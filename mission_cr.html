<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau compte rendu de mission</title>
<link rel="stylesheet" href="shared/repository_nav.css"><link rel="stylesheet" href="shared/mission_core/core.css?v=20260924h">
<script src="repository_tree"></script>
<style>
  .mc-choose{max-width:1100px;margin:20px auto;padding:0 16px 40px}
  .mc-choose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .mc-choose a{display:block;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
  .mc-choose a:hover{border-color:var(--accent)}
  .mc-choose a b{display:block;font-size:16px;margin-bottom:4px}
  .mc-choose a.last{border:2px solid var(--accent)}
  .mc-choose .small{color:var(--muted)}
</style>
</head><body>
<header class="mc-header"><h1>Nouveau compte rendu de mission</h1><p>DEFA Virtual — Mission Report Core</p></header>
<main class="mc-choose" id="choose" hidden>
  <p class="small" data-text="intro"></p>
  <div class="mc-choose-grid"></div>
</main>
<script src="shared/repository_nav.js?v=20260924h"></script>
<script src="shared/content_i18n.js?v=20260923c"></script>
<script src="shared/mission_core/vocab.js?v=20260924h"></script>
<script>
  // Menu ☰ › Missions › Nouveau compte rendu : CR de la dernière famille utilisée (changement
  // de famille / sous-type ensuite par la popup d'en-tête des pages) ; au premier usage, ou
  // avec ?choisir, choix de la famille.
  (() => {
    const families = window.MissionVocab.families, last = (() => { try { return localStorage.getItem('missionCoreLastFamily:v1') || ''; } catch { return ''; } })();
    const target = families.find(f => f.id === last);
    if (target && !new URLSearchParams(location.search).has('choisir')) { location.replace(target.cr); return; }
    const intro = ['Choisissez la famille de mission. Les fois suivantes, ce menu ouvre directement la dernière famille utilisée ; la popup de l’en-tête permet d’en changer.', 'Choose the mission family. Next time, this menu opens the last family used directly; the header popup lets you switch.', 'Einsatzfamilie wählen. Beim nächsten Mal öffnet dieses Menü direkt die zuletzt genutzte Familie; das Popup in der Kopfzeile wechselt sie.', 'Elija la familia de misión. Las próximas veces, este menú abre directamente la última familia usada; la ventana de la cabecera permite cambiarla.'];
    document.querySelector('[data-text="intro"]').textContent = intro[0];
    window.RepositoryContentI18n?.([intro]);
    document.querySelector('.mc-choose-grid').innerHTML = families.map(f => `<a href="${f.cr}"${f.id === last ? ' class="last"' : ''}><b>${f.id}</b><span class="small">${f.label}</span></a>`).join('');
    document.getElementById('choose').hidden = false;
  })();
</script>
<script src="shared/app_framework.js?v=20260924d"></script>
</body></html>
