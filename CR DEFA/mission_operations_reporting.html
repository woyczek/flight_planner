<style>
:root{--bg:#10131a;--panel:#191e28;--line:#30394a;--text:#edf1f8;--muted:#9da9bc;--soft:#242c3b;--accent:#67b6ff;--mcg-grid:#2a3342;--mcg-base:#56627a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}
header{padding:16px 24px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(103,182,255,.10),rgba(187,140,255,.08) 45%,transparent)}
h1{margin:0;font-size:22px}header p,.note{color:var(--muted);margin:6px 0 0;line-height:1.45}
/* en-tête collé : période (◀ zoom − ▶) et filtres */
.mcg-header-tools{display:grid;gap:8px;padding:4px 0 10px}
.mcg-header-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.mcg-header-tools .mcg-chips{margin:0}.mcg-inline{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.mcg-header-tools select,.mcg-header-tools input,.mcg-header-tools .tp-btn{padding:5px 8px}
header p{display:none}
.mcg-new{display:inline-flex;padding:7px 14px;border-radius:8px;background:var(--accent);color:#0d1015;font-weight:700;text-decoration:none}
main{max-width:1540px;margin:auto;padding:18px 26px 56px}
.panel,.section,.card{background:var(--panel);border:1px solid var(--line);border-radius:11px}.panel{padding:14px;margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{display:grid;gap:4px;color:var(--muted);font-size:12px}
input,button,select{background:#11151d;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--accent)}
.tp-picker select,.tp-picker input{background:#11151d;color:var(--text);border:1px solid var(--line)}
/* filtres par famille */
.mcg-chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}.mcg-label{color:var(--muted);font-size:12px}.mcg-chip-list{display:flex;gap:6px;flex-wrap:wrap}
.mcg-chip{--c:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);font-size:12px;font-weight:650}
.mcg-chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}.mcg-chip em{font-style:normal;color:var(--muted);font-weight:500}
.mcg-chip.off{opacity:.45;background:transparent;border-style:dashed}.mcg-chip.mcg-all{--c:#9da9bc}
.mcg-options{margin-top:8px}
/* indicateurs */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.card{--c:var(--accent);padding:12px 13px;border-top:3px solid var(--c)}.label{font-size:12px;color:var(--muted)}.value{font-size:23px;font-weight:700;margin-top:5px}.sub{font-size:12px;color:var(--muted);margin-top:4px;min-height:1em}
/* sections et graphiques */
.section{overflow:auto}.section h2{font-size:15px;margin:0;padding:12px 15px;border-bottom:1px solid var(--line)}.mcg-sub{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.inside{padding:12px 15px}.mcg-wide{margin-top:16px}
.mcg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
/* étiquettes */
.mcg-tag{--c:var(--accent);display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.mcg-pill{--c:#64748b;display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 65%,#fff)}
.section td a,.panel a{color:var(--accent)}
.mcg-legacy select{min-width:260px}
.mc-source{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.mc-source select{font-weight:600;border-color:#f59e0b}
.mcg-checks{border-color:#b45309}.mcg-checks h2{color:#fbbf24}.mcg-issue{color:#fcd34d;white-space:normal}
@media(max-width:1100px){.mcg-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){main{padding:14px}.mcg-grid{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#111}.mcg-header-tools .tp-nav,.mcg-header-tools select,.mcg-ledger,.mcg-new{display:none}.section,.card,.panel{break-inside:avoid;background:#fff;border-color:#ccc}.mcg-grid{grid-template-columns:1fr 1fr}}
</style></head>
