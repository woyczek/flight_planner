<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau compte rendu de mission</title>
<link rel="stylesheet" href="../shared/repository_nav.css"><link rel="stylesheet" href="../shared/mission_core/core.css?v=20260924zc">
<script src="../repository_tree"></script>
<style>
  .mc-choose{max-width:1100px;margin:20px auto;padding:0 16px 40px}
  .mc-choose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .mc-choose a{display:block;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
  .mc-choose a:hover{border-color:var(--accent)}
  .mc-choose a b{display:block;font-size:16px;margin-bottom:4px}
  .mc-choose a.last{border:2px solid var(--accent)}
  .mc-choose .small{color:var(--muted)}
</style>
</head><body>
<header class="mc-header"><h1>Nouveau compte rendu de mission</h1><p>DEFA Virtual — Mission Report Core</p></header>
<main class="mc-choose" id="choose">
  <p class="small" data-text="intro"></p>
  <div class="mc-choose-grid"></div>
</main>
<script src="../shared/repository_nav.js?v=20260924zc"></script>
<script src="../shared/content_i18n.js?v=20260924zc"></script>
<script src="../shared/mission_core/vocab.js?v=20260924zc"></script>
<script>
  // Menu ☰ › Missions › Nouveau compte rendu : choix de la famille, affiché à chaque fois ;
  // la dernière famille utilisée est proposée en premier (« Continuer avec … »).
  (() => {
    const families = window.MissionVocab.families, last = (() => { try { return localStorage.getItem('missionCoreLastFamily:v1') || ''; } catch { return ''; } })();
    const lastFamily = families.find(f => f.id === last);
    const intro = ['Choisissez la famille de mission (la popup de l’en-tête des pages permet ensuite d’en changer).', 'Choose the mission family (the page header popup lets you switch afterwards).', 'Einsatzfamilie wählen (das Popup in der Kopfzeile wechselt sie danach).', 'Elija la familia de misión (la ventana de la cabecera permite cambiarla después).'];
    const again = ['Continuer avec', 'Continue with', 'Weiter mit', 'Continuar con'];
    document.querySelector('[data-text="intro"]').textContent = intro[0];
    const ordered = lastFamily ? [lastFamily, ...families.filter(f => f !== lastFamily)] : families;
    document.querySelector('.mc-choose-grid').innerHTML = ordered.map(f => `<a href="${f.cr}"${f === lastFamily ? ' class="last"' : ''}>${f === lastFamily ? `<span class="small">${again[0]}</span>` : ''}<b>${f.id}</b><span class="small">${f.label}</span></a>`).join('');
    window.RepositoryContentI18n?.([intro, again]);
    document.getElementById('choose').hidden = false;
  })();
</script>
<script src="../shared/app_framework.js?v=20260924zc"></script>
</body></html>
