<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aide</title>
<link rel="stylesheet" href="../../shared/repository_nav.css?v=dd0730c4"><link rel="stylesheet" href="../../shared/mission_core/core.css?v=8594d3c0">
<script src="../../config/repository_tree?v=18728c91"></script>
<style>
  /* largeur : pleine page, marges latérales communes (repository_nav.css, body>main) ; ici le vertical seulement.
     La ligne de lecture est limitée dans l'article (article.doc-body : paragraphes et listes en ch), pas la page. */
  main.doc-page {
    margin-top: 18px;
    margin-bottom: 18px;
    padding-top: 0;
    padding-bottom: 48px;
    display: grid;
    grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
    gap: 18px;
    align-items: start
  }
  @media (max-width: 860px) {
    main.doc-page {
      grid-template-columns: minmax(0, 1fr)
    }
  }
  .doc-side {
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 24px);
    overflow: auto;
    font-size: 13.5px
  }
  @media (max-width: 860px) {
    .doc-side {
      position: static;
      max-height: none
    }
  }
  .doc-side h3 {
    margin: 12px 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    opacity: .7
  }
  .doc-side ul {
    list-style: none;
    margin: 0;
    padding: 0
  }
  .doc-side li a {
    display: block;
    padding: 3px 6px;
    text-decoration: none;
    color: inherit;
    border-left: 3px solid transparent
  }
  .doc-side li a:hover {
    background: color-mix(in srgb, currentColor 8%, transparent)
  }
  .doc-side li a.on {
    border-left-color: var(--repo-accent, #2563eb);
    font-weight: 600
  }
  .doc-side .doc-toc li a {
    padding-left: 12px;
    font-size: 12.5px
  }
  .doc-side .doc-toc li.l3 a {
    padding-left: 24px;
    opacity: .85
  }
  .doc-search {
    width: 100%;
    box-sizing: border-box;
    margin: 0 0 6px
  }
  .doc-hits li a small {
    display: block;
    opacity: .7
  }
  article.doc-body {
    min-width: 0;
    line-height: 1.55;
    font-size: 15px
  }
  /* ligne de lecture : le texte courant garde une longueur lisible ; tableaux, code et images prennent toute la largeur */
  article.doc-body :is(p, ul, ol, dl, blockquote) {
    max-width: 100ch
  }
  article.doc-body h1 {
    margin-top: 0
  }
  article.doc-body h2 {
    margin-top: 1.8em;
    padding-top: .3em;
    border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent)
  }
  article.doc-body :is(h1, h2, h3, h4) {
    scroll-margin-top: calc(var(--repo-header-h, 84px) + 16px)
      /* sous l'en-tête collé en haut */
  }
  /* liens : couleur du texte, soulignement discret (comme ailleurs dans la suite ; Durci : couleur de ses blocs) */
  article.doc-body a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
    text-underline-offset: 2px
  }
  article.doc-body a:hover {
    text-decoration-color: currentColor
  }
  article.doc-body .doc-anchor {
    margin-left: .4em;
    opacity: 0;
    text-decoration: none;
    font-size: .8em
  }
  article.doc-body :is(h1, h2, h3, h4):hover .doc-anchor {
    opacity: .5
  }
  article.doc-body .doc-table {
    overflow-x: auto
  }
  article.doc-body table {
    border-collapse: collapse;
    margin: .6em 0;
    font-size: 14px
  }
  article.doc-body :is(th, td) {
    border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
    padding: 4px 8px;
    vertical-align: top;
    text-align: left
  }
  article.doc-body th {
    background: color-mix(in srgb, currentColor 7%, transparent)
  }
  article.doc-body pre.doc-code {
    overflow-x: auto;
    padding: 10px 12px;
    background: color-mix(in srgb, currentColor 7%, transparent);
    font-size: 13px
  }
  article.doc-body code {
    font-size: .92em
  }
  article.doc-body blockquote {
    margin: .8em 0;
    padding: .2em 1em;
    border-left: 4px solid color-mix(in srgb, currentColor 25%, transparent)
  }
  article.doc-body img {
    max-width: 100%
  }
  article.doc-body .doc-target {
    animation: docFlash 1.6s ease-out
  }
  @keyframes docFlash {
    from {
      background: color-mix(in srgb, var(--repo-accent, #2563eb) 25%, transparent)
    }
  }
  @media (prefers-reduced-motion: reduce) {
    article.doc-body .doc-target {
      animation: none
    }
  }
  .doc-empty {
    opacity: .75
  }
</style>
</head><body>
<!-- Aide : documentation de la suite (docs/*.md), affichée ici. Index documentaire : docs/README.md (colonne de gauche) ;
     ?doc=FICHIER.md#ancre ouvre un document ; ?from=apps/…html (entrée « Aide » de la barre latérale) ouvre le chapitre de
     la page d'où l'on vient (commentaires « page: apps/…html » placés sous le titre du chapitre dans les manuels). Rendu : apps/aide/markdown.js. -->
<header class="mc-header"><h1>Aide</h1><p>Manuels, guides et documentation de la suite</p></header>
<main class="doc-page">
  <nav class="doc-side repo-block" data-no-deco aria-label="Documentation">
    <input type="search" class="doc-search" placeholder="Rechercher dans les manuels…" aria-label="Rechercher dans les manuels">
    <ul class="doc-hits" hidden></ul>
    <div class="doc-index"></div>
    <h3 class="doc-toc-title" hidden>Dans ce document</h3>
    <ul class="doc-toc"></ul>
  </nav>
  <article class="doc-body repo-block" data-no-deco data-no-i18n><p class="doc-empty">Chargement de la documentation…</p></article>
</main>
<script src="../../shared/kit.js?v=d74cff80"></script>
<script src="../../shared/repository_nav.js?v=0951fa5a"></script>
<script src="../../shared/content_i18n.js?v=515ea16b"></script>
<script src="markdown.js?v=197be05f"></script>
<script src="aide.js?v=b2226b69"></script>
<script src="../../shared/app_framework.js?v=0a2fa96b"></script>
</body></html>
