<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paramètres</title>
<!-- Paramètres en quatre pages (Mon profil, Centre, Installation, Maintenance : docs/technique/DISPOS_ET_REORGANISATION.md § 2) :
     cette adresse est gardée pour les anciens liens. ?base=<rubrique> et ?m=<bloc> (et #bloc) renvoient vers la page qui
     porte la rubrique (REPOSITORY_TREE.settings.sections), sans paramètre vers Mon profil. -->
<script src="../../config/repository_tree?v=531e4e18"></script>
<script>
(() => {
  const s = window.REPOSITORY_TREE?.settings || {},
    q = new URLSearchParams(location.search),
    id = q.get('base') || q.get('m') || location.hash.slice(1),
    page = s.pages?.[s.sections?.[id]] || s.pages?.profile || 'apps/settings/profil.html',
    url = new URL('../../' + page, location.href);
  if (id && s.sections?.[id]) url.search = q.get('base') ? `?base=${encodeURIComponent(id)}` : `?m=${encodeURIComponent(id)}`;
  for (const [k, v] of q)
    if (k !== 'base' && k !== 'm') url.searchParams.set(k, v); // ex. setup=1 du premier lancement
  url.hash = location.hash && !s.sections?.[location.hash.slice(1)] ? location.hash : '';
  location.replace(url.href);
})();
</script>
</head><body><p><a href="profil.html">Paramètres</a></p></body></html>
