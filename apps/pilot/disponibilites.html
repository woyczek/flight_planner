<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes disponibilités</title>
<link rel="stylesheet" href="../../shared/repository_nav.css?v=f6a61e75"><link rel="stylesheet" href="../../shared/mission_core/core.css?v=8594d3c0">
<script src="../../config/repository_tree?v=2a75a8a5"></script>
<style>
  main.pd-page {
    max-width: 1300px;
    margin: 18px auto;
    padding: 0 16px 48px
  }
</style>
</head><body>
<!-- Saisie des disponibilités par plages, seule (docs/technique/DISPOS_ET_REORGANISATION.md § 1.5) : même interface que
     Mes missions › Mes disponibilités (shared/dispos_editor.js), avec sa propre barre de semaine. Pilote : trigramme de
     travail (profil pilote, connexion ou usurpation : MissionAssignments.trigram). -->
<header class="mc-header"><h1>Mes disponibilités</h1><p>Plages de la semaine, par catégorie (heures UTC)</p></header>
<main class="pd-page mc-reporting">
<section data-block-id="dispos" data-icon="clock" data-subtitle="Choisir une catégorie dans la palette, puis cliquer sur une case ou tracer un rectangle (heures UTC) ; un second clic efface ; « Plage précise » pour des minutes. Le Centre s’en sert pour affecter les missions."><h2>Mes disponibilités</h2>
  <div id="pdEditor"></div>
</section>
</main>
<script src="../../shared/kit.js?v=d084129f"></script>
<script src="../../shared/repository_nav.js?v=ad188ce2"></script>
<script src="mes_missions_i18n.js?v=ff059abb" defer></script>
<script src="../../shared/content_i18n.js?v=efa62576"></script>
<script src="../../shared/dispos_editor.js?v=f19b2a34"></script>
<script>
(async () => {
  'use strict';
  // composants chargés par repository_nav.js (socle des affectations, catégories de disponibilité)
  for (let n = 0; !(window.MissionAssignments && window.SuiteDispos) && n < 120; n++) await new Promise(r => setTimeout(r, 50));
  // titre de l'onglet (hors de la page : la couche de traduction ne le voit pas)
  const title = () => {
    document.title = window.RepositoryKit.t(['Mes disponibilités', 'My availability', 'Meine Verfügbarkeit', 'Mi disponibilidad']);
  };
  title();
  window.addEventListener('repository-language-change', title);
  const ed = window.DisposEditor.mount(document.getElementById('pdEditor'));
  // semaine demandée (?semaine=2026-W41), sinon la semaine en cours
  const w = new URLSearchParams(location.search).get('semaine');
  const show = () => ed.set({
    tri: window.MissionAssignments.trigram(),
    week: /^\d{4}-W\d{2}$/.test(w || '') ? w : undefined
  });
  show();
  // autre pilote (profil, connexion, usurpation) : semaine relue pour lui
  for (const ev of ['pilot-profile-change', 'suite-session-change', 'suite-mode-change']) window.addEventListener(ev, () => setTimeout(
    show));
  window.addEventListener('storage', e => {
    if (e.key === 'missionReportingConfig:v1') show();
  });
})();
</script>
<script src="../../shared/app_framework.js?v=5653237c"></script>
</body></html>
