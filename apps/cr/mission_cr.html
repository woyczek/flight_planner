<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nouveau compte rendu de mission</title>
<link rel="stylesheet" href="../../shared/repository_nav.css?v=2bab0c08"><link rel="stylesheet" href="../../shared/mission_core/core.css?v=f33b51fd">
<script src="../../repository_tree?v=443f614d"></script>
<style data-layer="app">
@layer app {
  .mc-choose {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 16px 40px
  }
  .mc-choose-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px
  }
  .mc-choose a {
    display: block;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    text-decoration: none
  }
  .mc-choose a:hover {
    border-color: var(--accent)
  }
  .mc-choose a b {
    display: block;
    font-size: 16px;
    margin-bottom: 4px
  }
  .mc-choose a.last {
    border: 2px solid var(--accent)
  }
  .mc-choose .small {
    color: var(--muted)
  }
  .mc-find {
    width: 100%;
    box-sizing: border-box;
    margin: 6px 0 4px;
    padding: 10px 12px;
    font: inherit;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink)
  }
  .mc-choose a.dim {
    opacity: .35
  }
  .mc-choose a.hit {
    border: 2px solid var(--accent)
  }
}
</style>
</head><body>
<header class="mc-header"><h1>Nouveau compte rendu de mission</h1><p>DEFA Virtual — Mission Report Core</p></header>
<main class="mc-choose" id="choose">
  <p class="small" data-text="intro"></p>
  <input id="familySearch" class="mc-find" type="search" autocomplete="off">
  <p class="small" id="familyHint"></p>
  <div class="mc-choose-grid"></div>
</main>
<script src="../../shared/kit.js?v=9221c6fa"></script>
<script src="../../shared/repository_nav.js?v=5a3ba911"></script>
<script src="../../shared/content_i18n.js?v=cf6396e2"></script>
<script src="../../shared/mission_core/vocab.js?v=db00c09c"></script>
<script>
  // Menu ☰ › Missions › Nouveau compte rendu : choix de la famille, affiché à chaque fois ;
  // la dernière famille utilisée est proposée en premier (« Continuer avec … »).
  (() => {
    const families = window.MissionVocab.families,
      last = (() => {
        try {
          return localStorage.getItem('missionCoreLastFamily:v1') || '';
        } catch {
          return '';
        }
      })();
    const lastFamily = families.find(f => f.id === last);
    const intro = ['Choisissez la famille de mission (la popup de l’en-tête des pages permet ensuite d’en changer).', 'Choose the mission family (the page header popup lets you switch afterwards).', 'Einsatzfamilie wählen (das Popup in der Kopfzeile wechselt sie danach).', 'Elija la familia de misión (la ventana de la cabecera permite cambiarla después).'];
    const again = ['Continuer avec', 'Continue with', 'Weiter mit', 'Continuar con'];
    document.querySelector('[data-text="intro"]').textContent = intro[0];
    const ordered = lastFamily ? [lastFamily, ...families.filter(f => f !== lastFamily)] : families;
    const grid = document.querySelector('.mc-choose-grid'),
      tile = (f, cls = '') => `<a href="${f.cr}" data-family="${f.id}" title="${(f.descriptions || [''])[0]}" class="${[f === lastFamily && !cls ? 'last' : '', cls].filter(Boolean).join(' ')}">${f === lastFamily && !cls ? `<span class="small">${again[0]}</span>` : ''}<b>${f.id}</b><span class="small">${f.labels[0]}</span></a>`;
    grid.innerHTML = ordered.map(f => tile(f)).join('');
    // Recherche de la famille : mots de la description comparés aux mots-clés de chaque famille (FR / EN,
    // sans accents, préfixes acceptés : « ravito », « para »…) et aux alias des types de mission ;
    // familles classées, les autres estompées ; Entrée ouvre la première.
    const STOP = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'en', 'un', 'une', 'et', 'au', 'aux', 'of', 'the', 'and', 'an', 'in', 'on', 'for', 'der', 'die', 'das', 'und', 'ein', 'eine', 'im', 'mit', 'von', 'el', 'los', 'las', 'y', 'con', 'por', 'para', 'del']);
    const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const index = families.map(f => ({
      f,
      words: norm(`${f.id} ${f.labels.join(' ')} ${(f.descriptions || []).join(' ')} ${f.keywords}`).split(/[^a-z0-9]+/).filter(w => w.length > 1)
    }));
    const score = (entry, tokens) => tokens.reduce((sum, t) => sum + Math.max(0, ...entry.words.map(w => w === t ? 3 : t.length >= 3 && (w.startsWith(t) || (w.length >= 6 && t.startsWith(w))) ? 2 : 0)), 0);
    const search = $find => {
      const q = $find.value,
        tokens = norm(q).split(/[^a-z0-9]+/).filter(t => t.length >= 2 && !STOP.has(t));
      if (!tokens.length) {
        grid.innerHTML = ordered.map(f => tile(f)).join('');
        $('familyHint').textContent = '';
        return null;
      }
      // expressions de plusieurs mots reprises telles quelles (« police du ciel », « zone de saut »…) : bonus
      const words = norm(q).split(/[^a-z0-9]+/).filter(Boolean),
        phrases = [];
      for (let n = 3; n >= 2; n--)
        for (let i = 0; i + n <= words.length; i++) phrases.push([n, words.slice(i, i + n).join(' ')]);
      const phraseScore = e => phrases.reduce((s, [n, p]) => s + (` ${e.words.join(' ')} `.includes(` ${p} `) ? 4 * n : 0), 0);
      const alias = window.MissionVocab.familyForType?.(q),
        ranked = index.map(e => ({
          f: e.f,
          s: score(e, tokens) + phraseScore(e) + (alias === e.f.id && alias !== 'SPECIAL' ? 3 : 0)
        })).sort((a, b) => b.s - a.s);
      const hits = ranked.filter(r => r.s > 0),
        rest = ranked.filter(r => !r.s);
      grid.innerHTML = hits.map((r, i) => tile(r.f, i ? '' : 'hit')).join('') + rest.map(r => tile(r.f, 'dim')).join('');
      $('familyHint').innerHTML = hits.length ? `<span>${hint[0]}</span> <b>${hits[0].f.id}</b> — <span>${hits[0].f.labels[0]}</span>` : `<span>${noHit[0]}</span>`;
      return hits[0]?.f || null;
    };
    const $ = id => document.getElementById(id),
      find = $('familySearch'),
      hint = ['Suggestion (Entrée pour ouvrir) :', 'Suggestion (Enter to open):', 'Vorschlag (Eingabe zum Öffnen):', 'Sugerencia (Intro para abrir):'];
    const noHit = ['Aucune famille ne correspond : SPECIAL couvre les autres missions.', 'No matching family: SPECIAL covers other missions.', 'Keine passende Familie: SPECIAL deckt andere Einsätze ab.', 'Ninguna familia coincide: SPECIAL cubre las demás misiones.'];
    const ph = ['Décrivez la mission : « évasan hélico », « ravitaillement de Rafale », « largage para »…', 'Describe the mission: “helicopter medevac”, “Rafale refuelling”, “para drop”…', 'Einsatz beschreiben: „Hubschrauber-Medevac“, „Luftbetankung“, „Fallschirmabwurf“…', 'Describa la misión: «evacuación en helicóptero», «reabastecimiento», «lanzamiento paracaidista»…'];
    find.placeholder = ph[0];
    find.addEventListener('input', () => search(find));
    find.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const f = search(find);
      if (f) location.href = f.cr;
    });
    find.focus();
    // libellés des familles dans les 4 langues ; exemple du champ de recherche traduit aussi
    window.RepositoryContentI18n?.([intro, again, hint, noHit, ph, ...families.map(f => f.labels), ...families.map(f => f.descriptions).filter(Boolean)]);
    document.getElementById('choose').hidden = false;
  })();
</script>
<script src="../../shared/app_framework.js?v=817d675e"></script>
</body></html>
