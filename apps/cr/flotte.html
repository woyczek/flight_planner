  /* largeur : pleine page, marges latérales communes (repository_nav.css, body>main) ; ici le vertical seulement */
  main.fp-page {
    margin-top: 18px;
    margin-bottom: 18px;
    padding-top: 0;
    padding-bottom: 48px
  }
  .fp-centre {
    display: flex;
    justify-content: flex-end;
    margin: 0 0 6px
  }
  .fp-scroll {
    max-width: 100%;
    overflow-x: auto
  }
  .fp-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px
  }
  .fp-table th {
    text-align: left;
    padding: 6px 8px;
    white-space: nowrap;
    cursor: pointer;

    padding: 4px 8px;

    background: color-mix(in srgb, var(--accent, #2f6fd6) 10%, transparent)
  }
  .fp-table tbody tr.fp-sel td {
    background: color-mix(in srgb, #f59e0b 22%, transparent)
  }

  html[data-mobile="on"] .fp-table tbody tr.fp-sel {
    background: color-mix(in srgb, #f59e0b 22%, transparent)
  }
</style>
