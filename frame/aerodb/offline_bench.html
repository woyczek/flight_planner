<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aerodb — offline bench</title>
<!-- Banc du lot 4 d'aerodb (données gardées hors ligne) : la France gardée, interrogée réseau coupé, puis libérée. Le
     lecteur est un lecteur de banc qui imite le contrat de la couche de données du frame (read « reference », list,
     cached, evict) au-dessus du lecteur provisoire, avec un cache en mémoire et un compteur des lectures réseau ; à
     remplacer par FrameData.adapter dès qu'il offre cached et evict. Page d'outil, hors des applications. -->
<style>
  :root {
    color-scheme: light
  }
  body {
    margin: 0;
    padding: 12px;
    background: #f4f6f8;
    color: #17202a;
    font: 13px/1.4 system-ui, sans-serif
  }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #fff;
    border: 1px solid #0002;
    padding: 8px;
    font-size: 12px
  }
</style></head>
<body>
<h1 style="font-size:16px;margin:0 0 8px">aerodb — offline bench</h1>
<pre id="out">running…</pre>
<script src="../../shared/github_data.js?v=0"></script>
<script src="zones.js?v=0"></script>
<script src="aircraft.js?v=0"></script>
<script src="aerodb.js?v=0"></script>
<script>
  /** Lecteur de banc : contrat du frame (read avec wait, list, watch, cached, evict) sur le lecteur provisoire ; cache en
   *  mémoire ; offline : toute lecture réseau refusée (comptée). */
  function stubReader() {
    const base = AeroDB.fetchReader(),
      cache = new Map(), // chemin → { text, rev, at }
      net = {
        reads: 0,
        kb: 0,
        refused: 0,
        refusedPaths: []
      },
      self = {
        offline: false,
        net,
        async read(path, {
          wait = false
        } = {}) {
          const c = cache.get(path);
          if (c) return {
            ...c,
            cached: true,
            pending: false
          };
          const job = (async () => {
            if (self.offline) {
              net.refused++;
              net.refusedPaths.push(path);
              return null;
            }
            const r = await base.read(path);
            net.reads++;
            if (!r) return null;
            net.kb += r.text.length / 1024;
            const e = {
              text: r.text,
              rev: r.rev || String(r.text.length),
              at: Date.now()
            };
            cache.set(path, e);
            return {
              ...e,
              cached: false,
              pending: false
            };
          })();
          return wait ? job : null;
        },
        list: prefix => self.offline ? Promise.resolve(null) : base.list(prefix),
        watch: () => () => {},
        async cached(prefix) {
          return [...cache].filter(([p]) => p.startsWith(prefix)).map(([path, e]) => ({
            path,
            rev: e.rev,
            bytes: e.text.length,
            at: e.at
          }));
        },
        async evict(path) {
          return cache.delete(path);
        },
        size: () => Math.round([...cache.values()].reduce((n, e) => n + e.text.length, 0) / 1024)
      };
    return self;
  }
  (async () => {
    const res = {},
      out = document.getElementById('out'),
      pick = (list, id) => {
        const z = list.find(x => x.id === id);
        return z && {
          state: z.state,
          cycle: z.cycle,
          publishedKb: z.publishedKb,
          cachedKb: z.cachedKb,
          at: z.at,
          prefixes: z.prefixes.join(' ')
        };
      };
    const R = stubReader(),
      db = AeroDB.create({
        reader: R
      });
    res.supported = db.offline.supported();
    let t0 = performance.now();
    const z0 = await db.offline.zones();
    res.zones = {
      ms: Math.round(performance.now() - t0),
      n: z0.length,
      fr: pick(z0, 'fr'),
      names: z0.slice(0, 4).map(z => `${z.id} ${z.names[0]} ${z.state} ${z.publishedKb} KB`)
    };
    res.source = (await db.status()).source;
    // la France gardée
    const steps = [];
    t0 = performance.now();
    const kept = await db.offline.keep('fr', {
      onProgress: p => steps.push(`${p.done}/${p.total}`)
    });
    res.keep = {
      ms: Math.round(performance.now() - t0),
      steps: steps.length,
      readKb: kept.readKb,
      failed: kept.failed,
      state: kept.state,
      cachedKb: kept.cachedKb,
      publishedKb: kept.publishedKb
    };
    res.common = await db.offline.common();
    await db.aircraft();
    res.aircraft = await db.offline.aircraft();
    // réseau coupé : une instance neuve répond sur la France depuis le cache seul
    R.offline = true;
    const before = R.net.refused,
      off = AeroDB.create({
        reader: R
      }),
      tlse = {
        lat: 43.6,
        lon: 1.4,
        radiusNm: 40
      };
    t0 = performance.now();
    res.offlineQueries = {
      aerodromes: (await off.aerodromes(tlse)).length,
      airspaces: (await off.airspaces(tlse)).length,
      navaids: (await off.navaids(tlse)).length,
      obstacles: (await off.obstacles(tlse)).length,
      mora: await off.mora(43.6, 1.4),
      coordsLFBO: (await off.coords('LFBO'))?.name || null,
      findTOUL: (await off.find('TOUL', 5)).map(x => x.label),
      aircraft: (await off.aircraft()).size(),
      ms: Math.round(performance.now() - t0),
      networkRefused: R.net.refused - before,
      refusedPaths: R.net.refusedPaths.slice()
    };
    R.offline = false;
    // la France libérée
    t0 = performance.now();
    const rel = await db.offline.release('fr');
    res.release = {
      ms: Math.round(performance.now() - t0),
      state: rel.state,
      cachedKb: rel.cachedKb,
      cacheLeftKb: R.size()
    };
    res.net = {
      reads: R.net.reads,
      kb: Math.round(R.net.kb)
    };
    res.heapMb = performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null;
    window.__bench = res;
    out.textContent = JSON.stringify(res, null, 1);
  })().catch(e => {
    document.getElementById('out').textContent = 'error: ' + (e?.stack || e);
    window.__bench = {
      error: String(e?.stack || e)
    };
  });
</script>
</body></html>
