<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aerodb — procedures tests</title>
<!-- Essais des procédures d'aerodb (frame/aerodb/procedures.js et AeroDB.procedures / procedureFromOfp / rememberOfp) sur
     un lecteur en mémoire (read, list, put) : aucun réseau, aucun lanceur. L'OFP est fabriqué d'après les champs documentés
     de SimBrief (json=v2) : à remplacer par un vrai OFP dès qu'il y en a un. Résultat dans window.__procBench. -->
<style>
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 16px
  }
  li.ok::marker {
    content: '✓ '
  }
  li.ko::marker {
    content: '✗ '
  }
</style></head>
<body>
<h1>aerodb — procedures tests</h1>
<p id="state">running…</p>
<ol id="out"></ol>
<script src="../zones.js?v=0"></script>
<script src="../aerodb.js?v=0"></script>
<script>
  (async () => {
    const results = [],
      check = (name, ok, detail) => results.push({
        name,
        ok: !!ok,
        detail: ok ? '' : JSON.stringify(detail)
      });
    try {
      const files = new Map(),
        puts = [],
        reader = {
          read: async p => files.has(p) ? {
            value: JSON.parse(files.get(p)),
            rev: 'r' + files.get(p).length
          } : null,
          list: async prefix => [...files.keys()].filter(p => p.startsWith(prefix)),
          put: async (p, v) => {
            puts.push(p);
            files.set(p, JSON.stringify(v));
          }
        },
        db = AeroDB.create({
          reader,
          lnmperf: false,
          now: () => Date.parse('2026-10-25T12:00:00Z')
        }),
        fix = (ident, lat, lon, flag, extra = {}) => ({
          ident,
          type: 'wpt',
          is_sid_star: flag ? '1' : '0',
          pos_lat: String(lat),
          pos_long: String(lon),
          ...extra
        }),
        ofp = {
          origin: {
            icao_code: 'LFBD',
            plan_rwy: '23'
          },
          destination: {
            icao_code: 'LFML',
            plan_rwy: '31R'
          },
          general: {
            sid_ident: 'ROYAN6P',
            sid_trans: '',
            star_ident: 'MTL2A',
            star_trans: 'LUC'
          },
          params: {
            time_generated: '1790000000',
            airac: '2610'
          },
          navlog: {
            fix: [fix('LFBD', 44.8, -0.7, false, {
              type: 'apt'
            }), fix('BD230', 44.7, -0.8, true, {
              stage: 'CLB',
              altitude_feet: '1500'
            }), fix('ROYAN', 45.6, -1.0, true, {
              stage: 'CLB',
              type: 'vor'
            }), fix('TOC', 45.9, -0.9, false), fix('MEN', 44.3, 2.0, false, {
              via_airway: 'UN460'
            }), fix('TOD', 43.9, 4.0, false), fix('LUC', 43.4, 5.0, true, {
              stage: 'DSC',
              type: 'vor'
            }), fix('LFML', 43.4, 5.2, false, {
              type: 'apt'
            })]
          }
        };
      check('nothing without data', (await db.procedures('LFBD')).length === 0 && (await db.procedureIndex()) === null, null);
      const cur = await db.procedureFromOfp(ofp);
      check('SID of the OFP: id, points in order, status ofp, planned altitude', cur.sid?.id === 'LFBD.SID.ROYAN6P.RW23' && cur.sid
        .points.map(p => p.id).join() ===
        'BD230,ROYAN' && cur.sid.status === 'ofp' && cur.sid.points[0].planned === 1500 && cur.sid.points[0].alt === null, cur.sid);
      check('STAR of the OFP: transition and runway', cur.star?.id === 'LFML.STAR.MTL2A.RW31R.LUC' && cur.star.transition === 'LUC' &&
        cur.star.runways[0] ===
        '31R', cur.star);
      check('en-route fix, TOC, TOD and aerodromes kept out', ![...cur.sid.points, ...cur.star.points].some(p =>
        /^(MEN|TOC|TOD|LFBD|LFML)$/.test(p.id)), cur);
      const none = await db.procedureFromOfp({});
      // vrai OFP (allégé aux champs lus, sans identifiant), pris le 25 octobre 2026 : sid_trans et star_trans y sont des objets vides
      const real = await (await fetch('fixtures/ofp_lfrs_lfml.json')).json(),
        rr = await db.procedureFromOfp(real);
      check('real OFP: SID LUGE4N from LFRS runway 03, two points, no transition', rr.sid?.id === 'LFRS.SID.LUGE4N.RW03' && rr.sid
        .points.map(p => p.id).join() ===
        'SUBAK,BOBRI' && rr.sid.transition === null && rr.sid.source.cycle === '2610', rr.sid);
      check('real OFP: STAR LERG1R to LFML runway 13L, four points (TOD and the aerodrome left out)', rr.star?.id ===
        'LFML.STAR.LERG1R.RW13L' && rr.star.points
        .map(p => p.id).join() === 'LATAM,ARDEG,OSGOX,RIKSI' && rr.star.transition === null, rr.star);
      check('an OFP without navlog gives nothing', none.sid === null && none.star === null, none);
      check('nothing written by procedureFromOfp', puts.length === 0, puts);
      await db.rememberOfp(ofp);
      check('rememberOfp writes one file per aerodrome', puts.join() === 'proc-seen/LFBD.json,proc-seen/LFML.json', puts);
      await db.rememberOfp(ofp);
      check('the same OFP again writes nothing', puts.length === 2, puts);
      const seen = await db.procedures('LFBD');
      check('procedures() reads what was seen, status ofp', seen.length === 1 && seen[0].status === 'ofp' && seen[0].sources.length ===
        1, seen);
      files.set('proc/2026-10-08/LFBD.json', JSON.stringify({
        schema: 1,
        icao: 'LFBD',
        cycle: '2026-10-08',
        procedures: [{
          id: 'LFBD.SID.ROYAN6P.RW23',
          icao: 'LFBD',
          kind: 'SID',
          name: 'ROYAN 6P',
          runways: ['23'],
          transition: null,
          points: [{
            seq: 1,
            id: 'BD230',
            lat: 44.71,
            lon: -0.81,
            alt: null
          }, {
            seq: 2,
            id: 'ROYAN',
            lat: 45.6,
            lon: -1,
            alt: null
          }],
          source: {
            kind: 'eaip',
            cycle: '2026-10-08'
          },
          status: 'check'
        }, {
          id: 'LFBD.APP.RNPZ23.RW23',
          icao: 'LFBD',
          kind: 'APP',
          name: 'RNP Z RWY 23',
          runways: ['23'],
          points: [{
            seq: 1,
            id: 'IF',
            lat: 44.9,
            lon: -0.5,
            alt: null
          }],
          source: {
            kind: 'eaip'
          },
          status: 'check'
        }]
      }));
      files.set('proc/2026-10-08/index.json', JSON.stringify({
        schema: 1,
        cycle: '2026-10-08',
        aerodromes: {
          LFBD: {
            SID: 1,
            APP: 1
          }
        }
      }));
      const all = await db.procedures('LFBD');
      const sid = all.find(p => p.kind === 'SID');
      check('published and seen merged: one SID, the published geometry wins', all.length === 2 && sid.status === 'check' && sid.points[
          0].lat === 44.71 &&
        sid.sources.map(s => s.status).join() === 'check,ofp', all);
      check('filters kind, runway, name', (await db.procedures('LFBD', {
        kind: 'app'
      })).length === 1 && (await db.procedures('LFBD', {
        runway: '05'
      })).length === 0 && (await db.procedures('LFBD', {
        name: 'royan6p'
      })).length === 1, null);
      // base publiée minimale (zone fr) : un point en route placé à la lecture, les points déjà placés laissés
      files.set('sia/base/fr/2026-10-01/meta.json', JSON.stringify({
        schema: 2,
        zone: 'fr',
        cycle: '2026-10-01',
        kind: 'meta',
        data: {}
      }));
      files.set('sia/base/fr/2026-10-01/navaids.json', JSON.stringify({
        schema: 2,
        zone: 'fr',
        cycle: '2026-10-01',
        kind: 'navaids',
        data: [{
          id: 'ROYAN',
          lat: 45.62,
          lon: -1.03,
          name: 'ROYAN'
        }, {
          id: 'ROYAN',
          lat: -20,
          lon: 55,
          name: 'ROYAN (far)'
        }]
      }));
      files.set('proc/2026-10-08/LFBX.json', JSON.stringify({
        schema: 1,
        icao: 'LFBX',
        procedures: [{
          id: 'LFBX.SID.TEST1A.RWALL',
          icao: 'LFBX',
          kind: 'SID',
          name: 'TEST 1A',
          runways: [],
          points: [{
            seq: 1,
            id: 'BD230',
            lat: 44.7,
            lon: -0.8
          }, {
            seq: 2,
            id: 'ROYAN',
            lat: null,
            lon: null
          }],
          source: {
            kind: 'eaip'
          },
          status: 'check'
        }]
      }));
      const placed = (await db.procedures('LFBX'))[0]?.points;
      check('a point without position is placed from the base, the nearest one', placed?.[1]?.lat === 45.62 && placed[1].placed ===
        'base' && placed[0].placed === undefined,
        placed);
      check('the reader\'s copy is not modified', JSON.parse(files.get('proc/2026-10-08/LFBX.json')).procedures[0].points[1].lat ===
        null, null);
      check('index read', (await db.procedureIndex())?.aerodromes?.LFBD?.SID === 1, null);
      check('bad code answers empty', (await db.procedures('??')).length === 0, null);
      const ro = AeroDB.create({
        reader: {
          read: reader.read,
          list: reader.list
        },
        lnmperf: false
      });
      check('a reader that does not write: rememberOfp answers null', (await ro.rememberOfp(ofp)) === null, null);
      // ---------------------------------------------------------- § 10.20 : proc/manual, phases, tronçon sans point, procédure par
      // identifiant, pistes, index, lecture à la demande (l'heure du banc : 25 octobre 2026, cycle en vigueur 2026-10-01)
      const pt = (id, lat, lon, extra = {}) => ({
        seq: 0,
        id,
        lat,
        lon,
        alt: null,
        leg: 'TF',
        ...extra
      });
      const man = (id, kind, name, cycle, points, extra = {}) => ({
        id,
        icao: 'LFZZ',
        kind,
        name,
        runways: [],
        transition: null,
        points,
        source: {
          kind: 'ead-basic',
          cycle
        },
        status: 'check',
        ...extra
      });
      files.set('proc/manual/LFZZ.json', JSON.stringify({
        schema: 1,
        icao: 'LFZZ',
        cycle: '2026-09-03',
        procedures: [man('LFZZ.STAR.OLD1A.RWALL', 'STAR', 'OLD1A', '2026-09-03', [pt('AAAAA', 45, 1), pt('BBBBB', 45.1, 1.1)]),
          man('LFZZ.STAR.BOTH1A.RWALL', 'STAR', 'BOTH1A', '2026-09-03', [pt('CCCCC', 45, 1), pt('DDDDD', 45.1, 1.1)]),
          man('LFZZ.STAR.BOTH1A.RWALL.TRANS', 'STAR', 'BOTH1A', '2026-10-01', [pt('EEEEE', 46, 1), pt('CCCCC', 45, 1)], {
            transition: 'TRANS'
          }),
          man('LFZZ.APP.R27.RW27', 'APP', 'R27', '2026-10-01', [pt('FFFFF', 45, 2), pt('RW27', 45.01, 2.2, {
            alt: {
              type: 'at',
              ft: 500
            }
          }), pt(null, null, null, {
            leg: 'VA',
            crs: 270,
            phase: 'missed'
          })], {
            runways: ['27']
          })
        ]
      }));
      files.set('proc/2026-10-08/LFZZ.json', JSON.stringify({
        schema: 1,
        icao: 'LFZZ',
        cycle: '2026-10-08',
        runways: [{
          id: '09',
          lat: 45.0,
          lon: 2.0,
          elev: 410,
          qfu: 92,
          displaced: 0,
          length: 2400,
          width: 45,
          source: 'cifp'
        }],
        procedures: [{
          ...man('LFZZ.STAR.BOTH1A.RWALL', 'STAR', 'BOTH1A', null, [pt('CCCCC', 45, 1), pt('DDDDD', 45.1, 1.1)]),
          source: {
            kind: 'eaip'
          }
        }]
      }));
      files.set('proc/manual/index.json', JSON.stringify({
        schema: 1,
        folder: 'manual',
        aerodromes: {
          LFZZ: {
            STAR: 3,
            APP: 1,
            status: 'check',
            cycle: '2026-10-01'
          },
          LFYY: {
            SID: 2,
            status: 'check',
            cycle: '2026-09-03'
          }
        }
      }));
      const zz = await db.procedures('LFZZ'),
        by = id => zz.find(p => p.id === id);
      check('proc/manual/: a procedure of a past cycle is served as it is, marked outdated; one of the cycle in force is not', by(
          'LFZZ.STAR.OLD1A.RWALL')?.outdated ===
        true && !by('LFZZ.APP.R27.RW27')?.outdated && by('LFZZ.STAR.OLD1A.RWALL').points.length === 2, zz.map(p => [p.id, p.outdated])
      );
      check('the same procedure published for the cycle and read by hand earlier: the one not outdated wins, both sources listed', by(
        'LFZZ.STAR.BOTH1A.RWALL') && !by(
        'LFZZ.STAR.BOTH1A.RWALL').outdated && by('LFZZ.STAR.BOTH1A.RWALL').sources.length === 2, by('LFZZ.STAR.BOTH1A.RWALL'));
      check('every leg has a phase: main by default, trans for an enroute transition, missed kept', by('LFZZ.STAR.OLD1A.RWALL').points
        .every(p => p.phase === 'main') && by(
          'LFZZ.STAR.BOTH1A.RWALL.TRANS').points.every(p => p.phase === 'trans') && by('LFZZ.APP.R27.RW27').points[2].phase ===
        'missed', zz.map(p => p.points.map(q => q
          .phase)));
      const va = by('LFZZ.APP.R27.RW27').points[2];
      check('a leg without a fix (VA) keeps no position and is never placed', va.id === null && va.lat === null && va.placed ===
        undefined && va.crs === 270, va);
      check('the reader\'s copy of proc/manual/ is not modified (outdated and phases are on copies)', !JSON.parse(files.get(
          'proc/manual/LFZZ.json')).procedures[0]
        .outdated && !JSON.parse(files.get('proc/manual/LFZZ.json')).procedures[0].points[0].phase, null);
      const byOfp = await db.procedure('LFML.STAR.MTL2A.RW31R.LUC'),
        byMan = await db.procedure('lfzz.app.r27.rw27');
      check('procedure(id): an OFP procedure found by its identifier (proc-seen/, status ofp), a hand-read one too; unknown → null',
        byOfp?.status === 'ofp' &&
        byOfp.points.length >= 1 && (await db.procedure('LFBD.SID.ROYAN6P.RW23'))?.sources.some(x => x.status === 'ofp') && byMan
        ?.id === 'LFZZ.APP.R27.RW27' && (await db.procedure('LFZZ.SID.NONE.RWALL')) === null && (
          await db.procedure('x')) === null, [byOfp
          ?.id, byMan?.id
        ]);
      const rws = await db.runways('LFZZ');
      check('runways(icao): the full record from the file, the others from the RWnn points (threshold, QFU of the number, approx)', rws
        .length === 2 && rws[0].id === '09' &&
        rws[0].approx === false && rws[0].elev === 410 && rws[1].id === '27' && rws[1].approx === true && rws[1].qfu === 270 && rws[1]
        .lat === 45.01, rws);
      check('runways(): nothing without data, nothing for a bad code', (await db.runways('LFXX')).length === 0 && (await db.runways(
        '??')).length === 0, null);
      const ix = await db.procedureIndex();
      check('procedureIndex(): the hand-read aerodromes added, marked manual, outdated when their cycle is past', ix.aerodromes.LFYY
        ?.manual === true && ix.aerodromes.LFYY
        .outdated === true && ix.aerodromes.LFBD?.SID === 1 && !ix.aerodromes.LFBD.manual, ix.aerodromes);
      files.set('proc/local/LFZZ.json', JSON.stringify({
        schema: 1,
        icao: 'LFZZ',
        procedures: [{
          ...man('LFZZ.STAR.BOTH1A.RWALL', 'STAR', 'BOTH1A', null, [pt('XXXXX', 44, 1), pt('DDDDD', 45.1, 1.1)]),
          source: {
            kind: 'xplane'
          },
          status: 'official'
        }, {
          ...man('LFZZ.SID.XP1A.RW27', 'STAR', 'XP1A', null, [pt('RW27', 45.01, 2.2), pt('GGGGG', 45.2, 2.5)]),
          kind: 'SID',
          source: {
            kind: 'xplane'
          }
        }]
      }));
      const zl = await db.procedures('LFZZ'),
        xp = zl.find(p => p.id === 'LFZZ.SID.XP1A.RW27'),
        both = zl.find(p => p.id === 'LFZZ.STAR.BOTH1A.RWALL');
      check('proc/local/ (X-Plane fallback): served last, status forced to xplane and local, never above another source', xp?.status ===
        'xplane' && xp.local === true && both.points[0].id === 'CCCCC' && both.sources.at(-1).status === 'xplane' && (await db
          .procedure(
            'LFZZ.SID.XP1A.RW27'))?.local === true, [xp, both.sources]);
      const ac = new AbortController();
      ac.abort();
      // fetchProcedures() : le travail du poste est simulé par un faux lanceur (aucun réseau) ; chaque refus a sa raison
      const fetchDb = launcher => AeroDB.create({
          reader,
          lnmperf: false,
          launcher,
          now: () => Date.parse('2026-10-25T12:00:00Z')
        }),
        installed = {
          schema: 1,
          icao: 'EGLL',
          cycle: '2026-10-08',
          procedures: [{
            id: 'EGLL.STAR.OCK1H.RW27L',
            icao: 'EGLL',
            kind: 'STAR',
            name: 'OCK1H',
            runways: ['27L'],
            transition: null,
            points: [{
              seq: 1,
              id: 'AAAAA',
              lat: 51.4,
              lon: -0.5,
              leg: 'IF'
            }, {
              seq: 2,
              id: 'BBBBB',
              lat: 51.5,
              lon: -0.4,
              leg: 'TF'
            }],
            source: {
              kind: 'ead-basic',
              ref: 'ead-basic/EG/x',
              cycle: '2026-10-08'
            },
            status: 'check'
          }]
        },
        calls = [],
        jobAnswer = {
          r: null
        },
        fake = (over = {}) => ({
          info: () => ({
            data: true,
            lan: false
          }),
          request: async () => null,
          job: async (route, body, opts) => {
            calls.push({
              route,
              body,
              opts
            });
            opts.onProgress?.({
              step: 'EGLL: login',
              done: 1,
              total: 3
            });
            await new Promise(r => setTimeout(r, 30));
            return typeof jobAnswer.r === 'function' ? jobAnswer.r() : jobAnswer.r;
          },
          ...over
        }),
        reasonOf = async (d, icao = 'EGLL', o) => (await d.fetchProcedures(icao, o)).reason;
      check('fetchProcedures(): bad code and a signal already aborted answer at once', (await db.fetchProcedures('XX')).reason ===
        'bad-icao' && (await db.fetchProcedures('LFZZ', {
          signal: ac.signal
        })).reason === 'cancelled', null);
      check('fetchProcedures(): no launcher (none given, no job, no survey) is « no-launcher »', await reasonOf(db) ===
        'no-launcher' && await reasonOf(fetchDb({
          request: async () => null,
          info: () => ({
            data: true
          })
        })) === 'no-launcher' && await reasonOf(fetchDb(fake({
          info: () => null
        }))) === 'no-launcher' && calls.length === 0, calls);
      check('fetchProcedures(): a device paired to the workstation (lan) is « paired », nothing is asked', await reasonOf(fetchDb(
        fake({
          info: () => ({
            data: true,
            lan: true
          })
        }))) === 'paired' && calls.length === 0, calls);
      // un État ni LF ni lisible dans EAD Basic : « no-tables », rien n'est lancé ; lnm dit si le poste a des bases de Little Navmap
      const ul = await fetchDb(fake()).fetchProcedures('LBSF'),
        ulLnm = await fetchDb(fake({
          info: () => ({
            data: true,
            lan: false,
            lnm: ['navigraph']
          })
        })).fetchProcedures('LBSF'),
        ulNone = await fetchDb(fake({
          info: () => ({
            data: true,
            lan: false,
            lnm: []
          })
        })).fetchProcedures('LBSF');
      check('fetchProcedures(): a State with no coding table to read is « no-tables » with its outcome, nothing is asked', ul.reason ===
        'no-tables' && ul.outcome === 'none' && ul.lnm === false && calls.length === 0, [ul, calls.length]);
      check('fetchProcedures(): « no-tables » carries lnm = true when the workstation reports Little Navmap databases, false when none',
        ulLnm.reason === 'no-tables' && ulLnm.lnm === true && ulNone.reason === 'no-tables' && ulNone.lnm === false && [ul, ulLnm,
          ulNone
        ]
        .every(x => x.reason !== 'unknown-layout') && calls.length === 0, [ulLnm, ulNone]);
      // le travail : un faux lanceur qui écrit proc/manual/ comme le ferait le poste, puis rend le résultat du verbe
      let evicted = [],
        synced = 0;
      const rdr = {
          ...reader,
          evict: async x => evicted.push(x),
          status: async () => ({
            transport: 'local'
          }),
          sync: async () => ++synced
        },
        okDb = AeroDB.create({
          reader: rdr,
          lnmperf: false,
          launcher: fake(),
          now: () => Date.parse('2026-10-25T12:00:00Z')
        }),
        progress = [];
      jobAnswer.r = () => {
        files.set('proc/manual/EGLL.json', JSON.stringify(installed));
        files.set('proc/manual/index.json', JSON.stringify({
          schema: 1,
          folder: 'manual',
          aerodromes: {
            EGLL: {
              SID: 0,
              STAR: 1,
              APP: 0,
              status: 'check',
              cycle: '2026-10-08'
            }
          }
        }));
        return {
          ok: true,
          state: 'done',
          result: {
            ok: true,
            icao: 'EGLL',
            procedures: 1,
            warnings: ['w1'],
            commit: 'a'.repeat(40),
            ocr: false
          }
        };
      };
      const before = (await okDb.procedures('EGLL')).length,
        two = [okDb.fetchProcedures('EGLL', {
          onProgress: st => {
            progress.push(st);
            throw new Error('a listener that fails must not stop the job');
          }
        }), okDb.fetchProcedures('egll'), okDb.fetchProcedures(' EGLL ')],
        res = await Promise.all(two);
      check(
        'fetchProcedures(): one reading per aerodrome at a time (the others are « busy »), the job is asked once with the fixed verb',
        res.filter(x => x.ok).length === 1 && res.filter(x => x.reason === 'busy').length === 2 && calls.length === 1 && calls[0]
        .route === 'regen/job' && JSON.stringify(calls[0].body) === '{"set":"proc","verb":"ead-fetch","args":{"icao":"EGLL"}}', [res
          .map(x => x.reason || 'ok'), calls
        ]);
      const win = res.find(x => x.ok);
      check(
        'fetchProcedures(): the success gives the merged procedures read after the install, the warnings and the commit; progress forwarded',
        before === 0 && win.procedures.length === 1 && win.procedures[0].id === 'EGLL.STAR.OCK1H.RW27L' && win.procedures[0]
        .status ===
        'check' && win.icao === 'EGLL' && win.warnings.join() === 'w1' && win.commit === 'a'.repeat(40) && progress[0].step ===
        'EGLL: login' && progress[0].total === 3 && progress[0].source === 'ead' && win.source === 'ead', [before, win, progress]);
      check('fetchProcedures(): the reader is made to forget both files, and refresh its references without an exchange',
        evicted.includes('proc/manual/EGLL.json') && evicted.includes('proc/manual/index.json') && synced === 1, [evicted, synced]);
      check('fetchProcedures(): the aerodrome can be read again once the first reading is over',
        (await okDb.fetchProcedures('EGLL')).ok === true && calls.length === 2, calls.length);
      // les raisons rendues par le poste, et celles du lanceur lui-même
      const answers = {
          'no-credentials': {
            ok: true,
            state: 'done',
            result: {
              ok: false,
              reason: 'no-credentials'
            }
          },
          failed: {
            ok: true,
            state: 'done',
            result: {
              ok: false,
              reason: 'failed',
              message: 'login refused'
            }
          },
          'cancelled (result)': {
            ok: false,
            state: 'cancelled',
            result: {
              ok: false,
              reason: 'cancelled'
            }
          },
          'cancelled (signal)': {
            ok: false,
            cancelled: true
          },
          busy: {
            ok: false,
            status: 409,
            message: 'a job is already running'
          },
          paired: {
            ok: false,
            status: 403,
            refused: true
          },
          'no-tables': {
            ok: true,
            state: 'done',
            result: {
              ok: false,
              reason: 'no-tables'
            }
          },
          'failed (older launcher)': {
            ok: false,
            status: 400,
            message: 'unknown operation proc/ead-fetch'
          },
          'failed (error state)': {
            ok: false,
            state: 'error',
            result: {
              message: 'boom'
            }
          },
          'no-launcher': null
        },
        want = {
          'no-credentials': 'no-credentials',
          'no-tables': 'no-tables',
          failed: 'failed',
          'cancelled (result)': 'cancelled',
          'cancelled (signal)': 'cancelled',
          busy: 'busy',
          paired: 'paired',
          'failed (older launcher)': 'failed',
          'failed (error state)': 'failed',
          'no-launcher': 'no-launcher'
        },
        got = {};
      for (const [name, r] of Object.entries(answers)) {
        jobAnswer.r = r;
        got[name] = await okDb.fetchProcedures('EGLL');
      }
      check(
        'fetchProcedures(): every answer of the job maps to its reason (no-credentials, no-tables, failed, cancelled, busy, paired, no-launcher)',
        Object.keys(want).every(k => got[k].ok === false && got[k].reason === want[k]), got);
      check('fetchProcedures(): the message of a failure is handed on (login refused, older launcher, error state)', got.failed
        .message === 'login refused' && /unknown operation/.test(got['failed (older launcher)'].message) && got[
          'failed (error state)']
        .message === 'boom', got);
      // l'aiguillage par État : la France (LF) lit l'eAIP du SIA (eaip-fetch, jamais un refus de disposition), un État lisible dans EAD
      // Basic prend ead-fetch ; la source est dite dans la progression et dans la réponse
      calls.length = 0;
      const lfProgress = [];
      jobAnswer.r = {
        ok: true,
        state: 'done',
        result: {
          ok: true,
          icao: 'LFPO',
          procedures: 3,
          warnings: [],
          commit: 'b'.repeat(40),
          source: 'eaip',
          cycle: '2026-10-01'
        }
      };
      const lf = await okDb.fetchProcedures('lfpo', {
        onProgress: st => lfProgress.push(st)
      });
      check('fetchProcedures(): a French aerodrome (LF) asks the verb eaip-fetch, with the code and nothing else', lf.ok === true &&
        calls.length === 1 && calls[0].route === 'regen/job' && JSON.stringify(calls[0].body) ===
        '{"set":"proc","verb":"eaip-fetch","args":{"icao":"LFPO"}}', [lf, calls.map(x => x.body)]);
      check('fetchProcedures(): the progress of a French reading carries source « eaip », and so does the answer', lfProgress.length >
        0 && lfProgress.every(x => x.source === 'eaip') && lf.source === 'eaip', [lfProgress, lf.source]);
      calls.length = 0;
      jobAnswer.r = {
        ok: true,
        state: 'done',
        result: {
          ok: false,
          reason: 'no-tables'
        }
      };
      const lfNone = await okDb.fetchProcedures('LFXX');
      check('fetchProcedures(): a French aerodrome whose page lists no coding table is « no-tables » (never « unknown-layout »)',
        lfNone.ok === false && lfNone.reason === 'no-tables' && calls.length === 1, lfNone);
      calls.length = 0;
      jobAnswer.r = () => ({
        ok: true,
        state: 'done',
        result: {
          ok: true,
          icao: 'EGLL',
          procedures: 1,
          warnings: [],
          commit: null,
          source: 'ead'
        }
      });
      const ead = await okDb.fetchProcedures('EGLL');
      check('fetchProcedures(): a State readable in EAD Basic (EG) still asks ead-fetch', ead.ok === true && ead.source === 'ead' &&
        calls.length === 1 && calls[0].body.verb === 'ead-fetch', [ead, calls.map(x => x.body)]);
    } catch (e) {
      check('no exception', false, String(e && e.stack || e));
    }
    const out = document.getElementById('out');
    results.forEach(r => {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'ko';
      li.textContent = r.name + (r.ok ? '' : ' — ' + r.detail);
      out.append(li);
    });
    const fail = results.filter(r => !r.ok).length;
    document.getElementById('state').textContent = `${results.length - fail} / ${results.length} passed`;
    window.__procBench = {
      done: true,
      pass: results.length - fail,
      fail,
      rows: results.map(r => `${r.ok ? 'PASS' : 'FAIL'} ${r.name} ${r.detail}`)
    };
  })();
</script>
</body></html>
