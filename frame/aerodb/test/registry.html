<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aerodb — registry tests</title>
<!-- Essais du registre des aéronefs d'aerodb (frame/aerodb/registry.js, sheets.js) sur la couche de données réelle :
     FrameData en transport local, références lues au lanceur qui sert la page (references/aircraft_fleet.js,
     defa_reference.js, AircraftDB), fiches et flotte écrites par l'adaptateur d'aerodb. Cache du frame effacé au départ.
     Page d'outil servie par le lanceur (hors du service worker : dossier test/). -->
<style>
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 16px;
    background: #f5f6f8;
    color: #17202a
  }
  li.ok::marker {
    content: '✓ ';
    color: #1e7d32
  }
  li.ko::marker {
    content: '✗ ';
    color: #b3261e
  }
  li.ko {
    color: #b3261e
  }
  pre {
    font-size: 12px;
    white-space: pre-wrap
  }
</style></head>
<body>
<h1>aerodb — registry tests</h1>
<p id="state">running…</p>
<ol id="out"></ol>
<script src="../../store/frame_data.js?v=0"></script>
<script src="../../store/transport_git.js?v=0"></script>
<script src="../../store/transport_github.js?v=0"></script>
<script src="../../store/transport_launcher.js?v=0"></script>
<script src="../zones.js?v=0"></script>
<script src="../aircraft.js?v=0"></script>
<script src="../aerodb.js?v=0"></script>
<script>
  (async () => {
    const FD = window.FrameData,
      results = [],
      check = (name, ok, detail) => results.push({
        name,
        ok: !!ok,
        detail: ok ? '' : JSON.stringify(detail)
      });
    try {
      if (!await FD.launcher.detect()) throw new Error('serve this page from the launcher');
      await FD.reset();
      FD.configure({
        identity: {
          trigram: 'TST'
        },
        transport: FD.transports.local(),
        references: FD.launcher({
          exchange: false
        })
      });
      const decl = AeroDB.declaration(),
        data = FD.adapter(decl),
        // écritures des autres : la V2 (fpdb.json) et website (airline/fleet.json)
        seed = FD.adapter({
          id: 'seed',
          reads: ['airline/', 'planner/'],
          writes: ['airline/', {
            prefix: 'planner/flight_performance_database_merged.fpdb.json',
            merge: 'keyed:profiles:id'
          }]
        });
      // V2 : une fiche du planificateur (fpdb.json), plus ancienne
      await seed.put('planner/flight_performance_database_merged.fpdb.json', {
        schema: 'flight-performance-db/v1',
        profiles: [{
          id: 'A400_V2',
          name: 'A400M (planificateur)',
          icao: 'A400',
          unit: 'kg',
          cruise: {
            tasKt: 330,
            fuelFlowPerHour: 3500
          },
          updatedAt: '2026-01-01T00:00:00Z'
        }]
      });
      // flotte de la compagnie (website) : un A400 sans fiche à lui, un C-130J
      await seed.put('airline/fleet.json', {
        schema: 1,
        updated_at: '2026-10-20T10:00:00Z',
        by: 'website',
        aircraft: [{
          operator: 'Test',
          type: 'A400',
          variant: 'A400M Atlas',
          registration: 'F-RBAA',
          callsigns: ['TEST01'],
          base: 'LFOE'
        }, {
          operator: 'Test',
          type: 'C30J',
          variant: 'C-130J',
          registration: 'F-RAJA',
          callsigns: ['TEST02'],
          base: 'LFOJ'
        }]
      });
      await FD.sync();
      const db = AeroDB.create({
          reader: data,
          lnmperf: false
        }),
        A = await db.aircraft();
      check('legacy type API kept (classify, canonical, estimate)', A.classify('A400M').category === 'turboprop' && A.canonical(
          'A4M') ===
        'A400' && A.estimate('TBM9')?.kgPerHour > 0, null);
      // hélicoptères : plafond pratique et niveau économe bas, jamais un plafond d'avion
      const h = A.estimate('EC45'),
        hm = A.estimate('A139');
      check('helicopter estimate: category, ceiling at most 20 000 ft, economy level 3 000 ft', h?.category === 'helico' && h
        .ceilingFt <=
        20000 && h.ecoFt === 3000 && hm?.category === 'helico' && hm.ceilingFt <= 20000 && A.estimate('A400')?.category !== 'helico',
        [h,
          hm
        ]);
      // V3 § 10.34 (lot A2) : la limite de vent de travers est un champ de la fiche, hors du format .lnmperf
      const xw = A.lib?.PROFILE_FIELDS?.find(f => f[2] === 'maxCrosswindKt');
      check('schema: maxCrosswindKt in PROFILE_FIELDS (« Piste et alternat », number, not in .lnmperf)', !!xw && xw[0] ===
        'Piste et alternat' && xw[3] === 'number' && xw[4] === false, xw);
      check('sheets library configured (AeroDBSheets, lnmperf parser)', typeof A.lib?.parseLnmperf === 'function' && typeof A.lib
        ?.toLnmperf ===
        'function', null);
      // migration : la fiche de la V2 est adoptée, sans fichier écrit
      const list0 = await A.sheets.list();
      check('V2 sheet adopted in reading', list0.some(s => s.id === 'A400_V2' && s._fields?.['cruise.tasKt']?.source === 'v2'), list0);
      check('nothing written at reading', !(await data.list('aircraft/sheets/'))?.length, await data.list('aircraft/sheets/'));
      // recherche : ordre fiches → flotte → référence → types → code libre
      const all = await A.search('', 400),
        order = [...new Set(all.map(r => r.source))];
      check('empty search: sheets, then fleet, then reference', order.join() === 'sheet,fleet,reference', order);
      const a4 = await A.search('A400', 50),
        srcs = [...new Set(a4.map(r => r.source))];
      check('search A400: sheet, fleet and type results, in order', srcs[0] === 'sheet' && srcs.includes('fleet') && srcs.includes(
          'type') &&
        srcs.indexOf('fleet') < srcs.indexOf('type'), a4.map(r => `${r.source} ${r.label}`));
      check('free code offered last', (await A.search('ZZ9')).slice(-1)[0]?.kind === 'free', await A.search('ZZ9'));
      const ref = all.filter(r => r.source === 'reference');
      check('reference adds registrations, never bare numbers', ref.length > 0 && !ref.some(r => /^\d+$/.test(r.registration)), ref
        .slice(0,
          3));
      // appareil : fiche du type (alias), puis estimation
      const rb = await A.resolve('F-RBAA'),
        rj = await A.resolve('F-RAJA');
      check('fleet aircraft takes its type sheet', rb?.sheetId === 'A400_V2' && rb.sheetVia === 'type', rb);
      check('without a sheet: estimate', rj?.sheetVia === 'estimate' && rj.estimate, rj);
      check('fleet first (airline/fleet.json), callsign kept', rb?.callsigns?.includes('TEST01') && rb.origin?.type?.source === 'fleet',
        rb);
      // édition : champs tamponnés, valeur précédente gardée, miroir V2
      const t0 = (await A.sheets.get('A400_V2')),
        put = await A.sheets.put({
          ...t0,
          registration: 'F-RBAA',
          cruise: {
            ...t0.cruise,
            tasKt: 335
          }
        }, {
          source: 'edit'
        });
      check('put stamps changed fields only', put._fields['cruise.tasKt'].source === 'edit' && put._fields['cruise.fuelFlowPerHour']
        .source ===
        'v2' && put._fields.registration.source === 'edit', put._fields);
      check('previous value kept', put._kept['cruise.tasKt']?.[0]?.value === 330 && put._kept['cruise.tasKt'][0].source === 'v2', put
        ._kept);
      check('sheet file written', (await data.get('aircraft/sheets/A400_V2.json'))?.cruise?.tasKt === 335, null);
      const mirror = (await data.get('planner/flight_performance_database_merged.fpdb.json'))?.profiles?.find(p => p.id === 'A400_V2');
      check('V2 mirror: value, updated_at and updatedAt, no registry fields', mirror?.cruise?.tasKt === 335 && mirror.updated_at &&
        mirror
        .updatedAt && !mirror._fields && !mirror._kept, mirror);
      const B = await db.aircraft(),
        rb2 = await B.resolve('F-RBAA');
      check('own sheet wins once it carries the registration', rb2?.sheetVia === 'own', rb2);
      const o = await B.sheets.origins('A400_V2');
      check('origins: source, date and kept values per field', o['cruise.tasKt']?.source === 'edit' && o['cruise.tasKt'].kept.length ===
        1,
        o['cruise.tasKt']);
      // fusion champ par champ (règle du cadre) : chacun garde ce qu'il a de plus récent ; conflit si un même champ diffère
      const M = window.AeroDBRegistry.mergeSheets,
        base = {
          id: 'S',
          a: 1,
          b: 1
        },
        loc = {
          id: 'S',
          a: 2,
          b: 1,
          _fields: {
            a: {
              at: '2026-10-23T10:00:00Z',
              source: 'phone'
            }
          }
        },
        rem = {
          id: 'S',
          a: 1,
          b: 3,
          _fields: {
            b: {
              at: '2026-10-23T11:00:00Z',
              source: 'pc'
            },
            a: {
              at: '2026-10-22T00:00:00Z',
              source: 'pc'
            }
          }
        },
        m = M(base, loc, rem);
      check('merge: newest field wins on each side', m.value.a === 2 && m.value.b === 3 && m.value._fields.a.source === 'phone' && m
        .value
        ._fields.b.source === 'pc', m.value);
      check('merge: same field different values → loser kept, conflict reported', m.value._kept.a?.[0]?.value === 1 && !!m.lost, m);
      const lnm = A.lib.toLnmperf ? (() => {
        try {
          return A.lib.toLnmperf(put);
        } catch (e) {
          return e.message;
        }
      })() : '';
      check('lnmperf written from a registry sheet (or refused with the missing fields)', typeof lnm === 'string' && lnm.length > 0, lnm
        .slice(0, 200));
      // Little Navmap n'a ni immatriculation ni indicatif : jamais requis pour l'export
      const miss = A.lib.missingLnmperfFields({
        ...put,
        registration: '',
        callsign: ''
      });
      check('lnmperf: registration and callsign never required', !miss.some(m => /Immatriculation|Indicatif/.test(String(m))), miss);
      check('fleet given to the sheets logic (ChatGPT prompt)', (await A.fleetTypes()).some(f => f.type === 'A400' && f.registrations
        .includes(
          'F-RBAA')), await A.fleetTypes());
      // une ligne par immatriculation : fiche à soi sans consommation + flotte → une seule ligne, devis par la fiche du
      // type (ou l'estimation), champs fusionnés avec leur origine
      await seed.put('airline/fleet.json', {
        schema: 1,
        updated_at: '2026-10-23T10:00:00Z',
        by: 'website',
        aircraft: [{
          operator: 'Test',
          type: 'A400',
          variant: 'A400M Atlas',
          registration: 'F-RBAA',
          callsigns: ['TEST01'],
          base: 'LFOE'
        }, {
          operator: 'Test',
          type: 'C30J',
          variant: 'C-130J',
          registration: 'F-RAJA',
          callsigns: ['TEST02'],
          base: 'LFOJ'
        }, {
          operator: 'Test',
          type: 'A400',
          variant: 'A400M Atlas',
          registration: 'F-TEST',
          callsigns: ['TEST03'],
          base: 'LFOE'
        }]
      });
      await FD.sync();
      // une fiche ancienne d'appareil (immatriculation, identifiant hors règle) : elle vient de la V2, comme dans les données réelles
      const fp0 = await data.get('planner/flight_performance_database_merged.fpdb.json');
      await seed.put('planner/flight_performance_database_merged.fpdb.json', {
        ...fp0,
        profiles: [...fp0.profiles, {
          id: 'MY_FTEST',
          name: 'Mon A400',
          icao: 'A400',
          registration: 'F-TEST',
          callsign: 'OLDCS',
          unit: 'kg',
          cruise: {
            tasKt: 300
          },
          updatedAt: '2026-10-23T10:00:00Z'
        }]
      });
      await FD.sync();
      const C = await db.aircraft(),
        ft = (await C.search('F-TEST', 50)).filter(r => r.registration === 'F-TEST');
      check('one line per registration (own sheet and fleet merged)', ft.length === 1 && ft[0].ownSheetId === 'MY_FTEST' && ft[0]
        .sources.includes('sheet') && ft[0].sources.some(x => x.startsWith('fleet')), ft);
      check('own sheet without fuel flow: quote from the type sheet, fields merged with origin', ft[0]?.sheetId === 'A400_V2' && ft[0]
        .sheetVia === 'type' && ft[0].callsign === 'TEST03' && ft[0].origin.callsign !== 'sheet' && ft[0].name === 'Mon A400' && ft[0]
        .origin.name === 'sheet', ft[0]);
      const ftR = await C.resolve('F-TEST');
      check('resolve: own sheet kept as ownSheetId, quote sheet from the type', ftR?.ownSheetId === 'MY_FTEST' && ftR.sheetId ===
        'A400_V2', ftR);
      // V3 § 10.35, L0 : une fiche décrit un type ou une variante, jamais un appareil
      const PF = A.lib.PROFILE_FIELDS,
        fieldAt = path => PF.find(f => f[2] === path);
      check('schema: neither « Immatriculation » nor « Indicatif » in PROFILE_FIELDS (a sheet has no airframe identity)', !fieldAt(
        'registration') && !fieldAt('callsign'), PF.map(f => f[2]));
      check(
        'schema: « Maintenance et coût » (check and overhaul every h, hourly cost) and the fuel density beside jetFuel, numbers, optional, not in .lnmperf',
        ['maintenance.checkEveryH', 'maintenance.overhaulEveryH', 'hourlyCost'].every(x => fieldAt(x)?.[0] ===
          'Maintenance et coût' &&
          fieldAt(x)[3] === 'number' && fieldAt(x)[4] === false) && fieldAt('fuelDensityKgPerL')?.[3] === 'number' && fieldAt(
          'fuelDensityKgPerL')[4] === false && fieldAt('fuelDensityKgPerL')[5]?.min === 0.5 && fieldAt('fuelDensityKgPerL')[5]
        ?.max === 1 && PF.indexOf(fieldAt('fuelDensityKgPerL')) === PF.indexOf(fieldAt('jetFuel')) + 1 && !A
        .lib
        .sheetMissingPaths({
          id: 'X',
          icao: 'A400'
        }).some(x => /maintenance|hourlyCost|fuelDensity/.test(x)), PF.slice(-4));
      const RG = window.AeroDBRegistry;
      check('id rule: C30J and C30J-VARIANT [A-Z0-9-]; refused: lower case, underscore, a trailing dash, another type, taken', [RG
        .checkId('C30J', 'C30J'), RG.checkId('C30J-NAVY-2', 'C30J'), RG.checkId('c30j'), RG.checkId('C30J_X'), RG.checkId('C30J-'),
        RG
        .checkId('A400-X', 'C30J'), RG.checkId('C30J', '', x => x === 'C30J')
      ].join() === ',,format,format,format,type,taken', null);
      const old = await C.sheets.get('MY_FTEST'),
        lv = old?._variant;
      check('a sheet that carries a registration is read as the variant « TYPE · F-XXXX », nothing lost nor hidden (never written)',
        lv?.label === 'A400 · F-TEST' && lv.base === false && lv.registration === 'F-TEST' && old.name === 'Mon A400' && old
        .registration === 'F-TEST' && !('_variant' in JSON.parse(JSON.stringify(old))), lv);
      check('search: the old sheet of an aircraft gives one line, the callsign is the aircraft\'s (fleet), the old one only without',
        ft[0]?.callsign === 'TEST03', ft[0]);
      let refused = '';
      try {
        await C.sheets.put({
          id: 'DB_A400_F-NEW',
          icao: 'A400',
          name: 'x'
        });
      } catch (e) {
        refused = e.code;
      }
      check('a new sheet whose id is outside the rule is refused (sheet-id-format), nothing written', refused === 'sheet-id-format' &&
        !(await data.get('aircraft/sheets/DB_A400_F-NEW.json')), refused);
      const nb = await C.sheets.newId('A400');
      await C.sheets.put({
        id: nb,
        name: 'A400M',
        icao: 'A400',
        unit: 'kg',
        cruise: {
          tasKt: 320,
          fuelFlowPerHour: 3600
        }
      });
      const nv = await C.sheets.newId('A400', 'Atlas long range');
      await C.sheets.put({
        id: nv,
        name: 'A400M Atlas LR',
        icao: 'A400',
        unit: 'kg',
        cruise: {
          tasKt: 325,
          fuelFlowPerHour: 3700
        }
      });
      check('newId: the base when free, then the variant in capitals, -2 when taken; nothing without a type code', nb === 'A400' &&
        nv === 'A400-ATLAS-LONG-RANGE' && await C.sheets.newId('A400') === 'A400-V2' && await C.sheets.newId('a400',
          'atlas long range') === 'A400-ATLAS-LONG-RANGE-2' && await C.sheets.newId('??') === '', [nb, nv]);
      check('the V2 mirror keeps being written (fpdb.json), a variant like any sheet', (await data.get(
        'planner/flight_performance_database_merged.fpdb.json'))?.profiles?.some(x => x.id === nv), null);
      check('an existing sheet keeps its id outside the rule (legacy MY_FTEST updated)', !!(await C.sheets.put({
        ...old,
        name: 'Mon A400 (relu)'
      })) && (await C.sheets.get('MY_FTEST')).name === 'Mon A400 (relu)', null);
      // schéma 2 de la flotte (modules/aircraft/SPEC, L1) : la fiche que nomme l'entrée ; vide, l'estimation du type
      await seed.put('airline/fleet.json', {
        schema: 2,
        updated_at: '2026-10-31T10:00:00Z',
        by: 'website',
        aircraft: [{
          type: 'A400',
          registration: 'F-RBAA',
          sheetId: nv,
          callsigns: ['TEST01']
        }, {
          type: 'A400',
          registration: 'F-TEST',
          sheetId: '',
          callsigns: ['TEST03']
        }, {
          type: 'C30J',
          registration: 'F-RAJA',
          sheetId: 'C30J-GONE',
          callsigns: ['TEST02']
        }, {
          type: 'A400',
          registration: 'F-RBAC',
          callsigns: ['TEST04']
        }]
      });
      await FD.sync();
      const D = await db.aircraft(),
        [s1, s2, s3, s4] = await Promise.all(['F-RBAA', 'F-TEST', 'F-RAJA', 'F-RBAC'].map(r => D.resolve(r)));
      check('schema 2: the sheet its fleet entry names (via fleet), not its old sheet', s1?.sheetId === nv && s1.sheetVia === 'fleet' &&
        s1.ownSheetId === nv, s1);
      check('schema 2: sheetId empty → the type estimate, never another sheet (neither its old sheet nor the base)', s2?.sheetId ===
        '' && s2.sheetVia === 'estimate' && !!s2.estimate, s2);
      check('schema 2: a sheet that is not there → the estimate', s3?.sheetId === '' && s3.sheetVia === 'estimate', s3);
      check('a row without sheetId (schema 1 rule): the type sheet, the base A400 first', s4?.sheetId === 'A400' && s4.sheetVia ===
        'type', s4);
      const row = (await D.search('F-RBAA', 50)).filter(r => r.registration === 'F-RBAA');
      check('search: one line, the quote from the named sheet, the callsign from the fleet', row.length === 1 && row[0].sheetId ===
        nv && row[0].callsign === 'TEST01', row);
    } catch (e) {
      check('threw', false, e.stack || String(e));
    }
    const out = document.getElementById('out');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'ko';
      li.innerHTML = `${r.name}${r.detail ? `<pre>${r.detail.replace(/</g, '&lt;')}</pre>` : ''}`;
      out.append(li);
    }
    const ko = results.filter(r => !r.ok);
    document.getElementById('state').textContent = `${results.length - ko.length} / ${results.length} checks passed`;
    window.__results = {
      total: results.length,
      failed: ko
    };
  })();
</script>
</body></html>
