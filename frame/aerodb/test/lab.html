<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aerodb — data laboratory</title>
<!-- Essais du laboratoire des données (frame/aerodb/lab_*.js, écran #datalab, TEMPORAIRE) : la table des sources (adresses valides,
     cycle AIRAC dérivé pour l'eAIP et le CIFP sur le cycle 2610 connu), le lecteur XML par balises EN FLUX contre les lecteurs de
     la page (shared/sia_base.js parseXmlSia*, parseAixm*, SiaAero.parseAixm : test doré, mêmes résultats sur la même fixture, quelle
     que soit la taille des tranches), le ZIP lu en flux (AeroLabZip), les trois modes entre eux (a : page comme V2 ; b, c : sans
     DOMParser, aussi dans un vrai Worker), et le format du rapport. Les fixtures (fixtures/lab/) sont synthétiques, de la forme des
     vrais fichiers du SIA du 2026-10-01 (XML_SIA en ISO-8859-1, AIXM 4.5 en UTF-8) : aucune donnée du SIA. Résultat : window.__labBench.
     window.__labCompare(file) compare les trois modes sur un ZIP quelconque (essai local sur le vrai export, hors suite). -->
<style>
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 16px
  }
  li.ok::marker {
    content: '✓ '
  }
  li.ko::marker {
    content: '✗ '
  }
</style></head>
<body>
<h1>aerodb — data laboratory</h1>
<p id="state">running…</p>
<ol id="out"></ol>
<script src="../lab_sources.js?v=0"></script>
<script src="../lab_xml.js?v=0"></script>
<script src="../lab_zip.js?v=0"></script>
<script src="../lab_run.js?v=0"></script>
<script src="../lab_report.js?v=0"></script>
<script src="../lab_measure.js?v=0"></script>
<script>
  (async () => {
    const results = [],
      check = (name, ok, detail) => results.push({
        name,
        ok: !!ok,
        detail: ok ? '' : JSON.stringify(detail)
      });
    const J = JSON.stringify;
    const KEYS = ['airspacesSia', 'ringsSia', 'pointsSia', 'vrp', 'airspacesAixm', 'pointsAixm', 'aerodromes', 'navaids', 'points',
      'obstacles', 'obstacleCells'
    ];
    /** Les comptes communs des trois modes. */
    const pick = s => Object.fromEntries(KEYS.map(k => [k, s[k]]));
    window.__labCompare = async file => {
      const out = {};
      for (const m of ['c', 'b', 'a']) {
        const t0 = performance.now();
        const r = m === 'a' ? await AeroLabMeasure.modeA(file) : await AeroLabMeasure.modeWorker(m, file);
        out[m] = {
          summary: r.summary,
          steps: r.steps,
          peak: r.peak,
          sizes: r.sizes,
          stats: r.stats,
          wall: Math.round(performance.now() - t0)
        };
      }
      return out;
    };
    try {
      await AeroLabMeasure.needV2(); // ZipStore, SiaAero, SiaBase (V2) chargés comme le fait l'écran
      const S = AeroLabSources;
      // ------------------------------------------------------------------ la table des sources
      const urls = S.SOURCES.map(s => S.urlOf(s, '2610'));
      check('16 sources (the 17 of the table without X-Plane and the aircraft types, plus EAD Basic as no. 18)', S.SOURCES.length ===
        16 &&
        new Set(S.SOURCES.map(s => s.no)).size === 16 && !S.SOURCES.some(s => s.no === 11 || s.no === 16) && S.byId('ead').no ===
        18 &&
        S.SOURCES[S.SOURCES.findIndex(s => s.id === 'nats') + 1].id === 'ead', S.SOURCES.map(s => s.no));
      check('every source has an https address that is a valid URL', urls.every(u => {
        try {
          return new URL(u).protocol === 'https:'
        } catch {
          return false
        }
      }), urls);
      check('every source has four names, a size, a licence and a chain', S.SOURCES.every(s => s.n.length === 4 && s.n.every(x => x) &&
        s.size > 0 && s.lic && s.chain), S.SOURCES.map(s => s.id));
      check('human gestures (SIA zip, NATS) say so in four languages and name the expected file', ['sia', 'nats'].every(id => {
        const s = S.byId(id);
        return s.human && s.human.length === 4 && s.human.every(x => x) && s.name && s.nameText
      }), 0);
      // ---- passe 2 : le lien direct de chaque ligne (jamais d'adresse à recopier)
      const eai = S.byId('eaip'),
        cif = S.byId('cifp'),
        now = S.cycleOf(Date.UTC(2026, 9, 26)),
        seenOk = new Map([
          [S.urlOf(eai, '2611'), {
            ok: true,
            diag: null
          }]
        ]),
        seenCors = new Map([
          [S.urlOf(eai, '2611'), {
            ok: false,
            diag: 'cors'
          }]
        ]);
      const one = S.linkSet(eai, new Map, now),
        two = S.linkSet(eai, new Map, now, '2611');
      check('link: the eAIP row links to the cycle in force, derived by cycle (2610)', one.length === 1 && one[0].cycle === '2610' &&
        one[0].url ===
        'https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_01_OCT_2026/FRANCE/AIRAC-2026-10-01/html/eAIP/FR-menu-fr-FR.html', one
      );
      check('link: the next cycle (2611) is added when it is asked for, with its own derived address', two.length === 2 && two[1]
        .next === true &&
        two[1].cycle === '2611' && two[1].url ===
        'https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_29_OCT_2026/FRANCE/AIRAC-2026-10-29/html/eAIP/FR-menu-fr-FR.html', two
      );
      check(
        'link: the next cycle is added when its last test answered, not when it was only blocked by CORS (that says nothing of the file)',
        S.linkSet(eai, seenOk, now).length === 2 && S.linkSet(eai, seenCors, now).length === 1 && S.linkSet(eai, new Map, now)
        .length === 1, 0);
      const cfl = S.linkSet(cif, new Map, now, '2611');
      check('link: the CIFP row gives CIFP_261001.zip then CIFP_261029.zip', cfl.map(x => x.url.split('/').pop()).join() ===
        'CIFP_261001.zip,CIFP_261029.zip' && cfl.every(x => x.url.startsWith('https://aeronav.faa.gov/Upload_313-d/cifp/')), cfl);
      check('link: SIA product page and VAC chart follow the cycle too; the others have a single link', ['sia', 'vac'].every(id => S
          .linkSet(S
            .byId(id), new Map, now, '2611').length === 2 && S.linkSet(S.byId(id), new Map, now, '2611')[1].url !== S.linkSet(S.byId(
              id), new Map,
            now)[0].url) && S.SOURCES.filter(s => !s.cycled).every(s => S.linkSet(s, new Map, now, '2611').length === 1) &&
        S.SOURCES.filter(s => s.cycled).map(s => s.id).join() === 'sia,vac,eaip,cifp', S.SOURCES.filter(s => s.cycled).map(s => s.id));
      check('link: every link is a valid https address', S.SOURCES.every(s => S.linkSet(s, new Map, now, '2611').every(l => {
        try {
          return new URL(l.url).protocol === 'https:'
        } catch {
          return false
        }
      })), 0);
      check('every page that is not a file says what to download there, in four languages (get)', S.SOURCES.filter(s => s.asPage).every(
        s => s.get && s.get.length === 4 && s.get.every(x => x)), S.SOURCES.filter(s => s.asPage && !s.get).map(s => s.id));
      const ead = S.byId('ead');
      check('EAD Basic: the public login page, the AJAX form to call with empty fields, the host, no credential anywhere', ead.url ===
        'https://www.ead.eurocontrol.int/cms-eadbasic/opencms/en/login/ead-basic/' && ead.login ===
        'https://www.ead.eurocontrol.int/fwf-eadbasic/ajaxlogin/ajax_security_check.jspx' && ead.asPage && ead.pageChain === 'html' &&
        ead.chain === 'pdf' &&
        /\.pdf/.test(ead.accept) && /\.zip/.test(ead.accept) && S.hosts().includes('https://www.ead.eurocontrol.int') &&
        ead.human.length === 4 && ead.get.length === 4 && !/password|passwd|j_password=\w|token/i.test(JSON.stringify(ead.url) + ead
          .login), ead);
      check('the SIA row names the picker path "Files > Downloads" for iPhone', /Fichiers/.test(S.byId('sia').human[0]) && /Files/.test(
          S.byId('sia').human[1]) && /Dateien/.test(S.byId('sia').human[2]) && /Archivos/.test(S.byId('sia').human[3]), S.byId('sia')
        .human);
      check('AIRAC 2610: eAIP folder', S.eaipBase('2610') ===
        'https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_01_OCT_2026/FRANCE/AIRAC-2026-10-01', S.eaipBase('2610'));
      check('AIRAC 2610: eAIP menu page address', S.urlOf(S.byId('eaip'), '2610') ===
        'https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_01_OCT_2026/FRANCE/AIRAC-2026-10-01/html/eAIP/FR-menu-fr-FR.html', S
        .urlOf(S.byId('eaip'), '2610'));
      check('AIRAC 2610: VAC chart address on the same disc', S.urlOf(S.byId('vac'), '2610') ===
        'https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_01_OCT_2026/Atlas-VAC/PDF_AIPparSSection/VAC/AD/AD-2.LFBD.pdf', S
        .urlOf(S.byId('vac'), '2610'));
      check('AIRAC 2610: CIFP package', S.cifpName('2610') === 'CIFP_261001.zip' && S.urlOf(S.byId('cifp'), '2610') ===
        'https://aeronav.faa.gov/Upload_313-d/cifp/CIFP_261001.zip', S.cifpName('2610'));
      check('AIRAC 2611 (29 October): CIFP and eAIP', S.cifpName('2611') === 'CIFP_261029.zip' &&
        /eAIP_29_OCT_2026\/FRANCE\/AIRAC-2026-10-29$/.test(S.eaipBase('2611')), [S.cifpName('2611'), S.eaipBase('2611')]);
      check('AIRAC 2601: 22 January', S.cifpName('2601') === 'CIFP_260122.zip' && S.cycleDate('2601') === '2026-01-22', S.cycleDate(
        '2601'));
      check('SIA product page of the cycle', S.siaPage('2610').endsWith('/donnees-aeronautiques-xml-airac-10-26.html') && S.siaPage(
        '2611').endsWith('airac-11-26.html'), S.siaPage('2610'));
      const c1 = S.cycleOf(Date.UTC(2026, 9, 26)),
        c2 = S.cycleOf(Date.UTC(2026, 9, 29)),
        c3 = S.cycleOf(Date.UTC(2026, 11, 31));
      check('cycle in force on 26 Oct 2026 is 2610 (1 Oct), next 2611 (29 Oct)', c1.id === '2610' && c1.date === '2026-10-01' && c1.next
        .id === '2611' && c1.next.date === '2026-10-29', c1);
      check('cycle in force on 29 Oct 2026 is 2611', c2.id === '2611' && c2.date === '2026-10-29', c2);
      check('year end: 31 Dec 2026 is 2613, next is 2701 (21 Jan 2027)', c3.id === '2613' && c3.next.id === '2701' && c3.next.date ===
        '2027-01-21', c3);
      const a = S.siaFileInfo('export_xml_bd_SIA_2026-10-01-v02.zip'),
        b = S.siaFileInfo('export_xml_bd_sia_2026-10-01-v02.zip');
      check('SIA file name: cycle and version read from the name, any case', a.ok && a.cycle === '2610' && a.version === 2 && a.date ===
        '2026-10-01' && J(a) === J(b), [a, b]);
      check('SIA file name: a copy "(1)" is accepted, a wrong name is not', S.siaFileInfo('export_xml_bd_SIA_2026-10-01-v02 (1).zip')
        .ok && !S.siaFileInfo('data.zip').ok && !S.siaFileInfo('export_xml_bd_SIA_2026.zip').ok, 0);
      check('CIFP file name: cycle read from the name', S.cifpFileInfo('CIFP_261001.zip').cycle === '2610' && S.cifpFileInfo(
        'CIFP_261029.zip').cycle === '2611' && !S.cifpFileInfo('cifp.zip').ok, S.cifpFileInfo('CIFP_261001.zip'));
      check('hosts of the table are listed for the page policy', S.hosts().length >= 11 && S.hosts().every(h =>
        /^https:\/\/[a-z0-9.-]+$/.test(h)), S.hosts());

      // ------------------------------------------------------------------ la fixture
      const fetchBytes = async p => new Uint8Array(await (await fetch(p)).arrayBuffer());
      const siaBytes = await fetchBytes('fixtures/lab/XML_SIA_sample.xml'),
        aixmBytes = await fetchBytes('fixtures/lab/AIXM4.5_sample.xml');
      const siaText = new TextDecoder('iso-8859-1').decode(siaBytes),
        aixmText = new TextDecoder('utf-8').decode(aixmBytes);
      check('the encodings are read from the prologue', AeroLabXml.sniff(siaBytes) === 'iso-8859-1' && AeroLabXml.sniff(aixmBytes) ===
        'utf-8', [AeroLabXml.sniff(siaBytes), AeroLabXml.sniff(aixmBytes)]);
      const feed = (kind, text, size) => {
        const r = AeroLabXml.create(kind);
        for (let i = 0; i < text.length; i += size) r.push(text.slice(i, i + size));
        return r;
      };
      // test doré XML_SIA : mêmes espaces (type, nom, clé, anneaux) et mêmes points VFR que parseXmlSia*, à toute taille de tranche
      const refA = SiaBase.parseXmlSiaAirspaces(siaText),
        refV = SiaBase.parseXmlSiaVfrPoints(siaText);
      check('fixture XML_SIA is of the real shape (spaces with rings, VFR points, accents)', refA.length >= 20 && refV.length >= 10 &&
        refA.some(x => x.rings.length > 1) && /é/.test(siaText), [refA.length, refV.length]);
      for (const size of [1, 7, 64, 1000, siaText.length]) {
        const r = feed('sia', siaText, size),
          out = r.end();
        check(`XML_SIA, chunks of ${size}: the same airspaces as parseXmlSiaAirspaces`, J(out.airspaces) === J(refA), [out.airspaces.length, refA.length]);
        check(`XML_SIA, chunks of ${size}: the same VFR points as parseXmlSiaVfrPoints`, J(out.vrp) === J(refV), [out.vrp.length, refV.length]);
      }
      const o = feed('sia', siaText, 500).end();
      const naive = n => (siaText.match(new RegExp(`<${n}\\s`, 'g')) || []).length;
      check('XML_SIA: the other records are counted, per kind', o.counts.Ad === 5 && o.counts.Route === 4 && o.counts.Obstacle === 8 &&
        o.counts.Espace === naive('Espace') - o.counts.Partie && o.counts.NavFix === 20, o.counts);
      check('XML_SIA: the machine holds the largest block, not the file', feed('sia', siaText, 4096).stats().peakChars < siaText
        .length / 4, feed('sia', siaText, 4096).stats());
      // AIXM 4.5
      const doc = new DOMParser().parseFromString(aixmText, 'application/xml'),
        refAir = SiaBase.parseAixmAirspaces(doc),
        refObs = SiaBase.parseAixmObstacles(aixmText),
        refAero = SiaAero.parseAixm(aixmText);
      check('fixture AIXM is of the real shape (aerodromes, navaids, points, obstacles, spaces)', refAero.aerodromes.length >= 10 &&
        refAero.navaids.length >= 10 && refAir.length >= 5 && Object.keys(refObs).length >= 3, [refAero.aerodromes.length, refAero
          .navaids.length, refAir.length
        ]);
      for (const size of [1, 13, 100, 1000, aixmText.length]) {
        const out = feed('aixm', aixmText, size).end();
        const aer = J(out.aerodromes.map(x => [x.id, x.icao, x.name, +x.lat.toFixed(6), +x.lon.toFixed(6), x.elev, x.magVar])) === J(
          refAero.aerodromes.map(x => [x.id, x.icao, x.name, +x.lat.toFixed(6), +x.lon.toFixed(6), x.elev, x.magVar]));
        check(`AIXM, chunks of ${size}: the same aerodromes as SiaAero.parseAixm`, aer, [out.aerodromes.length, refAero.aerodromes.length]);
        const kinds = l => l.reduce((m, n) => (m[n.kind] = (m[n.kind] || 0) + 1, m), {});
        check(`AIXM, chunks of ${size}: the same navaids (kinds, merged DME / TACAN)`, J(kinds(out.navaids)) === J(kinds(refAero.navaids)) && out.navaids.length === refAero.navaids.length &&
          out.navaids.filter(n => n.dme).length === refAero.navaids.filter(n => n.dme).length && out.navaids.filter(n => n.tacan)
          .length === refAero.navaids.filter(n => n.tacan).length,
          [J(kinds(out.navaids)), J(kinds(refAero.navaids))]);
        check(`AIXM, chunks of ${size}: the same points, obstacles and obstacle cells`, out.points === refAero.points.length && out.obstacles === refAero.obstacles.length && J(out.obstacleCells) ===
          J(refObs), [out.points, refAero.points.length, out.obstacles, refAero.obstacles.length, J(out.obstacleCells), J(refObs)]);
        check(`AIXM, chunks of ${size}: the same airspaces as parseAixmAirspaces (type, name, key, parts)`, J(out.airspaces.map(x => [x.type, x.name, x.key, x.parts])) === J(refAir.map(x => [x.type, x.name, x.key, x
          .rings.length
        ])), [J(out.airspaces.map(x => [x.type, x.name, x.key, x.parts])), J(refAir.map(x => [x.type, x.name, x.key, x.rings
          .length
        ]))]);
        check(`AIXM, chunks of ${size}: the same number of outline points, arcs included`, out.airspaces.reduce((n, x) => n + x.points, 0) === refAir.reduce((n, x) => n + x.rings.reduce((m, r) => m + r
          .length, 0), 0), [out.airspaces.reduce((n, x) => n + x.points, 0), refAir.reduce((n, x) => n + x.rings.reduce((m, r) =>
          m + r.length, 0), 0)]);
      }
      const oa = feed('aixm', aixmText, 700).end();
      check('AIXM: the other records are counted', oa.counts.Rwy === 6 && oa.counts.Org === 1 && oa.counts.Ils === 2, oa.counts);
      // le test que l'on veut : les cas limites du lecteur (commentaire, CDATA, auto-fermante, balise coupée en deux tranches)
      const odd =
        '<?xml version="1.0" encoding="UTF-8"?><AIXM-Snapshot><!-- <Ahp> faux --><Ahp><AhpUid mid="1"><codeId>ZZZZ</codeId></AhpUid><txtName><![CDATA[ a > b <c> ]]></txtName><codeIcao>ZZZZ</codeIcao><geoLat>450000N</geoLat><geoLong>0010000E</geoLong></Ahp><Dpn/><Dpn><DpnUid mid="2"><codeId>P</codeId></DpnUid></Dpn></AIXM-Snapshot>';
      for (const size of [1, 3, 11, odd.length]) {
        const out = feed('aixm', odd, size).end();
        check(`reader edge cases (comment, CDATA, self-closing tag), chunks of ${size}`, out.aerodromes.length === 1 && out.aerodromes[0].icao === 'ZZZZ' && out.counts.Ahp === 1 && out.counts.Dpn ===
          2, [out.aerodromes.length, out.counts]);
      }
      // ------------------------------------------------------------------ le ZIP en flux, les trois modes
      const zip = new File([await ZipStore.build([{
        name: 'XML_SIA_2026-10-01.xml',
        data: siaBytes
      }, {
        name: 'AIXM4.5_all_FR_OM_2026-10-01.xml',
        data: aixmBytes
      }, {
        name: 'Lisez_moi.txt',
        data: 'hello'
      }], {
        compress: true
      })], 'export_xml_bd_SIA_2026-10-01-v02.zip');
      const ents = await AeroLabZip.entries(zip);
      check('streamed zip: the central directory is read from the end of the file', ents.length === 3 && ents.find(e => e.name ===
        'XML_SIA_2026-10-01.xml').size === siaBytes.length && ents.some(e => e.method === 8), ents);
      const back = new Uint8Array(await new Response(await AeroLabZip.stream(zip, ents.find(e => /AIXM/.test(e.name)))).arrayBuffer());
      check('streamed zip: an entry comes back byte for byte', back.length === aixmBytes.length && back.every((v, i) => v === aixmBytes[
        i]), back.length);
      const ra = await AeroLabMeasure.modeA(zip),
        rb = await AeroLabRun.modeB(zip),
        rc = await AeroLabRun.modeC(zip);
      check('mode a (V2 chain, DOMParser): steps timed, sizes by kind, counts', ra.steps.length >= 8 && ra.sizes.airspaces > 0 && ra
        .summary.aerodromes === refAero.aerodromes.length && ra.summary.airspacesSia === refA.length && ra.summary.airspacesAixm ===
        refAir.length, ra.summary);
      check('mode b (no DOMParser, zip in memory): same counts as mode a', J(pick(rb.summary)) === J(pick(ra.summary)), [pick(rb
        .summary), pick(ra.summary)]);
      check('mode c (no DOMParser, everything streamed): same counts as mode a', J(pick(rc.summary)) === J(pick(ra.summary)), [pick(rc
        .summary), pick(ra.summary)]);
      check('modes b and c: every step has a time; c has its own inflate pass and a compile step', rb.steps.every(s => s.ms >= 0) && rc
        .steps.some(s => /inflate/.test(s.name)) && rc.steps.some(s => /stream/.test(s.name)) && rc.steps.at(-1).name === 'compile',
        rc.steps);
      check('the three modes report the encodings and the tags read', rc.stats.sia.encoding === 'iso-8859-1' && rc.stats.aixm
        .encoding === 'utf-8' && rc.stats.sia.tags > 100, rc.stats);
      let wb = null,
        wc = null,
        werr = '';
      try {
        wb = await AeroLabMeasure.modeWorker('b', zip);
        wc = await AeroLabMeasure.modeWorker('c', zip);
      } catch (e) {
        werr = String(e && e.message || e);
      }
      check('modes b and c in a real Worker (no DOM there): same counts as mode a', !werr && J(pick(wb.summary)) === J(pick(ra
        .summary)) && J(pick(wc.summary)) === J(pick(ra.summary)), [werr, wb && pick(wb.summary)]);
      // ------------------------------------------------------------------ les autres chaînes et le test d'une adresse
      const cifpBytes = await fetchBytes('fixtures/cifp/KSEA_subset.arinc');
      const cifpText = new TextDecoder('iso-8859-1').decode(cifpBytes),
        cifpRecs = cifpText.split('\n').filter(l => l.length >= 100);
      const cifpZip = new Blob([await ZipStore.build([{
        name: 'FAACIFP18',
        data: cifpBytes
      }, {
        name: 'CIFP_Readme.txt',
        data: 'x'
      }], {
        compress: true
      })], {
        type: 'application/zip'
      });
      const cf = await AeroLabMeasure.chainCifp(cifpZip);
      check('CIFP chain: the 132-column records are counted and only the PA (airport) record is read', cf.records === cifpRecs.length -
        1 && cf.airports === 1 && cf.sample === 'KSEA' && cf.cycle === '2610' && cf.entry === 'FAACIFP18' && cf.steps.length === 2, cf
      );
      check('CIFP chain: the largest sections are listed', /P =\d+/.test(cf.topSections) || /PE=\d+/.test(cf.topSections), cf
        .topSections);
      const jb = await AeroLabMeasure.chainJson(new Blob([J({
          type: 'FeatureCollection',
          features: [1, 2, 3]
        })])),
        jo = await AeroLabMeasure.chainJson(new Blob([J({
          tracks: [],
          x: 1
        })]));
      check('JSON chain: shape, read and parse times', jb.shape === 'FeatureCollection[3]' && /^object\{tracks,x\}$/.test(jo.shape) &&
        jb.parseMs >= 0 && jb.readMs >= 0, [jb, jo]);
      const hb = await AeroLabMeasure.chainHtml(new Blob([
        '<html><title> Menu </title><a href="a.pdf">x</a><a href="b.html">y</a><a href=\'c.zip\'>z</a></html>'
      ]));
      check('HTML chain: title, links, PDF and ZIP links', hb.title === 'Menu' && hb.links === 3 && hb.pdfLinks === 1 && hb.zipLinks ===
        1, hb);
      const pb = await AeroLabMeasure.chainBin(new Blob(['%PDF-1.7 abc'])),
        gb = await AeroLabMeasure.chainBin(new Blob(['GRIB....']));
      check('binary chain: PDF (and why its rows are not read here), GRIB', pb.magic === 'PDF' && /pypdf/.test(pb.pdfText) && gb
        .magic === 'GRIB' && !gb.pdfText, [pb, gb]);
      const here = new URL('fixtures/lab/AIXM4.5_sample.xml', location.href).href;
      const bigUrl = URL.createObjectURL(new Blob([new Uint8Array(3 << 20)]));
      const p1 = await AeroLabMeasure.probe(here, {
          keep: true
        }),
        p2 = await AeroLabMeasure.probe(bigUrl, {
          cap: 100000
        }),
        p2b = await AeroLabMeasure.probe(here, {
          cap: aixmBytes.length,
          keep: true
        }),
        p3 = await AeroLabMeasure.probe(new URL('fixtures/lab/nothing.xml', location.href).href);
      check('probe: code, size, type, times and the body kept (a same-origin file)', p1.ok && p1.status === 200 && p1.bytes ===
        aixmBytes.length && p1.blob.size === aixmBytes.length && p1.ms >= 0 && p1.ttfbMs >= 0 && typeof p1.type === 'string', {
          ...p1,
          blob: 0

      check(
        'probe: the read cap stops a big answer and says so (or reads it whole when the engine delivers one chunk); a body that ends at the cap is whole',
        p2.ok && p2.bytes >= 100000 && (p2.truncated ? p2.bytes < (3 << 20) && !p2.blob : p2.bytes === (3 << 20)) && p2b.ok && !p2b
        .truncated && p2b.blob && p2b.blob.size === aixmBytes.length,
        [p2, {
          ...p2b,
          blob: 0
        }]);
      check('probe: an HTTP error is an HTTP error (not a CORS block)', !p3.ok && p3.status === 404 && p3.diag === 'http', p3);
      const rf = await AeroLabMeasure.readFile(zip);
      check('picker read: the file is read as a stream and as an ArrayBuffer, both timed', rf.size === zip.size && rf.streamMs >= 0 &&
        rf.bufferMs >= 0 && rf.bufferBytes === zip.size, rf);
      // ------------------------------------------------------------------ le rapport
      const R = AeroLabReport;
      const dev = {
        userAgent: 'TestUA',
        platform: 'X',
        online: true,
        screen: '390x844',
        viewport: '390x844',
        pixelRatio: 2,
        cores: 4,
        deviceMemoryGB: null,
        heapApi: 'none',
        heapLimitMB: null,
        decompressionStream: true,
        worker: true,
        domParser: true,
        secureContext: true,
        crossOriginIsolated: false,
        standalone: true,
        connection: null
      };
      const src = S.byId('cifp'),
        probe = (extra) => ({
          url: 'https://example.org/x',
          ok: false,
          ms: 120,
          ...extra
        });
      const entries = [R.ofProbe(src, probe({
        diag: 'cors'
      })), R.ofProbe(src, {
        url: 'https://example.org/y',
        ok: true,
        status: 200,
        statusText: 'OK',
        bytes: 9112585,
        ms: 3210,
        ttfbMs: 400,
        type: 'application/zip',
        length: 9112585
      }), R.ofMode(rc, 'SIA zip, mode c'), R.ofMode(ra), R.ofCompare([ra, rb, rc], null), R.ofCrash({
        at: '2026-10-26T10:00:00Z',

        step: 'parse aixm: DOMParser'

      const txt = R.format({
        at: '2026-10-26T14:00:00Z',
        device: dev,
        storage: {
          usageMB: 3,
          quotaMB: 1000

        entries,
        cycle: '2610'

      const L = txt.split('\n');
      check('report: dated header, device block, runs block in order, closing line', L[0] === 'SOG data lab report' && L[1] ===
        'generated: 2026-10-26T14:00:00Z' && L[2] === 'airac in force: 2610' && L.includes('== device ==') && L.includes(
          '== runs (6) ==') && L.at(-2) === 'end of report' && txt.endsWith('\n'), L.slice(0, 5));
      check('report: the device lines say what the browser does not expose', /deviceMemory \(declared\): n\/a \(not exposed/.test(
        txt) && /standalone \(home screen\)/.test(txt) && /heap api: none/.test(txt), txt.slice(0, 900));
      check('report: a CORS block is named as such, a success carries code, size, time and rate', /BLOCKED BY CORS/.test(txt) &&
        /OK HTTP 200 OK · 8\.7 MB · 3\.21 s \(first byte 400 ms\) · 2\.7 MB\/s/.test(txt), txt);
      check('report: modes list their steps, the peak heap (or why it is unknown) and the counts', /SIA zip, mode c/.test(txt) &&
        /peak heap seen/.test(txt) && /airspaces\(XML_SIA\)=\d+ rings=\d+/.test(txt) && /heap not measurable|heap \d+ MB/.test(txt),
        txt);
      check('report: the comparison says same / DIFFERENT and what the published base gave', /airspacesSia\s+a=\d+ b=\d+ c=\d+\s+same/
        .test(txt) && /published base: not readable/.test(txt) && !/DIFFERENT/.test(txt), L.filter(x => /same|DIFFERENT|published/
          .test(x)));
      check('report: a run that did not end is a crash entry', /crash previous run did not finish/.test(txt) &&
        /last step: parse aixm: DOMParser/.test(txt), txt.slice(-500));
      check('report: pure text, stable for the same entries', R.format({
        at: 'x',
        device: dev,
        entries,
        cycle: '2610'
      }) === R.format({
        at: 'x',
        device: dev,
        entries,
        cycle: '2610'
      }) && !/\bundefined\b|NaN|\[object/.test(txt), txt.match(/undefined|NaN|\[object[^\n]*/g));
      // ---- le résumé de tête : au plus dix lignes, lu dans les entrées
      const mk = (id, name, o) => R.ofProbe({
        id,
        n: ['', name]
      }, probe(o));
      const sum = R.summary([
        mk('nat', 'NAT tracks', {
          ok: true,
          status: 200,
          bytes: 1000
        }), mk('adds', 'FAA ADDS', {
          ok: true,
          status: 200,
          bytes: 1000
        }), mk('cifp', 'FAA CIFP', {
          ok: false,
          diag: 'cors',
          status: 0
        }), mk('sia', 'SIA France', {
          ok: false,
          diag: 'cors',
          status: 0
        }), mk('ukmil', 'UK Mil AIP', {
          ok: false,
          diag: 'unreachable',
          status: 0
        }), mk('enaire', 'ENAIRE', {
          ok: false,
          diag: 'http',
          status: 404
        }), mk('ead', 'EAD Basic', {
          ok: false,
          diag: 'cors',
          status: 0
        }), mk('ead-login', 'x', {
          ok: false,
          diag: 'cors',
          status: 0
        }),
        R.ofFile(S.byId('ead'), {
          name: 'AD2.pdf',
          size: 100,
          streamMs: 1,
          bufferMs: 1
        }), R.ofFile(S.byId('ead'), {
          name: 'AD2b.pdf',
          size: 100,
          streamMs: 1,
          bufferMs: 1
        }), R.ofMode(rc, 'SIA zip, mode c'), R.ofMode(rb, 'SIA zip, mode b'), R.ofMode(ra), R.ofCompare([ra, rb, rc], null),
        R.ofPublish('block of 0.5 MB', {
          ok: true,
          files: 1,
          bytes: 524288,
          ms: 2800,
          headMs: 300
        }, 524288), R.ofPublish('block of 2.0 MB', {
          ok: true,
          files: 1,
          bytes: 2097152,
          ms: 3200,
          headMs: 300
        }, 2097152), R.ofPublish('block of 5.3 MB', {
          ok: false,
          timedOut: true,
          files: 1,
          bytes: 5560000,
          ms: 120000,
          error: 'no answer after 120 s'
        }, 5560000)
      ], 16);
      const stxt = sum.join('\n');
      check('summary: ten lines at most', sum.length <= 10 && sum.length >= 8, sum);
      check('summary: parsing gives the time of mode c first, then b and a, and says the counts agree',
        /^parsing of the SIA zip: mode c [^,]+, mode b [^,]+, mode a [^(]+\(counts identical between modes\)$/
        .test(sum[0]), sum[0]);
      check('summary: publication lists the sizes that passed, the one without answer and the one not tried',
        /^publication passed: 0\.5 MB in 2\.80 s, 2\.0 MB in 3\.20 s$/
        .test(sum[1]) && /^publication failed: 5\.3 MB \(no answer after 120 s\)$/.test(sum[2]) && /^publication not tried: 10\.0 MB$/
        .test(sum[3]), sum.slice(1,
          4));
      check('summary: sources count the tested ones of the table and the files imported by hand, and name each class',
        /sources: 7 of 16 tested; files imported by hand: 2 \(EAD Basic \(EUROCONTROL\)\)/
        .test(stxt) && /allowed to read \(2\): NAT tracks, FAA ADDS/.test(stxt) &&
        /blocked by CORS \(3\): FAA CIFP, SIA France, EAD Basic/.test(stxt) &&
        /unreachable \(1\): UK Mil AIP/.test(stxt) && /other answers \(1\): ENAIRE \(HTTP 404\)/.test(stxt), sum);
      check('summary: the EAD line says the login page, the login call and the files imported', sum.at(-1) ===
        'EAD Basic: login page blocked by CORS, login call blocked by CORS, files imported 2', sum.at(-1));
      check('summary: an empty report says so without failing', R.summary([], 16).length >= 4 && R.summary([], 16).length <= 10 &&
        /not measured/.test(R.summary([], 16)[0]) &&
        /not tried: 0\.5 MB, 2\.0 MB, 5\.3 MB, 10\.0 MB/.test(R.summary([], 16).join()) &&
        /login page not tested, login call not tested, files imported 0/.test(R.summary([], 16)
          .at(-1)), R.summary([], 16));
      check('report: the summary opens the text, before the device block; the GitHub limits are written', (t2 => t2.indexOf(
        '== summary ==') < t2.indexOf(
        '== device ==') && /== github api limits/.test(t2) && /100 MB/.test(t2) && /7 MB/.test(t2) && /Base64/.test(t2))(R.format({
        at: 'x',
        device: dev,
        entries,
        cycle: '2610',
        total: 16
      })), 0);
      check('the guard marks a run, the next load finds it, then forgets it', (() => {
        AeroLabMeasure.guard.start('x');
        AeroLabMeasure.guard.step('s1');
        const g = AeroLabMeasure.guard.check();
        return g && g.label === 'x' && g.step === 's1' && AeroLabMeasure.guard.check() === null;
      })(), 0);
      const f = AeroLabMeasure.filler(100000);
      check('the filler of the trial is valid JSON of the size asked and holds no data', f.length >= 99990 && f.length <= 100100 && JSON
        .parse(f).kind === 'lab-filler', f.length);
    } catch (e) {
      check('no exception', false, String(e && e.stack || e));
    }
    const pass = results.filter(r => r.ok).length;
    document.getElementById('state').textContent = `${pass} passed, ${results.length - pass} failed`;
    document.getElementById('out').innerHTML = results.map(r => `<li class="${r.ok ? 'ok' : 'ko'}">${r.name.replace(/</g, '&lt;')}${r.ok ? '' : ' — ' + r.detail.replace(/</g, '&lt;').slice(0, 400)}</li>`).join('');
    window.__labBench = {
      done: true,
      pass,
      fail: results.length - pass,
      rows: results.map(r => `${r.ok ? 'PASS' : 'FAIL'} ${r.name}${r.ok ? '' : ' — ' + r.detail}`)
    };
  })();
