<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liste triable : le registre des missions (maquette)</title>
<style>
:root {
  --ink: #1b1f24;
  --muted: #59636e;
  --line: #d0d7de;
  --soft: #f6f8fa;
  --accent: #0b5cad;
  --accent-bg: #eaf2fb;
  --ok: #1a7f37;
  --warn: #7d4e00;
  --warn-bg: #fff4d1;
  --err: #a0211b;
  --touch: 44px;
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px 48px
}
h1 {
  font-size: 22px;
  margin: 16px 0 8px
}
.mock {
  background: var(--soft);
  border: 1px dashed var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  margin: 12px 0;
  font-size: 14px
}
.mock button {
  font: inherit;
  padding: 6px 10px;
  min-height: 36px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 4px;
  cursor: pointer
}
.mock button[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent)
}
.search {
  display: block;
  width: 100%;
  min-height: var(--touch);
  padding: 8px 12px;
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin: 0 0 8px
}
.bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 0 0 8px
}
.chip {
  font: inherit;
  min-height: var(--touch);
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: #fff;
  cursor: pointer
}
.chip[aria-pressed="true"] {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent)
}
.sortbtn {
  font: inherit;
  min-height: var(--touch);
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  display: inline-flex;
  gap: 6px;
  align-items: center
}
.panel {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  margin: 0 0 8px;
  background: #fff
}
.panel[hidden] {
  display: none
}
.panel label {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--touch);
  padding: 0 6px;
  cursor: pointer
}
.panel .dirs {
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--line);
  padding-top: 8px;
  margin-top: 4px
}
.panel .dirs button {
  flex: 1;
  font: inherit;
  min-height: var(--touch);
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: pointer
}
.panel .dirs button[aria-pressed="true"] {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600
}
/* wide: a real table, a button in each header */
table.reg {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px
}
table.reg th,
table.reg td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top
}
table.reg th {
  padding: 0;
  font-weight: 600;
  color: var(--muted);
  background: var(--soft)
}
table.reg th button {
  font: inherit;
  font-weight: 600;
  color: inherit;
  width: 100%;
  min-height: var(--touch);
  text-align: left;
  padding: 0 8px;
  background: none;
  border: 0;
  cursor: pointer;
  display: flex;
  gap: 6px;
  align-items: center
}
table.reg th[aria-sort="ascending"] button::after {
  content: "▲";
  font-size: 11px
}
table.reg th[aria-sort="descending"] button::after {
  content: "▼";
  font-size: 11px
}
table.reg th[aria-sort="ascending"],
table.reg th[aria-sort="descending"] {
  color: var(--accent);
  background: var(--accent-bg)
}
td.num {
  text-align: right
}
.st {
  font-size: 12px;
  padding: 1px 7px;
  border-radius: 10px;
  border: 1px solid;
  white-space: nowrap
}
.st.ok {
  color: var(--ok);
  border-color: #9bd3a8
}
.st.pb {
  color: var(--err);
  border-color: #e3a19d
}
.st.nr {
  color: var(--warn);
  border-color: #d4a72c
}
.more {
  display: block;
  margin: 10px 0 0;
  min-height: var(--touch);
  padding: 8px 14px;
  font: inherit;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--accent);
  cursor: pointer
}
/* phone: the same rows as a list; the sort is one button + a small panel */
.list {
  display: none
}
.list .row {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  margin: 0 0 6px;
  min-height: var(--touch)
}
.list .row b {
  font-weight: 600
}
.list .meta {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px
}
.wideonly {
  display: block
}
.phoneonly {
  display: none
}
.layout {
  display: block
}
.rowact {
  font: inherit;
  min-width: var(--touch);
  min-height: var(--touch);
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
  border-radius: 6px
}
.rowact:hover,
.rowact[aria-expanded="true"] {
  background: var(--accent-bg)
}
table.reg tr[data-id] {
  cursor: pointer
}
table.reg tr[aria-selected="true"] td {
  background: var(--accent-bg)
}
.menu {
  position: absolute;
  z-index: 5;
  min-width: 190px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  padding: 4px
}
.menu[hidden] {
  display: none
}
.menu button {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  min-height: var(--touch);
  padding: 0 12px;
  border: 0;
  background: none;
  border-radius: 6px;
  cursor: pointer
}
.menu button:hover {
  background: var(--soft)
}
.menu hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 4px 0
}
.sheet {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 12px 14px
}
.sheet[hidden] {
  display: none
}
.sheet h2 {
  font-size: 18px;
  margin: 0 0 2px
}
.sheet .meta {
  font-size: 13px;
  color: var(--muted)
}
.sheet dl {
  margin: 10px 0;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 15px
}
.sheet dt {
  color: var(--muted)
}
.sheet dd {
  margin: 0
}
.route {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
  align-items: center;
  margin: 6px 0 10px
}
.route span {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1px 9px;
  font-size: 13px;
  background: var(--soft)
}
.gestures {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px
}
.gestures button {
  font: inherit;
  min-height: var(--touch);
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  cursor: pointer
}
.gestures button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff
}
.close {
  float: right;
  font: inherit;
  min-height: var(--touch);
  min-width: var(--touch);
  border: 0;
  background: none;
  font-size: 22px;
  cursor: pointer
}
@media (min-width: 701px) {
  .layout.open {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    align-items: start
  }
  .sheet {
    position: sticky;
    top: 8px
  }
  .back {
    display: none
  }
}
@media (max-width: 700px) {
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 10;
    border-radius: 0;
    overflow: auto;
    padding: 12px 16px 24px
  }
  .list .row {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    cursor: pointer
  }
  .list .row .txt {
    flex: 1;
    min-width: 0
  }
  .back {
    display: inline-block;
    font: inherit;
    min-height: var(--touch);
    padding: 0 6px;
    border: 0;
    background: none;
    color: var(--accent);
    cursor: pointer
  }
}
@media (max-width: 700px) {
  table.reg {
    display: none
  }
  .list {
    display: block
  }
  .wideonly {
    display: none
  }
  .phoneonly {
    display: block
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mock">
    <b>Maquette :</b>
    <button type="button" data-state="a" aria-pressed="true">Tri par défaut</button>
    <button type="button" data-state="b" aria-pressed="false">Tri par la durée, du plus long</button>
    <button type="button" data-state="c" aria-pressed="false">Téléphone : panneau de tri ouvert</button>
    <button type="button" data-state="d" aria-pressed="false">Une ligne touchée : sa fiche</button>
    <button type="button" data-state="e" aria-pressed="false">Le bouton « ⋯ » d'une ligne</button>
    <div style="font-size:13px;color:var(--muted)">Missions inventées. Large : un tableau dont chaque colonne est un bouton, une ligne touchée ouvre sa fiche à droite, « ⋯ » pour les gestes rapides ; étroit (≤ 700 px) : la liste, « Trier » et la fiche en plein écran.</div>
  </div>

  <h1>Registre des missions</h1>
  <input class="search" type="search" placeholder="Chercher dans le registre" aria-label="Chercher dans le registre">
  <div class="bar"><button class="chip" type="button" aria-pressed="true">Toutes les familles</button><button class="chip" type="button" aria-pressed="false">Secours</button><button class="chip" type="button" aria-pressed="false">Transport</button>
    <span class="phoneonly"><button class="sortbtn" type="button" id="sortbtn" aria-expanded="false" aria-controls="panel">Trier : <b id="sortlbl">Identifiant ▼</b></button></span>
  </div>

  <div class="panel phoneonly" id="panel" hidden role="group" aria-label="Trier par">
    <label><input type="radio" name="col" value="id" checked> Identifiant</label>
    <label><input type="radio" name="col" value="title"> Titre</label>
    <label><input type="radio" name="col" value="fam"> Famille</label>
    <label><input type="radio" name="col" value="ser"> Série</label>
    <label><input type="radio" name="col" value="dur"> Durée</label>
    <div class="dirs"><button type="button" data-dir="asc" aria-pressed="false">▲ Croissant</button><button type="button" data-dir="desc" aria-pressed="true">▼ Décroissant</button></div>
  </div>

  <div class="layout" id="layout">
  <div>
  <table class="reg" id="tbl">
    <thead>
      <tr>
        <th scope="col" aria-sort="none"><button type="button" data-col="st">État</button></th>
        <th scope="col" aria-sort="descending"><button type="button" data-col="id">Identifiant</button></th>
        <th scope="col" aria-sort="none"><button type="button" data-col="title">Titre</button></th>
        <th scope="col" aria-sort="none"><button type="button" data-col="fam">Famille</button></th>
        <th scope="col" aria-sort="none"><button type="button" data-col="ser">Série</button></th>
        <th scope="col" aria-sort="none"><button type="button" data-col="route">Origine → destination</button></th>
        <th scope="col" aria-sort="none"><button type="button" data-col="dur" style="justify-content:flex-end">Durée</button></th>
        <th scope="col" style="width:52px"><span class="sr" style="position:absolute;left:-9999px">Actions</span></th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="list" id="ls"></div>
  <button class="more" type="button">12 autres</button>
  </div>
  <aside class="sheet" id="sheet" hidden aria-label="Fiche de la mission">
    <button class="back" type="button" id="back">← Registre</button>
    <button class="close wideonly" type="button" id="close" aria-label="Fermer la fiche">×</button>
    <h2 id="sh-title"></h2>
    <div class="meta" id="sh-meta"></div>
    <div class="route" id="sh-route" aria-label="Trajet"></div>
    <dl id="sh-dl"></dl>
    <div class="gestures">
      <button type="button" class="primary">Brief</button><button type="button">Atelier</button><button type="button">Dupliquer</button><button type="button" id="sh-more" aria-haspopup="menu">⋯</button>
    </div>
  </aside>
  </div>
  <div class="menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem">Brief</button><button type="button" role="menuitem">Atelier</button><button type="button" role="menuitem">Dupliquer</button><hr><button type="button" role="menuitem">Corriger</button><button type="button" role="menuitem">Retirer</button>
  </div>
</div>
<script>
(() => {
  const ROWS = [
    ['pb', 'M-014', 'Évacuation sanitaire Îles du Ponant', 'Secours', 12, 'LFRB → LFRK', 94],
    ['ok', 'M-009', 'Ravitaillement d’une base avancée', 'Transport', 4, 'LFRS → LFBO', 118],
    ['ok', 'M-007', 'Reconnaissance côtière', 'Surveillance', 2, 'LFRN → LFRN', 150],
    ['nr', 'M-006', 'Largage de matériel', 'Transport', null, 'LFOB → LFRH', null],
    ['ok', 'M-004', 'Transfert d’un patient', 'Secours', 12, 'LFRD → LFRS', 47],
    ['ok', 'M-003', 'Vol de réception', 'Entraînement', 1, 'LFRS → LFRS', 35],
    ['pb', 'M-002', 'Convoyage d’un hélicoptère', 'Transport', 4, 'LFOH → LFRZ', 73]
  ];
  const cols = {
      st: 0,
      id: 1,
      title: 2,
      fam: 3,
      ser: 4,
      route: 5,
      dur: 6
    },
    text = new Set(['st', 'id', 'title', 'fam', 'route']);
  const lab = {
    st: 'État',
    id: 'Identifiant',
    title: 'Titre',
    fam: 'Famille',
    ser: 'Série',
    dur: 'Durée'
  };
  const stl = {
    pb: 'À corriger',
    ok: 'Lue',
    nr: 'Non lue'
  };
  const fmt = m => m == null ? '—' : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
  let S = {
      key: 'id',
      dir: 'desc'
    },
    sel = null;
  const ROUTES = {
    'M-014': ['LFRB', 'ILE DE BATZ', 'ILE D’OUESSANT', 'LFRK'],
    'M-009': ['LFRS', 'NTS', 'ROYAN', 'LFBO'],
    'M-007': ['LFRN', 'CAP FRÉHEL', 'LFRN'],
    'M-006': ['LFOB', 'LFRH'],
    'M-004': ['LFRD', 'LFRS'],
    'M-003': ['LFRS'],
    'M-002': ['LFOH', 'ROUEN', 'LFRZ']
  };
  const openSheet = id => {
    const r = ROWS.find(x => x[1] === id);
    if (!r) return;
    sel = id;
    document.getElementById('sh-title').textContent = `${r[1]} · ${r[2]}`;
    document.getElementById('sh-meta').innerHTML = `<span class="st ${r[0]}">${stl[r[0]]}</span> · fichier missions/${r[1]}.yaml`;
    document.getElementById('sh-route').innerHTML = (ROUTES[id] || []).map((p, i, a) => `<span>${p}</span>${i < a.length - 1 ? '→' : ''}`).join('');
    document.getElementById('sh-dl').innerHTML = `<dt>Famille</dt><dd>${r[3]}</dd><dt>Série</dt><dd>${r[4] ?? '—'}</dd><dt>Durée ≈</dt><dd>${fmt(r[6])}</dd><dt>Aéronefs</dt><dd>EC135, H145</dd><dt>Théâtre</dt><dd>Bretagne</dd>`;
    document.getElementById('sheet').hidden = false;
    document.getElementById('layout').classList.add('open');
    paint();
  };
  const closeSheet = () => {
    sel = null;
    document.getElementById('sheet').hidden = true;
    document.getElementById('layout').classList.remove('open');
    paint();
  };
  const menu = document.getElementById('menu');
  const showMenu = btn => {
    const r = btn.getBoundingClientRect();
    menu.hidden = false;
    menu.style.top = `${window.scrollY + r.bottom + 4}px`;
    menu.style.left = `${Math.max(8, Math.min(window.scrollX + r.right - 190, window.innerWidth - 200))}px`;
    document.querySelectorAll('[aria-expanded][data-act]').forEach(x => x.setAttribute('aria-expanded', 'false'));
    btn.setAttribute('aria-expanded', 'true');
  };
  const hideMenu = () => {
    menu.hidden = true;
    document.querySelectorAll('[data-act]').forEach(x => x.removeAttribute('aria-expanded'));
  };
  document.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      e.stopPropagation();
      if (!menu.hidden) {
        hideMenu();
      } else showMenu(act);
      return;
    }
    if (e.target.closest('#sh-more')) {
      showMenu(e.target.closest('#sh-more'));
      return;
    }
    if (!e.target.closest('#menu')) hideMenu();
    const row = e.target.closest('[data-id]');
    if (row && !e.target.closest('th')) openSheet(row.dataset.id);
  });
  document.getElementById('close').addEventListener('click', closeSheet);
  document.getElementById('back').addEventListener('click', closeSheet);
  const coll = new Intl.Collator('fr', {
    numeric: true,
    sensitivity: 'base'
  });
  const sorted = () => {
    const i = cols[S.key],
      k = S.dir === 'asc' ? 1 : -1;
    return ROWS.map((r, n) => [r, n]).sort((A, B) => {
      const a = A[0][i],
        b = B[0][i];
      const ea = a == null || a === '',
        eb = b == null || b === '';
      if (ea !== eb) return ea ? 1 : -1; // vide toujours en dernier, dans les deux sens
      const c = text.has(S.key) ? coll.compare(String(a), String(b)) : a - b;
      return c ? c * k : A[1] - B[1];
    }).map(x => x[0]);
  };
  const paint = () => {
    const rows = sorted();
    document.getElementById('tb').innerHTML = rows.map(r => `<tr data-id="${r[1]}"${sel === r[1] ? ' aria-selected="true"' : ''}><td><span class="st ${r[0]}">${stl[r[0]]}</span></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4] ?? '—'}</td><td>${r[5]}</td><td class="num">${fmt(r[6])}</td><td><button class="rowact" type="button" data-act="${r[1]}" aria-haspopup="menu" aria-label="Gestes de ${r[1]}">⋯</button></td></tr>`).join('');
    document.getElementById('ls').innerHTML = rows.map(r => `<div class="row" data-id="${r[1]}"><div class="txt"><b>${r[1]}</b> ${r[2]}<div class="meta"><span class="st ${r[0]}">${stl[r[0]]}</span> · ${r[3]} · série ${r[4] ?? '—'} · ${r[5]} · ${fmt(r[6])}</div></div><button class="rowact" type="button" data-act="${r[1]}" aria-haspopup="menu" aria-label="Gestes de ${r[1]}">⋯</button></div>`).join('');
    document.querySelectorAll('#tbl th[aria-sort]').forEach(th => th.setAttribute('aria-sort', th.querySelector('button').dataset
      .col === S.key ? (S.dir === 'asc' ? 'ascending' : 'descending') : 'none'));
    document.getElementById('sortlbl').textContent = `${lab[S.key] || 'Identifiant'} ${S.dir === 'asc' ? '▲' : '▼'}`;
    document.querySelectorAll('input[name=col]').forEach(r => r.checked = r.value === S.key);
    document.querySelectorAll('.dirs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === S.dir)));
  };
  document.querySelectorAll('#tbl th button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.col; // même colonne : on inverse ; une autre : texte croissant d'abord, nombre décroissant d'abord
    S = S.key === k ? {
      key: k,
      dir: S.dir === 'asc' ? 'desc' : 'asc'
    } : {
      key: k,
      dir: text.has(k) ? 'asc' : 'desc'
    };
    paint();
  }));
  document.getElementById('sortbtn').addEventListener('click', () => {
    const p = document.getElementById('panel'),
      o = p.hidden;
    p.hidden = !o;
    document.getElementById('sortbtn').setAttribute('aria-expanded', String(o));
  });
  document.querySelectorAll('input[name=col]').forEach(r => r.addEventListener('change', () => {
    S = {
      key: r.value,
      dir: text.has(r.value) ? 'asc' : 'desc'
    };
    paint();
  }));
  document.querySelectorAll('.dirs button').forEach(b => b.addEventListener('click', () => {
    S = {
      ...S,
      dir: b.dataset.dir
    };
    paint();
  }));
  const go = id => {
    document.querySelectorAll('[data-state]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.state === id)));
    S = id === 'b' ? {
      key: 'dur',
      dir: 'desc'
    } : {
      key: 'id',
      dir: 'desc'
    };
    const open = id === 'c';
    document.getElementById('panel').hidden = !open;
    document.getElementById('sortbtn').setAttribute('aria-expanded', String(open));
    if (id === 'c') S = {
      key: 'dur',
      dir: 'desc'
    };
    hideMenu();
    closeSheet();
    paint();
    if (id === 'd') openSheet('M-014');
    if (id === 'e') {
      const w = window.innerWidth > 700;
      const b = document.querySelector(w ? '#tb tr[data-id="M-009"] [data-act]' : '#ls .row[data-id="M-009"] [data-act]');
      if (b) showMenu(b);
    }
  };
  document.querySelectorAll('[data-state]').forEach(b => b.addEventListener('click', () => go(b.dataset.state)));
  const v = new URLSearchParams(location.search).get('v');
  go(v || 'a');
})();
</script>
</body>
</html>
