<!doctype html>
<!-- Banc des missions (frame/lib/mission.js, modules/missions/SPEC.md § 2, § 4) : les trois formes réelles d'un fichier mission<ID>.yaml
     (minimale comme M-001, complète comme A-001A, organisation …Z) et une ligne du registre, sur des missions inventées (noms, positions,
     indicatifs : aucun contenu d'AIP ni de mission réelle). Fonctions pures ; page nue ; window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>mission — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">mission.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import {
    readMission,
    readRegistry,
    icaoOf,
    levelFt,
    missionFlight,
    ownerOf,
    missionsFor,
    passageMin,
    routeNm,
    OBJECT_KINDS,
    notJudgedYet,
    pilotView
  } from '../mission.js?v=0';
  const out = document.getElementById('out'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      got: String(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `  → ${got}`}`;
    out.append(l);
  }

  // la forme minimale (comme M-001) : ni origine ni destination, une cible et des tournants, des notes
  const minimal = {
      schema: 'helo-xp-mission',
      mission: {
        id: 'X-001',
        type: 'MEDEVAC',
        subtype: null
      },
      target: {
        id: 'TARGET',
        name: 'Pic Inventé',
        lat: 42.5,
        lon: 2.4
      },
      turning_points: [{
        id: 'PT1',
        name: 'Villeneuve-Test',
        lat: 42.7,
        lon: 2.9
      }, {
        id: 'PT2',
        name: 'Col Test',
        lat: 42.6,
        lon: 2.5
      }],
      teams: [{
        name: 'SAMUXX',
        type: 'H135'
      }],
      notes: ['Mission X-001 — le randonneur inventé']
    },
    // la forme complète (comme A-001A) : origine, destination, appareil, rendez-vous, zone à son centre, ordre de route, timing
    complete = {
      mission: {
        id: 'X-002A',
        type: 'COMBAT',
        subtype: 'BFM'
      },
      operation: {
        id: 'X-002',
        name: 'EXERCICE TEST',
        organisation: 'X-002Z'
      },
      title: 'EXERCICE TEST — premier round',
      summary: 'Un résumé inventé.',
      aircraft: [{
        id: 'AC1',
        type: 'RFAL Rafale',
        callsign: 'TESTEUR31',
        cruise_speed_kt: 430,
        cruise_level: 'FL240'
      }],
      origin: {
        name: 'BA 999 Base-Test (XTST)',
        lat: 44,
        lon: -0.5
      },
      destination: {
        name: 'BA 998 Autre-Base (XTSU)',
        lat: 44.5,
        lon: -1.1
      },
      target: {
        id: 'TARGET',
        name: 'Secteur test',
        lat: 44.05,
        lon: -0.35
      },
      turning_points: [{
        id: 'PT1',
        name: 'Point test 1',
        lat: 44.3,
        lon: -1.5
      }, {
        id: 'PT2',
        name: 'Point test 2',
        lat: 44.2,
        lon: -1.4
      }],
      rendezvous: [{
        id: 'RDV-1',
        name: 'Rendez-vous test',
        lat: 44.33,
        lon: -1.55
      }],
      zones: [{
        id: 'ZONE-1',
        name: 'Zone test',
        centre: {
          lat: 44.1,
          lon: -0.4
        },
        radius_km: 35
      }],
      route_order: ['ORIGIN', 'PT1', 'RDV-1', 'PT2', 'ZONE-1', 'TARGET', 'DESTINATION'],
      timing: {
        estimated_flight_min: 82,
        estimated_block_min: 102
      },
      payload: {
        constraints: ['Une contrainte inventée']
      },
      risks: ['Un risque inventé']
    },
    // l'organisation d'un exercice (…Z) : jamais un vol
    organisation = {
      mission: {
        id: 'X-002Z',
        type: 'COMBAT',
        subtype: 'EXERCICE',
        role: 'organisation'
      },
      title: 'EXERCICE TEST — organisation'
    };

  ck('icaoOf : le code entre parenthèses à la fin, rien sinon', icaoOf('BA 999 Base-Test (XTST)') === 'XTST' && icaoOf('Col Test') === '' &&
    icaoOf(null) === '');
  ck('levelFt : FL240, 1500 ft, un nombre, rien', levelFt('FL240') === 24000 && levelFt('1500 ft') === 1500 && levelFt(3000) === 3000 &&
    levelFt('haut') === null && levelFt(null) === null);
  ck('readMission : sans id ou sans type, rien', readMission({
    mission: {
      id: 'X-9'
    }
  }) === null && readMission(null) === null);

  const m1 = readMission(minimal);
  ck('forme minimale : lue, sans origine ni destination, ses points et ses notes', m1 && m1.origin === null && m1.destination === null &&
    Object.keys(m1.points).join() === 'PT1,PT2,TARGET' && m1.notes.length === 1 && !m1.organisation, JSON.stringify(m1 && m1.points));
  const f1 = missionFlight(m1);
  ck('forme minimale : le vol sans terrains (le pilote les tape), les points dans l’ordre du fichier, l’appareil de l’équipe (H135)', f1
    .route.dep === '' && f1.route
    .arr ===
    '' && f1.route.points.map(p => p.id).join() === 'PT1,PT2,TARGET' && f1.mission === 'X-001' && f1.aircraft.type === 'H135', JSON
    .stringify(f1.route));

  const m2 = readMission(complete);
  ck('forme complète : origine et destination avec leur code, appareil, niveau et vitesse du premier appareil', m2.origin.icao === 'XTST' &&
    m2.destination.icao === 'XTSU' && m2.aircraft[0].type === 'RFAL' && m2.cruiseLevelFt === 24000 && m2.cruiseSpeedKt === 430,
    JSON.stringify(m2.aircraft));
  ck('forme complète : la zone par son centre, le rendez-vous, l’estimation, contraintes et risques', m2.points['ZONE-1']?.lat === 44.1 &&
    m2.points['RDV-1']?.kind === 'rdv' && m2.estimate.blockMin === 102 && m2.constraints.length === 1 && m2.risks.length === 1);
  const f2 = missionFlight(m2, {
    aircraft: {
      registration: 'f-test'
    }
  });
  ck('forme complète : le vol suit route_order (ORIGIN et DESTINATION sont les terrains, pas des points)', f2.route.dep === 'XTST' && f2
    .route
    .arr === 'XTSU' && f2.route.points.map(p => p.id).join() === 'PT1,RDV-1,PT2,ZONE-1,TARGET', f2.route.points.map(p => p.id).join());
  ck('forme complète : l’appareil du fichier, l’immatriculation de l’affectation, niveau, vitesse, mission', f2.aircraft.type === 'RFAL' &&
    f2
    .aircraft.registration === 'F-TEST' && f2.levelFt === 24000 && f2.speedKt === 430 && f2.mission === 'X-002A', JSON.stringify(f2
      .aircraft));
  const f2b = missionFlight({
    ...m2,
    destination: null
  });
  ck('sans destination : retour à l’origine ; sans origine : le départ de l’affectation', f2b.route.arr === 'XTST' && missionFlight({
    ...m1
  }, {
    departure: 'xtsv'
  }).route.dep === 'XTSV');

  ck('organisation (…Z) : reconnue', readMission(organisation)?.organisation === true && missionFlight(null) === null);

  const reg = readRegistry({
    missions: [{
      id: 'X-002A',
      family: 'COMBAT',
      title: 'EXERCICE TEST — premier round',
      operation: {
        name: 'EXERCICE TEST'
      },
      aircraftTypes: ['RFAL Rafale'],
      origin: 'BA 999 Base-Test (XTST)',
      destination: 'BA 999 Base-Test (XTST)',
      estimate: {
        block: 121
      },
      folder: 'A_COMBAT/X-002A',
      files: ['missionX-002A.yaml']
    }, {
      id: 'X-002Z',
      family: 'COMBAT',
      organisation: true
    }, {
      title: 'sans id'
    }]
  });
  ck('readRegistry : les lignes avec un id, codes OACI, estimation, fichier ; l’organisation marquée', reg.length === 2 && reg[0]
    .originIcao === 'XTST' && reg[0].blockMin === 121 && reg[0].file === 'missionX-002A.yaml' && !reg[0].organisation && reg[1]
    .organisation === true && reg[1].file === 'missionX-002Z.yaml', JSON.stringify(reg[0]));

  const bad = readRegistry({
    missions: [{
      id: 'X-009A',
      folder: '../pilot/ABC',
      files: ['current_flight.json']
    }, {
      id: 'X-009B',
      folder: 'X_TEST/X-009B',
      files: ['../../airline/settings.yaml']
    }, {
      id: 'X-009C',
      folder: '/abs\\X',
      files: ['missionX-009C.yaml']
    }, {
      id: 'X-009D',
      folder: 'É_TEST/X-009D'
    }]
  });
  ck('readRegistry : un dossier ou un fichier pas sûr (« .. », absolu, « \\ », autre extension) vide ; un nom accentué gardé', bad[0]
    .folder === '' &&
    bad[1].file === '' && bad[2].folder === '' && bad[3].folder === 'É_TEST/X-009D' && bad[3].file === 'missionX-009D.yaml', JSON
    .stringify(bad));

  // à qui appartient une mission (l'utilisateur, 10 nov. 15 h 50) : son champ airline, sinon « perso », jamais la première de l'index
  const owned = [{
    id: 'A',
    airline: 'defa'
  }, {
    id: 'B'
  }, {
    id: 'C',
    airline: 'ITF<x>'
  }, {
    id: 'D',
    airline: 'itf'
  }];
  ck('ownerOf : le code nommé, sinon perso (un code d\'une autre forme : perso)', owned.map(ownerOf).join() === 'defa,perso,perso,itf',
    owned.map(ownerOf).join());
  ck('missionsFor : les missions d\'une compagnie, les personnelles sous perso', missionsFor(owned, 'perso').map(r => r.id).join() ===
    'B,C' &&
    missionsFor(owned, 'itf').map(r => r.id).join() === 'D' && missionsFor(null, 'itf').length === 0, missionsFor(owned, 'perso').map(r =>
      r.id).join());

  // ---- les tiroirs (SOG-0440 ; organisation/SPEC_MISSIONS_TIROIRS.md § 7 et § 10.3) : une mission inventée, ses parties lues comme des
  // tiroirs — la forme écrite dans la partie (l'éditeur de la V3) ET la forme par identifiant (zones et objets en tête)
  /** Une vérification par comparaison (JSON). */
  const same = (name, got, want) => ck(name, JSON.stringify(got) === JSON.stringify(want), JSON.stringify(got));
  const drawerBase = {
      mission: {
        id: 'X-401A',
        type: 'SAR'
      },
      title: 'Tiroirs',
      origin: {
        name: 'Base Test (XTST)',
        lat: 44.5,
        lon: 1.0
      },
      destination: {
        name: 'Base Test Sud (XTSU)',
        lat: 44.0,
        lon: 1.2
      },
      target: {
        id: 'TARGET',
        name: 'Cible',
        lat: 44.6,
        lon: 1.3
      },
      turning_points: [{
        id: 'PT1',
        name: 'Un',
        lat: 44.8,
        lon: 1.2,
        time_on_task_min: 10
      }, {
        id: 'PT2',
        name: 'Deux',
        lat: 44.7,
        lon: 1.4
      }],
      rendezvous: [{
        id: 'RDV-1',
        name: 'Rdv',
        lat: 44.65,
        lon: 1.25
      }],
      zones: [{
        id: 'ZONE-1',
        name: 'Vallée',
        kind: 'search',
        centre: {
          lat: 44.62,
          lon: 1.28
        },
        radius_km: 4,
        ceiling_ft: 3000
      }],
      objects: [{
        id: 'OBJ-1',
        kind: 'person',
        name: 'Randonneur',
        lat: 44.61,
        lon: 1.31,
        altitude_ft: 2500,
        detection_range_nm: 0.3,
        detection_height_ft: 800,
        require_confirmation: true
      }, {
        id: 'OBJ-2',
        kind: 'aircraft',
        name: 'Cible',
        control: 'ai',
        callsign: 'XTEST',
        lat: 44.8,
        lon: 1.2,
        route_order: ['PT1', 'TARGET', 'GHOST', 'DESTINATION'],
        speed_kt: 110,
        altitude_ft: 4500,
        start_delay_min: 5,
        detection_range_nm: 0.8,
        detection_height_ft: 1000
      }, {
        id: 'SHIP-1',
        kind: 'ship',
        lat: 44.1,
        lon: 1.1,
        altitude_ft: 0,
        motion: 'axis',
        course_deg: 65,
        speed_kt: 8,
        detection_range_nm: 0.5,
        require_confirmation: 'non',
        hidden_until_event: 'SHIP_SPOTTED'
      }],
      route_order: ['ORIGIN', 'PT1', 'RDV-1', 'TARGET', 'DESTINATION'],
      cruise_speed_kt: 120,
      x_mission_editor: {
        version: '1.0',
        scenario: 'rescue'
      }
    },
    withPhases = (phases, more = {}) => readMission({
      ...drawerBase,
      ...more,
      phases
    }),
    circle = {
      centre: {
        lat: 44.6,
        lon: 1.3
      },
      radius_km: 2.5
    },
    hand = {
      kind: 'hand',
      fallbackMin: null
    };
  let dm = withPhases([{
    id: 'B',
    title: 'Changement',
    trigger_point: 'RDV-1',
    trigger_delay_min: 10,
    trigger: '10 min après RDV-1',
    message: '« Nouvelle DZ. »',
    brief: 'Ligne un.\r\nLigne deux.  \n',
    route_order: ['RDV-1', 'PT2', 'TARGET', 'DESTINATION']
  }, {
    id: 'C',
    trigger_point: 'ORIGIN',
    trigger_delay_min: 40
  }, {
    id: 'D',
    trigger_point: 'pt1'
  }]);
  same('tiroirs : une mission de la V2, trois parties par l\'heure (un point, ORIGIN, une autre casse, sans délai = 0)', dm.drawers.map(
      d => [d.id, d.key, d.keyWhy]),
    [
      ['B', {
        kind: 'time',
        point: 'RDV-1',
        delayMin: 10
      }, ''],
      ['C', {
        kind: 'time',
        point: 'ORIGIN',
        delayMin: 40
      }, ''],
      ['D', {
        kind: 'time',
        point: 'PT1',
        delayMin: 0
      }, '']
    ]);
  same('tiroirs : les textes, les fins de ligne ramenées', [dm.drawers[0].title, dm.drawers[0].trigger, dm.drawers[0].message, dm.drawers[0]
      .brief
    ],
    ['Changement', '10 min après RDV-1', '« Nouvelle DZ. »', 'Ligne un.\nLigne deux.']);
  same('tiroirs : la suite de route telle qu\'écrite (le premier point est le raccord), DESTINATION n\'est pas un point', dm.drawers[0]
    .route.map(p => [p.id, p.lock || '']),
    [
      ['RDV-1', 'mission'],
      ['PT2', ''],
      ['TARGET', 'mission']
    ]);
  same('tiroirs : la suite d\'un tiroir n\'entre ni dans la route, ni dans missionFlight, ni dans routeNm',
    [dm.drawersRefused, dm.routeOrder, missionFlight(dm).route.points.map(p => p.id), routeNm(dm)],
    [0, drawerBase.route_order, ['PT1', 'RDV-1', 'TARGET'], routeNm(readMission(drawerBase))]);
  dm = withPhases([{
    title: 'Sans clé ni identifiant'
  }, {
    title: 'Deuxième',
    fallback_delay_min: 30
  }]);
  same('tiroirs : sans clé, le geste seul ; sans identifiant, la lettre du rang', dm.drawers.map(d => [d.id, d.key, d.keyWhy]),
    [
      ['B', hand, ''],
      ['C', {
        kind: 'hand',
        fallbackMin: 30
      }, '']
    ]);
  same('tiroirs : une partie écrite comme un objet seul ; aucune partie', [withPhases({
    id: 'B'
  }).drawers.length, readMission(drawerBase).drawers], [1, []]);
  // la zone écrite DANS la partie
  dm = withPhases([{
    id: 'B',
    trigger_zone: {
      ...circle,
      ceiling_ft: 1500
    },
    fallback_delay_min: 60
  }, {
    id: 'C',
    trigger_zone: {
      points: [{
        lat: 44.1,
        lon: 1.1
      }, {
        lat: 44.2,
        lon: 1.1
      }, {
        lat: 44.2,
        lon: 1.3
      }],
      centre: {
        lat: 44.15,
        lon: 1.2
      },
      radius_km: 9
    },
    zone_shown: false
  }, {
    id: 'D',
    trigger_zone: {
      lat: 44.3,
      lon: 1.5,
      radius_km: '0.5'
    },
    zone_shown: 'non',
    fallback_delay_min: '90'
  }]);
  same(
    'tiroirs : la zone dans la partie — un cercle, son plafond, son repli, cachée sans zone_shown (SOG-0459) ; un polygone (les sommets priment), cachée ; un centre à plat',
    dm.drawers.map(d => d.key), [{
      kind: 'zone',
      shape: {
        circle: {
          lat: 44.6,
          lon: 1.3,
          radiusM: 2500
        }
      },
      ceilingFt: 1500,
      zoneId: null,
      shown: false,
      actor: null,
      fallbackMin: 60
    }, {
      kind: 'zone',
      shape: {
        polygon: [
          [44.1, 1.1],
          [44.2, 1.1],
          [44.2, 1.3]
        ]
      },
      ceilingFt: null,
      zoneId: null,
      shown: false,
      actor: null,
      fallbackMin: null
    }, {
      kind: 'zone',
      shape: {
        circle: {
          lat: 44.3,
          lon: 1.5,
          radiusM: 500
        }
      },
      ceilingFt: null,
      zoneId: null,
      shown: false,
      actor: null,
      fallbackMin: 90
    }]);
  // la zone et l'objet cités PAR IDENTIFIANT (l'atelier de l'utilisateur) : la géométrie est résolue dans la clé
  dm = withPhases([{
    id: 'B',
    trigger_zone: 'zone-1',
    trigger_actor: 'OBJ-2',
    zone_shown: true
  }, {
    id: 'C',
    trigger_object: 'OBJ-1'
  }, {
    id: 'D',
    trigger_object: 'ship-1',
    fallback_delay_min: 120
  }]);
  same('tiroirs : la zone par identifiant, franchie par une cible mobile (trigger_actor) — sa route résolue, un point inconnu sauté', dm
    .drawers[0].key, {
      kind: 'zone',
      shape: {
        circle: {
          lat: 44.62,
          lon: 1.28,
          radiusM: 4000
        }
      },
      ceilingFt: 3000,
      zoneId: 'zone-1',
      shown: true,
      actor: {
        id: 'OBJ-2',
        kind: 'aircraft',
        name: 'Cible',
        lat: 44.8,
        lon: 1.2,
        rangeNm: 0.8,
        heightFt: 1000,
        altitudeFt: 4500,
        confirm: true,
        hiddenUntil: '',
        moving: true,
        motion: {
          kind: 'route',
          route: dm.drawers[0].key.actor?.motion?.route,
          speedKt: 110,
          startDelayMin: 5
        }
      },
      fallbackMin: null
    });
  same('tiroirs : la route de la cible mobile, en points de la mission', dm.drawers[0].key.actor.motion.route.map(p => p.id), ['PT1',
    'TARGET'
  ]);
  same(
    'tiroirs : l\'objet par identifiant — portée en NM, hauteur en ft, altitude, « à portée ET déclaré » par défaut ; un navire sur son axe, proximité seule',
    dm.drawers.slice(1).map(d => d.key), [{
      kind: 'object',
      object: {
        id: 'OBJ-1',
        kind: 'person',
        name: 'Randonneur',
        lat: 44.61,
        lon: 1.31,
        rangeNm: 0.3,
        heightFt: 800,
        altitudeFt: 2500,
        confirm: true,
        hiddenUntil: '',
        moving: false,
        motion: null
      },
      fallbackMin: null
    }, {
      kind: 'object',
      object: {
        id: 'SHIP-1',
        kind: 'ship',
        name: '',
        lat: 44.1,
        lon: 1.1,
        rangeNm: 0.5,
        heightFt: null,
        altitudeFt: 0,
        confirm: false,
        hiddenUntil: 'SHIP_SPOTTED',
        moving: true,
        motion: {
          kind: 'axis',
          courseDeg: 65,
          speedKt: 8,
          startDelayMin: 0
        }
      },
      fallbackMin: 120
    }]);
  // l'objet écrit DANS la partie : les mêmes champs
  dm = withPhases([{
    id: 'B',
    trigger_object: {
      kind: 'Raft',
      lat: 44.62,
      lon: 1.31,
      detection_range_nm: 0.4,
      detection_height_ft: 1000
    },
    fallback_delay_min: 45
  }, {
    id: 'C',
    trigger_object: {
      kind: 'dragon',
      centre: {
        lat: 44,
        lon: 1
      },
      detection_range_nm: 0.3,
      speed_kt: 1e9,
      course_deg: 90
    }
  }]);
  same('tiroirs : l\'objet dans la partie ; un genre inconnu est dit vide, l\'objet reste ; une vitesse hors bornes : pas de mouvement lu',
    dm.drawers.map(d => d.key), [{
      kind: 'object',
      object: {
        id: '',
        kind: 'raft',
        name: '',
        lat: 44.62,
        lon: 1.31,
        rangeNm: 0.4,
        heightFt: 1000,
        altitudeFt: null,
        confirm: true,
        hiddenUntil: '',
        moving: false,
        motion: null
      },
      fallbackMin: 45
    }, {
      kind: 'object',
      object: {
        id: '',
        kind: '',
        name: '',
        lat: 44,
        lon: 1,
        rangeNm: 0.3,
        heightFt: null,
        altitudeFt: null,
        confirm: true,
        hiddenUntil: '',
        moving: false,
        motion: null
      },
      fallbackMin: null
    }]);
  ck('tiroirs : OBJECT_KINDS, la liste fermée', Object.isFrozen(OBJECT_KINDS) && OBJECT_KINDS.join() ===
    'wreck,raft,person,vehicle,container,ship,smoke,aircraft', OBJECT_KINDS.join());
  // la cinquième clé : l'arrivée
  dm = withPhases([{
    id: 'B',
    trigger_condition: {
      kind: 'arrival',
      point: 'DESTINATION',
      radius_nm: 1,
      speed_max_kt: 30,
      require_on_ground: true,
      required_points: ['pt2'],
      escort_min_sec: 30
    },
    fallback_delay_min: 180
  }, {
    id: 'C',
    trigger_condition: {
      kind: 'arrival',

        name: 'Glacier',
        centre: {
          lat: 45.31,
          lon: 1.42
        },
        radius_km: 2
      }],
      objects: [{
        id: 'OBJ-1',
        kind: 'person',
        name: 'Randonneur',
        lat: 45.31,
        lon: 1.42,
        detection_range_nm: 1
      }],
      route_order: ['ORIGIN', 'PT1', 'DESTINATION'],
      maps: [{
        id: 'carte1',
        filename: 'detail_X-002A_1.png',
        centre_ref: 'PT1'
      }],
      phases: [{
        id: 'B',
        title: 'La vallée',
        trigger_zone: 'ZONE-1',
        fallback_delay_min: 30,
        route_order: ['PT2']
      }, {
        id: 'C',
        title: 'Le glacier',
        trigger_zone: 'ZONE-2',
        zone_shown: false,
        fallback_delay_min: 60,
        message: 'Randonneur vu vers 45.31 N.',
        route_order: ['TARGET', 'RDV-1']
      }, {
        id: 'D',
        title: 'Trouvé',
        trigger_object: 'OBJ-1',
        fallback_delay_min: 90
      }]
    },
    glacier = readMission(glacierDoc),
    glacierBefore = JSON.stringify(glacier),
    // SOG-0459 : la vue ne rend que les tiroirs OUVERTS — leurs lettres
    seenOf = v => [!!v.target, Object.keys(v.points).sort().join(' '), v.zones.map(z => z.id).join(' '), v.rendezvous.map(z => z.id).join(
      ' '), v.turns.map(z => z.id).join(' '), v.drawers.map(d => d.id).join(' ')],
    leaks = v => /45\.31|1\.42|Randonneur vu|La vallée|Le glacier|Trouvé/.test(JSON.stringify(v)),
    // la zone du tiroir 1 (fermé) selon ce que le fichier écrit de zone_shown
    shownAs = v => seenOf(pilotView(readMission({
      ...glacierDoc,
      phases: glacierDoc.phases.map((x, i) => i ? x : {
        ...x,
        zone_shown: v
      })
    }), []))[2];
  same('pilotView, aucun tiroir ouvert : la partie visible seule — sa route, le centre de sa carte ; la zone d\'un tiroir fermé sans zone_shown est cachée (SOG-0459)',
    seenOf(pilotView(glacier, [])), [false, 'PT1', '', '', 'PT1', '']);
  ck('pilotView, aucun tiroir ouvert : la position cachée, le message et les titres des tiroirs ne sont dans RIEN de ce qui est rendu', !leaks(
    pilotView(glacier, [])), JSON.stringify(pilotView(glacier, [])).slice(0, 200));
  same('pilotView, le premier tiroir ouvert : lui seul, entier — sa zone et sa suite de route en plus, rien du deuxième',
    [seenOf(pilotView(glacier, ['B'])), pilotView(glacier, ['B']).drawers.map(d => [d.id, d.rank, d.title]), /Le glacier|Trouvé|Randonneur vu/.test(
      JSON.stringify(pilotView(glacier, ['B'])))], [
      [false, 'PT1 PT2 ZONE-1', 'ZONE-1', '', 'PT1 PT2', 'B'],
      [
        ['B', 1, 'La vallée']
      ], false
    ]);
  same('pilotView, le deuxième ouvert : sa zone, la cible et le rendez-vous de sa suite de route ; le troisième n\'est pas rendu',
    seenOf(pilotView(glacier, ['B', 'C'])), [true, 'PT1 PT2 RDV-1 TARGET ZONE-1 ZONE-2', 'ZONE-1 ZONE-2', 'RDV-1', 'PT1 PT2', 'B C']);
  // SOG-0459 : le cheminement du profil (vertical_profile.route) ne nomme pas un lieu d'un tiroir fermé ; le jeton revient avec le tiroir ouvert
  const glacierProfile = readMission({
    ...glacierDoc,
    vertical_profile: {
      route: 'ORIGIN PT1 PT2 FL050 ZONE-1 DESTINATION'
    }
  });
  same('pilotView, le cheminement du profil : un jeton qui nomme un lieu d\'un tiroir fermé (PT2, ZONE-1) n\'y est plus, le point visible et le niveau restent ; le tiroir ouvert, ils reviennent',
    [pilotView(glacierProfile, []).profileRoute, pilotView(glacierProfile, ['B']).profileRoute, glacierProfile.profileRoute], [
      'ORIGIN PT1 FL050 DESTINATION', 'ORIGIN PT1 PT2 FL050 ZONE-1 DESTINATION', 'ORIGIN PT1 PT2 FL050 ZONE-1 DESTINATION'
    ]);
  same('pilotView, un tiroir fermé ne laisse rien (SOG-0459) : ni talon, ni compte ; drawersRefused vaut 0',
    [pilotView(glacier, []).drawers, pilotView(glacier, []).pilot, pilotView(glacier, []).drawersRefused], [
      [], {
        mine: true,
        opened: []
      }, 0
    ]);
  same('pilotView, la zone de passage d\'un tiroir fermé : montrée avec zone_shown: true (le booléen) seulement ; « true » en texte, 1, false : cachée',
    [true, 'true', 1, false, null].map(shownAs), ['ZONE-1', '', '', '', '']);
  same('pilotView, une mission qu\'on feuillette (pas la mienne) : la partie visible seule, quels que soient les tiroirs dits ouverts',
    [seenOf(pilotView(glacier, ['B', 'C', 'D'], {
      mine: false
    })), pilotView(glacier, ['B'], {
      mine: false
    }).pilot], [
      [false, 'PT1', '', '', 'PT1', ''], {
        mine: false,
        opened: []
      }
    ]);
  same('pilotView, des tiroirs ouverts qui ne sont pas des lettres de tiroir sont ignorés (une entrée bornée)',
    [null, 'B', 7, {}, ['Z', 7, null, {}, '__proto__', 'b'],
      ['C', 'C', 'B']
    ].map(o => pilotView(glacier, o).pilot.opened), [
      [],
      [],
      [],
      [],
      [],
      ['B', 'C']
    ]);
  ck('pilotView : une mission sans tiroir n\'a pas de secret (elle est rendue telle quelle) ; sans mission, null ; la mission lue n\'est pas touchée',
    (plainMission => pilotView(plainMission, ['B']) === plainMission && plainMission.target !== null)(readMission(minimal)) && pilotView(null,
      []) === null && pilotView('x', []) === null && JSON.stringify(glacier) === glacierBefore, '');

  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
