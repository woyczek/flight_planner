<!doctype html>
<!-- Banc de la mise à jour du service worker du cadre (frame/sw.js, frame/SPEC.md § 3.6) : sw.js chargé dans une page nue,
     avec un faux « self » (portée /frame/, pages ouvertes qui reçoivent ses messages) et un faux réseau qui sert la
     version suivante d'une copie gardée ; la vraie CacheStorage de la page (noms du service worker, page sans service
     worker : rien d'autre ne les touche). Vérifie : une version relue à moitié n'entre jamais dans le cache que les pages
     lisent et n'est pas annoncée ; complète, elle est annoncée et attend ; un chargement de page la prend d'un coup ; une
     page ouverte ne reçoit jamais un fichier d'une autre version que la sienne (31 oct. 2026, Réglages vides).
     window.__swUpdateBench = { done, pass, fail, rows }. Ouvrir la page suffit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>sw update — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">sw.js — update bench</h1>
<pre id="out"></pre>
<script type="module">
  const rows = [],
    out = document.getElementById('out');
  const ck = (name, ok, detail = '') => {
    rows.push({
      name,
      ok: !!ok,
      detail
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}`;
    out.append(l);
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    // une adresse qui n'est pas la boucle locale : le service worker y garde la question « Recharger » (le poste avec lanceur est l'essai 4)
    const O = 'https://example.test',
      F = `${O}/frame/`,
      files = ['index.html', 'app.js', 'settings/settings.js', 'lib/qr.js'].map(p => F + p),
      net = {
        version: 'v2',
        fail: '', // une adresse dont la relecture échoue (réseau perdu en route)
        down: false, // le serveur ne répond plus (lanceur arrêté)
        stamp: 's1', // l'empreinte de ce que le lanceur sert (GET /__setup/frame-stamp)
        files: 0, // demandes de fichiers faites au serveur (hors empreinte)
        stamps: 0 // demandes d'empreinte
      },
      messages = [];
    for (const k of await caches.keys())
      if (k.startsWith('sog-frame-')) await caches.delete(k);
    const live = await caches.open('sog-frame-v1');
    for (const u of files) await live.put(u, new Response(`v1 ${u}`));
    // le faux « self » du service worker, ses écouteurs, et un faux réseau
    const listeners = {},
      fakeSelf = {
        location: new URL(`${F}sw.js`),
        addEventListener: (type, fn) => listeners[type] = fn,
        skipWaiting: async () => {},
        clients: {
          claim: async () => {},
          matchAll: async () => [{
            postMessage: m => messages.push(m.type)
          }]
        }
      },
      fakeFetch = async input => {
        const u = String(input?.url || input).split('?')[0];
        if (net.down || net.fail && u === net.fail) throw new TypeError('Failed to fetch');
        if (u.endsWith('/__setup/frame-stamp')) {
          net.stamps++;
          return new Response(JSON.stringify({
            stamp: net.stamp
          }));
        }
        net.files++;
        return new Response(`${net.version} ${u}`);
      };
    const src = await (await fetch('../../sw.js', {
      cache: 'no-store'
    })).text();
    new Function('self', 'fetch', src)(fakeSelf, fakeFetch);
    /** Une requête de la page au service worker : la réponse servie, et tout ce qu'il a lancé à côté. */
    const ask = async (url, mode = 'cors') => {
      const waits = [];
      let served;
      listeners.fetch({
        request: {
          url,
          method: 'GET',
          mode
        },
        respondWith: p => served = p,
        waitUntil: p => waits.push(p)
      });
      const text = await (await served).text();
      await Promise.all(waits);
      return text;
    };
    const liveText = async u => (await (await caches.open('sog-frame-v1')).match(u))?.text();
    const settle = async test => {
      for (let i = 0; i < 40 && !await test(); i++) await sleep(50);
    };

    // 1. une copie a changé, mais la relecture de la version suivante échoue en route
    net.fail = F + 'lib/qr.js';
    ck('la page ouverte reçoit sa propre version (copie gardée)', (await ask(F + 'app.js')).startsWith('v1'));
    await settle(async () => !(await caches.has('sog-frame-v1-next')));
    ck('relecture coupée : rien n’entre dans le cache que les pages lisent (aucun fichier v2 mêlé à v1)', (await Promise.all(files.map(
      liveText))).every(t => t?.startsWith('v1')), JSON.stringify(await Promise.all(files.map(liveText))));
    ck('relecture coupée : aucune annonce', messages.length === 0, messages.join());

    // 2. la relecture passe : la version suivante est annoncée, la page ouverte garde la sienne
    net.fail = '';
    await ask(F + 'app.js');
    await settle(async () => messages.length > 0);
    ck('relecture complète : « sog-frame-update » envoyé aux pages', messages.includes('sog-frame-update'), messages.join());
    ck('la page ouverte lit encore sa version (réglages chargés plus tard : v1)', (await ask(F + 'settings/settings.js')).startsWith('v1'));

    // 3. un chargement de page prend la version suivante d'un coup
    const page = await ask(F, 'navigate');
    ck('chargement de la page : la nouvelle version, entière', page.startsWith('v2') && (await Promise.all(files.map(liveText))).every(t =>
      t?.startsWith('v2')), JSON.stringify(await Promise.all(files.map(liveText))));
    ck('la version suivante quitte son cache à part une fois prise', !(await caches.has('sog-frame-v1-next')));

    // 4. poste avec lanceur (la page est servie par la boucle locale, SOG-0168) : un fichier changé est pris dès le chargement de la page
    // qui suit, sans question ni annonce ; le lanceur arrêté, la copie tient
    for (const k of await caches.keys())
      if (k.startsWith('sog-frame-')) await caches.delete(k);
    const L = 'http://127.0.0.1:8000/frame/',
      lfiles = ['index.html', 'app.js', 'settings/settings.js', 'lib/qr.js'].map(p => L + p),
      lmsgs = [],
      llisteners = {};
    const lc = await caches.open('sog-frame-v1');
    for (const u of lfiles) await lc.put(u, new Response(`v1 ${u}`));
    new Function('self', 'fetch', src)({
      location: new URL(`${L}sw.js`),
      addEventListener: (type, fn) => llisteners[type] = fn,
      skipWaiting: async () => {},
      clients: {
        claim: async () => {},
        matchAll: async () => [{
          postMessage: m => lmsgs.push(m.type)
        }]
      }
    }, fakeFetch);
    const lask = async (url, mode = 'cors') => {
      const waits = [];
      let served;
      llisteners.fetch({
        request: {
          url,
          method: 'GET',
          mode
        },
        respondWith: p => served = p,
        waitUntil: p => waits.push(p)
      });
      const text = await (await served).text();
      await Promise.all(waits);
      return text;
    };
    net.version = 'v2';
    net.fail = '';
    net.files = net.stamps = 0;
    const lpage = await lask(L, 'navigate');
    const lall = await Promise.all(lfiles.map(liveText));
    ck('lanceur présent : la page chargée est la nouvelle version, dès ce chargement', lpage.startsWith('v2'), lpage);
    ck('lanceur présent : toutes les copies sont de la nouvelle version, sans version suivante à part', lall.every(t => t?.startsWith(
        'v2')) &&
      !(await caches.has('sog-frame-v1-next')), JSON.stringify(lall));
    ck('lanceur présent : aucune annonce « Nouvelle version » (rien à accepter)', lmsgs.length === 0, lmsgs.join());
    // empreinte égale : UNE demande, rien d'autre (aucune copie redemandée, aucune revérification fichier par fichier)
    net.version = 'v3';
    net.files = net.stamps = 0;
    const lsame = await lask(L, 'navigate');
    await lask(L + 'app.js');
    await lask(L + 'settings/settings.js');
    ck('empreinte égale : la copie est servie (rien n’a changé pour le lanceur)', lsame.startsWith('v2'), lsame);
    ck('empreinte égale : une seule demande au lanceur (l’empreinte), aucun fichier redemandé', net.stamps === 1 && net.files === 0,
      `empreintes ${net.stamps}, fichiers ${net.files}`);
    // empreinte différente : les copies sont relues, la page chargée est la nouvelle
    net.stamp = 's2';
    net.files = net.stamps = 0;
    const lnew = await lask(L, 'navigate');
    ck('empreinte différente : la page chargée est la nouvelle version, dès ce chargement', lnew.startsWith('v3') && (await Promise.all(
        lfiles.map(liveText))).every(t => t?.startsWith('v3')),
      lnew);
    net.version = 'v4';
    net.down = true;
    ck('lanceur arrêté : la copie tient, la page se charge', (await lask(L, 'navigate')).startsWith('v3'));
    net.down = false;
    ck('lanceur de retour, même empreinte : la copie, rien de relu', (await lask(L, 'navigate')).startsWith('v3'));
    net.stamp = 's3';
    ck('lanceur de retour, empreinte changée : la version suivante est prise au chargement qui suit', (await lask(L, 'navigate'))
      .startsWith('v4'));
  } catch (e) {
    ck('exception', false, e.stack || String(e));
  }
  window.__swUpdateBench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__swUpdateBench.pass} PASS · ${window.__swUpdateBench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
