<!doctype html>
<!-- Banc du bloc commun des flèches « Plus tôt » / « Plus tard » (frame/lib/reorder.js, SOG-0482) : le geste pur (move, moveId, canMove) sur les trois listes de la maquette de l'itinéraire (la route de départ, la suite
     d'un tiroir, les tiroirs entre eux), les deux flèches (arrowsHtml : la flèche d'un bord grisée avec son titre, jamais cachée ; textes échappés ; quatre langues), l'écouteur délégué (bind : une flèche ouverte appelle,
     une grisée ou un sens inconnu non), le focus rendu après le redessin (focusAfter). Page nue ; window.__reorderBench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>reorder — bench</title>
<style>
  /* la scène ne bouge pas quand le compte rendu s'allonge : les essais du glisser mesurent des positions */
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 340px;
    max-height: 100vh;
    overflow: hidden;
    background: #fff;
    z-index: 2
  }
  #out {
    margin-left: 360px
  }
</style>
</head>
<body>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
  import {
    DIRS,
    TEXTS,
    canMove,
    move,
    moveId,
    moveTo,
    moveIdTo,
    arrowsHtml,
    handleHtml,
    bind,
    focusAfter,
    DRAG_MIN,
    pastThreshold,
    slotAt,
    dragPlan,
    scrollStep,
    limitStep
  } from '../reorder.js?v=0';
  const rows = [],
    out = document.getElementById('out'),
    stage = document.getElementById('stage');
  window.__reorderBench = {
    done: false,
    pass: 0,
    fail: 0,
    rows
  };
  const ck = (name, ok, detail = '') => {
    window.__reorderBench[ok ? 'pass' : 'fail']++;
    rows.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : ' — ' + detail}`);
    out.append(`${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}\n`);
  };
  const J = v => JSON.stringify(v);
  const eq = (name, got, want) => ck(name, J(got) === J(want), `got ${J(got)}, want ${J(want)}`);
  const parse = h => new DOMParser().parseFromString(`<body>${h}</body>`, 'text/html').body;

  // ---- canMove : les flèches ouvertes ------------------------------------------------------------------
  eq('une liste de trois : le premier ne remonte pas, le dernier ne descend pas', [canMove(3, 0), canMove(3, 1), canMove(3, 2)], [{
    up: false,
    down: true
  }, {
    up: true,
    down: true
  }, {
    up: true,
    down: false
  }]);
  eq('un élément seul dans sa liste : les deux flèches fermées', canMove(1, 0), {
    up: false,
    down: false
  });
  eq('un indice qui n\'en est pas un (hors liste, fraction, texte, NaN, négatif, liste vide) : rien d\'ouvert', [canMove(3, 3), canMove(3, -
    1), canMove(3, 1.5), canMove(3, '1'), canMove(3, NaN), canMove(0, 0), canMove('3', 1), canMove(undefined, undefined)].map(x => x
    .up || x.down), [false, false, false, false, false, false, false, false]);

  // ---- move : un NOUVEAU tableau, la liste n'est jamais modifiée ----------------------------------------
  const L = ['a', 'b', 'c', 'd'];
  eq('move down : b passe après c', move(L, 1, 'down'), ['a', 'c', 'b', 'd']);
  eq('move up : c passe avant b', move(L, 2, 'up'), ['a', 'c', 'b', 'd']);
  eq('la liste d\'origine n\'est pas modifiée', L, ['a', 'b', 'c', 'd']);
  ck('le résultat est un autre tableau', move(L, 1, 'down') !== L);
  eq('le bord : le premier ne remonte pas, le dernier ne descend pas (null)', [move(L, 0, 'up'), move(L, 3, 'down')], [null, null]);
  eq('un sens illisible, un indice illisible, ce qui n\'est pas une liste : null', [move(L, 1, 'left'), move(L, 1, undefined), move(L, 9,
    'up'), move(L, 1.2, 'up'), move('abc', 1, 'up'), move(null, 0, 'up'), move({
    length: 3
  }, 1, 'up')], [null, null, null, null, null, null, null]);
  eq('deux fois de suite (down puis up) : on retrouve l\'ordre', move(move(L, 1, 'down'), 2, 'up'), L);
  eq('les éléments sont rangés, jamais copiés : un objet reste le même objet', (() => {
    const o = {
        id: 'x'
      },
      r = move([{
        id: 'w'
      }, o], 1, 'up');
    return r[0] === o;
  })(), true);

  // ---- moveId : le même geste par identifiant ----------------------------------------------------------
  const drawers = [{
    id: 'T1',
    suite: ['PT2']
  }, {
    id: 'T2',
    suite: []
  }, {
    id: 'T3',
    suite: ['PT9', 'PT10']
  }];
  const r1 = moveId(drawers, 'T1', 'down');
  eq('un tiroir bouge AVEC sa suite (l\'élément contient sa suite)', [r1.items.map(x => x.id), r1.items[1].suite, r1.from, r1.to], [
    ['T2', 'T1', 'T3'],
    ['PT2'], 0, 1
  ]);
  eq('moveId : le bord, l\'identifiant inconnu, un sens inconnu : null', [moveId(drawers, 'T1', 'up'), moveId(drawers, 'T3', 'down'),
    moveId(drawers, 'T9', 'up'), moveId(drawers, 'T2', 'sideways')
  ], [null, null, null, null]);
  eq('moveId : idOf donné, identifiant numérique lu d\'un data-id (texte)', moveId([{
    n: 7
  }, {
    n: 8
  }], '8', 'up', x => x.n).items.map(x => x.n), [8, 7]);
  eq('moveId : ce qui n\'est pas une liste → null', [moveId(null, 'a', 'up'), moveId('abc', 'a', 'up')], [null, null]);
  eq('les trois listes de la maquette : la route de départ finit par TARGET (« Plus tard » fermé), PT2 seul (rien), les tiroirs 1 à 5', [
    canMove(3, 2).down, canMove(1, 0), canMove(5, 0).up, canMove(5, 4).down
  ], [false, {
    up: false,
    down: false
  }, false, false]);

  // ---- arrowsHtml ----------------------------------------------------------------------------------------
  const one = (o) => parse(arrowsHtml(o)).querySelector('.f-reorder');
  let g = one({
    lang: 'fr',
    list: 'route',
    id: 'PT1',
    n: 3,
    i: 1,
    name: 'PT1 · Point un'
  });
  let b = [...g.querySelectorAll('button')];
  eq('deux boutons, « ↑ Plus tôt » puis « ↓ Plus tard », des vrais boutons (type=button)', [b.map(x => x.textContent), b.map(x => x.type), b
    .map(x => x.dataset.reorder)
  ], [
    ['↑ Plus tôt', '↓ Plus tard'],
    ['button', 'button'],
    ['up', 'down']
  ]);
  eq('au milieu : les deux ouvertes, sans titre', [b.map(x => x.disabled), b.map(x => x.hasAttribute('title'))], [
    [false, false],
    [false, false]
  ]);
  eq('la liste et l\'identifiant portés par chaque flèche', b.map(x => [x.dataset.list, x.dataset.id]), [
    ['route', 'PT1'],
    ['route', 'PT1']
  ]);
  eq('le groupe et chaque flèche nomment l\'élément pour un lecteur d\'écran', [g.getAttribute('role'), g.getAttribute('aria-label'), b.map(
    x => x.getAttribute('aria-label'))], ['group', 'Changer la place : PT1 · Point un', ['PT1 · Point un : plus tôt',
    'PT1 · Point un : plus tard'
  ]]);
  g = one({
    lang: 'fr',
    list: 'route',
    id: 'TARGET',
    n: 3,
    i: 2,
    why: {
      down: 'La limite du tiroir 1 : retirez de l\'itinéraire, puis ＋ sous la ligne voulue'
    }
  });
  b = [...g.querySelectorAll('button')];
  eq('le dernier : « ↓ Plus tard » est GRISÉ (présent, jamais caché) avec le titre du module', [b.length, b.map(x => x.disabled), b[1]
    .title, b[0].hasAttribute('title')
  ], [2, [false, true], 'La limite du tiroir 1 : retirez de l\'itinéraire, puis ＋ sous la ligne voulue', false]);
  g = one({
    lang: 'fr',
    list: 'suite',
    id: 'PT2',
    n: 1,
    i: 0,
    why: {
      up: 'Seul lieu de la suite',
      down: 'Seul lieu de la suite'
    }
  });
  b = [...g.querySelectorAll('button')];
  eq('seul dans sa liste : les deux grisées, chacune avec son titre', [b.map(x => x.disabled), b.map(x => x.title)], [
    [true, true],
    ['Seul lieu de la suite', 'Seul lieu de la suite']
  ]);
  g = one({
    lang: 'en',
    list: 'drawers',
    id: 'T1',
    n: 5,
    i: 0
  });
  b = [...g.querySelectorAll('button')];
  eq('sans texte du module, le titre du bloc (en anglais ici) ; sans nom, pas d\'aria-label', [b[0].disabled, b[0].title, b[1].disabled, b
    .map(x => x.hasAttribute('aria-label')), g.hasAttribute('aria-label')
  ], [true, 'Already first in its list', false, [false, false], false]);
  const texts = {};
  for (const lang of ['fr', 'en', 'de', 'es']) {
    const bb = [...one({
      lang,
      list: 'l',
      id: 'x',
      n: 2,
      i: 1
    }).querySelectorAll('button')];
    texts[lang] = [bb[0].textContent, bb[1].textContent, bb[1].title];
  }
  eq('les quatre langues : les flèches et le titre d\'un bord', texts, {
    fr: ['↑ Plus tôt', '↓ Plus tard', 'Déjà en dernière place de sa liste'],
    en: ['↑ Earlier', '↓ Later', 'Already last in its list'],
    de: ['↑ Früher', '↓ Später', 'Schon an letzter Stelle seiner Liste'],
    es: ['↑ Antes', '↓ Después', 'Ya es el último de su lista']
  });
  eq('une langue inconnue : le français', one({
    lang: 'xx',
    list: 'l',
    id: 'x',
    n: 2,
    i: 0
  }).querySelector('button').textContent, '↑ Plus tôt');
  eq('TEXTS : quatre langues pour chaque texte', Object.entries(TEXTS).filter(([, v]) => !Array.isArray(v) || v.length !== 4 || v.some(s =>
    !s)).map(([k]) => k), []);
  const hostile = '"><img src=x onerror=window.__pwn=1>\u0007<b>';
  const h = parse(arrowsHtml({
    lang: 'fr',
    list: hostile,
    id: hostile,
    n: 3,
    i: 1,
    name: hostile,
    why: {
      up: hostile,
      down: hostile
    }
  }));
  eq('un texte hostile (identifiant, liste, nom) reste du texte : aucune balise de plus, aucun attribut de plus', [h.querySelectorAll(
      'img, b, script').length, [...h.querySelectorAll('button')].every(x => x.attributes.length <= 7), h.querySelectorAll('button')
    .length, window.__pwn
  ], [0, true, 2, undefined]);
  const h2 = parse(arrowsHtml({
    lang: 'fr',
    list: 'l',
    id: 'x',
    n: 1,
    i: 0,
    why: {
      up: hostile,
      down: 'x'.repeat(5000)
    }
  }));
  eq('un titre hostile est du texte et la longueur est bornée (200)', [h2.querySelectorAll('img').length, h2.querySelectorAll('button')[1]
    .title.length
  ], [0, 200]);
  eq('les entrées illisibles : deux flèches fermées, rien d\'autre', [...parse(arrowsHtml({
    n: 'x',
    i: {}
  })).querySelectorAll('button')].map(x => x.disabled), [true, true]);
  eq('sans argument : un groupe de deux flèches fermées', [...parse(arrowsHtml()).querySelectorAll('button')].map(x => x.disabled), [true,
    true
  ]);

  // ---- bind : l'écouteur délégué ---------------------------------------------------------------------------
  const calls = [];
  stage.innerHTML = `<div id="root">${arrowsHtml({ lang: 'fr', list: 'route', id: 'A', n: 3, i: 0 })}${arrowsHtml({ lang: 'fr', list: 'route', id: 'B', n: 3, i: 1 })}${arrowsHtml({ lang: 'fr', list: 'drawers', id: 'B', n: 2, i: 1 })}<p id="away">x</p><button id="forged" data-reorder="sideways" data-list="route" data-id="A">?</button></div>`;
  const root = stage.querySelector('#root');
  const unbind = bind(root, {
    onMove: m => calls.push(m)
  });
  const btn = (list, id, dir) => root.querySelector(`button[data-list="${list}"][data-id="${id}"][data-reorder="${dir}"]`);
  btn('route', 'B', 'down').click();
  eq('une flèche ouverte appelle onMove avec la liste, l\'identifiant et le sens', calls, [{
    list: 'route',
    id: 'B',
    dir: 'down'
  }]);
  btn('route', 'A', 'up').click();
  btn('drawers', 'B', 'down').click();
  eq('une flèche grisée n\'appelle rien', calls.length, 1);
  root.querySelector('#forged').click();
  root.querySelector('#away').click();
  eq('un sens inconnu, un clic ailleurs : rien', calls.length, 1);
  btn('drawers', 'B', 'up').click();
  eq('la même clé dans une autre liste : la liste est dite', calls[1], {
    list: 'drawers',
    id: 'B',
    dir: 'up'
  });
  unbind();
  btn('route', 'B', 'up').click();
  eq('après unbind : plus d\'appel', calls.length, 2);
  eq('onMove absent ou illisible : aucune erreur', (() => {
    try {
      const u = bind(root, {});
      btn('route', 'B', 'up').click();
      const u2 = bind(root);
      u();
      u2();
      return 'ok';
    } catch (e) {
      return String(e);
    }
  })(), 'ok');

  // ---- focusAfter : le focus après le redessin ---------------------------------------------------------------
  const draw = (items, list) => items.map((id, i) => arrowsHtml({
    lang: 'fr',
    list,
    id,
    n: items.length,
    i
  })).join('');
  stage.innerHTML = `<div id="r2">${draw(['a', 'b', 'c'], 'route')}${draw(['b', 'z'], 'suite')}</div>`;
  const r2 = stage.querySelector('#r2');
  let f = focusAfter(r2, {
    list: 'route',
    id: 'b',
    dir: 'down'
  });
  eq('le focus sur la flèche du même sens de l\'élément', [f && f.dataset.id, f && f.dataset.reorder, f && f.dataset.list, document
    .activeElement === f
  ], ['b', 'down', 'route', true]);
  r2.innerHTML = draw(['b', 'a', 'c'], 'route');
  f = focusAfter(r2, {
    list: 'route',
    id: 'b',
    dir: 'up'
  });
  eq('l\'élément est arrivé au bord : la flèche du même sens est fermée, le focus va sur l\'autre', [f && f.dataset.reorder, f && f
    .disabled, document.activeElement === f
  ], ['down', false, true]);
  r2.innerHTML = draw(['b'], 'route');
  f = focusAfter(r2, {
    list: 'route',
    id: 'b',
    dir: 'up'
  });
  eq('seul dans sa liste : aucune flèche ouverte, pas de focus (null)', f, null);
  eq('un identifiant inconnu, une autre liste : null', [focusAfter(r2, {
    list: 'route',
    id: 'nope',
    dir: 'up'
  }), focusAfter(r2, {
    list: 'other',
    id: 'b',
    dir: 'up'
  })], [null, null]);
  r2.innerHTML = draw(['a', 'b', 'c'], 'route') + draw(['b', 'z'], 'suite');
  f = focusAfter(r2, {
    list: 'suite',
    id: 'b',
    dir: 'down'
  });
  eq('le même identifiant dans deux listes : la liste choisit', [f.dataset.list, f.dataset.reorder], ['suite', 'down']);
  eq('DIRS est figé', [Object.isFrozen(DIRS), DIRS], [true, ['up', 'down']]);

  {
    // ======== 7b : la poignée et le glisser ==================================================================
    // ---- moveTo / moveIdTo : le geste vers un indice d'arrivée -------------------------------------------
    eq('moveTo : a de 0 à 2, c\'est ["b","c","a","d"] ; de 3 à 1 ["a","d","b","c"]', [moveTo(L, 0, 2), moveTo(L, 3, 1)], [
      ['b', 'c', 'a', 'd'],
      ['a', 'd', 'b', 'c']
    ]);
    eq('moveTo : la même place, un indice illisible, pas une liste → null ; la liste n\'est pas modifiée', [moveTo(L, 1, 1), moveTo(L, 1,
      9), moveTo(L, -1, 0), moveTo(L, 1.5, 2), moveTo('abcd', 0, 1), moveTo(null, 0, 1), L], [null, null, null, null,
      null, null, ['a', 'b', 'c', 'd']
    ]);
    const r2t = moveIdTo(drawers, 'T1', 2);
    eq('moveIdTo : un tiroir glissé en dernier emporte sa suite ; from et to rendus', [r2t.items.map(x => x.id), r2t.items[2].suite, r2t
      .from, r2t.to
    ], [
      ['T2', 'T3', 'T1'],
      ['PT2'], 0, 2
    ]);
    eq('moveIdTo : l\'identifiant inconnu, la même place → null ; un data-id (texte) lu pour un identifiant numérique', [moveIdTo(drawers,
      'T9', 1), moveIdTo(drawers, 'T2', 1), moveIdTo([{
      n: 7
    }, {
      n: 8
    }], '7', 1, x => x.n).items.map(x => x.n)], [null, null, [8, 7]]);

    // ---- handleHtml : la poignée, au pointeur seulement --------------------------------------------------
    const hd = parse(handleHtml({
      lang: 'de',
      list: 'drawers',
      id: 'T1',
      name: 'Fach <b>1</b>'
    })).firstElementChild;
    eq('la poignée : un span (pas un bouton, pas de tabulation), caché des lecteurs d\'écran, avec sa liste et son identifiant', [hd
      .tagName, hd.className, hd.hasAttribute('data-reorder-handle'), hd.dataset.list, hd.dataset.id, hd.getAttribute('aria-hidden'), hd
      .hasAttribute(
        'tabindex'), hd.querySelector('b')
    ], ['SPAN', 'f-reorder-handle', true, 'drawers', 'T1', 'true', false, null]);
    eq('la poignée : le titre dit le nom, échappé, dans la langue', hd.title, 'Ziehen, um die Position zu ändern: Fach <b>1</b>');
    eq('la poignée : le titre en quatre langues, sans nom → le texte général', ['fr', 'en', 'de', 'es'].map(l => parse(handleHtml({
      lang: l,
      list: 'a',
      id: 'b'
    })).firstElementChild.title), TEXTS.handleBare);
    eq('la poignée : le titre avec nom en quatre langues', ['fr', 'en', 'de', 'es'].map(l => parse(handleHtml({
      lang: l,
      list: 'a',
      id: 'b',
      name: 'N'
    })).firstElementChild.title), TEXTS.handle.map(x => x.replace('{n}', 'N')));
    eq('la poignée : un identifiant qui casse l\'attribut reste du texte', parse(handleHtml({
      list: 'a',
      id: '"><img src=x onerror=alert(1)>'
    })).querySelectorAll('img').length, 0);

    // ---- les calculs purs du glisser ---------------------------------------------------------------------
    eq('le seuil : 6 px (3-4 = 5 : pas encore ; 6-0, 4-5 : oui ; illisible : non)', [DRAG_MIN, pastThreshold(3, 4), pastThreshold(6, 0),
      pastThreshold(-4, 5), pastThreshold(NaN, 9), pastThreshold(undefined, 9)
    ], [6, false, true, true, false, false]);
    const R = [0, 50, 100, 150].map(t => ({
      top: t,
      bottom: t + 50
    }));
    eq('la case d\'insertion : le nombre de lignes dont le milieu est au-dessus du pointeur', [-100, 10, 30, 60, 130, 190, 500].map(y =>
      slotAt(R, y)), [0, 0, 1, 1, 3, 4, 4]);
    eq('le plan, ligne 2 tenue (from 1) : au-dessus de la première → to 0, repère avant la ligne 0', dragPlan(R, 1, 10), {
      slot: 0,
      to: 0,
      mark: {
        index: 0,
        side: 'before'
      }
    });
    eq('le plan : sur sa propre place (cases 1 et 2) → to === from, aucun repère', [dragPlan(R, 1, 60).mark, dragPlan(R, 1, 60).to,
      dragPlan(R, 1, 110).slot, dragPlan(R, 1, 110).mark
    ], [null, 1, 2, null]);
    eq('le plan : plus bas → to après retrait de la ligne tenue (slot 3 → to 2), repère avant la ligne 3', dragPlan(R, 1, 130), {
      slot: 3,
      to: 2,
      mark: {
        index: 3,
        side: 'before'
      }
    });
    eq('le plan : sous la dernière → to est la dernière place, repère APRÈS la dernière ligne', dragPlan(R, 1, 900), {
      slot: 4,
      to: 3,
      mark: {
        index: 3,
        side: 'after'
      }
    });
    eq('le plan : jamais hors de la liste, quel que soit le pointeur (to entre 0 et n-1)', [-1e9, -1, 0, 75, 175, 1e9].map(y => dragPlan(R,
      2, y).to).every(v => v >= 0 && v <= 3), true);
    eq('le plan : liste vide, indice illisible, hauteur illisible → null', [dragPlan([], 0, 10), dragPlan(R, 9, 10), dragPlan(R, 1, NaN),
      dragPlan(null, 0, 1)
    ], [null, null, null, null]);
    eq('le pas de défilement : au milieu 0 ; au bord plein (±20) ; proportionnel à l\'approche ; au-delà du bord plein', [scrollStep(400,
        100, 700), scrollStep(100, 100, 700), scrollStep(128, 100, 700), scrollStep(40, 100, 700), scrollStep(700, 100, 700),
      scrollStep(672, 100, 700), scrollStep(900, 100, 700)
    ], [0, -20, -10, -20, 20, 10, 20]);
    eq('le pas de défilement : une zone minuscule (deux fois la bande à peine), des bornes illisibles → 0 ou borné', [scrollStep(30, 0, 60),
      scrollStep(5, 0, 60), scrollStep(NaN, 0, 600), scrollStep(10, 600, 0), scrollStep(10, 5, 5)
    ], [0, -17, 0, 0, 0]);
    eq('le pas borné à la liste : plus haut seulement si la première ligne dépasse en haut, plus bas seulement si la dernière dépasse en bas',
      [limitStep(-10, 120, 900, 100, 700), limitStep(-10, 50, 900, 100, 700), limitStep(10, 100, 600, 100, 700), limitStep(10, 100, 900,
        100, 700), limitStep(0, 0, 9999, 100, 700), limitStep(10, 100, 705, 100, 700), limitStep(-10, 96, 900, 100, 700), limitStep(10,
        100, 701, 100, 700)], [0, -10, 0, 10, 0, 5, -4, 0]);

    // ---- le geste : les événements du pointeur sur une page nue -----------------------------------------
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const rowsHtml = (list, ids, extra = '') => ids.map(x => `<div data-reorder-row data-id="${x}" style="height:50px;box-sizing:border-box;border-bottom:1px solid #ccc">${handleHtml({
    list,
    id: x
  }).replace('class="f-reorder-handle"', 'class="f-reorder-handle" style="display:inline-block;width:44px;height:44px;background:#ddd"')}${x}${extra}</div>`).join('');
    stage.innerHTML = `<div id="g1" style="width:300px">${rowsHtml('a', ['a1', 'a2', 'a3', 'a4'])}</div>`;
    const g1 = stage.querySelector('#g1'),
      calls = [],
      pe = (type, o = {}) => new PointerEvent(type, {
        bubbles: true,
        cancelable: true,
        pointerId: 1,
        isPrimary: true,
        button: 0,
        pointerType: 'mouse',
        ...o
      });
    let unbind = bind(g1, {
      onDrop: m => calls.push(m)
    });
    const hand = id => g1.querySelector(`[data-reorder-handle][data-id="${id}"]`);
    const rowOf = id => hand(id).closest('[data-reorder-row]');
    const cy = id => {
      const r = rowOf(id).getBoundingClientRect();
      return r.top + r.height / 2;
    };
    const marks = () => [...g1.querySelectorAll('[data-reorder-drop]')].map(e => e.dataset.id + ':' + e.dataset.reorderDrop);
    const dragging = () => [...g1.querySelectorAll('[data-reorder-dragging]')].map(e => e.dataset.id);
    const start = (id, o = {}) => {
      const r = hand(id).getBoundingClientRect();
      X = r.left + 20;
      hand(id).dispatchEvent(pe('pointerdown', {
        clientX: r.left + 20,
        clientY: r.top + 20,
        ...o
      }));
      return r;
    };
    let X = 20;
    const mv = (y, o = {}) => window.dispatchEvent(pe('pointermove', {
      clientX: X,
      clientY: y,
      ...o
    }));
    const up = (y, o = {}) => window.dispatchEvent(pe('pointerup', {
      clientX: X,
      clientY: y,
      ...o
    }));
    let r = start('a2');
    mv(r.top + 20 + 5);
    eq('sous 6 px : rien ne bouge (ni ligne tenue, ni repère, pas d\'attribut sur la racine)', [dragging(), marks(), g1.hasAttribute(
      'data-reorder-active')], [
      [],
      [], false
    ]);
    up(r.top + 25);
    eq('un toucher sans glisser (moins de 6 px) : onDrop n\'est pas appelé', calls.length, 0);
    r = start('a2');
    mv(cy('a2') + 8);
    eq('à 6 px et plus : la ligne tenue porte son attribut, la racine aussi ; la même place : aucun repère', [dragging(), g1.hasAttribute(
      'data-reorder-active'), marks()], [
      ['a2'], true, []
    ]);
    mv(cy('a4') + 10);
    eq('le pointeur sous la dernière ligne : le repère est APRÈS a4', marks(), ['a4:after']);
    mv(cy('a3') + 20);
    eq('entre a3 et a4 : le repère est avant a4 (un seul repère à la fois)', marks(), ['a4:before']);
    mv(5);
    eq('au-dessus de la première : le repère est avant a1', marks(), ['a1:before']);
    mv(cy('a4') + 10);
    up(cy('a4') + 10);
    eq('au lâcher : onDrop({ list, id, from, to }) une fois ; attributs retirés', [calls.map(c => [c.list, c.id, c.from, c.to]), dragging(),
      marks(), g1.hasAttribute('data-reorder-active')
    ], [
      [
        ['a', 'a2', 1, 3]
      ],
      [],
      [], false
    ]);
    calls.length = 0;
    r = start('a2');
    mv(cy('a2') + 20);
    mv(cy('a2') + 10);
    up(cy('a2') + 10);
    eq('lâché sur sa propre place (to === from) : onDrop n\'est pas appelé', calls.length, 0);
    r = start('a3');
    mv(cy('a1') - 10);
    const esc = [];
    const spy = e => esc.push(e.key);
    document.addEventListener('keydown', spy);
    document.dispatchEvent(new KeyboardEvent('keydown', {
      key: 'Escape',
      bubbles: true,
      cancelable: true
    }));
    document.removeEventListener('keydown', spy);
    up(cy('a1') - 10);
    eq('Échap pendant le glisser : tout est retiré, rien n\'est déposé, l\'Échap n\'atteint pas le module (il fermerait un tiroir)', [
      dragging(), marks(), g1.hasAttribute('data-reorder-active'), calls.length, esc.length
    ], [
      [],
      [], false, 0, 0
    ]);
    r = start('a3');
    mv(cy('a1') - 10);
    window.dispatchEvent(pe('pointercancel'));
    up(cy('a1') - 10);
    eq('pointercancel (le navigateur reprend le geste) : annulé, rien n\'est déposé', [dragging(), marks(), calls.length], [
      [],
      [], 0
    ]);
    r = start('a3');
    mv(cy('a1') - 10);
    window.dispatchEvent(new Event('blur'));
    up(cy('a1') - 10);
    eq('la fenêtre perd le focus pendant le glisser : annulé', [dragging(), marks(), calls.length], [
      [],
      [], 0
    ]);
    r = start('a3');
    mv(cy('a1') - 10, {
      pointerId: 2
    });
    up(cy('a1') - 10, {
      pointerId: 2
    });
    eq('un autre doigt (autre pointerId) : ignoré', [dragging(), calls.length], [
      [], 0
    ]);
    up(cy('a1') - 10);
    r = start('a3', {
      button: 2
    });
    mv(cy('a1') - 10);
    eq('le bouton droit de la souris : pas de glisser', [dragging(), calls.length], [
      [], 0
    ]);
    up(cy('a1') - 10, {
      button: 2
    });
    r = start('a3', {
      isPrimary: false
    });
    mv(cy('a1') - 10);
    eq('un second doigt (pas le pointeur principal) : pas de glisser', dragging(), []);
    up(cy('a1') - 10);
    r = start('a3', {
      pointerType: 'touch'
    });
    mv(cy('a1') - 10, {
      pointerType: 'touch'
    });
    up(cy('a1') - 10, {
      pointerType: 'touch'
    });
    eq('au toucher : le même geste (a3 devant a1)', calls.map(c => [c.id, c.from, c.to]), [
      ['a3', 2, 0]
    ]);
    calls.length = 0;
    r = start('a3');
    mv(cy('a1') - 10);
    unbind();
    eq('unbind pendant le glisser : le geste est annulé, attributs retirés', [dragging(), marks(), g1.hasAttribute('data-reorder-active')],
      [
        [],
        [], false
      ]);
    up(cy('a1') - 10);
    eq('et rien n\'est déposé après unbind', calls.length, 0);
    unbind = bind(g1, {
      onMove: () => {}
    });
    r = start('a2');
    mv(cy('a1'));
    eq('sans onDrop : la poignée ne fait rien (les flèches seules)', [dragging(), calls.length], [
      [], 0
    ]);
    up(cy('a1'));
    unbind();
    stage.innerHTML = `<div id="g2">${rowsHtml('a', ['a1', 'a2', 'a3'])}<div data-id="x">x${handleHtml({
    list: 'a',
    id: 'x'
  })}</div></div>`;
    const g2 = stage.querySelector('#g2');
    const calls2 = [];
    bind(g2, {
      onDrop: m => calls2.push(m)
    });
    const h2 = g2.querySelector('[data-reorder-handle][data-id="a1"]').getBoundingClientRect();
    g2.querySelector('[data-reorder-handle][data-id="a1"]').dispatchEvent(pe('pointerdown', {
      clientX: h2.left + 5,
      clientY: h2.top + 5
    }));
    mv(h2.top + 120);
    up(h2.top + 120);
    eq('une ligne sans data-reorder-row dans la liste : le module n\'a pas fini son contrat, le geste est abandonné sans rien déposer', [
      calls2.length, g2.querySelectorAll('[data-reorder-dragging],[data-reorder-drop]').length
    ], [0, 0]);

    // ---- une liste dans une liste : le tiroir contient sa suite ; le glisser ne franchit jamais sa liste --------
    stage.innerHTML = `<div id="g3" style="width:300px"><div data-reorder-row data-id="T1" style="box-sizing:border-box;border-bottom:1px solid #ccc">${handleHtml({
    list: 'drawers',
    id: 'T1'
  })}T1<div id="suiteBox">${rowsHtml('suite', ['PT2', 'PT3'])}</div></div>${rowsHtml('drawers', ['T2', 'T3'])}</div>`;
    const g3 = stage.querySelector('#g3'),
      calls3 = [];
    bind(g3, {
      onDrop: m => calls3.push(m)
    });
    const hh = (l, id) => g3.querySelector(`[data-reorder-handle][data-list="${l}"][data-id="${id}"]`);
    let b3 = hh('drawers', 'T1').getBoundingClientRect();
    hh('drawers', 'T1').dispatchEvent(pe('pointerdown', {
      clientX: b3.left + 5,
      clientY: b3.top + 5
    }));
    mv(b3.top + 30);
    mv(5000);
    up(5000);
    eq('un tiroir glissé tout en bas : il passe en dernier DES TIROIRS (to 2), jamais dans la suite ; sa suite l\'accompagne (elle est dans sa ligne)',
      [calls3.map(c => [c.list, c.id, c.from, c.to]), g3.querySelector('[data-id="T1"]').contains(g3.querySelector('#suiteBox'))], [
        [
          ['drawers', 'T1', 0, 2]
        ], true
      ]);
    calls3.length = 0;
    b3 = hh('suite', 'PT2').getBoundingClientRect();
    hh('suite', 'PT2').dispatchEvent(pe('pointerdown', {
      clientX: b3.left + 5,
      clientY: b3.top + 5
    }));
    mv(b3.top + 30);
    mv(5000);
    up(5000);
    eq('une ligne de la suite glissée loin sous les tiroirs : elle reste dans la suite (to 1), jamais dans la liste des tiroirs', calls3
      .map(c => [c.list, c.id, c.from, c.to]), [
        ['suite', 'PT2', 0, 1]
      ]);
    const bits = [];
    stage.innerHTML = `<div id="g4">${rowsHtml('a', ['a1'])}</div>`;
    bind(stage.querySelector('#g4'), {
      onDrop: m => bits.push(m)
    });
    const h4 = stage.querySelector('[data-reorder-handle]');
    const b4 = h4.getBoundingClientRect();
    h4.dispatchEvent(pe('pointerdown', {
      clientX: b4.left + 5,
      clientY: b4.top + 5
    }));
    mv(b4.top + 200);
    up(b4.top + 200);
    eq('un élément seul dans sa liste : rien à déposer', bits.length, 0);

    // ---- le défilement au bord : borné à la liste, jusqu'au lâcher ---------------------------------------
    stage.innerHTML = `<div id="sc" style="height:300px;overflow:auto;position:relative;width:300px"><div id="g5">${rowsHtml('a', Array.from({
    length: 12
  }, (_, k) => 'r' + (k + 1)))}</div><div style="height:500px">après la liste</div></div>`;
    const sc = stage.querySelector('#sc'),
      g5 = stage.querySelector('#g5'),
      calls5 = [];
    bind(g5, {
      onDrop: m => calls5.push(m),
      edges: () => ({
        top: 0,
        bottom: 0
      })
    });
    const scr = sc.getBoundingClientRect(),
      hr1 = g5.querySelector('[data-reorder-handle][data-id="r1"]').getBoundingClientRect();
    g5.querySelector('[data-reorder-handle][data-id="r1"]').dispatchEvent(pe('pointerdown', {
      clientX: hr1.left + 5,
      clientY: hr1.top + 5
    }));
    mv(hr1.top + 60);
    mv(scr.bottom - 5);
    await wait(250);
    const s1 = sc.scrollTop;
    ck('le doigt au bord bas de la zone qui défile : elle défile toute seule', s1 > 60, 'scrollTop ' + s1);
    await wait(1500);
    const s2 = sc.scrollTop,
      listBottom = g5.getBoundingClientRect().bottom - scr.top;
    ck('et s\'arrête quand la liste est entièrement visible : l\'espace après la liste n\'est pas parcouru', s2 >= s1 && g5
      .getBoundingClientRect().bottom <= scr.bottom + 1 && sc.scrollHeight - sc.clientHeight - s2 > 100, `scrollTop ${s2}, bas de la liste ${listBottom}, max ${sc.scrollHeight - sc.clientHeight}`);
    const s3 = sc.scrollTop;
    await wait(250);
    eq('arrivé au bout de la liste, il ne défile plus', sc.scrollTop, s3);
    mv(scr.top + 3);
    await wait(300);
    ck('le doigt au bord haut : elle remonte', sc.scrollTop < s3, `${s3} → ${sc.scrollTop}`);
    mv(scr.bottom - 5);
    await wait(150);
    const s4 = sc.scrollTop;
    up(scr.bottom - 5);
    await wait(250);
    eq('au lâcher le défilement s\'arrête', sc.scrollTop, s4);
    ck('la ligne tenue est déposée dans la liste (r1 loin vers le bas : to est un indice de la liste)', calls5.length === 1 && calls5[0]
      .list === 'a' && calls5[0].from === 0 && calls5[0].to > 0 && calls5[0].to <= 11, J(calls5));
    calls5.length = 0;
    sc.scrollTop = 0;
    const hr2 = g5.querySelector('[data-reorder-handle][data-id="r2"]').getBoundingClientRect();
    g5.querySelector('[data-reorder-handle][data-id="r2"]').dispatchEvent(pe('pointerdown', {
      clientX: hr2.left + 5,
      clientY: hr2.top + 5
    }));
    mv(hr2.top + 60);
    mv(scr.bottom - 5);
    await wait(200);
    const s5 = sc.scrollTop;
    document.dispatchEvent(new KeyboardEvent('keydown', {
      key: 'Escape',
      bubbles: true,
      cancelable: true
    }));
    await wait(250);
    eq('Échap arrête aussi le défilement', [sc.scrollTop, calls5.length], [s5, 0]);
    up(scr.bottom - 5);
    await wait(50);
    stage.innerHTML = '';

  }

  window.__reorderBench.done = true;
  out.append(`\n${window.__reorderBench.pass} passed, ${window.__reorderBench.fail} failed\n`);
</script>
</body>
</html>
