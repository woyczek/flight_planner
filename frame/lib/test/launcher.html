<!doctype html>
<!-- Banc du client du lanceur (frame/lib/launcher.js, frame/INTEGRATION.md § 15.1) : routes et chemins normalisés, appels du
     cadre (en-tête, méthode, corps, jamais d'exception), ctx.launcher d'un module (déclaration : routes et préfixes de
     lecture, refus sans appel), protocole des travaux (avancement, fin, erreur, annulation, démontage, reprise), lecture
     en flux de data/. Lanceur simulé (fetch donné au client) : aucun appel réel.
     window.__launcherBench = { done, pass, fail, rows } pour un pilote (Playwright). Ouvrir la page suffit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>launcher — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">launcher.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import {
    launcherClient,
    routeOf,
    dataPathOf
  } from '../launcher.js?v=0';
  const rows = [],
    out = document.getElementById('out');
  window.__launcherBench = {
    done: false,
    pass: 0,
    fail: 0,
    rows
  };
  const ck = (name, ok, detail = '') => {
    rows.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : ' — ' + detail}`);
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}`;
    out.append(l);
  };
  const ROOT = 'http://launcher.test/',
    J = v => JSON.stringify(v);
  const json = (v, status = 200) => new Response(JSON.stringify(v), {
    status,
    headers: {
      'content-type': 'application/json'
    }
  });
  /** Lanceur simulé : routes du test, journal des appels, un travail dont l'état avance à chaque lecture. */
  function fake(opts = {}) {
    const calls = [],
      jobs = new Map();
    let n = 0;
    return {
      calls,
      jobs,
      async fetch(url, init = {}) {
        const u = new URL(url),
          method = init.method || 'GET',
          route = u.pathname.replace(/^\/__setup\//, '');
        calls.push({
          method,
          route,
          query: u.search,
          headers: init.headers || {},
          body: init.body
        });
        if (opts.offline) throw new TypeError('Failed to fetch');
        if (u.pathname.startsWith('/data/')) {
          const p = decodeURIComponent(u.pathname.slice(6));
          if (p === 'sia/eaip/x.bin') return new Response(new Uint8Array(3000), {
            headers: {
              'Content-Length': '3000'
            }
          });
          return new Response('nope', {
            status: 404
          });
        }
        if (route === 'echo') return json({
          ok: true,
          method,
          body: init.body ? JSON.parse(init.body) : null
        });
        if (route === 'array') return json([1, 2]);
        if (route === 'slow') return json({
          ok: false,
          message: 'too soon: wait 12 s',
          reason: 'too-soon',
          wait: 12,
          secret: 'never handed on',
          detail: {
            x: 1
          }
        }, 429);
        if (route === 'boom') return json({
          message: 'kaput'
        }, 500);
        if (route === 'regen/job' && method === 'POST') {
          const b = JSON.parse(init.body || '{}');
          opts.starts?.push(b);
          if (opts.busy) return json({
            ok: false,
            message: 'a job is already running'
          }, 409);
          const id = `j${++n}`;
          jobs.set(id, {
            id,
            state: 'running',
            done: 0,
            total: 3,
            step: '',
            fail: b.verb === 'fail',
            cancelled: false
          });
          return json({
            ok: true,
            job: id
          });
        }
        if (route === 'regen/job/cancel') {
          const j = jobs.get(JSON.parse(init.body).id);
          if (j) j.cancelled = true;
          return json({
            ok: !!j
          });
        }
        if (route === 'regen/job') {
          const id = u.searchParams.get('id');
          if (!id) {
            const last = [...jobs.values()].at(-1);
            return json({
              job: last ? {
                ...last
              } : null
            });
          }
          const j = jobs.get(id);
          if (!j) return json({
            ok: false,
            message: 'no such job'
          }, 410);
          if (j.state === 'running') {
            j.done++;
            j.step = `step ${j.done}`;
            if (j.cancelled) j.state = 'cancelled';
            else if (j.done >= j.total) {
              j.state = j.fail ? 'error' : 'done';
              j.result = j.fail ? {
                message: 'builder failed'
              } : {
                files: 7
              };
            }
          }
          return json({
            ...j
          });
        }
        return json({
          error: 'not found'
        }, 404);
      }
    };
  }
  const mk = (o = {}) => {
    const f = fake(o);
    return {
      f,
      c: launcherClient({
        root: ROOT,
        info: {
          host: 'pc',
          data: true,
          dataGit: true,
          lan: false
        },
        fetch: f.fetch,
        poll: 5
      })
    };
  };
  const DECL = {
    routes: ['regen/', 'echo', 'array', 'boom', 'missing', 'slow'],
    read: ['sia/', 'proc/']
  };

  try {
    // ---------------------------------------------------------------- routes et chemins
    ck('routeOf : préfixe /__setup/ et requête retirés', routeOf('/__setup/regen/job?id=1') === 'regen/job');
    ck('routeOf : « .. », caractères hors liste refusés', routeOf('regen/../secrets') === '' && routeOf('a b') === '' && routeOf(
      'x:y') === '' && routeOf('') === '');
    ck('dataPathOf : chemin relatif gardé', dataPathOf('sia/base/fr/2026-10-01/x.json') === 'sia/base/fr/2026-10-01/x.json');
    ck('dataPathOf : absolu, « .. », « . », vide, encodé, antislash, deux-points refusés', ['/sia/x', 'sia/../x', 'sia/./x',
      'sia//x', 'sia/%2e%2e/x', 'sia\\x', 'C:x', ''
    ].every(p => dataPathOf(p) === ''));

    // ---------------------------------------------------------------- appels du cadre
    let S = mk();
    const r1 = await S.c.request('echo', {
      json: {
        a: 1
      }
    });
    const c1 = S.f.calls.at(-1);
    ck('request : POST avec corps JSON, en-tête X-SOG-Setup', r1.status === 200 && r1.body.method === 'POST' && r1.body.body.a === 1 &&
      c1.headers['X-SOG-Setup'] === '1' && c1.headers['Content-Type'] === 'application/json', JSON.stringify(c1));
    const r2 = await S.c.request('echo');
    ck('request : GET sans corps', r2.body.method === 'GET' && r2.body.body === null);
    ck('request : statut et corps d\'un refus rendus', (await S.c.request('boom')).status === 500);
    ck('request : route invalide → null, sans appel', (await S.c.request('../x')) === null && S.f.calls.length === 3);
    ck('request : réseau coupé → null, jamais d\'exception', (await mk({
      offline: true
    }).c.request('echo')) === null);

    // ---------------------------------------------------------------- ctx.launcher : déclaration
    const M = S.c.forModule(DECL);
    const n0 = S.f.calls.length;
    const ref = await M.call('secrets');
    ck('call : route non déclarée refusée (403), sans appel', ref.ok === false && ref.status === 403 && ref.refused && ref.route ===
      'secrets' && S.f.calls.length === n0, JSON.stringify(ref));
    ck('call : préfixe « regen/ » ne couvre pas « regenx »', (await M.call('regenx')).refused === true);
    ck('call : route exacte déclarée acceptée', (await M.call('echo')).method === 'GET');
    ck('call : corps → POST', (await M.call('echo', {
      x: 1
    })).method === 'POST');
    ck('call : réponse en tableau → { ok, value }', JSON.stringify(await M.call('array')) === '{"ok":true,"value":[1,2]}');
    const e5 = await M.call('boom');
    ck('call : erreur du lanceur → { ok: false, status, message, route }', e5.ok === false && e5.status === 500 && e5.message ===
      'kaput' && e5.route === 'boom', JSON.stringify(e5));
    const e4 = await M.call('missing');
    ck('call : route inconnue du lanceur (404) → « unknown route » (lanceur à mettre à jour)', e4.status === 404 && e4.message ===
      'unknown route', JSON.stringify(e4));
    const off = await mk({
      offline: true
    }).c.forModule(DECL).call('echo');
    ck('call : hors ligne → { ok: false, offline }', off.ok === false && off.offline === true);
    const r429 = await M.call('slow');
    ck('refus motivé (429) : { ok: false, status, route, message, reason, wait }, rien d\'autre du corps', J(Object.keys(r429).sort()) ===
      J(['message', 'ok', 'reason', 'route', 'status', 'wait']) && r429.reason === 'too-soon' && r429.wait === 12 && r429.status === 429,
      J(r429));
    ck('refus sans motif : ni reason ni wait', !('reason' in e5) && !('wait' in e5), J(e5));
    ck('info : une copie du relevé', M.info().host === 'pc' && M.info() !== M.info());

    // ---------------------------------------------------------------- travaux
    const prog = [];
    const j1 = await M.job('regen/job', {
      set: 'state',
      verb: 'scan'
    }, {
      onProgress: s => prog.push(s.done)
    });
    ck('job : avancement à chaque lecture, fin « done », résultat', j1.ok === true && j1.state === 'done' && j1.result?.files === 7 &&
      prog.join() === '1,2,3', `${JSON.stringify(j1)} ${prog}`);
    const j2 = await M.job('regen/job', {
      set: 'x',
      verb: 'fail'
    });
    ck('job : fin en erreur → ok: false, state error', j2.ok === false && j2.state === 'error' && j2.result?.message === 'builder failed');
    const ac = new AbortController();
    setTimeout(() => ac.abort(), 1);
    const j3 = await M.job('regen/job', {
      set: 'x',
      verb: 'long'
    }, {
      signal: ac.signal
    });
    ck('job : annulation (signal) → POST …/cancel, { cancelled }', j3.cancelled === true && S.f.calls.some(c => c.route ===
      'regen/job/cancel'), JSON.stringify(j3));
    S = mk();
    const life = new AbortController(),
      Ml = S.c.forModule(DECL, {
        life: life.signal
      });
    setTimeout(() => life.abort(), 1);
    const j4 = await Ml.job('regen/job', {
      set: 'x',
      verb: 'long'
    });
    ck('job : démontage du module → suivi arrêté (detached), travail laissé au lanceur', j4.detached === true && !S.f.calls.some(c => c
      .route === 'regen/job/cancel') && S.f.jobs.get(j4.job)?.state === 'running', JSON.stringify(j4));
    const r4 = await S.c.forModule(DECL).resume('regen/job');
    ck('resume : le travail en cours retrouvé et suivi jusqu\'à sa fin', r4?.ok === true && r4.job === j4.job && r4.state === 'done',
      JSON.stringify(r4));
    ck('resume : travail fini → son état, sans suivi', (await S.c.forModule(DECL).resume('regen/job'))?.state === 'done');
    ck('resume : aucun travail → null', (await mk().c.forModule(DECL).resume('regen/job')) === null);
    const busy = await mk({
      busy: true
    }).c.forModule(DECL).job('regen/job', {});
    ck('job : un travail déjà en cours (409) → refus rendu', busy.ok === false && busy.status === 409);
    ck('job : route non déclarée refusée', (await M.job('secrets', {})).refused === true);
    // l'annulation fait partie du protocole : déclarer « regen/job » permet « regen/job/cancel », rien d'autre en plus
    const Mj = S.c.forModule({
      routes: ['regen/job']
    });
    ck("call : <route>/cancel d’une route déclarée permise", (await Mj.call('regen/job/cancel', {
      id: 'x'
    })).refused !== true);
    ck("call : ni une autre sous-route, ni l’annulation d’une route non déclarée", (await Mj.call('regen/job/put', {})).refused === true &&
      (await Mj.call('secrets/cancel', {})).refused === true);
    // l'auteur : le trigramme de l'appareil ajouté au départ d'un travail (l'auteur de ses commits côté lanceur)
    const starts = [],
      F2 = fake({
        starts
      }),
      Ma = launcherClient({
        root: ROOT,
        fetch: F2.fetch,
        poll: 5
      }).forModule(DECL, {
        author: () => 'ABC'
      });
    await Ma.job('regen/job', {
      set: 'state',
      verb: 'scan'
    });
    ck('job : le trigramme de l\'appareil ajouté au départ (author)', starts[0]?.author === 'ABC' && starts[0]?.set === 'state', JSON
      .stringify(starts));
    const starts2 = [],
      Mn = launcherClient({
        root: ROOT,
        fetch: fake({
          starts: starts2
        }).fetch,
        poll: 5
      }).forModule(DECL);
    await Mn.job('regen/job', {
      set: 'state',
      verb: 'scan'
    });
    ck('job : sans trigramme, pas de champ author', starts2.length === 1 && !('author' in starts2[0]), JSON.stringify(starts2));

    // ---------------------------------------------------------------- lecture de data/
    let bytes = 0;
    const rd = await M.read('sia/eaip/x.bin', {
      onBytes: n => bytes = n
    });
    let got = 0;
    if (rd.ok)
      for (const rdr = rd.stream.getReader();;) {
        const {
          done,
          value
        } = await rdr.read();
        if (done) break;
        got += value.length;
      }
    ck('read : flux, taille, onBytes au fil de la lecture', rd.ok && rd.size === 3000 && got === 3000 && bytes === 3000,
      `${JSON.stringify(rd)} ${got} ${bytes}`);
    ck('read : chemin non déclaré refusé, sans appel', (await M.read('secrets/x.json')).refused === true);
    ck('read : remontée refusée', (await M.read('sia/../secrets/x')).refused === true);
    ck('read : absent → { ok: false, status: 404 }', (await M.read('proc/x.json')).status === 404);
    const M3 = S.c.forModule(DECL);
    ck('read : chemin encodé dans l\'adresse (espaces)', (await M3.read('sia/a b.json')).status === 404 && S.f.calls.at(-1).route
      .endsWith('/data/sia/a%20b.json'), S.f.calls.at(-1).route);

    // ---------------------------------------------------------------- upload : un fichier envoyé avec avancement et annulation (SOG-0199)
    {
      const UP = {
        routes: ['base/upload', 'echo']
      };
      /** XMLHttpRequest simulé : journal de l'envoi, avancement par morceaux, réponse choisie par le test. */
      const fakeXhr = (o = {}) => {
        const log = [];
        const make = () => {
          const x = {
            headers: {},
            upload: {},
            open(m, u) {
              x.method = m;
              x.url = u;
            },
            setRequestHeader(k, v) {
              x.headers[k] = v;
            },
            abort() {
              x.aborted = true;
              setTimeout(() => x.onabort?.());
            },
            send(body) {
              x.body = body;
              log.push(x);
              if (o.hang) return;
              setTimeout(() => {
                if (o.offline) return x.onerror?.();
                for (const f of [.25, .5, 1]) x.upload.onprogress?.({
                  loaded: Math.round(body.size * f),
                  total: body.size,
                  lengthComputable: true
                });
                x.status = o.status || 200;
                x.responseText = o.text ?? JSON.stringify({
                  ok: true,
                  received: body.size
                });
                x.onload?.();
              });
            }
          };
          return x;
        };
        return {
          log,
          make
        };
      };
      const up = (o = {}) => {
        const xr = fakeXhr(o);
        let lost = 0;
        const f = fake();
        return {
          xr,
          f,
          lost: () => lost,
          M: launcherClient({
            root: ROOT,
            info: {
              host: 'pc',
              data: true,
              dataGit: true,
              lan: false
            },
            fetch: f.fetch,
            xhr: xr.make,
            onLost: () => lost++,
            poll: 5
          }).forModule(UP)
        };
      };
      const file = new Blob([new Uint8Array(4000)]);
      let U = up();
      const seen = [];
      const r = await U.M.upload('base/upload', file, {
        name: 'LFPO é.pdf',
        onProgress: (l, t) => seen.push([l, t])
      });
      const x0 = U.xr.log[0];
      ck('upload : POST sur la route déclarée, octets du fichier en corps, en-tête X-SOG-Setup, Content-Type octets', x0.method ===
        'POST' && x0.url ===
        `${ROOT}__setup/base/upload` && x0.body === file && x0.headers['X-SOG-Setup'] === '1' && x0.headers['Content-Type'] ===
        'application/octet-stream', JSON.stringify([x0.method, x0.url, x0.headers]));
      ck('upload : X-SOG-Name = indice du nom, encodé', x0.headers['X-SOG-Name'] === encodeURIComponent('LFPO é.pdf'), x0.headers[
        'X-SOG-Name']);
      ck('upload : avancement (chargé, total) pendant l\'envoi', JSON.stringify(seen) === '[[1000,4000],[2000,4000],[4000,4000]]', JSON
        .stringify(seen));
      ck('upload : réponse { ok: true, status, body } (le JSON du lanceur)', r.ok === true && r.status === 200 && r.body.received === 4000,
        JSON.stringify(r));
      const n1 = U.xr.log.length;
      const rf = await U.M.upload('secrets', file);
      ck('upload : route non déclarée refusée (403), sans envoi', rf.ok === false && rf.status === 403 && rf.refused === true && U.xr.log
        .length === n1, JSON
        .stringify(rf));
      ck('upload : « .. » et route hors liste refusées, sans envoi', (await U.M.upload('base/../secrets', file)).refused === true && (
        await U.M.upload(
          'base/uploadx', file)).refused === true && U.xr.log.length === n1);
      ck('upload : ce n\'est pas un fichier → refus, sans envoi', (await U.M.upload('base/upload', 'texte')).ok === false && U.xr.log
        .length === n1);
      ck('upload : sans nom, pas d\'en-tête X-SOG-Name', await (async () => {
        const V = up();
        await V.M.upload('base/upload', file);
        return !('X-SOG-Name' in V.xr.log[0].headers);
      })());
      ck('upload : nom : contrôles retirés, 200 caractères au plus', await (async () => {
        const V = up();
        await V.M.upload('base/upload', file, {
          name: `a\u0000b\n${'x'.repeat(500)}`
        });
        const h = decodeURIComponent(V.xr.log[0].headers['X-SOG-Name']);
        return h.length === 200 && !/[\u0000-\u001f]/.test(h);
      })());
      // refus du lanceur : même forme que call
      U = up({
        status: 429,
        text: JSON.stringify({
          message: 'too soon',
          reason: 'too-soon',
          wait: 9,
          secret: 'never'
        })
      });
      const rr = await U.M.upload('base/upload', file);
      ck('upload : refus du lanceur → { ok: false, status, route, message, reason, wait }, rien d\'autre', rr.ok === false && rr.status ===
        429 && rr.reason ===
        'too-soon' && rr.wait === 9 && !('secret' in rr), JSON.stringify(rr));
      ck('upload : 404 → « unknown route » (lanceur plus ancien)', (await up({
        status: 404,
        text: '{}'
      }).M.upload('base/upload', file)).message === 'unknown route');
      // réseau coupé
      U = up({
        offline: true
      });
      const ro = await U.M.upload('base/upload', file);
      ck('upload : réseau coupé → { ok: false, offline: true }, le cadre prévenu (onLost)', ro.ok === false && ro.offline === true && U
        .lost() === 1, JSON.stringify(ro));
      // annulation
      U = up({
        hang: true
      });
      const ac = new AbortController();
      const pending = U.M.upload('base/upload', file, {
        signal: ac.signal
      });
      await new Promise(r => setTimeout(r, 5));
      ac.abort();
      const ra = await pending;
      ck('upload : annulation par signal → { ok: false, aborted: true }, envoi interrompu', ra.ok === false && ra.aborted === true && U.xr
        .log[0].aborted === true, JSON
        .stringify(ra));
      const ac2 = new AbortController();
      ac2.abort();
      const n2 = (U = up()).xr.log.length;
      ck('upload : signal déjà arrêté → aborted, sans envoi', (await U.M.upload('base/upload', file, {
        signal: ac2.signal
      })).aborted === true && U.xr.log.length === n2);
      ck('upload : écouteur d\'avancement en échec → l\'envoi se termine', (await up().M.upload('base/upload', file, {
        onProgress: () => {
          throw new Error('x');
        }
      })).ok === true);
    }
  } catch (e) {
    ck('exception', false, e.stack || e.message);
  }
  const pass = rows.filter(r => r.startsWith('PASS')).length,
    fail = rows.length - pass;
  Object.assign(window.__launcherBench, {
    done: true,
    pass,
    fail
  });
  const s = document.createElement('p');
  s.className = fail ? 'FAIL' : 'PASS';
  s.textContent = `${pass} / ${rows.length}`;
  out.append(s);
</script>
</body>
</html>
