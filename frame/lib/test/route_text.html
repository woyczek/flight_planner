<!doctype html>
<!-- Banc du texte de route (frame/lib/route_text.js, V3_SPECIFICATION § 10.31) : provenance des mots d'un Auto, forme OACI avec « DCT »,
     noms de SID et de STAR posés depuis le choix et relus. Fonctions pures ; page nue ; window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>route_text — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">route_text.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import {
    provenance,
    tokenize,
    textFromTokens,
    textFromPoints,
    icaoCoord,
    formatLevel,
    withProcedures,
    proceduresOfText
  } from '../route_text.js?v=0';
  const out = document.getElementById('out'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      got: String(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `  → ${got}`}`;
    out.appendChild(l);
  }
  const J = x => JSON.stringify(x);
  // provenance : les mots d'un Auto précédent
  const seq = [
    ['LFRS', false],
    ['TSA01', true],
    ['UT460', true],
    ['TSA05', true],
    ['LFML', false]
  ].map(([w, g]) => ({
    w,
    g
  }));
  ck('provenance : le texte écrit par l’Auto, mot pour mot', J(provenance(['LFRS', 'TSA01', 'UT460', 'TSA05', 'LFML'], seq)) === J([false,
    true, true, true, false
  ]));
  ck('provenance : un mot ajouté par le pilote est posé, rien ne se décale', J(provenance(['LFRS', 'TSA01', 'UT460', 'TSA05', 'XYZ',
    'LFML'
  ], seq)) === J([false, true, true, true, false, false]));
  ck('provenance : sans Auto précédent, tout est posé', J(provenance(['A', 'B'], null)) === J([false, false]) && J(provenance([], seq)) ===
    '[]');
  // textFromTokens : forme OACI
  const P = id => ({
    pt: {
      id
    }
  });
  ck('textFromTokens dct : « DCT » entre deux points de route, jamais contre le départ ni l’arrivée', textFromTokens([P('LFBO'), {
    keep: 'LACOU7B'
  }, P('LACOU'), P('LMG'), {
    keep: 'UN859'
  }, P('AMB'), {
    keep: 'OKRIX5A'
  }, P('LFPO')], {
    dct: true
  }) === 'LFBO LACOU7B LACOU DCT LMG UN859 AMB OKRIX5A LFPO');
  ck('textFromTokens sans dct : rien d’ajouté', textFromTokens([P('A'), P('B'), P('C'), P('D')]) === 'A B C D' && textFromTokens([P('A'),
    P('B'), P('C')
  ], {
    dct: true
  }) === 'A B C');
  // withProcedures : rendu
  const o = {
    dep: 'LFBO',
    arr: 'LFPO',
    sidNames: ['LACOU7B', 'FINOT5B'],
    starNames: ['OKRIX5A', 'MOLBA1W']
  };
  const w1 = withProcedures('LFBO LMG UN859 AMB LFPO', {
    ...o,
    sid: 'LACOU7B',
    exit: 'LACOU',
    sidPoints: ['TOU01', 'LACOU'],
    star: 'OKRIX5A',
    entry: 'OKRIX',
    starPoints: ['OKRIX', 'PO401']
  });
  ck('withProcedures : SID et sa sortie après le départ, entrée et STAR avant l’arrivée ; le premier point suivant est dit', w1.text ===
    'LFBO LACOU7B LACOU LMG UN859 AMB OKRIX OKRIX5A LFPO' && w1.exitAdded && w1.entryAdded && w1.next === 'LMG', J(w1));
  const w2 = withProcedures('LFBO FINOT5B FINOT LACOU LMG AMB MOLBA1W LFPO', {
    ...o,
    sid: 'LACOU7B',
    exit: 'LACOU',
    sidPoints: ['LACOU'],
    star: null
  });
  ck('withProcedures : les anciens noms retirés ; un point de la procédure déjà dans la route : pas de sortie ajoutée', w2.text ===
    'LFBO LACOU7B FINOT LACOU LMG AMB LFPO' && !w2.exitAdded, J(w2));
  ck('withProcedures : rien de choisi, le texte sans noms de procédures', withProcedures('LFBO LACOU7B LACOU LMG LFPO', o).text ===
    'LFBO LACOU LMG LFPO');
  // proceduresOfText : relecture
  ck('proceduresOfText : la première SID du départ, la dernière STAR de l’arrivée ; rien sinon', J(proceduresOfText(
    'LFBO lacou7b LACOU LMG AMB OKRIX5A LFPO', o)) === J({
    sid: 'LACOU7B',
    star: 'OKRIX5A'
  }) && J(proceduresOfText('LFBO LMG LFPO', o)) === J({
    sid: null,
    star: null
  }));

  // noms publiés avec une espace (« AMOLO 7A ») : un seul indicatif, rendu idempotent (parcours de BUGS SOG, 30 octobre)
  ck('tokenize : « AMOLO 7A » est un seul mot de procédure, jamais le point AMOLO suivi de « 7A »', J(tokenize('LFBO AMOLO 7A AMOLO LFPO')
    .map(
      t => t.id)) === J(['LFBO', 'AMOLO7A', 'AMOLO', 'LFPO']));
  const sp = {
      dep: 'LFBO',
      arr: 'LFPO',
      sid: 'AMOLO 7A',
      exit: 'AMOLO',
      sidPoints: ['TOU01', 'AMOLO'],
      star: 'AMB 9E',
      entry: 'AMB',
      starPoints: ['AMB', 'PO401'],
      sidNames: ['AMOLO 7A', 'FINOT 5B'],
      starNames: ['AMB 9E']
    },
    t1 = withProcedures('LFBO LFPO', sp).text;
  ck('withProcedures : indicatifs sans espace, sortie et entrée', t1 === 'LFBO AMOLO7A AMOLO AMB AMB9E LFPO', t1);
  ck('withProcedures : idempotent — deux retours de la Carte donnent le même texte, même depuis les noms avec espace', withProcedures(t1,
      sp)
    .text === t1 && withProcedures('LFBO AMOLO 7A AMOLO AMB AMB 9E LFPO', sp).text === t1, withProcedures(
      'LFBO AMOLO 7A AMOLO AMB AMB 9E LFPO', sp).text);
  ck('proceduresOfText : relit les noms écrits avec espace', J(proceduresOfText('LFBO AMOLO 7A AMOLO AMB AMB 9E LFPO', sp)) === J({
    sid: 'AMOLO7A',
    star: 'AMB9E'
  }));

  // repris de l'ancien banc modules/fuel/test/route_text.html (refonte § 10.33 R-F4c : un seul banc, lu par F69), points et voies
  // inventés ; textFromPoints écrit maintenant la forme OACI, avec ses « DCT » (un seul écrivain : textFromTokens)
  const qP = {
      XDEP: [47.16, -1.61],
      QLUG: [46.58, -1.2],
      QNEP: [45.9, 0.6],
      XARR: [43.44, 5.22],
      QXRY: [46.9, -1.4]
    },
    qpt = (id, alt) => ({
      id,
      lat: qP[id][0],
      lon: qP[id][1],
      ...(alt ? {
        alt_ft: alt
      } : {})
    }),
    qeq = (name, got, want) => ck(name, JSON.stringify(got) === JSON.stringify(want), JSON.stringify(got));
  qeq('tokenize : texte libre', tokenize('xdep n0300f270 dct qlug q869 QNEP/N0300F280 4530N00030E xarr').map(t =>
    `${t.kind}:${t.id || ''}${t.alt_ft ? '@' + t.alt_ft : ''}${t.airway ? '*' : ''}`), ['name:XDEP', 'group:@27000', 'name:QLUG',
    'name:Q869*', 'name:QNEP@28000', 'coord:4530N00030E', 'name:XARR'
  ]);
  qeq('tokenize : liste d’OFP', tokenize('XDEP 47.16 -1.61/N0300F270,\nXARR 43.44 5.22').map(t => [t.kind, t.id, t.alt_ft]), [
    ['coord', 'XDEP', 27000],
    ['coord', 'XARR', 0]
  ]);
  qeq('tokenize : NOM lat lon dans une ligne', tokenize('XDEP PT1 45.5 0.5 XARR').map(t => t.kind + ':' + t.id), ['name:XDEP', 'coord:PT1',
    'name:XARR'
  ]);
  qeq('icaoCoord', icaoCoord(45.5, -0.8), '4530N00048W');
  qeq('textFromTokens : texte normalisé', textFromTokens([{
    pt: qpt('XDEP')
  }, {
    keep: 'Q869'
  }, {
    pt: qpt('QLUG', 28000)
  }, {
    pt: {
      id: '',
      lat: 45.5,
      lon: .5
    }
  }]), 'XDEP Q869 QLUG/F280 4530N00030E');
  const qTyped = 'XDEP Q869 QLUG DCT QNEP Q3 XARR',
    qBefore = ['XDEP', 'QLUG', 'QNEP', 'XARR'].map(id => qpt(id)),
    qMoved = {
      ...qpt('QLUG'),
      lat: 46.2,
      lon: -0.9
    };
  qeq('textFromPoints : mêmes points, même texte (forme OACI)', textFromPoints(qBefore, qTyped, qBefore), 'XDEP Q869 QLUG DCT QNEP Q3 XARR');
  qeq('textFromPoints : un point inséré dans le direct, les deux voies restent', textFromPoints([qpt('XDEP'), qpt('QLUG'), qpt('QXRY'), qpt(
    'QNEP'), qpt('XARR')], qTyped, qBefore), 'XDEP Q869 QLUG DCT QXRY DCT QNEP Q3 XARR');
  qeq('textFromPoints : un point d’une voie déplacé, cette voie tombe, l’autre reste', textFromPoints([qpt('XDEP'), qMoved, qpt('QNEP'), qpt(
    'XARR')], qTyped, qBefore), 'XDEP QLUG DCT QNEP Q3 XARR');
  qeq('textFromPoints : un point retiré, ses voies tombent', textFromPoints([qpt('XDEP'), qpt('QNEP'), qpt('XARR')], qTyped, qBefore),
    'XDEP QNEP Q3 XARR');
  qeq('textFromPoints : ordre changé, la voie d’une paire rompue tombe', textFromPoints([qpt('XDEP'), qpt('QNEP'), qpt('QLUG'), qpt('XARR')],
    qTyped), 'XDEP QNEP DCT QLUG XARR');
  qeq('textFromPoints : un niveau sur un point, écrit, les voies gardées', textFromPoints([qpt('XDEP'), qpt('QLUG'), qpt('QNEP', 28000), qpt(
    'XARR')], qTyped), 'XDEP Q869 QLUG DCT QNEP/F280 Q3 XARR');
  qeq('textFromPoints : sans positions d’avant, mêmes noms = inchangés', textFromPoints([qpt('XDEP'), qpt('QLUG'), qpt('QXRY'), qpt('QNEP'),
    qpt('XARR')
  ], qTyped), 'XDEP Q869 QLUG DCT QXRY DCT QNEP Q3 XARR');
  qeq('textFromPoints : un point sans nom utilisable, en coordonnées OACI', textFromPoints([qpt('XDEP'), {
    id: 'point 1',
    lat: 45.5,
    lon: .5
  }, qpt('XARR')], 'XDEP XARR'), 'XDEP 4530N00030E XARR');
  qeq('textFromPoints : le groupe vitesse-niveau de l’ancien texte ignoré', textFromPoints(qBefore, 'XDEP N0300F270 Q869 QLUG QNEP Q3 XARR'),
    'XDEP Q869 QLUG DCT QNEP Q3 XARR');
  qeq('formatLevel : FL060 au-dessus de la transition, FL050 à la transition', [formatLevel(6000), formatLevel(5000)], ['FL060', 'FL050']);
  qeq('formatLevel : en dessous, des pieds (espace fine), arrondis à la centaine ; une autre transition ; sans valeur', [formatLevel(3500),
    formatLevel(3449), formatLevel(6000, 7000), formatLevel(null)
  ], ['3\u202f500 ft', '3\u202f400 ft', '6\u202f000 ft', '']);

  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
