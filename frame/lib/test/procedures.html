<!doctype html>
<!-- Banc des règles des procédures (frame/lib/procedures.js, V3_SPECIFICATION § 10.29 c) : pistes (servesRwy, sameRwy), noms (nameOf),
     conflits et ordre des listes (conflictsOf, orderProcedures), transitions (transitionsOf, appChoices), pistes proposées
     (runwayChoices). Fonctions pures, données inventées ; page nue, aucun module du cadre ; window.__bench = { done, pass, fail, rows }
     pour un pilote (Playwright). Ouvrir la page suffit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>procedures — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">procedures.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import {
    rwNum,
    sameRwy,
    servesAll,
    servesRwy,
    nameOf,
    isDoubt,
    conflictsOf,
    orderProcedures,
    transitionsOf,
    appChoices,
    runwayChoices,
    runwayOf,
    firstServing,
    familyOf,
    siblingsOf,
    familiesOf,
    compatible,
    summaryOf,
    isAppTransition,
    labelOf,
    transitionLabelOf,
    exitOf,
    entryOf,
    arincApp
  } from '../procedures.js?v=0';
  const rows = [],
    out = document.getElementById('out');
  const ck = (name, ok, detail = '') => {
    rows.push({
      name,
      ok: !!ok,
      detail
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}`;
    out.append(l);
  };
  const Pr = (id, kind, name, runways, extra = {}) => ({
    id,
    kind,
    name,
    runways,
    ...extra
  });

  // pistes
  ck('rwNum : sans RW, sans espaces, en majuscules', rwNum(' rw05r ') === '05R' && rwNum(null) === '' && rwNum('23') === '23');
  ck('sameRwy : 24 et RW24 se valent, pas 24 et 25', sameRwy('24', 'RW24') && !sameRwy('24', '25') && !sameRwy('', '24'));
  ck('sameRwy : « 14 » vaut 14L et 14R, 14L ne vaut pas 14R', sameRwy('14', '14L') && sameRwy('14R', '14') && !sameRwy('14L', '14R'));
  ck('servesAll : aucune piste nommée, ALL et RWALL', servesAll(Pr('a', 'SID', 'A', [])) && servesAll(Pr('a', 'SID', 'A', ['ALL'])) &&
    servesAll(Pr('a', 'SID', 'A', ['RWALL'])) &&
    !servesAll(Pr('a', 'SID', 'A', ['07'])));
  ck('servesRwy : sans piste donnée, vrai ; fiche à une piste ; fiche à toutes ; numéro sans côté', servesRwy(Pr('a', 'SID', 'A', ['07']),
      '') &&
    servesRwy(Pr('a', 'SID', 'A', ['07']), 'RW07') && !servesRwy(Pr('a', 'SID', 'A', ['07']), '25') && servesRwy(Pr('a', 'SID', 'A', [
      'ALL'
    ]), '25') &&
    servesRwy(Pr('a', 'SID', 'A', ['14L', '14R']), '14') && !servesRwy(Pr('a', 'SID', 'A', ['14L']), '14R'));

  // noms
  ck('nameOf : le nom de la fiche, sinon le troisième champ de l’identifiant', nameOf(Pr('X.SID.ROYAN6P.RW23.NONE', 'SID', 'AB1', []),
      'X.SID.ROYAN6P.RW23.NONE') === 'AB1' &&
    nameOf(null, 'X.SID.ROYAN6P.RW23.NONE') === 'ROYAN6P' && nameOf({
      name: ' '
    }, 'X.STAR.TOTO1.RW02.NONE') === 'TOTO1');
  ck('nameOf : sans nom ou NONAME, null', nameOf(null, 'X.STAR.NONAME.RW20.NONE') === null && nameOf({
    name: null
  }, 'X.STAR.NONAME.RW20.NONE') === null && nameOf(null, null) === null && nameOf({
    name: 'noname'
  }) === null);
  ck('isDoubt : statut doubt, sans nom ou NONAME', isDoubt({
      status: 'doubt',
      name: 'X1A'
    }) && isDoubt({
      name: ''
    }) && isDoubt({
      name: 'A',
      id: 'X.STAR.NONAME.RW20.NONE'
    }) &&
    !isDoubt({
      name: 'MEN1A',
      id: 'LFML.STAR.MEN1A.RW13R.NONE',
      status: 'official'
    }));

  // conflits et ordre (V3_SPECIFICATION § 10.23)
  const s07 = Pr('S.SID.A.RW07', 'SID', 'A1', ['07']),
    s25 = Pr('S.SID.B.RW25', 'SID', 'B1', ['25']),
    sAll = Pr('S.SID.C.RWALL', 'SID', 'C1', []),
    st07 = Pr('S.STAR.D.RW07', 'STAR', 'D1', ['07']),
    st25 = Pr('S.STAR.E.RW25', 'STAR', 'E1', ['25']),
    ap07 = Pr('S.APP.F.RW07', 'APP', 'ILS 07', ['07']),
    byId = new Map([s07, s25, sAll, st07, st25, ap07].map(r => [r.id, r])),
    kinds = (key, rec, ch) => conflictsOf(key, rec, ch, byId).map(c => c.kind).join();

  ck('conflictsOf : sans choix, aucun conflit', kinds('sid', s07, {}) === '' && kinds('app', ap07, undefined) === '');
  ck('conflictsOf : une SID qui ne dessert pas la piste choisie', kinds('sid', s07, {
    rwy: '25'
  }) === 'rwy' && conflictsOf('sid', s07, {
    rwy: 'RW25'
  }, byId)[0].rwy === 'RW25');
  ck('conflictsOf : la piste choisie, « ALL » ou aucune piste nommée, un numéro sans côté', kinds('sid', sAll, {
    rwy: '25'
  }) === '' && kinds('sid', s25, {
    rwy: '25'
  }) === '' && kinds('sid', Pr('x', 'SID', 'X', ['14L']), {
    rwy: '14'
  }) === '' && kinds('sid', Pr('x', 'SID', 'X', ['ALL']), {
    rwy: '25'
  }) === '');
  ck('conflictsOf : une STAR qui ne dessert pas la piste, une approche aussi', kinds('star', st07, {
    rwy: '25'
  }) === 'rwy' && kinds('app', ap07, {
    rwy: '25'
  }) === 'rwy');
  ck('conflictsOf : sans piste, une STAR qui ne dessert aucune piste de l’approche choisie', conflictsOf('star', st25, {
    app: ap07.id
  }, byId).map(c => `${c.kind}:${c.app}`).join() === 'starApp:ILS 07' && kinds('star', st07, {
    app: ap07.id
  }) === '');
  ck('conflictsOf : avec une piste choisie, la STAR n’est jugée que sur la piste ; une transition n’a pas de conflit', kinds('star', st25, {
    rwy: '25',
    app: ap07.id
  }) === '' && kinds('appTrans', Pr('t', 'APP', 'T', ['25'], {
    transition: 'T'
  }), {
    rwy: '07'
  }) === '');
  ck('conflictsOf : les fiches par objet ou par fonction', conflictsOf('star', st25, {
    app: ap07.id
  }, {
    [ap07.id]: ap07
  }).length === 1 && conflictsOf('star', st25, {
    app: ap07.id
  }, id => byId.get(id)).length === 1);
  const names = l => l.map(r => r.name).join(' ');
  ck('orderProcedures : les compatibles d’abord, puis les ⚠', names(orderProcedures([s25, s07, sAll], 'sid', {
    rwy: '07'
  }, byId)) === 'C1 A1 B1', names(orderProcedures([s25, s07, sAll], 'sid', {
    rwy: '07'
  }, byId)));
  const li = [Pr('1', 'STAR', 'Z', ['07']), Pr('2', 'STAR', 'B', ['07']), Pr('3', 'STAR', 'A', ['02']), Pr('4', 'STAR', 'Q', [], {
      status: 'xplane'
    }), Pr('5', 'STAR', 'M', []), Pr('6', 'STAR', 'B', ['07'], {
      transition: 'T1'
    }), Pr('7', 'STAR', 'B', ['07'], {
      transition: 'T0'
    })],
    o1 = orderProcedures(li, 'star', {}, byId);
  ck('orderProcedures : piste (toutes d’abord), nom, transition, le repli X-Plane en dernier', o1.map(r => r.id).join('') === '5' + '3' +
    '2' + '7' + '6' + '1' + '4',
    o1.map(r => r.id).join(''));
  ck('orderProcedures : nouveau tableau, la liste reçue intacte', li.map(r => r.id).join('') === '1234567' && o1 !== li);
  const o2 = orderProcedures([Pr('1', 'STAR', 'Z', ['02']), Pr('2', 'STAR', 'Y', ['07']), Pr('3', 'STAR', 'X', ['25']), Pr('4', 'STAR', 'W',
    ['02'], {
      status: 'xplane'
    })], 'star', {
    rwy: '07'
  }, byId);
  ck('orderProcedures : le groupe compatible garde son repli X-Plane en dernier, le groupe ⚠ après', o2.map(r => r.id).join('') === '2134',
    o2.map(r => r.id).join(''));
  ck('orderProcedures : les pistes de la SID choisie d’abord', orderProcedures(['25', '07', '14L', '02'], 'rwy', {
    sid: s07.id
  }, byId).join(' ') === '07 02 14L 25');
  ck('orderProcedures : les pistes de l’approche choisie d’abord (objets { id }), ordre naturel sinon', orderProcedures([{
    id: '25'
  }, {
    id: '07'
  }, {
    id: '02'
  }], 'rwy', {
    app: ap07.id
  }, byId).map(r => r.id).join(' ') === '07 02 25' && orderProcedures(['25', '07'], 'rwy', {}, byId).join(' ') === '07 25');
  ck('orderProcedures : une fiche qui dessert toutes les pistes ne change pas l’ordre des pistes', orderProcedures(['25', '02'], 'rwy', {
    sid: sAll.id
  }, byId).join(' ') === '02 25');

  // transitions d'une SID ou d'une STAR
  const sid1 = Pr('Z.SID.ABC1.RW07.NONE', 'SID', 'ABC1', ['07']),
    tr1 = Pr('Z.SID.ABC1.RWALL.XYZ', 'SID', 'ABC1', [], {
      transition: 'XYZ'
    }),
    tr2 = Pr('Z.SID.ABC1.RWALL.UVW', 'SID', 'ABC1', [], {
      transition: 'UVW'
    }),
    other = Pr('Z.SID.DEF2.RW07.NONE', 'SID', 'DEF2', ['07']),
    otherTr = Pr('Z.SID.DEF2.RWALL.QRS', 'SID', 'DEF2', [], {
      transition: 'QRS'
    });
  ck('transitionsOf : mêmes sorte et nom, avec une transition', transitionsOf([sid1, tr1, other, otherTr, tr2], sid1.id).map(r => r
    .transition).join() === 'XYZ,UVW');
  ck('transitionsOf : sans choix ou sans nom, rien ; nom pris de l’identifiant si la fiche manque', transitionsOf([sid1, tr1], null)
    .length === 0 &&
    transitionsOf([sid1, tr1], 'Z.SID.NONAME.RW07.NONE').length === 0 && transitionsOf([tr1], 'Z.SID.ABC1.RW07.NONE').length === 1);

  // approches : une approche donnée par ses entrées est listée une fois, ses transitions sont les fiches qui y mènent
  const fx = (id, lat) => ({
      id,
      lat,
      lon: 3
    }),
    main = Pr('Z.APP.ILS07.RW07.NONE', 'APP', 'ILS07', ['07'], {
      points: [fx('F1', 45), fx('RW07', 45.1)]
    }),
    mainTr = Pr('Z.APP.ILS07.RW07.T1', 'APP', 'ILS07', ['07'], {
      transition: 'T1',
      points: [fx('T1', 44.5), fx('F1', 45)]
    }),
    rnpFinal = Pr('Z.APP.RNP25.RW25.E2', 'APP', 'RNP25', ['25'], {
      transition: 'E2',
      points: [fx('E2', 46), fx('RW25', 46.1)]
    }),
    rnpFeed = Pr('Z.APP.RNP25.RW25.E1', 'APP', 'RNP25', ['25'], {
      transition: 'E1',
      points: [fx('E1', 47), fx('E2', 46)]
    }),
    ac = appChoices([rnpFeed, main, rnpFinal, mainTr]);
  ck('appChoices : l’approche à fiche principale et celle donnée par ses entrées, listées une fois', ac.list.map(r => r.id).join() ===
    `${main.id},${rnpFinal.id}`, ac.list.map(r => r.id).join());
  ck('appChoices : les transitions de l’approche donnée par ses entrées sont les fiches qui mènent à la fiche finale', ac.transitionsOf(
    rnpFinal.id).map(r => r.id).join() === rnpFeed.id);
  // refonte § 10.33 R-F2 : une seule notion de transition, l'ordre de la liste ne suit pas celui des fiches reçues
  ck('appChoices : les finales sans transition d’abord, quel que soit l’ordre reçu', appChoices([rnpFinal, mainTr, rnpFeed, main]).list
    .map(r => r.id).join() === `${main.id},${rnpFinal.id}`);
  ck('appChoices : celles d’une approche à fiche principale sont ses transitions, jamais elle-même', ac.transitionsOf(main.id).map(r => r
      .id).join() === mainTr.id &&
    ac.transitionsOf(null).length === 0);
  // des fiches d'entrée qui bouclent sans atteindre la piste sont des segments d'approche initiale (§ 10.30, quatrième lecture) : aucune ligne
  ck('appChoices : fiches d’entrée en boucle, sans piste : des segments, aucune ligne', appChoices([Pr('a', 'APP', 'R', ['07'], {
    transition: 'A',
    points: [fx('P', 1), fx('Q', 1)]
  }), Pr('b', 'APP', 'R', ['07'], {
    transition: 'B',
    points: [fx('Q', 1), fx('P', 1)]
  })]).list.length === 0 && appChoices([]).list.length === 0);

  // pistes à proposer, par ses trois sources
  const rw = (...ids) => ids.map(id => ({
    id,
    lat: 45,
    lon: 3
  }));
  ck('runwayChoices : 1. celles d’aerodb, quand elles ont une position', runwayChoices(rw('07', '25'), [s07], null).map(r => r.id)
    .join() === '07,25');
  ck('runwayChoices : une piste d’aerodb sans position que seules des fiches absentes nomment est écartée', runwayChoices([{
    id: '14',
    lat: null
  }, {
    id: '07',
    lat: null
  }], [s07], null).map(r => r.id).join() === '07');
  ck('runwayChoices : 2. sinon celles que nomment les fiches (union triée, ALL écarté)', runwayChoices([], [s25, s07, sAll, Pr('x', 'STAR',
    'X', ['14L', '14R'])], null).map(r => r.id).join() === '07,14L,14R,25');
  ck('runwayChoices : 3. sinon les deux sens de l’axe de la base (route vraie − déclinaison Est)', runwayChoices([], [sAll], {
    bearing: 241.85,
    magVar: 1.8
  }).map(r => r.id).join() === '06,24' && runwayChoices([], [], {
    bearing: 322.9,
    magVar: 1.7
  }).map(r => r.id).join() === '14,32');
  // runwayOf, firstServing (§ 10.30)
  ck('runwayOf : la piste unique servie, sans RW ; null pour plusieurs, toutes ou aucune', runwayOf({
    runways: ['RW07']
  }) === '07' && runwayOf({
    runways: ['14L', '14L']
  }) === '14L' && runwayOf({
    runways: ['07', '25']
  }) === null && runwayOf({
    runways: ['ALL']
  }) === null && runwayOf({
    runways: []
  }) === null && runwayOf(null) === null);
  const fa = {
      id: 'A',
      runways: ['25']
    },
    fb = {
      id: 'B',
      runways: ['07']
    },
    fc = {
      id: 'C',
      runways: ['07']
    };
  ck('firstServing : la première du groupe qui dessert la piste ; null sinon ; sans piste, la première', firstServing([fa, fb, fc], '07')
    ?.id === 'B' && firstServing([fa, fb], 'RW25')?.id === 'A' && firstServing([fa, fb], '14') === null && firstServing([fa, fb], '')
    ?.id ===
    'A' && firstServing(null, '07') === null);
  // seconde lecture du § 10.30 : familles, compatibilité, résumé (données inventées)
  const qIdsOf = l => l.map(r => r.id).join();
  const qP = (kind, name, runways, transition = null, id = null) => ({
      id: id || `LFVX.${kind}.${name}.RW${runways.length === 1 ? runways[0] : 'ALL'}.${transition || 'NONE'}`,
      kind,
      name,
      runways,
      transition
    }),
    qS4l = qP('STAR', 'ABLI4L', ['28L']),
    qS4r = qP('STAR', 'ABLI4R', ['28R']),
    qS4lt = qP('STAR', 'ABLI4L', [], 'ABLIN'),
    qS2a = qP('STAR', 'MOLU2A', ['10L', '10R']),
    qS5x = qP('STAR', 'OKRIX5X', ['28L']),
    qSAll = qP('STAR', 'TOTO1B', []),
    qI28l = qP('APP', 'ILS28L', ['28L']),
    qI28lt = qP('APP', 'ILS28L', ['28L'], 'PIZSA'),
    qI10r = qP('APP', 'ILS10R', ['10R']),
    qD1 = qP('SID', 'ABLI4L', ['28L']),
    qStars = [qS4l, qS4r, qS4lt, qS2a, qS5x, qSAll],
    qById = new Map([...qStars, qI28l, qI28lt, qI10r, qD1].map(r => [r.id, r])),
    qIds = l => l.map(r => typeof r === 'string' ? r : r.id || r.name).join();
  ck('familyOf : lettres, un chiffre, une lettre ; rien d’autre', JSON.stringify(familyOf('abli4l')) ===
    '{"family":"ABLI4","suffix":"L"}' &&
    familyOf('ILS28L') === null && familyOf('NTS') === null && familyOf('') === null && familyOf(null) === null);
  ck('siblingsOf : même radical et chiffre, au moins deux suffixes, sans transition, même sorte', qIds(siblingsOf(qStars, qS4l)) === qIds([
    qS4l,
    qS4r
  ]) && siblingsOf([...qStars, qD1], qS4r).every(r => r.kind === 'STAR'));
  ck('siblingsOf : une forme seule n’est pas une famille (jamais de devinette)', siblingsOf(qStars, qS5x).length === 0 && siblingsOf(qStars,
    qS2a).length === 0 && siblingsOf(qStars, qP('STAR', 'NTS', ['03'])).length === 0);
  const qRowsF = familiesOf(qStars);
  ck('familiesOf : ABLI4L et ABLI4R en une ligne ABLI4 avec ses pistes ; les autres seules, dans l’ordre', qRowsF.map(r => `${r.name}:${r
    .runways.join('/')}`)
    .join() === 'ABLI4:28L/28R,MOLU2A:10L/10R,OKRIX5X:28L,TOTO1B:', qRowsF.map(r => `${r.name}:${r.runways.join('/')}`)
    .join());
  const qRwys = ['10L', '10R', '28L', '28R'];
  ck('compatible : sans choix, tout', qIds(compatible(qStars, {})) === qIds(qStars) && qIds(compatible(qRwys, null)) === qIds(qRwys));
  ck('compatible : piste → STAR qui la desservent (et celles qui les desservent toutes), approches vers elle', qIds(compatible([qS4l, qS4r,
    qS2a,
    qSAll
  ], {
    rwy: '28L'
  })) === qIds([qS4l, qSAll]) && qIds(compatible([qI28l, qI10r], {
    rwy: 'RW28L'
  })) === qIds([qI28l]));
  ck('compatible : STAR → pistes qu’elle dessert, approches qu’elle rejoint', qIds(compatible(qRwys, {
    star: qS2a.id
  }, qById)) === '10L,10R' && qIds(compatible([qI28l, qI10r], {
    star: qS2a
  })) === qIds([qI10r]));
  ck('compatible : approche → sa piste, STAR qui la rejoignent', qIds(compatible(qRwys.map(id => ({
    id
  })), {
    app: qI28l.id
  }, qById)) === '28L' && qIds(compatible([qS4l, qS4r, qS2a, qSAll], {
    app: qI28l
  })) === qIds([qS4l, qSAll]));
  ck('compatible : une famille choisie avant sa piste (tableau) → ses pistes', qIds(compatible(qRwys, {
    star: [qS4l, qS4r]
  })) === '28L,28R');
  ck('compatible : SID → ses pistes ; trois choix croisés', qIds(compatible(qRwys, {
    sid: qD1
  })) === '28L' && qIds(compatible([qI28l, qI10r], {
    rwy: '28L',
    star: qS4l
  })) === qIds([qI28l]));
  ck('compatible : absent, null (« Aucune ») ou introuvable ne filtre pas', qIds(compatible(qRwys, {
    star: null,
    app: 'LFVX.APP.NOPE.RW01.NONE'
  }, qById)) === qIds(qRwys));
  const qSum = summaryOf({
    rwy: '28L',
    star: qS4l.id,
    trans: qS4lt.id,
    app: qI28l.id,
    appTrans: qI28lt.id
  }, {
    byId: qById,
    wind: {
      head: 12,
      cross: 6,
      side: 'L'
    }
  });
  ck('summaryOf : « 28L · ↓ 12 kt · → 6 kt », « ABLI4L via ABLIN », « ILS28L via PIZSA »', qSum.rwy === '28L · ↓ 12 kt · → 6 kt' && qSum
    .proc === 'ABLI4L via ABLIN' && qSum.app === 'ILS28L via PIZSA', JSON.stringify(qSum));
  const qSum2 = summaryOf({
    rwy: '10R',
    sid: null,
    app: 'LFVX.APP.VOR10.RW10R.NONE',
    appTrans: null
  });
  ck('summaryOf : sans vent la piste seule ; « Aucune » = null ; sans fiche, le nom de l’identifiant ; rien de choisi = undefined',
    qSum2.rwy === '10R' && qSum2.proc === null && qSum2.app === 'VOR10' && JSON.stringify(summaryOf({})) === '{}' && summaryOf(null)
    .rwy === undefined, JSON.stringify(qSum2));
  // quatrième lecture du § 10.30 : la forme des fiches du SIA (segments d'approche initiale « INA RNAV RWY nn » portant la transition,
  // finales « ILS CAT I or CAT II or CAT III RWY nn », « RNP RWY nn ») ; terrain, points et noms inventés
  const A = (name, rwy, pts, transition = null) => ({
      id: `LFVZ.APP.${name.replace(/\W/g, '')}.RW${rwy}${transition ? '.' + transition.replace(/\W/g, '') : ''}`,
      kind: 'APP',
      name,
      runways: [rwy],
      transition,
      points: pts.map((id, i) => ({
        seq: i + 1,
        id,
        phase: id.startsWith('M') ? 'missed' : undefined
      }))
    }),
    zIls = A('ILS CAT I or CAT II or CAT III RWY 06', '06', ['IZZ06', 'RW06', 'MZ1']),
    zRnp = A('RNP RWY 06', '06', ['IZZ06', 'FZZ06', 'RW06', 'MZ1']),
    zLoc = A('ILS CAT I or CAT II and CAT III or LOC RWY 07', '07', ['RW07', 'MZ2']),
    zT1 = A('INA RNAV RWY 06', '06', ['OKAPI', 'ZP609', 'IZZ06'], 'OKAPI 1A'),
    zT2 = A('INA RNAV RWY 06', '06', ['BISON', 'ZP617', ''], 'BISON 1E'),
    zT3 = A('INA RNAV RWY 06', '06', ['ALPAG', 'ZP621', ''], 'ALPAG 1E'),
    zT7 = A('INA RNAV RWY 07', '07', ['BISON', 'ZP617', ''], 'BISON 1E'),
    zEnt = A('RNP RWY 20', '20', ['ZP421', 'IZZ20', 'RW20'], 'ZP421'),
    zApps = [zIls, zRnp, zT1, zT2, zT3, zLoc, zT7, zEnt],
    zAc = appChoices(zApps);
  ck('isAppTransition : « INA … », ou une transition qui n’atteint pas la piste ; jamais une finale', isAppTransition(zT1) &&
    isAppTransition(
      zT2) && !isAppTransition(zIls) && !isAppTransition(zEnt) && isAppTransition(A('VOR RWY 09', '09', ['VZ1', 'VZ2'], 'VZ1')) &&
    !isAppTransition({
      ...zT1,
      kind: 'STAR'
    }));
  ck('appChoices : les segments INA ne sont jamais des lignes (plus six lignes identiques)', qIdsOf(zAc.list) === qIdsOf([zIls, zRnp, zLoc,
    zEnt
  ]), qIdsOf(zAc.list));
  ck('appChoices : les segments de la piste appartiennent à TOUTES ses finales, triés par IAF', qIdsOf(zAc.transitionsOf(zIls.id)) ===
    qIdsOf([zT3, zT2, zT1]) && qIdsOf(zAc.transitionsOf(zRnp.id)) === qIdsOf([zT3, zT2, zT1]) && qIdsOf(zAc.transitionsOf(zLoc.id)) ===
    qIdsOf([zT7]), qIdsOf(zAc.transitionsOf(zIls.id)));
  ck('labelOf : type et piste seulement, sans catégories ni « RWY » ; un autre nom tel quel', labelOf(zIls, zAc.list) === 'ILS 06' &&
    labelOf(zRnp, zAc.list) === 'RNP 06' && labelOf(zLoc, zAc.list) === 'ILS 07' && labelOf(zEnt, zAc.list) === 'RNP 20' && labelOf({
      id: 'X',
      name: 'I13R'
    }) === 'I13R', [zIls, zRnp, zLoc, zEnt].map(r => labelOf(r, zAc.list)).join());
  const zY = A('RNP Y RWY 06', '06', ['IZZ06', 'RW06']),
    zZ = A('RNP Z RWY 06', '06', ['IZY06', 'RW06']),
    zDup = A('RNP RWY 06', '06', ['IZX06', 'RW06'], null);
  zDup.id += '.BIS';
  ck('labelOf : deux finales de même type et piste gardent la lettre ; jamais deux libellés identiques (le premier point s’ajoute)',
    labelOf(zY, [zY, zZ]) === 'RNP Y 06' && labelOf(zZ, [zY, zZ]) === 'RNP Z 06' && labelOf(zRnp, [zRnp, zDup]) === 'RNP 06 · IZZ06' &&
    labelOf(zDup, [zRnp, zDup]) === 'RNP 06 · IZX06' && labelOf(zY, [zY]) === 'RNP 06');
  ck('transitionLabelOf : « via OKAPI 1A » quand le nom commence par l’IAF ; « via ZP421 » quand le nom est l’IAF', transitionLabelOf(
      zT1) ===
    'via OKAPI 1A' && transitionLabelOf(zEnt) === 'via ZP421', transitionLabelOf(zT1));
  const zSum = summaryOf({
    rwy: '06',
    app: zIls.id,
    appTrans: zT1.id
  }, {
    byId: new Map(zApps.map(r => [r.id, r]))
  });
  ck('summaryOf : la finale par son libellé court, via le nom publié de la transition', zSum.app === 'ILS 06 via OKAPI 1A', JSON.stringify(
    zSum));
  // § 10.31 : sortie, entrée, axe « vers votre route »
  const rS1 = {
      id: 'S1',
      kind: 'SID',
      runways: ['32L'],
      points: [{
        id: 'RW32L'
      }, {
        id: 'TOU01'
      }, {
        id: 'LACOU'
      }]
    },
    rS2 = {
      id: 'S2',
      kind: 'SID',
      runways: ['32L'],
      points: [{
        id: 'FINOT'
      }]
    },
    rT1 = {
      id: 'T1',
      kind: 'STAR',
      runways: [],
      points: [{
        id: 'OKRIX'
      }, {
        id: 'PO401'
      }, {
        id: 'M1',
        phase: 'missed'
      }]
    };
  ck('exitOf / entryOf : le dernier et le premier point nommé, hors seuil et interrompue', exitOf(rS1) === 'LACOU' && entryOf(rT1) ===
    'OKRIX' && exitOf({
      points: []
    }) === null);
  ck('compatible : axe « vers votre route » — les SID dont la sortie est sur la route, les STAR dont l’entrée y est ; route vide : rien',
    qIdsOf(compatible([rS1, rS2], {
      route: ['LACOU', 'LMG']
    })) === 'S1' && qIdsOf(compatible([rT1], {
      route: ['LMG']
    })) === '' && qIdsOf(compatible([rS1, rS2], {
      route: []
    })) === 'S1,S2');
  // une transition d'approche avec une STAR : son IAF est sur la STAR (sa fin comprise), sinon pas proposée
  const sT = {
      id: 'ST',
      kind: 'STAR',
      runways: [],
      points: [{
        id: 'OKAPI'
      }, {
        id: 'BISON'
      }]
    },
    tOk = {
      id: 'TA',
      kind: 'APP',
      name: 'INA RNAV RWY 06',
      transition: 'BISON 1E',
      runways: ['06'],
      points: [{
        id: 'BISON'
      }, {
        id: 'ZP617'
      }]
    },
    tNo = {
      ...tOk,
      id: 'TB',
      transition: 'ALPAG 1E',
      points: [{
        id: 'ALPAG'
      }, {
        id: 'ZP621'
      }]
    };
  ck('compatible : une transition d’approche va avec une STAR quand son IAF est sur la STAR (sa fin comprise), sinon non', qIdsOf(
    compatible(
      [tOk, tNo], {
        star: sT
      })) === 'TA' && qIdsOf(compatible([tOk, tNo], {})) === 'TA,TB');
  // même nom, une fiche par piste (« AMB 9E » de 02, 06 et 07 à LFPO) : une famille, une ligne, ses pistes en étiquettes
  const amb = rw => ({
      id: `AMB9E.${rw}`,
      kind: 'STAR',
      name: 'AMB 9E',
      runways: [rw],
      points: [{
        id: 'AMB'
      }]
    }),
    ambs = [amb('02'), amb('06'), amb('07')],
    ambRows = familiesOf([...ambs, qS5x]);
  ck('siblingsOf / familiesOf : des fiches de même nom pour des pistes différentes font une famille, une ligne', qIdsOf(siblingsOf(ambs,
      ambs[0])) === qIdsOf(ambs) && ambRows.length === 2 && ambRows[0].name === 'AMB 9E' && ambRows[0].runways.join() === '02,06,07' &&
    siblingsOf([amb('02'), {
      ...amb('02'),
      id: 'DUP'
    }], amb('02')).length === 0, JSON.stringify(ambRows.map(r => [r.name, r.runways])));
  ck('arincApp : déjà ARINC tel quel ; ILS → I, RNP → R, LOC → L, VOR/DME → D, la lettre après un tiret ; rien sinon', arincApp({
    name: 'I13R'
  }) === 'I13R' && arincApp({
    name: 'ILS CAT I or CAT II or CAT III RWY 02'
  }) === 'I02' && arincApp({
    name: 'RNP Y RWY 06'
  }) === 'R06-Y' && arincApp({
    name: 'ILS CAT I or CAT II and CAT III or LOC RWY 07'
  }) === 'I07' && arincApp({
    name: 'VOR/DME RWY 24'
  }) === 'D24' && arincApp({
    name: 'LOC RWY 25'
  }) === 'L25' && arincApp({
    name: 'VISUAL RWY 25'
  }) === '' && arincApp({
    name: 'Circling'
  }) === '', [arincApp({
    name: 'RNP Y RWY 06'
  }), arincApp({
    name: 'VOR/DME RWY 24'
  })].join());
  ck('runwayChoices : rien de rien, rien', runwayChoices([], [], null).length === 0 && runwayChoices(null, null, {}).length === 0);

  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
