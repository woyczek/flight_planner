<!doctype html>
<!-- Banc du vol dans le temps (frame/lib/current_flight.js, modules/maps/SPEC.md § 13) : vol démarré, heure de référence,
     horaire (quote.legs, roulage, repli sur la route et le devis), heures estimées et position prévue, ligne de
     changement de date. Page nue, aucun module du cadre ; window.__cfBench = { done, pass, fail, rows } pour un pilote
     (Playwright). Ouvrir la page suffit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>current_flight — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">current_flight.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import {
    isStarted,
    refTime,
    legTimes,
    etaOf,
    plannedPositionAt,
    TAXI_MIN,
    proceduresOf,
    loadProcedures,
    expandedPath,
    flownPath,
    routingChain,
    altitudeAt,
    routeNmToFlown,
    conflictsOf,
    orderProcedures,
    routeMidpoint
  } from '../current_flight.js?v=0';

  const rows = [],
    out = document.getElementById('out');
  const near = (a, b, e = 1e-6) => Math.abs(a - b) <= e;
  const ck = (name, ok, detail = '') => {
    rows.push({
      name,
      ok: !!ok,
      detail
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}`;
    out.append(l);
  };
  const T0 = Date.parse('2030-01-01T10:00:00Z'),
    min = m => T0 + m * 60e3,
    pts = [{
      id: 'LFRS',
      lat: 47.1569,
      lon: -1.6078
    }, {
      id: 'LUGEN',
      lat: 46.5833,
      lon: -1.2
    }, {
      id: 'LFML',
      lat: 43.4367,
      lon: 5.215
    }],
    flight = (o = {}) => ({
      route: {
        points: pts
      },
      planned_at: '2030-01-01T10:00:00Z',
      quote: {
        minutes: 80,
        legs: [{
          id: 'LFRS',
          min: 0
        }, {
          id: 'LUGEN',
          min: 12
        }, {
          id: 'LFML',
          min: 80
        }],
        taxiMin: 15
      },
      profile: {
        tocNm: 48.2,
        todNm: 56.1,
        climbKt: 196,
        descentKt: 253
      },
      ...o
    });

  // vol démarré : started.at, jamais la présence de progress
  ck('isStarted : started.at posé', isStarted({
    started: {
      at: '2030-01-01T10:00:00Z'
    }
  }));
  ck('isStarted : started sans at → faux', !isStarted({
    started: {}
  }));
  ck('isStarted : progress présent, started null → faux', !isStarted({
    started: null,
    progress: {
      plannedPos: {
        lat: 1,
        lon: 1
      }
    }
  }));

  // heure de référence
  ck('refTime : planned_at', refTime(flight()) === T0);
  ck('refTime : started.at l\'emporte sur planned_at', refTime(flight({
    started: {
      at: '2030-01-01T11:00:00Z'
    }
  })) === min(60));
  ck('refTime : ni l\'un ni l\'autre → null', refTime(flight({
    planned_at: null
  })) === null);

  // horaire : quote.legs et roulage
  const L = legTimes(flight());
  ck('legTimes : minutes de quote.legs', JSON.stringify(L?.min) === '[0,12,80]', JSON.stringify(L?.min));
  ck('legTimes : roulage de quote.taxiMin', L?.taxi === 15);
  ck(`legTimes : roulage par défaut ${TAXI_MIN} min`, legTimes(flight({
    quote: {
      minutes: 80,
      legs: [{
        min: 0
      }, {
        min: 12
      }, {
        min: 80
      }]
    }
  }))?.taxi === TAXI_MIN);
  ck('legTimes : quote.legs dans un autre ordre, lus par leur nom', JSON.stringify(legTimes(flight({
    quote: {
      minutes: 80,
      legs: [{
        id: 'LFML',
        min: 80
      }, {
        id: 'LFRS',
        min: 0
      }, {
        id: 'LUGEN',
        min: 12
      }]
    }
  }))?.min) === '[0,12,80]');
  ck('legTimes : sans devis → null', legTimes(flight({
    quote: null
  })) === null);
  ck('legTimes : un seul point → null', legTimes(flight({
    route: {
      points: [pts[0]]
    }
  })) === null);

  // repli : sans quote.legs, la route et le devis
  const R = legTimes(flight({
    quote: {
      minutes: 80
    }
  }));
  ck('repli : arrivée au temps du devis (± 2 min)', R && Math.abs(R.total - 80) <= 2, String(R?.total));
  ck('repli : minutes croissantes', R && R.min.every((v, i) => !i || v > R.min[i - 1]), JSON.stringify(R?.min));
  ck('repli : départ à 0', R?.min[0] === 0);
  ck('repli : sans profil, une seule vitesse (temps proportionnel à la distance)', (() => {
    const U = legTimes(flight({
      quote: {
        minutes: 80
      },
      profile: null
    }));
    return U && near(U.min[1] / U.total, U.cum[1] / U.D, 1e-9);
  })());
  ck('repli : sans quote.minutes → null', legTimes(flight({
    quote: {
      block: 4000
    }
  })) === null);

  // heures estimées
  const E = etaOf(flight(), T0);
  ck('etaOf : départ = référence + roulage', E?.[0].at === new Date(min(15)).toISOString(), E?.[0].at);
  ck('etaOf : arrivée = référence + roulage + 80 min', E?.[2].at === new Date(min(95)).toISOString(), E?.[2].at);
  ck('etaOf : identifiants des points', E?.map(e => e.id).join() === 'LFRS,LUGEN,LFML');
  ck('etaOf : vol non démarré, arrivée passée → null', etaOf(flight(), min(200)) === null);
  ck('etaOf : vol démarré, arrivée passée → gardées', etaOf(flight({
    started: {
      at: '2030-01-01T10:00:00Z'
    }
  }), min(200))?.length === 3);
  ck('etaOf : sans référence → null', etaOf(flight({
    planned_at: null
  }), T0) === null);

  // position prévue
  const f = flight({
    started: {
      at: '2030-01-01T10:00:00Z'
    }
  });
  ck('plannedPositionAt : avant la mise en route → null', plannedPositionAt(f, min(-1)) === null);
  const tx = plannedPositionAt(f, min(5));
  ck('plannedPositionAt : roulage au départ', tx?.phase === 'taxi' && tx.lat === pts[0].lat && near(tx.lon, pts[0].lon) && tx.nmFromDep ===
    0, JSON.stringify(tx));
  const mid = plannedPositionAt(f, min(15 + 6));
  // distance orthodromique (NM), pour vérifier les positions sur le grand cercle
  const gc = (a, b) => {
    const r = Math.PI / 180,
      d = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lon - a.lon) * r / 2) ** 2;
    return 2 * 3440.065 * Math.asin(Math.min(1, Math.sqrt(d)));
  };
  ck('plannedPositionAt : à mi-temps du premier tronçon, à mi-chemin sur le grand cercle', mid && mid.legIndex === 0 && near(gc(pts[0],
      mid),
    gc(mid, pts[1]), .05) && near(gc(pts[0], mid) + gc(mid, pts[1]), gc(pts[0], pts[1]), .05), JSON.stringify(mid));
  ck('plannedPositionAt : en montée avant tocNm', mid?.phase === 'climb');
  const cr = plannedPositionAt(f, min(15 + 40));
  ck('plannedPositionAt : croisière au milieu', cr?.phase === 'cruise' && cr.legIndex === 1, JSON.stringify(cr));
  const ar = plannedPositionAt(f, min(15 + 81));
  ck('plannedPositionAt : arrivé', ar?.phase === 'arrived' && ar.lat === pts[2].lat, JSON.stringify(ar));
  ck('plannedPositionAt : distance prévue croissante', mid.nmFromDep < cr.nmFromDep && cr.nmFromDep < ar.nmFromDep);
  ck('plannedPositionAt : vol non démarré dont l’arrivée est passée → null (comme etaOf)', plannedPositionAt(flight(), min(200)) === null);
  ck('plannedPositionAt : vol daté pas encore arrivé → une position', plannedPositionAt(flight(), min(15 + 40))?.phase === 'cruise');

  // lectures strictes : un texte n'est pas une minute
  ck('taxiMin en texte : ignoré (10 min)', legTimes(flight({
    quote: {
      minutes: 80,
      taxiMin: '15',
      legs: [{
        min: 0
      }, {
        min: 12
      }, {
        min: 80
      }]
    }
  }))?.taxi === TAXI_MIN);
  const strict = legTimes(flight({
    quote: {
      minutes: 80,
      legs: [{
        id: 'LFRS',
        min: 0
      }, {
        id: 'LUGEN',
        min: '12'
      }, {
        id: 'LFML',
        min: 80
      }]
    }
  }));
  ck('legs[].min en texte : quote.legs écarté, repli sur la route', strict && strict.min[1] !== 12 && near(strict.total, 80, 2),
    JSON.stringify(
      strict?.min));

  // branche océanique : la position suit le grand cercle (au nord de la droite des latitudes)
  const ocean = {
      route: {
        points: [{
          id: 'KJFK',
          lat: 40.64,
          lon: -73.78
        }, {
          id: 'EGLL',
          lat: 51.47,
          lon: -0.45
        }]
      },
      started: {
        at: '2030-01-01T10:00:00Z'
      },
      quote: {
        minutes: 400,
        taxiMin: 0
      }
    },
    op = plannedPositionAt(ocean, min(200));
  ck('océan : à mi-temps, sur le grand cercle (plus de 52° N, la droite donnerait 46° N)',
    op && op.lat > 52, JSON.stringify(op));
  ck('océan : à mi-chemin des deux terrains (± 1 NM)', op && near(gc({
    lat: 40.64,
    lon: -73.78
  }, op), gc(op, {
    lat: 51.47,
    lon: -0.45
  }), 1), JSON.stringify(op));

  // ligne de changement de date : UHMA → PAOM
  const dl = {
      route: {
        points: [{
          id: 'UHMA',
          lat: 64.7349,
          lon: 177.7414
        }, {
          id: 'PAOM',
          lat: 64.5122,
          lon: -165.4453
        }]
      },
      started: {
        at: '2030-01-01T10:00:00Z'
      },
      quote: {
        minutes: 100,
        taxiMin: 0
      }
    },
    DL = legTimes(dl);
  ck('date : distance du grand cercle (≈ 434 NM, pas le tour du monde)', DL && DL.D > 400 && DL.D < 470, String(DL
    ?.D));
  const dp = plannedPositionAt(dl, min(50));
  ck('date : position à mi-temps au-delà de 180° rendue dans [-180, 180[', dp && dp.lon >= -
    180 && dp.lon < 180 && (dp.lon > 175 || dp
      .lon < -170), JSON.stringify(dp));

  // ---- route et procédures choisies (V3_SPECIFICATION § 10.20)
  const RT = {
    dep: 'LFBD',
    arr: 'LFPO',
    points: [{
      id: 'LFBD',
      lat: 44.83,
      lon: -0.72,
      alt_ft: 0
    }, {
      id: 'AAA',
      lat: 45.3,
      lon: -0.5,
      alt_ft: 9000,
      wind: '270/20',
      via: 'UN1'
    }, {
      id: 'BBB',
      lat: 46.5,
      lon: 0.5,
      alt_ft: 25000
    }, {
      id: 'CCC',
      lat: 48.2,
      lon: 2.0,
      alt_ft: 9000
    }, {
      id: 'LFPO',
      lat: 48.72,
      lon: 2.38,
      alt_ft: 0
    }]
  };
  const fl = procedures => ({
    route: {
      ...RT,
      procedures
    }
  });
  ck('proceduresOf : rien → côtés vides', JSON.stringify(proceduresOf(fl())) === '{"dep":{},"arr":{},"by":null,"at":null}');
  const pv2 = proceduresOf(fl({
    dep: {
      rwy: '23',
      sid: 'LFBD.SID.S1.RW23.NONE'
    },
    arr: null,
    by: 'fuel'
  }));
  ck('proceduresOf : v2 lu, « aucune » gardée (null)', pv2.dep.sid === 'LFBD.SID.S1.RW23.NONE' && pv2.arr === null && pv2.by === 'fuel');
  const pst = proceduresOf(fl({
    dep: {
      sid: 'LFBO.SID.X.RW32.NONE'
    },
    arr: {
      star: 'LFPO.STAR.Y.RW24.NONE'
    }
  }));
  ck('proceduresOf : côté d’un autre aérodrome → {} (pas choisi)', JSON.stringify(pst.dep) === '{}' && pst.arr.star ===
    'LFPO.STAR.Y.RW24.NONE');
  const pv1 = proceduresOf(fl({
    sid: {
      id: 'LFBD.SID.S1.RW23.NONE',
      runways: ['23']
    },
    star: {
      id: 'LFPO.STAR.Y.ALL.NONE',
      runways: ['24', '25']
    }
  }));
  ck('proceduresOf : v1 → v2, piste seulement si une seule', pv1.dep.sid === 'LFBD.SID.S1.RW23.NONE' && pv1.dep.rwy === '23' && pv1.arr
    .star ===
    'LFPO.STAR.Y.ALL.NONE' && !('rwy' in pv1.arr));

  const SID = {
    id: 'LFBD.SID.S1.RW23.NONE',
    icao: 'LFBD',
    kind: 'SID',
    points: [{
      seq: 1,
      id: null,
      lat: null,
      lon: null,
      leg: 'VA',
      crs: 230,
      alt: {
        type: 'min',
        ft: 1500
      },
      phase: 'main'
    }, {
      seq: 2,
      id: 'S01',
      lat: 44.95,
      lon: -0.70,
      alt: {
        type: 'min',
        ft: 3000
      },
      kt: 220,
      phase: 'main'
    }, {
      seq: 3,
      id: 'AAA',
      lat: 45.3,
      lon: -0.5,
      alt: {
        type: 'at',
        ft: 6000
      },
      nm: 21,
      phase: 'main'
    }]
  };
  const STAR = {
    id: 'LFPO.STAR.Y.RW24.NONE',
    icao: 'LFPO',
    kind: 'STAR',
    points: [{
      seq: 1,
      id: 'CCC',
      lat: 48.2,
      lon: 2.0,
      alt: {
        type: 'between',
        ft: 7000,
        ft2: 9000
      },
      phase: 'main'
    }, {
      seq: 2,
      id: 'S02',
      lat: 48.5,
      lon: 2.2,
      alt: {
        type: 'max',
        ft: 5000
      },
      kt: 220,
      phase: 'main'
    }]
  };
  const APP = {
    id: 'LFPO.APP.I24.RW24.NONE',
    icao: 'LFPO',
    kind: 'APP',
    points: [{
      seq: 1,
      id: 'S02',
      lat: 48.5,
      lon: 2.2,
      alt: {
        type: 'at',
        ft: 4000
      },
      phase: 'main'
    }, {
      seq: 2,
      id: 'FAF',
      lat: 48.65,
      lon: 2.3,
      alt: {
        type: 'at',
        ft: 2000
      },
      phase: 'main'
    }, {
      seq: 3,
      id: 'MAP1',
      lat: 48.8,
      lon: 2.5,
      alt: {
        type: 'min',
        ft: 3000
      },
      phase: 'missed'
    }]
  };
  const fakeDb = {
    procedure: id => ({
      [SID.id]: SID,
      [STAR.id]: STAR,
      [APP.id]: APP
    })[id] || null,
    runways: icao => icao === 'LFBD' ? [{
      id: '23',
      lat: 44.84,
      lon: -0.71,
      elev: 160,
      qfu: 230
    }] : [{
      id: '24',
      lat: 48.71,
      lon: 2.37,
      elev: 290
    }]
  };
  const FV = fl({
    dep: {
      rwy: '23',
      sid: SID.id
    },
    arr: {
      rwy: '24',
      star: STAR.id,
      app: APP.id
    }
  });
  const LP = await loadProcedures(fakeDb, FV);
  ck('loadProcedures : enregistrements et pistes', LP.sid === SID && LP.star === STAR && LP.app === APP && LP.depRwy?.id === '23' && LP
    .arrRwy?.id ===
    '24' && LP.sidTrans === null);
  const XP = expandedPath(FV, LP),
    ids = XP.map(p => p.id || '·').join(' ');
  ck('expandedPath : raccords sur le premier point commun, aucun point deux fois', ids ===
    'LFBD RW23 · S01 AAA BBB CCC S02 FAF RW24 LFPO MAP1', ids);
  ck('expandedPath : étiquettes', XP.map(p => p.origin[0]).join('') === 'rsssrrraaarm', XP.map(p => p.origin).join(','));
  const aaa = XP.find(p => p.id === 'AAA'),
    s02 = XP.find(p => p.id === 'S02');
  ck('expandedPath : le point commun garde ses champs de route et prend la contrainte', aaa.origin === 'route' && aaa.alt_ft === 9000 && aaa
    .wind ===
    '270/20' && aaa.alt?.type === 'at' && aaa.alt.ft === 6000 && aaa.legNm === 21 && !('nm' in aaa));
  ck('expandedPath : STAR puis approche, point partagé une fois avec la contrainte de l’approche', s02.origin === 'app' && s02.alt.ft ===
    4000 &&
    s02.kt === 220, JSON.stringify(s02));
  ck('expandedPath : tronçon sans point gardé, sans position', XP[2].lat === null && XP[2].leg === 'VA' && XP[2].alt.ft === 1500);
  const FP = flownPath(XP);
  ck('flownPath : ni tronçon sans point ni approche interrompue', FP.map(p => p.id).join(' ') ===
    'LFBD RW23 S01 AAA BBB CCC S02 FAF RW24 LFPO');
  ck('flownPath : nm cumulés croissants depuis 0', FP[0].nm === 0 && FP.every((p, i) => !i || p.nm > FP[i - 1].nm), FP.map(p => p.nm
      .toFixed(1))
    .join(' '));
  const XN = expandedPath(fl({}), {});
  ck('expandedPath : sans procédure = la route', XN.map(p => p.id).join(' ') === 'LFBD AAA BBB CCC LFPO' && XN.every(p => p.origin ===
    'route'));
  const XO = expandedPath(fl({}), {
    sid: {
      ...SID,
      icao: 'LFBO'
    }
  });
  ck('expandedPath : procédure d’un autre aérodrome ignorée', XO.length === 5);
  const SIDX = {
      ...SID,
      points: [{
        seq: 1,
        id: 'S09',
        lat: 45.0,
        lon: -0.9,
        phase: 'main'
      }]
    },
    XD = expandedPath(fl({}), {
      sid: SIDX
    });
  ck('expandedPath : sans point commun, la route reprend à route[1] après la SID', XD.map(p => p.id).join(' ') ===
    'LFBD S09 AAA BBB CCC LFPO');
  const XW = expandedPath({
    route: {
      points: [{
        id: 'A',
        lat: 0,
        lon: 179
      }, {
        id: 'B',
        lat: 0,
        lon: 181
      }]
    }
  }, {});
  ck('expandedPath : longitudes dans [-180, 180[', XW[1].lon === -179);
  // horaire sur le chemin : quote.legs suit flownPath ; sans path, seuls les legs de la route
  const legs = FP.map((p, i) => ({
    id: p.id,
    min: i * 5,
    origin: p.origin
  }));
  const FQ = {
    ...FV,
    planned_at: '2030-01-01T10:00:00Z',
    quote: {
      minutes: 45,
      taxiMin: 0,
      legs
    }
  };
  const TP = legTimes(FQ, {
      path: FP
    }),
    TR = legTimes(FQ);
  ck('legTimes { path } : distances de flownPath et minutes du devis', TP && TP.pts.length === 10 && TP.cum[3] === FP[3].nm && TP.min[9] ===
    45);
  ck('legTimes sans path : les legs origin route seulement, dans l’ordre', TR && TR.pts.length === 5 && TR.min.join(',') ===
    '0,15,20,25,45', TR?.min
    .join(','));
  const FQ0 = {
    ...FQ,
    quote: {
      ...FQ.quote,
      legs: RT.points.map((p, i) => ({
        id: p.id,
        min: i * 10
      }))
    }
  };
  ck('legTimes : un leg sans origin compte pour la route', legTimes(FQ0)?.min.join(',') === '0,10,20,30,40');

  // transition d'approche qui va au-delà du point commun (elle reprend IF et FAF de l'approche) : la jonction se fait au
  // premier point de l'approche, la fin propre de la transition n'est pas volée, aucun tronçon deux fois
  const TR2 = {
    id: 'LFPO.APP.T.RW24.T1',
    icao: 'LFPO',
    kind: 'APP',
    transition: 'T1',
    points: [{
      seq: 1,
      id: 'T1',
      lat: 48.5,
      lon: 1.9
    }, {
      seq: 2,
      id: 'IF1',
      lat: 48.6,
      lon: 2.1
    }, {
      seq: 3,
      id: 'FAF1',
      lat: 48.66,
      lon: 2.25
    }]
  };
  const AP2 = {
    id: 'LFPO.APP.T.RW24.IF1',
    icao: 'LFPO',
    kind: 'APP',
    points: [{
      seq: 1,
      id: 'IF1',
      lat: 48.6,
      lon: 2.1,
      alt: {
        type: 'at',
        ft: 3000
      }
    }, {
      seq: 2,
      id: 'FAF1',
      lat: 48.66,
      lon: 2.25
    }, {
      seq: 3,
      id: 'M1',
      lat: 48.8,
      lon: 2.5,
      phase: 'missed'
    }]
  };
  const XT = expandedPath(fl({}), {
      appTrans: TR2,
      app: AP2
    }),
    FT = flownPath(XT),
    idsT = FT.map(p => p.id).join(' ');
  ck('expandedPath : transition au-delà du point commun, aucun tronçon deux fois', idsT === 'LFBD AAA BBB CCC T1 IF1 FAF1 LFPO', idsT);
  ck('expandedPath : le point de jonction prend les contraintes de l’approche', FT.find(p => p.id === 'IF1')?.alt?.ft === 3000);
  // § 10.30, quatrième lecture : jonction au PREMIER point commun, où qu'il soit dans la finale ; sans point commun, un direct en tireté
  const inaTr = (id, pts) => ({
      id: `LFPO.APP.INARNAVRWY24.RW24.${id}`,
      icao: 'LFPO',
      kind: 'APP',
      name: 'INA RNAV RWY 24',
      transition: id,
      points: pts.map(([pid, lat, lon], i) => ({
        seq: i + 1,
        id: pid,
        lat,
        lon
      }))
    }),
    inaXF = flownPath(expandedPath(fl({}), {
      appTrans: inaTr('X1', [
        ['X1', 48.4, 1.7],
        ['X2', 48.5, 1.9],
        ['FAF1', 48.66, 2.25]
      ]),
      app: AP2
    })).map(p => p.id).join(' ');
  ck('expandedPath : transition qui rejoint la finale à son FAF (pas à son premier point) : coupée là, l’IF de la finale écarté', inaXF ===
    'LFBD AAA BBB CCC X1 X2 FAF1 LFPO', inaXF);
  const inaXG = expandedPath(fl({}), {
      appTrans: inaTr('Y1', [
        ['Y1', 48.4, 1.7],
        ['Y2', 48.5, 1.9],
        ['', null, null]
      ]),
      app: AP2
    }),
    inaIds = flownPath(inaXG).map(p => p.id).join(' ');
  ck('expandedPath : transition sans point commun avec la finale : la finale entière, son premier point en join direct (tireté)', inaIds ===
    'LFBD AAA BBB CCC Y1 Y2 IF1 FAF1 LFPO' && inaXG.find(p => p.id === 'IF1')?.join === 'direct', `${inaIds} / ${inaXG.find(p => p.id === 'IF1')
    ?.join}`);
  ck('expandedPath : une transition qui rejoint la finale n’a pas de direct sur la finale', !expandedPath(fl({}), {
    appTrans: inaTr('X1', [
      ['X1', 48.4, 1.7],
      ['X2', 48.5, 1.9],
      ['FAF1', 48.66, 2.25]
    ]),
    app: AP2
  }).some(p => p.origin === 'app' && p.id === 'FAF1' && p.join === 'direct'));

  // routage des voies : la fin de la SID et le début de l'arrivée choisies (utilisateur, 29 octobre : départ FINOT de LFBO,
  // route qui commence à GOSAD, « Auto » ne trouvait pas G36)
  const RC = routingChain(fl({}), {
      sid: SIDX,
      star: STAR
    }),
    rcIds = RC.map(p => p.id).join(' ');
  ck('routingChain : fin de SID insérée après le départ ; début de STAR déjà dans la route, rien', rcIds === 'LFBD S09 AAA BBB CCC LFPO' &&
    RC[1]
    .inserted && RC[1].origin === 'sid', rcIds);
  const STAR2 = {
      ...STAR,
      points: [{
        seq: 1,
        id: 'S10',
        lat: 48.0,
        lon: 1.6
      }, ...STAR.points]
    },
    RC2 = routingChain(fl({}), {
      sid: SID,
      star: STAR2
    });
  ck('routingChain : fin de SID déjà dans la route, début de STAR inséré avant l’arrivée', RC2.map(p => p.id).join(' ') ===
    'LFBD AAA BBB CCC S10 LFPO' && RC2.at(-2).inserted && RC2.at(-2).origin === 'star', RC2.map(p => p.id).join(' '));
  const RC3 = routingChain(fl({}), {
    app: AP2,
    appTrans: TR2
  });
  ck('routingChain : sans STAR, le début de la transition d’approche', RC3.map(p => p.id).join(' ') === 'LFBD AAA BBB CCC T1 LFPO');
  ck('routingChain : sans procédure, les points tels quels', routingChain(fl({}), {}).map(p => p.id).join(' ') === 'LFBD AAA BBB CCC LFPO');
  ck('routingChain : une procédure d’un autre terrain est ignorée', routingChain(fl({}), {
    sid: {
      ...SIDX,
      icao: 'LFBO'
    }
  }).length === 5);
  const pts2 = [RT.points[0], RT.points[2], RT.points[4]];
  ck('routingChain : sur les points donnés (la chaîne d’« Auto »)', routingChain(fl({}), {
      sid: SIDX
    }, pts2).map(p => p.id).join(' ') ===
    'LFBD S09 BBB LFPO');

  // altitude du vol : le chemin vertical de fuel, sinon montée / croisière / descente (utilisateur, 29 octobre : vents et coupe à
  // l'altitude du profil, pas au niveau de croisière partout)
  const AP = {
    route: RT,
    level: {
      ft: 26000
    },
    profile: {
      path: [{
        nm: 0,
        ft: 0
      }, {
        nm: 50,
        ft: 26000
      }, {
        nm: 200,
        ft: 26000
      }, {
        nm: 260,
        ft: 3000
      }, {
        nm: 270,
        ft: 0
      }]
    }
  };
  ck('altitudeAt : profile.path interpolé', altitudeAt(AP, 25) === 13000 && altitudeAt(AP, 100) === 26000 && altitudeAt(AP, 265) === 1500);
  const AR = {
    route: RT,
    level: {
      ft: 20000
    },
    profile: {
      tocNm: 40,
      todNm: 60
    }
  };
  ck('altitudeAt : sans chemin, montée jusqu’à tocNm et descente sur todNm', altitudeAt(AR, 20, {
    total: 300
  }) === 10000 && altitudeAt(AR, 150, {
    total: 300
  }) === 20000 && altitudeAt(AR, 270, {
    total: 300
  }) === 10000);
  ck('altitudeAt : un palier (cruiseFt) gardé en croisière', altitudeAt(AR, 150, {
    total: 300,
    cruiseFt: 18000
  }) === 18000);
  ck('altitudeAt : sans niveau, null', altitudeAt({
    route: RT
  }, 10) === null);
  const FPr = flownPath(expandedPath(FV, LP)),
    toF = routeNmToFlown(fl({}), FPr),
    gcr = (a, b) => 3440.065 * 2 * Math.asin(Math.sqrt(Math.sin((b.lat - a.lat) * Math.PI / 360) ** 2 + Math.cos(a.lat * Math.PI / 180) *
      Math.cos(b.lat *
        Math.PI / 180) * Math.sin((b.lon - a.lon) * Math.PI / 360) ** 2)),
    rAAA = gcr(RT.points[0], RT.points[1]),
    fAAA = FPr.find(p => p.id === 'AAA').nm;
  ck('routeNmToFlown : un point de la route tombe sur son nm du chemin volé', Math.abs(toF(rAAA) - fAAA) < 1e-6, `${toF(rAAA)} / ${fAAA}`);
  ck('routeNmToFlown : sans chemin, l’identité', routeNmToFlown(fl({}), null)(42) === 42);
  // conflictsOf et orderProcedures vivent dans procedures.js (banc frame/lib/test/procedures.html) : ici, la ré-exportation
  ck('ré-exportation : conflictsOf et orderProcedures marchent depuis current_flight.js (procedures.js les porte)',
    typeof orderProcedures === 'function' &&
    orderProcedures(['25', '07'], 'rwy', {}, new Map()).join() === '07,25' && conflictsOf('sid', {
      id: 'x',
      runways: ['07']
    }, {
      rwy: '25'
    }, new Map()).length === 1);

  // § 10.29 a : loadProcedures rend les mêmes enregistrements à Carburant et à la Carte, sans transition égale à sa procédure
  const LPd = await loadProcedures(fakeDb, fl({
    dep: {
      rwy: '23',
      sid: SID.id,
      trans: SID.id
    },
    arr: {
      star: STAR.id
    }
  }));
  ck('loadProcedures : une transition égale à sa procédure est ignorée (dedupProcs)', LPd.sid === SID && LPd.sidTrans === null);

  // § 10.29 c : les jonctions marquées par expandedPath (le dessin ne les devine plus)
  const XJ = expandedPath(FV, LP),
    jn = id => XJ.find(p => p.id === id)?.join;
  ck('expandedPath : jonction sur un point commun (SID sur AAA, STAR sur CCC puis S02)', jn('AAA') === 'common' && jn('S02') === 'common' &&
    !jn('BBB'), XJ.map(p => `${p.id}:${p.join || ''}`).join(' '));
  const XD2 = expandedPath(fl({}), {
    sid: SIDX
  });
  ck('expandedPath : sans point commun, le point de la route qui suit la SID porte join direct', XD2.find(p => p.id === 'AAA')?.join ===
    'direct');
  const SG = {
      ...STAR,
      points: [STAR.points[0], {
        ...STAR.points[1],
        gap: true
      }]
    },
    XG = expandedPath(fl({}), {
      star: SG
    });
  ck('expandedPath : un tronçon dont le prédécesseur n’est pas codé porte join gap', XG.find(p => p.id === 'S02')?.join === 'gap');

  // le point qui choisit le modèle météo, le même pour la Carte et Atmosphère : à mi-longueur de la route
  const MP = routeMidpoint([{
    lat: 0,
    lon: 0
  }, {
    lat: 0,
    lon: 1
  }, {
    lat: 0,
    lon: 9
  }]);
  ck('routeMidpoint : à mi-longueur (5° sur 9), pas au point du milieu par son rang', Math.abs(MP.lat) < 1e-9 && Math.abs(MP.lon - 4.5) <
    .01, JSON.stringify(MP));
  const MD = routeMidpoint([{
    lat: 0,
    lon: 179
  }, {
    lat: 0,
    lon: -179
  }]);
  ck('routeMidpoint : à travers la ligne de changement de date, dans [-180, 180[', MD.lon === -180 || Math.abs(Math.abs(MD.lon) - 180) <
    1e-6, JSON.stringify(MD));

  window.__cfBench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__cfBench.pass} PASS · ${window.__cfBench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
