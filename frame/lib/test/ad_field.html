<!doctype html>
<!-- Banc du champ de terrain (frame/lib/ad_field.js, SOG-0465 : sorti de Carburant en bloc commun, pour l'atelier de Missions aussi) :
     sur une page SANS module, avec un aerodb inventé passé par le contexte — les clés données par l'écran, la complétion par le code,
     le choix écrit dans le champ, le nom « XTST — Base Test » sous le champ, « inconnu » pour un code que la base ne connaît pas, la
     valeur de repli d'une clé sans champ, l'abonnement arrêté. window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ad_field — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
  #screen {
    position: relative
  }
</style>
</head>
<body>
<h1 style="font-size:16px">ad_field.js — bench</h1>
<div id="screen"><label>Départ <input data-k="eddep" autocomplete="off"></label>
  <div data-adline="eddep"></div><span data-adtext data-code="xtst"></span>
  <div data-adline="edarr"></div>
  <div data-adsug hidden></div>
</div>
<pre id="out"></pre>
<script type="module">
  import {
    createAdField,
    zoneAt
  } from '../ad_field.js?v=0';
  const out = document.getElementById('out'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      got: String(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : `  → ${got}`}`;
    out.appendChild(l);
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // un aerodb inventé : deux terrains de banc, rien d'autre ; aucune globale, tout passe par le contexte
  const BASE = {
      XTST: {
        name: 'BASE TEST',
        lat: 45.0,
        lon: 1.0
      },
      XTSU: {
        name: 'Base Test Sud',
        lat: 44.6,
        lon: 1.5
      }
    },
    calls = [];
  let offs = 0;
  const aerodb = {
    coords: async code => (calls.push(['coords', code]), BASE[code] || null),
    suggest: async q => (calls.push(['suggest', q]), Object.entries(BASE).filter(([c]) => c.startsWith(q.toUpperCase())).map(([code, x]) => ({
      code,
      name: x.name,
      rank: 1,
      lat: x.lat,
      lon: x.lon
    }))),
    find: async () => [],
    on: () => () => offs++
  };
  const ctx = {
      aerodb,
      lang: () => 'fr',
      t: row => Array.isArray(row) ? row[0] : String(row)
    },
    screen = document.getElementById('screen'),
    input = screen.querySelector('[data-k=eddep]');
  const F = createAdField({
    ctx,
    body: () => screen,
    gone: () => false,
    keys: ['eddep', 'edarr'],
    value: k => k === 'edarr' ? 'xtsu' : '',
    idPrefix: 'bn-ad'
  });
  // l'écran rend au bloc chaque frappe de ses champs (comme Carburant) : c'est le contrat
  input.addEventListener('input', e => F.onInput(e));
  // la frappe « xt » : deux propositions par le code
  input.value = 'xt';
  F.onInput({
    type: 'input',
    target: input
  });
  await wait(50);
  const items = [...screen.querySelectorAll('[data-adsug] [data-code]')].map(x => x.dataset.code);
  ck('frappe « xt » : les deux terrains du code proposés', JSON.stringify(items) === JSON.stringify(['XTST', 'XTSU']), JSON.stringify(items));
  ck('frappe : la liste est visible sous le champ', !screen.querySelector('[data-adsug]').hidden && input.getAttribute('aria-expanded') ===
    'true');
  ck('le champ propose pour ses seules clés : un champ inconnu est ignoré', F.onInput({
    type: 'input',
    target: document.createElement('input')
  }) === undefined);
  // le toucher sur XTST : écrit dans le champ, la ligne du nom suit
  F.onClick({
    target: screen.querySelector('[data-adsug] [data-code="XTST"]')
  });
  await wait(50);
  const line = screen.querySelector('[data-adline=eddep]');
  ck('choix : le code écrit dans le champ, la liste fermée', input.value === 'XTST' && screen.querySelector('[data-adsug]').hidden, input
    .value);
  ck('le nom sous le champ, avec son code (la règle de adnames.js)', /XTST/.test(line.textContent) && /Base Test/i.test(line.textContent) &&
    line.dataset.state === 'found', line.textContent);
  ck('une clé sans champ : sa valeur de repli (value) nomme son terrain', /XTSU/.test(screen.querySelector('[data-adline=edarr]')
    .textContent), screen.querySelector('[data-adline=edarr]').textContent);
  ck('le nom seul d’un [data-adtext] (code en minuscules lu en majuscules)', /Base Test/i.test(screen.querySelector('[data-adtext]')
    .textContent), screen.querySelector('[data-adtext]').textContent);
  // un code que la base ne connaît pas
  input.value = 'XZZZ';
  F.onInput({
    type: 'change',
    target: input
  });
  await wait(50);
  ck('un code inconnu de la base : « inconnu »', line.textContent === 'inconnu' && line.dataset.state === 'unknown', line.textContent);
  ck('known : vrai pour un terrain de la base, faux sinon', await F.known('XTST') === true && await F.known('XZZZ') === false);
  ck('le nom demandé une fois par code', calls.filter(c => c[0] === 'coords' && c[1] === 'XTST').length === 1, JSON.stringify(calls));
  ck('zoneAt : le plus petit cadre qui porte la position, null sans zones', zoneAt([{
    id: 'A',
    frames: [[0, 40, 10, 50]]
  }, {
    id: 'B',
    frames: [[0, 44, 2, 46]]
  }], {
    lat: 45,
    lon: 1
  })?.id === 'B' && zoneAt([], {
    lat: 45,
    lon: 1
  }) === null);
  // un bloc commun ne lit rien d'un module : ses imports restent dans frame/lib
  const src = await fetch('../ad_field.js?v=0').then(r => r.text()),
    imports = [...src.matchAll(/from '([^']+)'/g)].map(m => m[1]);
  ck('ses imports restent dans frame/lib (aucun module)', imports.length > 0 && imports.every(p => p.startsWith('./')), JSON.stringify(
    imports));
  ck('aucune globale de l’application lue', !/window\.(SogFrame|AeroDB|AppFramework)/.test(src));
  F.stop();
  ck('stop : l’abonnement à la base arrêté', offs === 1, offs);
  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
