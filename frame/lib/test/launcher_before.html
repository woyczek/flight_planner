<!doctype html>
<!-- Banc du crochet `before` du client du lanceur (frame/lib/launcher.js, SOG-0400) : un travail du lanceur n'attend pas l'envoi de ce qui attend dans data/ au-delà d'une
     borne courte, et un travail qui ne fait que lire ce que le lanceur a construit (le READ_ONLY de tools/regen_jobs.py) ne l'attend pas du tout. Mesuré avant : « Calculer »
     attendait toute la passe en cours (38,7 s pour un envoi de 40 s). Lanceur simulé (fetch donné au client). window.__beforeBench = { done, pass, fail, rows, readOnly }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>launcher before — bench</title>
</head>
<body>
<pre id="out"></pre>
<script type="module">
  import {
    launcherClient,
    READ_ONLY_JOBS,
    READ_ONLY_EXCLUDED,
    BEFORE_MAX_MS,
    readOnlyJob
  } from '../launcher.js?v=0';
  const rows = [],
    out = document.getElementById('out');
  window.__beforeBench = {
    done: false,
    pass: 0,
    fail: 0,
    rows,
    readOnly: [...(READ_ONLY_JOBS || [])].sort(),
    excluded: [...(READ_ONLY_EXCLUDED || [])].sort()
  };
  const ck = (name, ok, detail = '') => {
    window.__beforeBench[ok ? 'pass' : 'fail']++;
    rows.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : ' — ' + detail}`);
    out.append(`${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + detail}\n`);
  };
  const json = (v, status = 200) => new Response(JSON.stringify(v), {
    status,
    headers: {
      'content-type': 'application/json'
    }
  });
  const ROOT = 'http://launcher.test/',
    DECL = {
      routes: ['regen/job']
    };
  /** Un lanceur qui accepte tout travail et le finit à la première lecture ; `starts` : l'heure (performance.now) de chaque départ. */
  const fake = starts => async (url, init = {}) => {
    const u = new URL(url);
    if (u.pathname.endsWith('/regen/job') && (init.method || 'GET') === 'POST') {
      starts.push({
        at: performance.now(),
        body: JSON.parse(init.body || '{}')
      });
      return json({
        ok: true,
        job: 'j1'
      });
    }
    return json({
      state: 'done',
      done: 1,
      total: 1,
      result: {
        ok: true
      }
    });
  };
  const never = () => new Promise(() => {}); // l'envoi tenu : une passe de synchronisation qui n'en finit pas
  /** Lance un travail avec un `before` donné ; rend { waited: ms entre l'appel et le départ, wait: ce que le client a dit, r: le résultat }. */
  async function run(body, before, extra = {}) {
      const starts = [],
        waits = [],
        c = launcherClient({
          root: ROOT,
          info: {
            host: 'pc',
            data: true,
            dataGit: true,
            lan: false
          },
          fetch: fake(starts),
          before,
          onWait: w => waits.push(w),
          poll: 5,
          ...extra
        }),
        t0 = performance.now(),
        r = await Promise.race([c.forModule(DECL).job('regen/job', body), new Promise(res => setTimeout(() => res({
          timeout: true
        }), 6000))]);
      return {
        waited: starts[0] ? Math.round(starts[0].at - t0) : null,
        wait: waits[0] || null,
        r
      };
    }
    (async () => {
      ck('la borne par défaut de l’attente est de 4 s', BEFORE_MAX_MS === 4000, String(BEFORE_MAX_MS));
      ck('readOnlyJob : route/compute et base/status sont en lecture seule, aircraft/publish et base/build non',
        readOnlyJob('regen/job', {
          set: 'route',
          verb: 'compute'
        }) && readOnlyJob('regen/job', {
          set: 'base',
          verb: 'status'
        }) && !readOnlyJob('regen/job', {
          set: 'aircraft',
          verb: 'publish'
        }) && !readOnlyJob('regen/job', {
          set: 'base',
          verb: 'build'
        }) && !readOnlyJob('regen/job', null) && !readOnlyJob('other', {
          set: 'route',
          verb: 'compute'
        }));
      // 1. un travail en lecture seule part TOUT DE SUITE, l'envoi fût-il tenu pour toujours (la mesure : 38 746 ms avant)
      const a = await run({
        set: 'route',
        verb: 'compute',
        args: {}
      }, never);
      ck('« Calculer » (route/compute) pendant un envoi tenu : le travail part en moins d’une seconde', a.waited !== null && a.waited <
        1000, JSON.stringify({
          waited: a.waited,
          wait: a.wait
        }));
      ck('… et le client dit qu’il n’a rien attendu (skipped)', a.wait?.skipped === true && a.wait?.late === false && a.wait?.set ===
        'route' && a.wait?.verb === 'compute', JSON.stringify(a.wait));
      // 2. un travail qui peut lire ce que les pages écrivent attend l'envoi, mais jamais au-delà de la borne ; puis il part et le client le dit
      const b = await run({
        set: 'aircraft',
        verb: 'publish'
      }, never, {
        beforeMax: 400
      });
      ck('un travail qui peut lire ce que les pages écrivent, envoi tenu : il attend la borne (400 ms ici), puis il part', b.waited !==
        null && b.waited >= 380 && b.waited < 1500, JSON.stringify({
          waited: b.waited,
          wait: b.wait
        }));
      ck('… et le client dit que la borne est atteinte (late), pour que la page le dise', b.wait?.late === true && b.wait?.skipped ===
        false && b.wait?.ms >= 380, JSON.stringify(b.wait));
      // 2 bis. un travail en lecture seule du lanceur qui peut lire ce que des pages écrivent (stats/output) garde l'attente bornée
      const e = await run({
        set: 'stats',
        verb: 'output'
      }, never, {
        beforeMax: 300
      });
      ck('stats/output (en lecture seule, mais il peut lire ce que des pages écrivent) : l’attente est bornée, puis il part', e
        .waited !== null && e.waited >= 280 && e.waited < 1500 && e.wait?.late === true && e.wait?.skipped === false, JSON.stringify({
          waited: e.waited,
          wait: e.wait
        }));
      // 3. un envoi rapide : le travail part dès qu'il est fini, sans borne atteinte
      const c = await run({
        set: 'aircraft',
        verb: 'publish'
      }, () => new Promise(res => setTimeout(res, 120)), {
        beforeMax: 2000
      });
      ck('un envoi qui finit en 120 ms : le travail part juste après, la borne n’est pas atteinte', c.waited !== null && c.waited >=
        100 && c.waited < 1000 && c.wait?.late === false, JSON.stringify({
          waited: c.waited,
          wait: c.wait
        }));
      // 4. un envoi qui échoue ne retient pas le travail
      const d = await run({
        set: 'aircraft',
        verb: 'publish'
      }, async () => {
        throw new Error('send failed');
      });
      ck('un envoi qui échoue : le travail part tout de suite', d.waited !== null && d.waited < 1000 && d.wait?.late === false, JSON
        .stringify({
          waited: d.waited,
          wait: d.wait
        }));
      // 5. le travail se termine normalement dans tous les cas
      ck('le travail rend son résultat dans les quatre cas', [a, b, c, d].every(x => x.r?.state === 'done' || x.r?.ok === true), JSON
        .stringify([a, b, c, d].map(x => x.r)));
      // 6. SOG-0432 (c) : le lanceur libère une lecture qui ne donnait plus signe de vie (cancelled, reason released) : une lecture pure est redemandée UNE fois, sans erreur ; un travail qui écrit ne l'est jamais
      const released = (verb, again) => {
        const starts = [];
        return {
          starts,
          fetch: async (url, init = {}) => {
            const u = new URL(url);
            if (u.pathname.endsWith('/regen/job') && (init.method || 'GET') === 'POST') {
              starts.push(JSON.parse(init.body || '{}'));
              return json({
                ok: true,
                job: 'j' + starts.length
              });
            }
            const first = starts.length === 1 && !again;
            return json(first || again ? {
              state: 'cancelled',
              result: {
                ok: false,
                reason: 'released'
              }
            } : {
              state: 'done',
              result: {
                ok: true
              }
            });
          }
        };
      };
      const mk = f => launcherClient({
        root: ROOT,
        info: {
          host: 'pc',
          data: true,
          dataGit: true,
          lan: false
        },
        fetch: f,
        poll: 5
      }).forModule(DECL);
      const e1 = released('status');
      const re = await mk(e1.fetch).job('regen/job', {
        set: 'base',
        verb: 'status'
      });
      ck('une lecture pure libérée par le lanceur est redemandée une fois : deux départs, résultat « done », pas d’erreur', e1.starts
        .length === 2 && re.ok === true && !re.released, JSON.stringify({
          starts: e1.starts.length,
          re
        }));
      const e2 = released('status', true);
      const re2 = await mk(e2.fetch).job('regen/job', {
        set: 'base',
        verb: 'status'
      });
      ck('libérée deux fois : une seule redemande, puis le client le dit (released), sans boucle', e2.starts.length === 2 && re2.ok ===
        false && re2.released === true, JSON.stringify({
          starts: e2.starts.length,
          re2
        }));
      const e3 = released('build');
      const re3 = await mk(e3.fetch).job('regen/job', {
        set: 'base',
        verb: 'build'
      });
      ck('un travail qui écrit libéré n’est jamais relancé de lui-même', e3.starts.length === 1 && re3.ok === false && re3.released ===
        true, JSON.stringify({
          starts: e3.starts.length,
          re3
        }));
      // 7. SOG-0438 : `current` dit le travail en cours d'une route sans le suivre (une page rouverte le retrouve) : set, verbe, arguments simples, avancement ; null sans travail en cours ou fini
      const cur = view => mk(async (url, init = {}) => json(view)).current('regen/job');
      const c1 = await cur({
        job: {
          id: 'j9',
          state: 'running',
          set: 'proc',
          verb: 'ead-fetch',
          args: {
            icao: 'EGGW',
            deep: {
              x: 1
            },
            'bad key': 1
          },
          step: 'EGGW: 5/10',
          done: 5,
          total: 10,
          unit: 'documents',
          started: 1700000000
        }
      });
      ck('current : le travail en cours, sans le suivre (set, verbe, arguments simples seulement, avancement)', c1?.id === 'j9' && c1
        .set === 'proc' && c1.verb === 'ead-fetch' && c1.args?.icao === 'EGGW' && !('deep' in c1.args) && !('bad key' in c1.args) &&
        c1.done === 5 && c1.total === 10, JSON.stringify(c1));
      const c2 = await cur({
        job: {
          id: 'j8',
          state: 'done',
          set: 'proc',
          verb: 'ead-fetch'
        }
      });
      const c3 = await cur({
        job: null
      });
      ck('current : null pour un travail fini et pour l’absence de travail', c2 === null && c3 === null, JSON.stringify([c2, c3]));
      const c4 = await mk(async () => json({}, 404)).current('regen/other');
      ck('current : une route non déclarée est refusée sans appel', c4?.ok === false && c4.refused === true, JSON.stringify(c4));
      window.__beforeBench.done = true;
    })().catch(e => {
      ck('le banc va au bout', false, String(e));
      window.__beforeBench.done = true;
    });
</script>
</body>
</html>
