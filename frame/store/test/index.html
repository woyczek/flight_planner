<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>frame/store — tests</title>
<!-- Essais de la couche de données du cadre V3 (frame/store/frame_data.js, transport_github.js) contre le faux GitHub de
     frame/store/test/fake_github.py, qui sert aussi cette page : python frame/store/test/fake_github.py, puis
     http://127.0.0.1:8790/frame/store/test/ et « Run ». Chaque scénario repart d'un cache et d'un dépôt vides. -->
<style>
  body {
    font: 14px/1.45 system-ui, sans-serif;
    margin: 16px;
    background: #f5f6f8;
    color: #17202a
  }
  li.ok::marker {
    content: '✓ ';
    color: #1e7d32
  }
  li.ko::marker {
    content: '✗ ';
    color: #b3261e
  }
  li.ko {
    color: #b3261e
  }
  pre {
    font-size: 12px;
    white-space: pre-wrap
  }
</style></head>
<body>
<h1>frame/store — tests</h1>
<p><button type="button" id="run">Run</button> <span id="state"></span></p>
<ol id="out"></ol>
<script src="../frame_data.js"></script>
<script src="../transport_git.js"></script>
<script src="../transport_github.js"></script>
<script>
  const FD = window.FrameData,
    $ = id => document.getElementById(id);
  // « hors ligne » simulé : le navigateur le dit aussi (le transport ne dit offline que si navigator.onLine est faux, 31 oct. 2026)
  let simOffline = false;
  Object.defineProperty(navigator, 'onLine', {
    configurable: true,
    get: () => !simOffline
  });
  const T = (cmd, body) => (cmd === 'offline' && (simOffline = !!body?.on), fetch(`/__test/${cmd}`, {
    method: 'POST',
    body: JSON.stringify(body || {})
  }).then(r => r.json()));
  const stats = () => fetch('/__test/stats').then(r => r.json());
  const results = [];
  /** Vérification : nom, condition, détail montré en cas d'échec. */
  const check = (name, ok, detail) => results.push({
    name,
    ok: !!ok,
    detail: ok ? '' : JSON.stringify(detail)
  });
  const rec = (who, at, extra = {}) => ({
    pilote: who,
    updated_at: at,
    ...extra
  });
  /** Couche neuve : cache effacé, dépôt d'essai, transport github sur le faux GitHub, module « essai » déclaré. */
  async function fresh(files = {}) {
    await FD.reset();
    await T('offline', {
      on: false
    });
    await T('reset', {
      files
    });
    FD.configure({
      transport: FD.github({
        repo: 'test/data',
        branch: 'main',
        token: 'test-token',
        api: `${location.origin}/api`
      }),
      identity: {
        trigram: 'TST'
      }
    });
    return FD.adapter({
      id: 'essai',
      reads: ['disponibilites/', 'cr/', {
        prefix: 'sia/base/',
        policy: 'reference'
      }],
      writes: [{
        prefix: 'disponibilites/',
        merge: 'record'
      }, {
        prefix: 'cr/log.json',
        merge: 'journal'
      }, {
        prefix: 'cr/affectations.json',
        merge: 'keyed:assignments:mission+pilot'
      }]
    });
  }
  const scenarios = {
    async 'offline: writes wait in the queue, reads answer from the cache'() {
      const d = await fresh();
      await T('offline', {
        on: true
      });
      await d.put('disponibilites/TST/2026-W43.json', rec('TST', '2026-10-22T10:00:00Z'));
      await d.put('disponibilites/TST/2026-W44.json', rec('TST', '2026-10-22T10:01:00Z'));
      const s = await d.status(),
        v = await d.get('disponibilites/TST/2026-W43.json');
      check('2 writes pending', s.pending === 2, s);
      check('the queue tells each path and the module that wrote it', s.queue?.length === 2 && s.queue.every(q => q.module ===
        'essai' && q.path && q.at), s.queue);
      check('read returns the local write', v?.pilote === 'TST', v);
      const r = await d.sync();
      check('sync offline: error "offline", nothing lost', r.error === 'offline' && (await d.status()).pending === 2, r);
      const pl = await FD.pendingList();
      check('pendingList: each path waiting, its date, the error of the last pass, never the text', pl.length === 2 && pl.every(q => q
        .path.startsWith('disponibilites/TST/') && q.at && q.error === 'offline' && !('text' in q)) && !JSON.stringify(pl).includes(
        'pilote'), pl);
      const st = await stats();
      check('no commit while offline', st.commits.length === 1, st.commits);
    },
    async 'batch: several writes and a removal leave in ONE commit'() {
      const d = await fresh({
        'disponibilites/OLD/2026-W40.json': JSON.stringify(rec('OLD', '2026-10-01T00:00:00Z'))
      });
      await d.sync();
      for (let i = 0; i < 5; i++) await d.put(`disponibilites/TST/2026-W4${i}.json`, rec('TST', `2026-10-22T10:0${i}:00Z`));
      await d.remove('disponibilites/OLD/2026-W40.json');
      const r = await d.sync(),
        st = await stats(),
        last = st.commits[st.commits.length - 1];
      check('sync ok, 6 pushed', r.ok && r.pushed === 6, r);
      check('one commit for the batch', st.commits.length === 2 && last[2].length === 6, st.commits);
      check('commit message names the trigram', /^TST : 6 fichier/.test(last[1]), last[1]);
      check('removed file gone from the repository', !('disponibilites/OLD/2026-W40.json' in st.files), Object.keys(st.files));
      check('queue empty after push', (await d.status()).pending === 0, await d.status());
      check('list sees the pushed files', (await d.list('disponibilites/TST/'))?.length === 5, await d.list('disponibilites/'));
    },
    async 'lastPushed: what the last synchronisation sent, file by file, with its result; the last one only, never a journal'() {
      const d = await fresh();
      await d.sync();
      check('before any send: nothing', (await FD.lastPushed()).length === 0, await FD.lastPushed());
      await d.put('disponibilites/TST/2026-W44.json', rec('TST', '2026-11-02T10:00:00Z', {
        secret: 'contenu-prive'
      }));
      await d.put('disponibilites/TST/2026-W45.json', rec('TST', '2026-11-02T10:01:00Z'));
      const r = await d.sync(),
        a = await FD.lastPushed();
      check('two files sent: both named, ok, with the time of the pass', r.ok && a.length === 2 && a.map(x => x.path).sort().join() ===
        'disponibilites/TST/2026-W44.json,disponibilites/TST/2026-W45.json' && a.every(x => x.result === 'ok' && !isNaN(Date.parse(x
          .at))), a);
      check('never the content of a file', !JSON.stringify(a).includes('contenu-prive'), a);
      check('reading has no effect: same answer, no pass launched', JSON.stringify(await FD.lastPushed()) === JSON.stringify(a) && !(
        await d.status()).syncing, null);
      // a pass with nothing to send leaves the list as it was (the last send, not the last pass)
      await d.sync();
      check('a pass that sends nothing leaves the list', JSON.stringify(await FD.lastPushed()) === JSON.stringify(a), await FD
        .lastPushed());
      // a refused send is named with its reason, and replaces the list (the last synchronisation only)
      await T('deny', {
        on: true
      });
      await d.put('disponibilites/TST/2026-W46.json', rec('TST', '2026-11-02T10:02:00Z'));
      const f = await d.sync(),
        b = await FD.lastPushed();
      check('a refused send: the file named with the reason (403), the old list gone', !f.ok && b.length === 1 && b[0].path ===
        'disponibilites/TST/2026-W46.json' && /403/.test(b[0].result) && /not accessible/.test(b[0].result), [f, b]);
      check('the refused file is still queued', (await d.status()).pending === 1, await d.status());
      await T('deny', {
        on: false
      });
      const g = await d.sync(),
        c = await FD.lastPushed();
      check('then sent: the same file, now ok', g.ok && c.length === 1 && c[0].path === 'disponibilites/TST/2026-W46.json' && c[0]
        .result === 'ok', [g, c]);
      // offline before any commit: nothing was tried, the list stays
      await T('offline', {
        on: true
      });
      await d.put('disponibilites/TST/2026-W47.json', rec('TST', '2026-11-02T10:03:00Z'));
      await d.sync();
      check('offline pass (nothing tried): the list stays', JSON.stringify(await FD.lastPushed()) === JSON.stringify(c), await FD
        .lastPushed());
    },
    async 'pull: a change made on another device arrives, watch is called'() {
      const d = await fresh({
        'disponibilites/ABC/2026-W43.json': JSON.stringify(rec('ABC', '2026-10-20T00:00:00Z'))
      });
      await d.sync();
      const seen = [];
      const stop = d.watch('disponibilites/', p => seen.push(...p));
      await T('write', {
        files: {
          'disponibilites/ABC/2026-W43.json': JSON.stringify(rec('ABC', '2026-10-22T08:00:00Z', {
            note: 'remote'
          }))
        }
      });
      const before = await d.get('disponibilites/ABC/2026-W43.json');
      check('before sync: the cached version (no network in a read)', before?.note === undefined, before);
      await d.sync();
      const after = await d.get('disponibilites/ABC/2026-W43.json');
      check('after sync: the remote version', after?.note === 'remote', after);
      check('watch called with the path', seen.includes('disponibilites/ABC/2026-W43.json'), seen);
      stop();
    },
    async 'conflict on a record: the newest wins, the loser is kept'() {
      const p = 'disponibilites/TST/2026-W45.json',
        d = await fresh({
          [p]: JSON.stringify(rec('TST', '2026-10-20T00:00:00Z', {
            v: 'base'
          }))
        });
      await d.sync();
      await d.put(p, rec('TST', '2026-10-22T09:00:00Z', {
        v: 'local-older'
      }));
      await T('write', {
        files: {
          [p]: JSON.stringify(rec('TST', '2026-10-22T11:00:00Z', {
            v: 'remote-newer'
          }))
        }
      });
      let alerted = 0;
      const on = () => alerted++;
      window.addEventListener('frame-data-conflict', on);
      const r = await d.sync();
      window.removeEventListener('frame-data-conflict', on);
      const st = await stats(),
        cs = await FD.conflicts();
      check('sync ok, 1 conflict counted', r.ok && r.conflicts === 1, r);
      check('repository keeps the newest (remote)', JSON.parse(st.files[p]).v === 'remote-newer', st.files[p]);
      check('loser kept and consultable', cs.length === 1 && JSON.parse(cs[0].lost).v === 'local-older', cs);
      check('conflict signalled (event), no question asked', alerted === 1, alerted);
      check('status counts the unseen conflict', (await d.status()).conflicts === 1, await d.status());
    },
    // ---- fusion d'une fiche modifiée des deux côtés (6 nov. 2026, SOG-0043 : « 8 conflits » alors que git n'en avait aucun) : la même règle que
    // tools/data_sync.py (identiques hors updated_at : rien), un conflit par clé de premier niveau changée des deux côtés (avec la base),
    // les dates comparées en instants ; le vol courant reste un fichier entier
    async 'record merge: identical but for updated_at, key order and layout is no conflict'() {
      const p = 'disponibilites/TST/2026-W46.json',
        base = rec('TST', '2026-11-02T10:00:00Z', {
          a: 1,
          b: {
            x: 1,
            y: 2
          }
        }),
        d = await fresh({
          [p]: JSON.stringify(base)
        });
      await d.sync();
      await d.put(p, {
        b: {
          y: 2,
          x: 1
        },
        a: 1,
        updated_at: '2026-11-02T10:05:00Z',
        pilote: 'TST'
      });
      await T('write', {
        files: {
          [p]: JSON.stringify({
            ...base,
            updated_at: '2026-11-02T10:07:00.250Z'
          }, null, 4)
        }
      });
      const r = await d.sync();
      check('no conflict counted', r.ok && r.conflicts === 0, r);
      check('none kept, none to see', (await FD.conflicts()).length === 0 && (await d.status()).conflicts === 0, await FD.conflicts());
      check('the document says the same thing', JSON.stringify((await d.get(p)).b) === JSON.stringify({
        x: 1,
        y: 2
      }), await d.get(p));
    },
    async 'record merge: different top-level keys changed on each side are both kept, no conflict'() {
      const p = 'disponibilites/TST/2026-W47.json',
        base = rec('TST', '2026-11-02T10:00:00Z', {
          a: 1,
          b: 2,
          c: 3
        }),
        d = await fresh({
          [p]: JSON.stringify(base)
        });
      await d.sync();
      const {
        c,
        ...noC
      } = base;
      await d.put(p, {
        ...noC,
        a: 10,
        updated_at: '2026-11-02T10:05:00Z'
      }); // a changed, c removed
      await T('write', {
        files: {
          [p]: JSON.stringify({
            ...base,
            b: 20,
            updated_at: '2026-11-02T10:03:00Z'
          })
        }
      });
      const r = await d.sync(),
        st = await stats(),
        got = JSON.parse(st.files[p]);
      check('no conflict counted, none kept', r.ok && r.conflicts === 0 && (await FD.conflicts()).length === 0, r);
      check('a from this side, b from the other, c removed here and untouched there', got.a === 10 && got.b === 20 && !('c' in got),
        got);
      check('the stamp is the newest one', got.updated_at === '2026-11-02T10:05:00Z', got);
    },
    async 'record merge: the same key changed on both sides is one conflict, the newest wins that key, the loser is kept whole with the key named'
      () {
        const p = 'disponibilites/TST/2026-W48.json',
          base = rec('TST', '2026-11-02T10:00:00Z', {
            a: 1,
            b: 2,
            c: 3
          }),
          d = await fresh({
            [p]: JSON.stringify(base)
          });
        await d.sync();
        await d.put(p, {
          ...base,
          a: 'local',
          c: 30,
          updated_at: '2026-11-02T10:05:00Z'
        });
        await T('write', {
          files: {
            [p]: JSON.stringify({
              ...base,
              a: 'remote',
              b: 20,
              updated_at: '2026-11-02T10:03:00Z'
            })
          }
        });
        const r = await d.sync(),
          got = JSON.parse((await stats()).files[p]),
          cs = await FD.conflicts();
        check('one conflict counted', r.ok && r.conflicts === 1 && cs.length === 1, [r, cs]);
        check('a: the newest (local); b: only the remote changed it; c: only the local one did', got.a === 'local' && got.b === 20 && got
          .c === 30, got);
        check('the loser kept whole (restore takes it back as a file), with the key in conflict named', cs.length === 1 && JSON.parse(cs[
            0].lost).a ===
          'remote' && JSON.parse(cs[0].lost).b === 20 && JSON.stringify(cs[0].keys) === '["a"]', cs);
      },
    async 'record merge: the current flight stays a whole file (its derived sections depend on the route)'() {
      const p = 'pilot/TST/current_flight.json',
        base = {
          updated_at: '2026-11-02T10:00:00Z',
          route: {
            text: 'LFRS LFML'
          },
          profile: {
            tocNm: 60
          }
        };
      await fresh({
        [p]: JSON.stringify(base)
      });
      const v = FD.adapter({
        id: 'vol',
        reads: ['pilot/'],
        writes: [{
          prefix: 'pilot/',
          merge: 'record'
        }]
      });
      await v.sync();
      await v.put(p, {
        ...base,
        route: {
          text: 'LFRS LFLL'
        },
        updated_at: '2026-11-02T10:05:00Z'
      });
      await T('write', {
        files: {
          [p]: JSON.stringify({
            ...base,
            profile: {
              tocNm: 99
            },
            updated_at: '2026-11-02T10:03:00Z'
          })
        }
      });
      const r = await v.sync({
          gesture: true
        }), // le vol en cours est RETENU (SOG-0279) : il ne part que sur un geste
        got = JSON.parse((await stats()).files[p]),
        cs = await FD.conflicts();
      check('one conflict, the newest file kept whole: the route of the newest and the profile it came with', r.conflicts === 1 && got
        .route.text ===
        'LFRS LFLL' && got.profile.tocNm === 60, [r, got]);
      check('the loser kept whole', cs.length === 1 && JSON.parse(cs[0].lost).profile.tocNm === 99, cs);
      const dgc = (await FD.diagnostic()).conflictList;
      check('the diagnostic lists the conflict: path, time, side, seen — never the content', dgc.length === 1 && dgc[0].path === p && dgc[0].at && dgc[0].seen === false && !('lost' in dgc[0]) && !('kept' in dgc[0]), dgc);
    },
    // ---- SOG-0136 (« nouvelle brouette de conflits alors que je suis tout seul ») : une entrée de conflit n'existe que si une version DIFFÈRE ; la copie qui revient est la dernière
    // écriture de cet appareil (fins de ligne, mise en forme, ordre des clés), un texte distant vide n'est pas une version : jamais d'entrée, la locale gagne
    async 'merge text: the copy that comes back is this device\u2019s last write (line endings, layout, key order): no conflict, the new edit wins'() {
      const p = 'pilot/TST/current_flight.json',
        A = {
          updated_at: '2026-11-09T15:02:14.779Z',
          route: {
            text: 'LFLL LFPO'
          },
          level: 180
        },
        B = {
          ...A,
          updated_at: '2026-11-09T15:02:34.593Z',
          route: {
            text: 'LFLL BUSIL LFPO'
          }
        },
        base = JSON.stringify(A, null, 1) + '\n',
        local = JSON.stringify(B, null, 1) + '\n',
        crlf = base.replace(/\n/g, '\r\n'),
        shuffled = JSON.stringify({
          level: 180,
          route: {
            text: 'LFLL LFPO'
          },
          updated_at: A.updated_at
        }, null, 4);
      const r1 = FD.mergeText(p, base, local, crlf),
        r2 = FD.mergeText(p, base, local, shuffled);
      check('CRLF copy of the last write: the new edit is kept, no entry', r1.text === local && r1.conflict === null, r1);
      check('same data, other layout and key order: the new edit is kept, no entry', r2.text === local && r2.conflict === null, r2);
    },
    async 'merge text: an empty or blank remote text is not a version: nothing to lose, no entry with two empty blocks'() {
      const p = 'pilot/TST/current_flight.json',
        base = JSON.stringify({
          updated_at: '2026-11-09T15:00:00Z',
          route: {
            text: 'A'
          }
        }, null, 1) + '\n',
        local = JSON.stringify({
          updated_at: '2026-11-09T15:01:00Z',
          route: {
            text: 'B'
          }
        }, null, 1) + '\n';
      for (const remote of ['', ' \n', null]) {
        const r = FD.mergeText(p, base, local, remote);
        check(`remote ${JSON.stringify(remote)}: the local text stays, no entry`, r.text === local && r.conflict === null, r);
      }
      const u = FD.mergeText(p, base, base, '');
      check('an unchanged local with an empty remote does not take the empty text', u.text === base && u.conflict === null, u);
    },
    async 'merge text: a different content is one entry, with both versions in it and different'() {
      const p = 'pilot/TST/current_flight.json',
        mk = (route, at) => JSON.stringify({
          updated_at: at,
          route: {
            text: route
          }
        }, null, 1) + '\n',
        base = mk('A', '2026-11-09T15:00:00Z'),
        local = mk('B', '2026-11-09T15:02:00Z'),
        remote = mk('C', '2026-11-09T15:01:00Z'),
        r = FD.mergeText(p, base, local, remote);
      check('one entry: the newer (local) kept whole, the other kept as the lost version, both non-empty and different', r.conflict && r.conflict.kept === local && r.conflict.lost === remote && r.conflict.kept.trim() && r.conflict.lost.trim() && r.conflict.kept !== r.conflict.lost, r);
    },
    async 'instants: the most recent is the one that is later, whatever the form of the date'() {
      check('FrameData.isNewer compares instants: +02:00 and Z, to the second and in milliseconds, equal instants, no date', FD
        .isNewer({
          updated_at: '2026-11-06T07:30:00.000Z'
        }, {
          updated_at: '2026-11-06T09:00:00+02:00'
        }) && FD.isNewer({
          updated_at: '2026-11-06T07:00:50.400Z'
        }, {
          updated_at: '2026-11-06T07:00:50Z'
        }) && !FD.isNewer({
          updated_at: '2026-11-06T07:00:50.000Z'
        }, {
          updated_at: '2026-11-06T07:00:50Z'
        }) && FD.isNewer({
          updatedAt: '2026-11-06T07:00:00Z'
        }, {}) && !FD.isNewer({}, {
          updated_at: '2026-11-06T07:00:00Z'
        }) && !FD.isNewer(null, undefined), null);
      // a record, the same key on both sides: the later instant wins, in both written forms
      for (const [local, remote, win] of [
          ['2026-11-06T09:00:00+02:00', '2026-11-06T07:30:00.000Z', 'remote'],
          ['2026-11-06T07:00:50.400Z', '2026-11-06T07:00:50Z', 'local']
        ]) {
        const p = 'disponibilites/TST/2026-W49.json',
          base = rec('TST', '2026-11-02T10:00:00Z', {
            a: 1
          }),
          d = await fresh({
            [p]: JSON.stringify(base)
          });
        await d.sync();
        await d.put(p, {
          ...base,
          a: 'local',
          updated_at: local
        });
        await T('write', {
          files: {
            [p]: JSON.stringify({
              ...base,
              a: 'remote',
              updated_at: remote
            })
          }
        });
        const r = await d.sync(),
          got = JSON.parse((await stats()).files[p]);
        check(`record, local ${local} against remote ${remote}: the ${win} wins`, r.conflicts === 1 && got.a === win, [r, got]);
      }
      // a keyed list: the same assignment changed on both sides, the later instant wins
      const aff = 'cr/affectations.json',
        d = await fresh({
          [aff]: JSON.stringify({
            assignments: [{
              mission: 'M1',
              pilot: 'AAA',
              v: 0
            }]
          })
        });
      d.watch('cr/', () => {});
      await d.sync();
      await d.put(aff, {
        assignments: [{
          mission: 'M1',
          pilot: 'AAA',
          v: 'local',
          updated_at: '2026-11-06T09:00:00+02:00'
        }]
      });
      await T('write', {
        files: {
          [aff]: JSON.stringify({
            assignments: [{
              mission: 'M1',
              pilot: 'AAA',
              v: 'remote',
              updated_at: '2026-11-06T07:30:00.000Z'
            }]
          })
        }
      });
      await d.sync();
      check('keyed: the later instant (remote, 07:30Z, not the local 09:00+02:00 = 07:00Z) wins the assignment', JSON.parse((
          await stats()).files[aff])

        }]
      });
      check('a pending write is never judged stale', (await a.get(p))?.airlines?.[0]?.code === 'local', await a.get(p));
    },
    async 'conflicts: the ones seen more than 30 days ago are dropped at the first pass; the unseen and the recent stay with their lost version'() {
      await fresh({
        'disponibilites/A/x.json': '{}'
      });
      const day = 864e5,
        iso = ms => new Date(Date.now() - ms).toISOString();
      await FD.conflicts(); // opens the store of the layer (its stores exist)
      await new Promise((res, rej) => {
        const r = indexedDB.open('sogFrame');
        r.onsuccess = () => {
          const db = r.result,
            tx = db.transaction('conflicts', 'readwrite'),
            st = tx.objectStore('conflicts');
          for (const [path, ago, seen] of [
              ['old-seen.json', 40 * day, true],
              ['old-unseen.json', 40 * day, false],
              ['recent-seen.json', 2 * day, true]
            ]) st.add({
            path,
            kept: '{}',
            lost: '{"a":1}',
            side: 'remote',
            at: iso(ago),
            seen
          });
          tx.oncomplete = () => (db.close(), res());
          tx.onerror = () => rej(tx.error);
        };
        r.onerror = () => rej(r.error);
      });
      const d = FD.adapter({
        id: 'essai4',
        reads: ['disponibilites/'],
        writes: []
      });
      await d.sync();
      await new Promise(r => setTimeout(r, 150));
      const left = (await FD.conflicts()).map(c => c.path).sort();
      check('only the old SEEN one is gone, the unseen and the recent stay', JSON.stringify(left) === '["old-unseen.json","recent-seen.json"]', left);
    },
    async 'write guard: a browser without userActivation: the user’s own back-and-forth (a gesture before each write) is not a series'() {
      const p = 'pilot/TST/current_flight.json';
      await fresh({
        [p]: JSON.stringify({
          updated_at: '2026-11-10T14:40:00Z',
          profile: {
            n: 0
          }
        })
      });
      FD.configure({
        transport: {
          ...FD.github({
            repo: 'test/data',
            branch: 'main',
            token: 'test-token',
            api: `${location.origin}/api`
          }),
          quick: true
        },
        identity: {
          trigram: 'TST'
        }
      });
      const v = FD.adapter({
        id: 'vol2',
        reads: ['pilot/'],
        writes: [{
          prefix: 'pilot/',
          merge: 'record'
        }]
      });
      await v.sync();
      const was = {
        ...FD.guard
      };
      Object.assign(FD.guard, {
        window: 900,
        group: 60
      });
      Object.defineProperty(navigator, 'userActivation', {
        configurable: true,
        value: undefined
      }); // an older browser: no such API
      const events = [];
      v.watch('pilot/', e => events.push(e));
      for (let i = 0; i < 10; i++) {
        window.dispatchEvent(new Event('pointerdown')); // the user touches the screen, then the write follows
        await v.put(p, {
          updated_at: new Date().toISOString(),
          profile: {
            n: 1 + i % 2
          }
        });
        await new Promise(r => setTimeout(r, 120));
      }
      delete navigator.userActivation;
      Object.assign(FD.guard, was);
      check('every write of a user who touches the screen is announced (10 of 10), none held as a series', events.length === 10 && !(await FD.diagnostic()).serialWrites.some(x => x.path === p), [events.length, (await FD.diagnostic()).serialWrites]);
    }
  };
  async function runAll() {
    results.length = 0;
    $('out').innerHTML = '';
    $('state').textContent = 'running…';
    for (const [name, fn] of Object.entries(scenarios)) {
      const start = results.length;
      try {
        await fn();
      } catch (e) {
        check(`${name}: threw`, false, e.stack || String(e));
      }
      const mine = results.slice(start),
        li = document.createElement('li');
      li.className = mine.every(x => x.ok) ? 'ok' : 'ko';
      li.innerHTML = `<b>${name}</b><ul>${mine.map(x => `<li class="${x.ok ? 'ok' : 'ko'}">${x.name}${x.detail ? `<pre>${x.detail.replace(/</g, '&lt;')}</pre>` : ''}</li>`).join('')}</ul>`;
      $('out').append(li);
    }
    await T('offline', {
      on: false
    });
    const ko = results.filter(x => !x.ok).length;
    $('state').textContent = `${results.length - ko} / ${results.length} checks passed`;
    window.__results = {
      total: results.length,
      failed: results.filter(x => !x.ok)
    };
    return window.__results;
  }
  $('run').onclick = runAll;
</script>
