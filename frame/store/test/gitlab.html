<script>
  // API GitLab simulée : branches, tree (keyset, Link next), blobs/:sha/raw, commits (actions), un seul projet
  window.GL = (() => {
    const API = 'https://gitlab.example/api/v4',
      PROJECT = `${API}/projects/${encodeURIComponent('grp/data')}`,
      st = {
        files: {}, // chemin → { sha, text }
        head: 'c0',
        n: 0,
        offline: false,
        moveBeforeCommit: false, // la branche part ailleurs juste avant le POST du commit
        moveDuringCommit: false, // un autre commit se glisse avant le nôtre (parent_ids[0] ≠ tête attendue)
        evilNext: false, // le lien « next » mène à un autre hôte
        limitAt: 0, // SOG-0337 : la page (à partir de 1) qui répond 429 ; limitHits : combien de fois encore ; retryAfter : l'en-tête (null : absent)
        limitHits: 0,
        retryAfter: null,
        dropAt: 0, // la page qui est coupée une fois (le navigateur ne dit alors que « réseau » : un 429 sans en-tête CORS)
        pageHits: {}, // page → demandes reçues
        calls: [],
        perPage: 2
      };
    // « hors ligne » : le navigateur le dit aussi (le transport ne dit offline que si navigator.onLine est faux, 31 oct. 2026)
    Object.defineProperty(navigator, 'onLine', {
      configurable: true,
      get: () => !st.offline
    });
    const sha = t => {
      let h = 0;
      for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return `b${h.toString(16).padStart(8, '0')}${(++st.n).toString(16)}`;
    };
    const json = (body, status = 200, headers = {}) => new Response(JSON.stringify(body), {
      status,
      headers: {
        'Content-Type': 'application/json',
        ...headers
      }
    });
    const other = () => {
      st.head = `c${++st.n}`;
    };
    const reset = (files = {}) => {
      st.files = {};
      for (const [p, t] of Object.entries(files)) st.files[p] = {
        sha: sha(t),
        text: t
      };
      st.head = `c${++st.n}`;
      st.calls = [];
    };
    window.fetch = async (url, init = {}) => {
      url = String(url);
      st.calls.push({
        url,
        method: init.method || 'GET',
        token: init.headers?.['PRIVATE-TOKEN'] || '',
        redirect: init.redirect || '',
        body: init.body || ''
      });
      if (st.offline) throw new TypeError('Failed to fetch');
      if ((init.headers?.['PRIVATE-TOKEN'] || '') !== 'glpat-test') return json({
        message: '401 Unauthorized'
      }, 401);
      // qui est le jeton (whoami) : un robot de projet, ses portées et son expiration
      if (url === `${API}/user`) return json({
        id: 7,
        username: 'project_1_bot',
        bot: st.personal ? false : true
      });
      if (url === `${API}/personal_access_tokens/self`) return st.selfRefused ? json({
        message: '403 Forbidden'
      }, 403) : json({
        scopes: ['api'],
        expires_at: '2027-01-31'
      });
      if (!url.startsWith(PROJECT)) return json({
        message: '404 Project Not Found'
      }, 404);
      const u = new URL(url),
        rest = url.slice(PROJECT.length).split('?')[0];
      if (rest === '/repository/branches/main') return json({
        name: 'main',
        commit: {
          id: st.head
        }
      });
      if (rest === '/repository/tree') {
        const all = Object.keys(st.files).sort().map(p => ({
            id: st.files[p].sha,
            name: p.split('/').pop(),
            type: 'blob',
            path: p,
            mode: '100644'
          })).concat([{
            id: 'tdir',
            name: 'sia',
            type: 'tree',
            path: 'sia',
            mode: '040000'
          }]),
          from = +(u.searchParams.get('page_token') || 0),
          num = from / st.perPage + 1;
        st.pageHits[num] = (st.pageHits[num] || 0) + 1;
        if (st.dropAt === num) {
          st.dropAt = 0;
          throw new TypeError('Failed to fetch');
        }
        if (st.limitAt === num && st.limitHits > 0) {
          st.limitHits--;
          return json({
            message: '429 Too Many Requests'
          }, 429, st.retryAfter === null ? {} : {
            'Retry-After': String(st.retryAfter)
          });
        }
        const page = all.slice(from, from + st.perPage),
          more = from + st.perPage < all.length;
        const next = st.evilNext ? 'https://evil.example/api/v4/steal' : `${PROJECT}/repository/tree?ref=${u.searchParams.get('ref')}&recursive=true&per_page=100&pagination=keyset&page_token=${from + st.perPage}`;
        return json(page, 200, more ? {
          Link: `<${next}>; rel="next"`
        } : {});
      }
      const blob = /^\/repository\/blobs\/([^/]+)\/raw$/.exec(rest);
      if (blob) {
        const f = Object.values(st.files).find(x => x.sha === decodeURIComponent(blob[1]));
        return f ? new Response(f.text) : json({
          message: '404 Blob Not Found'
        }, 404);
      }
      if (rest === '/repository/commits' && init.method === 'POST') {
        const b = JSON.parse(init.body);
        if (st.moveBeforeCommit) {
          st.moveBeforeCommit = false;
          other();
        }
        let parent = st.head;
        if (st.moveDuringCommit) {
          st.moveDuringCommit = false;
          other();
          parent = st.head;
        }
        for (const a of b.actions) {
          if (a.action === 'create' && st.files[a.file_path]) return json({
            message: 'A file with this name already exists'
          }, 400);
          if ((a.action === 'update' || a.action === 'delete') && !st.files[a.file_path]) return json({
            message: "A file with this name doesn't exist"
          }, 400);
        }
        for (const a of b.actions) {
          if (a.action === 'delete') delete st.files[a.file_path];
          else {
            const text = a.encoding === 'base64' ? atob(a.content) : a.content;
            st.files[a.file_path] = {
              sha: sha(text),
              text
            };
          }
        }
        st.head = `c${++st.n}`;
        st.last = b;
        return json({
          id: st.head,
          parent_ids: [parent],
          author_name: b.author_name || 'project_bot'
        }, 201);
      }
      return json({
        message: '404 Not Found'
      }, 404);
    };
    return {
      st,
      reset,
      API
    };
  })();
</script>

<script>
  (async () => {
    const out = document.getElementById('out'),
      rows = [];
    const ck = (name, ok, info = '') => {
      rows.push([ok ? 'PASS' : 'FAIL', name, info]);
      out.insertAdjacentHTML('beforeend', `<span class="${ok ? 'PASS' : 'FAIL'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${ok ? '' : ' — ' + String(info).replace(/</g, '&lt;')}\n`);
    };
    const FD = window.FrameData,
      G = window.GL;
    try {
      // réglage : l'adresse collée d'un projet GitLab dit l'instance et l'api ; GitHub reste GitHub
      FD.github.hold({
        repo: 'https://gitlab.example/grp/data.git',
        token: ' glpat-test '
      });
      const cfg = FD.github.config();
      ck('réglage : adresse GitLab → provider, api de l’instance, projet', cfg.provider === 'gitlab' && cfg.api === `${G.API}` && cfg
        .repo ===
        'grp/data' && cfg.token === 'glpat-test', JSON.stringify({
          ...cfg,
          token: '…'
        }));
      FD.github.hold({
        repo: 'https://github.com/acme/data',
        token: 'x'
      });
      ck('réglage : adresse GitHub → GitHub', !FD.github.config().provider && FD.github.config().repo === 'acme/data');
      FD.github.hold(null);
      const T = FD.github({
        ...cfg,
        author: () => 'ABC'
      });
      ck('FD.github renvoie vers le transport GitLab', T.id === 'gitlab' && T.kind === 'remote');
      T.limit.pacing.gapMs = 0; // le banc lit des arbres entiers : la pause entre deux pages (SOG-0337) a son propre essai plus bas
      T.limit.pacing.perMin = 1e9;
      // tête, arbre page par page, lecture
      G.reset({
        'a.json': '{"a":1}',
        'pilot/ABC/x.json': '{}',
        'sia/base/fr/1.json': '[1]',
        'sia/base/fr/2.json': '[2]',
        'z.txt': 'zz'
      });
      const head = await T.head();
      ck('head : la tête de la branche', head === G.st.head);
      const tree = await T.tree(head);
      ck('tree : tous les fichiers, page par page (les dossiers écartés)', Object.keys(tree).length === 5 && tree['a.json'] === G.st
        .files['a.json'].sha,
        JSON.stringify(Object.keys(tree)));
      const pages = G.st.calls.filter(c => c.url.includes('/repository/tree')).length;
      ck('tree : plusieurs pages suivies par le lien « next »', pages === 3, pages);
      const before = G.st.calls.length;
      await T.tree(head);
      ck('tree : gardé par tête (aucun appel de plus)', G.st.calls.length === before);
      ck('read : contenu du blob', await T.read('a.json', tree['a.json']) === '{"a":1}');
      ck('le jeton ne passe que par l’en-tête : jamais dans une adresse', G.st.calls.every(c => !c.url.includes('glpat')) && G.st.calls
        .every(c => c.token ===
          'glpat-test'));
      ck('jamais une redirection suivie (redirect: error)', G.st.calls.every(c => c.redirect === 'error'));
      // le jeton enregistré n'est repris que pour la même cible (fournisseur, origine de l'API, projet)
      FD.github.hold({
        repo: 'https://gitlab.example/grp/data',
        token: 'glpat-saved'
      });
      const same = FD.github.resolve({
          repo: 'https://gitlab.example/grp/data',
          token: ''
        }),
        host = FD.github.resolve({
          repo: 'https://evil.example/grp/data',
          token: ''
        }),
        proj = FD.github.resolve({
          repo: 'https://gitlab.example/grp/other',
          token: ''
        }),
        gh = FD.github.resolve({
          repo: 'grp/data',
          token: ''
        });
      ck('jeton repris pour la même cible seulement', same.token === 'glpat-saved' && host.token === '' && host.newTarget ===
        'evil.example' && proj.token ===
        '' && gh.token === '' && gh.newTarget === 'github.com', JSON.stringify([host.newTarget, gh.newTarget]));
      let thrown = '';
      try {
        FD.github.save({
          repo: 'https://evil.example/grp/data',
          token: ''
        });
      } catch (x) {
        thrown = x.message;
      }
      ck('save refuse un réglage sans jeton', /token required/.test(thrown) && FD.github.config().token === 'glpat-saved');
      ck('un hôte collé avec « @ » ou un caractère hors [A-Za-z0-9.-] : dépôt refusé, aucun hôte affiché', [
        'https://gitlab.com@evil.example/x/y',
        'https://evil_host/x/y', 'http://gitlab.example/x/y', 'https://gitlab.example/x@y'
      ].every(repo => {
        const r = FD.github.resolve({
          repo,
          token: 't'
        });
        return r.repo === '' && !r.api;
      }) && FD.github.clean({
        repo: 'https://gitlab.example:8443/grp/data',
        token: 't'
      }).api === 'https://gitlab.example:8443/api/v4');
      FD.github.hold(null);
      let refused = false;
      try {
        FD.gitlab({
          repo: 'x/y',
          token: 't',
          api: 'https://gitlab.example/api/v4/../steal'
        });
      } catch {
        refused = true;
      }
      ck('api GitLab d’une autre forme : ignorée par clean, refusée par le transport', !FD.github.clean({
        repo: 'x/y',
        provider: 'gitlab',
        api: 'http://gitlab.example/api/v4'
      }).api && refused);
      // lien « next » vers un autre hôte : jamais suivi (le jeton n'y part pas)
      G.st.evilNext = true;
      G.st.head = `c${++G.st.n}`; // une tête neuve : l'arbre déjà lu (partagé entre les transports du même dépôt) ne répond pas à sa place
      const T2 = FD.github({
        ...cfg
      });
      const t2 = await T2.tree(await T2.head());
      G.st.evilNext = false;
      G.st.head = `c${++G.st.n}`; // l'arbre tronqué de cette lecture reste à sa tête : la suite lit la sienne
      ck('tree : un lien « next » vers un autre hôte n’est pas suivi', G.st.calls.every(c => !c.url.startsWith(
          'https://evil.example')) && Object.keys(t2).length ===
        2, JSON.stringify(Object.keys(t2)));
      // commit atomique : create, update, delete, auteur
      const h1 = await T.head(),
        h2 = await T.commit([{
          path: 'a.json',
          text: '{"a":2}'
        }, {
          path: 'n.json',
          text: '{"n":1}'
        }, {
          path: 'z.txt',
          text: null
        }, {
          path: 'gone.json',
          text: null
        }], 'ABC : lot', h1, {
          tree: await T.tree(h1)
        });
      const acts = G.st.last.actions.map(a => `${a.action}:${a.file_path}`).join(',');
      ck('commit : un seul commit, create / update / delete (suppression d’un absent sautée)', acts ===
        'update:a.json,create:n.json,delete:z.txt' &&
        h2 === G.st.head, acts);
      ck('commit : l’auteur est le trigramme de l’appareil', G.st.last.author_name === 'ABC' && G.st.last.author_email ===
        'abc@defa.local');
      ck('commit : lot vide → la même tête, aucun appel', await T.commit([{
        path: 'nothere.json',
        text: null
      }], 'm', h2, {
        tree: await T.tree(h2)
      }) === h2);
      // conflits
      let e = await T.commit([{
        path: 'a.json',
        text: '3'
      }], 'm', 'c-old', {
        tree: await T.tree(h2)
      }).catch(x => x);
      ck('commit : la branche est partie ailleurs → err.conflict, rien d’écrit', e?.conflict === true && G.st.files['a.json'].text ===
        '{"a":2}', e?.message);
      G.st.moveDuringCommit = true;
      const h3 = await T.head();
      e = await T.commit([{
        path: 'a.json',
        text: '4'
      }], 'm', h3, {
        tree: await T.tree(h3)
      }).catch(x => x);
      ck('commit : posé sur une branche qui a bougé entre-temps → err.conflict (la couche tire)', e?.conflict === true, e?.message);
      const h4 = await T.head();
      e = await T.commit([{
        path: 'brand-new.json',
        text: '1'
      }], 'm', h4, {
        tree: {
          ...await T.tree(h4),
          'brand-new.json': 'x'
        }
      }).catch(x => x);
      ck('commit : fichier absent alors que l’arbre le croyait là (update refusé) → err.conflict', e?.conflict === true, e?.message);
      // jeton refusé, hors ligne
      const bad = FD.gitlab({
        ...cfg,
        token: 'glpat-bad'
      });
      e = await bad.head().catch(x => x);
      ck('jeton refusé : « GitLab 401 : … », le jeton jamais cité', e?.status === 401 && /^GitLab 401: /.test(e.message) && !/glpat-bad/
        .test(e.message), e?.message);
      // whoami : robot du projet, portées, expiration ; un jeton personnel ; la route des portées refusée : null ; jeton refusé
      const w1 = await T.whoami();
      G.st.personal = true;
      const w2 = await T.whoami();
      G.st.personal = false;
      G.st.selfRefused = true;
      const w3 = await T.whoami();
      G.st.selfRefused = false;
      const w4 = await bad.whoami().catch(x => x);
      ck('whoami : robot, portées, expiration ; jeton personnel → bot false ; portées illisibles → null ; jeton refusé → 401', w1
        .bot === true && w1.username === 'project_1_bot' &&
        w1.scopes.join() === 'api' && w1.expiresAt === '2027-01-31' && w2.bot === false && w3.bot === true && w3.scopes === null && w4
        ?.status ===
        401, JSON.stringify([w1, w2, w3, w4?.status]));
      const wcalls = G.st.calls.filter(x => /\/user$|\/personal_access_tokens\/self$/.test(x.url));
      ck('whoami : même hôte, même jeton', wcalls.length === 7 && wcalls.every(x => x
        .url.startsWith(
          G.API) && (x.token === 'glpat-test' || x.token === 'glpat-bad')));
      G.st.offline = true;
      e = await T.head().catch(x => x);
      G.st.offline = false;
      ck('hors ligne → err.offline', e?.offline === true);
      // publication par groupes : texte, binaire (base64), suppression d'un présent et d'un absent
      const blob = new Blob([new Uint8Array([0, 1, 2, 255])]);
      const p = await T.publish([{
        name: 'fr',
        files: [{
          path: 'sia/base/fr/3.json',
          text: '[3]'
        }, {
          path: 'sia/base/fr/b.bin',
          blob
        }],
        removed: ['sia/base/fr/1.json', 'sia/base/fr/nope.json'],
        message: 'Publication fr'
      }, {
        name: 'ie',
        files: [{
          path: 'sia/base/ie/1.json',
          text: '[1]'
        }]
      }]);
      ck('publish : un commit par groupe, absents sautés', p.ok && p.groups.length === 2 && p.groups[0].files === 2 && p.groups[0]
        .removed === 1 &&
        !G.st.files['sia/base/fr/1.json'] && G.st.files['sia/base/ie/1.json'], JSON.stringify(p));
      ck('publish : le binaire arrive tel quel (base64)', [...G.st.files['sia/base/fr/b.bin'].text].map(ch => ch.charCodeAt(0)).join(
        ',') === '0,1,2,255');
      G.st.offline = true;
      const po = await T.publish([{
        name: 'x',
        files: [{
          path: 'x.json',
          text: '1'
        }]
      }]);
      G.st.offline = false;
      ck('publish : hors ligne → { ok: false, offline, at }', po.ok === false && po.offline === true && po.at === 0, JSON.stringify(
        po));
      // un arbre de plus de dix mille fichiers (le dépôt des données de l'utilisateur en compte 10 441, le 12 nov. 2026) : lu en entier, page par page, rien de tronqué (SOG-0235, téléphone sans lanceur)
      {
        const big = {};
        for (let i = 0; i < 10441; i++) big[`sia/base/fr/${String(i).padStart(5, '0')}.json`] = `[${i}]`;
        big['airline/index.json'] = '{"airlines":[{"code":"itf"},{"code":"defa"}]}';
        big['airline/defa/settings.json'] = '{"name":"DEFA Virtual"}';
        big['airline/defa/fleet.json'] = '{"aircraft":[]}';
        G.reset(big);
        G.st.perPage = 100;
        const h = await T.head(),
          bt = await T.tree(h);
        ck('tree : 10 444 fichiers lus en entier, page par page (rien de tronqué, DEFA présente)', Object.keys(bt).length === 10444 && !!bt['airline/defa/settings.json'] && !!bt['airline/defa/fleet.json'] && !!bt['airline/index.json'],
          Object.keys(bt).length);
        ck('tree : ce que la lecture a rendu est dit (pages, entrées, fichiers), pour le diagnostic', T.lastTree?.pages === 105 && T.lastTree?.blobs === 10444 && T.lastTree?.entries === 10445, JSON.stringify(T.lastTree));
        G.st.perPage = 2;
      }
      // SOG-0337 (« GitLab 429 sur le téléphone », 14 nov. 2026) : un 429 est une demande d'attendre, pas un échec ni un recommencement : la lecture de l'arbre ATTEND (Retry-After, sinon 60 s doublé),
      // REPREND à sa page, le DIT (waiting, info), et la cadence est tenue
      {
        const files = {};
        for (let i = 0; i < 12; i++) files[`d/${String(i).padStart(2, '0')}.json`] = `[${i}]`; // 12 fichiers + 1 dossier, deux par page : 7 pages
        const fresh = () => {
          G.reset(files);
          G.st.perPage = 2;
          G.st.pageHits = {};
          G.st.limitAt = 0;
          G.st.limitHits = 0;
          G.st.dropAt = 0;
          G.st.retryAfter = null;
        };
        const T = FD.gitlab({
          api: G.API,
          repo: 'grp/data',
          token: 'glpat-test'
        }); // un transport neuf : sa garde a ses valeurs par défaut
        const L = T.limit,
          waits = [],
          prev = {
            ...L.pacing
          };
        L.pacing.gapMs = 600; // le banc l'avait coupée pour ses arbres entiers (la garde est partagée par les transports du même dépôt et du même jeton)
        L.pacing.perMin = 80;
        ck('limite : le transport porte sa garde (cadence, attente, état)', !!L && typeof L.waiting === 'function' && L.pacing.perMin === 80 && L.pacing.gapMs === 600 && L.pacing.retries === 3, JSON.stringify(L?.pacing));
        L.pacing.windowMs = 50; // les 105 pages du grand arbre sont dans la minute : la fenêtre du banc est courte (la cadence a son propre essai, plus bas)
        L.pacing.gapMs = 0;
        L.pacing.minWait = 1;
        L.pacing.defWait = 1;
        L.onLimit = () => waits.push(L.waiting()?.secs || 0);
        // (a) un 429 à la page 4, Retry-After lisible : attendu, la même page reprise, les pages 1 à 3 jamais relues
        fresh();
        G.st.limitAt = 4;
        G.st.limitHits = 1;
        G.st.retryAfter = 1;
        let h = await T.head(),
          t0 = Date.now(),
          pr = T.tree(h);
        await new Promise(r => setTimeout(r, 300));
        const during = L.waiting();
        const bt = await pr;
        ck('limite : un 429 à la page 4 — l’arbre est lu en entier après l’attente (12 fichiers)', Object.keys(bt).length === 12 && Date.now() - t0 >= 900, `${Object.keys(bt).length} fichiers en ${Date.now() - t0} ms`);
        ck('limite : l’attente est dite pendant qu’elle dure (waiting : secondes, statut 429) et finie ensuite', !!during && during.secs === 1 && during.status === 429 && L.waiting() === null && waits.includes(1) && waits.at(-1) === 0, JSON.stringify([during, waits]));
        ck('limite : la lecture REPREND — les pages 1 à 3 lues une fois, la page 4 deux fois, rien ne recommence de zéro', [1, 2, 3].every(n => G.st.pageHits[n] === 1) && G.st.pageHits[4] === 2 && G.st.pageHits[7] === 1, JSON.stringify(G.st.pageHits));
        ck('limite : ce qui a été lu est gardé pour le diagnostic (attentes, secondes, statut, Retry-After lisible)', L.info.waits === 1 && L.info.waitedS === 1 && L.info.last?.status === 429 && L.info.last?.retryAfterS === 1 && L.info.last?.source === 'retry-after', JSON.stringify(L.info));
        // (b) Retry-After illisible (CORS) : 60 s par défaut, doublé (ici 1 s, 2 s)
        fresh();
        L.info.waits = 0;
        L.info.waitedS = 0;
        G.st.limitAt = 3;
        G.st.limitHits = 2;
        h = await T.head();
        const b2 = await T.tree(h);
        ck('limite : sans Retry-After lisible, l’attente est la valeur par défaut DOUBLÉE à chaque fois (1 s puis 2 s)', Object.keys(b2).length === 12 && L.info.waits === 2 && L.info.waitedS === 3 && L.info.last?.retryAfterS === null, JSON.stringify(L.info));
        // (c) la limite ne passe pas : l’erreur est levée après les reprises, l’arbre lu jusque-là est GARDÉ ; la lecture suivante reprend à la page où elle s’était arrêtée
        fresh();
        L.pacing.retries = 1;
        G.st.limitAt = 4;
        G.st.limitHits = 99;
        G.st.retryAfter = 1;
        h = await T.head();
        let err = null;
        try {
          await T.tree(h);
        } catch (e) {
          err = e;
        }
        ck('limite : une limite qui dure lève l’erreur après les reprises (rateLimited, statut 429, message GitLab 429)', err?.rateLimited === true && err.status === 429 && /^GitLab 429:/.test(err.message), `${err?.message} ${err?.rateLimited}`);
        G.st.limitHits = 0;
        const before = {
          ...G.st.pageHits
        };
        const b3 = await T.tree(h);
        ck('limite : la lecture suivante REPREND à la page 4 (pages 1 à 3 non redemandées), l’arbre est entier', Object.keys(b3).length === 12 && [1, 2, 3].every(n => G.st.pageHits[n] === before[n]) && T.lastTree?.resumedAt === 3, JSON.stringify([G.st.pageHits, T.lastTree]));
        // (d) le 429 d’une réponse sans en-tête CORS : le navigateur ne dit que « réseau » — en pleine lecture, traité de même
        fresh();
        L.pacing.retries = 3;
        L.info.waits = 0;
        G.st.dropAt = 3;
        h = await T.head();
        const b4 = await T.tree(h);
        ck('limite : une coupure en pleine lecture de l’arbre (429 sans en-tête CORS) est attendue puis reprise, pas un échec muet', Object.keys(b4).length === 12 && L.info.waits === 1 && L.info.last?.kind === 'unreadable', JSON.stringify(L.info));
        // (e) un refus qui n’est pas une limite (401, 404) n’est jamais attendu
        L.info.waits = 0;
        const bad = FD.gitlab({
          api: G.API,
          repo: 'grp/data',
          token: 'wrong'
        });
        let e401 = null;
        try {
          await bad.head();
        } catch (e) {
          e401 = e;
        }
        ck('limite : un 401 n’est pas une limite (levé tout de suite, aucune attente)', e401?.status === 401 && !e401.rateLimited && bad.limit.info.waits === 0, e401?.message);
        // (f) la cadence : une pause entre deux pages (600 ms par défaut : 80 pages à la minute au plus)
        fresh();
        L.pacing.gapMs = 150;
        h = await T.head();
        t0 = Date.now();
        await T.tree(h);
        ck('cadence : une pause entre deux pages de l’arbre (150 ms demandées : 7 pages, six pauses)', Date.now() - t0 >= 800, `${Date.now() - t0} ms`);
        // (g) la cadence par fenêtre : à `perMin` demandes dans la fenêtre, la suivante attend son tour (jamais perdue) — fenêtre de 500 ms pour le banc
        const g = FD.git.guard(async () => 'ok');
        g.pacing.perMin = 3;
        g.pacing.windowMs = 500;
        t0 = Date.now();
        for (let i = 0; i < 4; i++) await g.call('x');
        ck('cadence : la quatrième demande dans la fenêtre attend sa fin (au moins 450 ms)', Date.now() - t0 >= 450 && Date.now() - t0 < 2000, `${Date.now() - t0} ms`);
        L.onLimit = null;
      }
    } catch (x) {
      ck('exception du banc', false, x?.stack || x);
    }
    const pass = rows.filter(r => r[0] === 'PASS').length;
    window.__gitlabBench = {
      done: true,
      pass,
      fail: rows.length - pass,
      rows
    };
    out.insertAdjacentHTML('beforeend', `\n${pass}/${rows.length}\n`);
  })();
</script>
