<title>Pilote — SOG</title>
<!-- V3 : appli Pilote, squelette du cadre (frame/app.js) : navigation par verbes, modules chargés à la demande
     (modules/<nom>/module.js), bouton de synchronisation et son état, écran des conflits, réglages de l'appareil
     (frame/settings/settings.js). -->
<!-- design et ton de l'appareil posés avant le premier affichage (copie de device/design.json, frame/app.js) -->
<script>
try {
  const d = JSON.parse(localStorage.getItem('sogFrame:design') || '{}'),
    h = document.documentElement;
  if (/^(standard|cabinet|field)$/.test(d.design)) h.dataset.design = d.design;
  if (/^(day|night)$/.test(d.tone)) h.dataset.tone = d.tone
} catch (e) {}
</script>
