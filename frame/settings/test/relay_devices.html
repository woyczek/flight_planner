<!doctype html>
<!-- Banc de l'écran « Appareils du relais » (frame/settings/relay_devices.js ; R1a) : sans lanceur, relais coupé ou en marche,
     liste, code montré une fois et effacé en quittant l'écran, trigramme refusé, révocation d'un appareil et d'un pilote
     après question. Contexte du cadre simulé : aucun appel réel. window.__relayBench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>relay devices — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">relay_devices.js — bench</h1>
<pre id="out"></pre>
<div id="view"></div>
<script src="../relay_devices.js?v=0"></script>
<script>
  (async () => {
    const out = document.getElementById('out'),
      rows = [];
    const ck = (name, ok, info = '') => {
      rows.push([ok ? 'PASS' : 'FAIL', name, info]);
      out.insertAdjacentHTML('beforeend', `<span class="${ok ? 'PASS' : 'FAIL'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${ok ? '' : ' — ' + String(info).replace(/</g, '&lt;')}\n`);
    };
    const tick = (ms = 40) => new Promise(r => setTimeout(r, ms));
    const t = (row, v = {}) => String(row[0]).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
    try {
      const S = window.SogScreens['relay-devices'],
        view = document.getElementById('view'),
        calls = [];
      let on = false,
        devices = [],
        answer = true;
      const routes = {
        call: async (route, body) => {
          calls.push([route, body]);
          if (route === 'relay') return {
            on,
            host: on ? 'sog.example.org' : '',
            devices,
            pending: []
          };
          if (route === 'relay/devices') return {
            ok: true,
            code: '12345678',
            trigram: body.trigram,
            expires_in: 600
          };
          if (route === 'relay/devices/revoke') {
            const before = devices.length;
            devices = devices.filter(d => !(body.id ? d.id === body.id : d.trigram === body.trigram));
            return {
              ok: true,
              removed: before - devices.length
            };
          }
          return {
            ok: false,
            status: 404
          };
        }
      };
      const ctx = (withRoutes = true) => ({
        t,
        notify: () => {},
        ask: async () => answer,
        routes: () => withRoutes ? routes : null
      });
      S.screen(view, ctx(false));
      await tick();
      ck('sans lanceur : la carte le dit, aucun appel', !!view.querySelector('[data-relay-nolauncher]') && calls.length === 0);
      S.screen(view, ctx());
      await tick();
      ck('relais coupé : il le dit', view.querySelector('[data-relay-state]')?.dataset.relayState === 'off');
      on = true;
      devices = [{
        id: 'a1',
        trigram: 'ABC',
        label: 'iPhone',
        at: '2026-10-29T22:00:00+00:00',
        last: ''
      }, {
        id: 'a2',
        trigram: 'ABC',
        label: 'Android',
        at: '2026-10-29T22:10:00+00:00',
        last: ''
      }, {
        id: 'b1',
        trigram: 'XYZ',
        label: 'iPad',
        at: '2026-10-29T22:20:00+00:00',
        last: ''
      }];
      S.screen(view, ctx());
      await tick();
      ck('relais en marche : l’hôte, trois appareils, une révocation par pilote', /sog\.example\.org/.test(view.textContent) && view
        .querySelectorAll('[data-device]').length ===
        3 && view.querySelectorAll('[data-act=revokeAll]').length === 2);
      view.querySelector('[data-f=tri]').value = 'a';
      view.querySelector('[data-act=make]').click();
      await tick();
      ck('trigramme refusé : un message, aucun code demandé', /2 à 5/.test(view.querySelector('[data-msg]').textContent) && !calls.some(
        c => c[0] === 'relay/devices'));
      view.querySelector('[data-f=tri]').value = 'abc';
      view.querySelector('[data-act=make]').click();
      await tick(80);
      ck('code demandé : montré une fois', view.querySelector('[data-relay-code]')?.textContent === '12345678' && calls.some(c => c[
        0] === 'relay/devices' && c[1]?.trigram === 'ABC'));
      window.dispatchEvent(new HashChangeEvent('hashchange'));
      await tick();
      ck('quitter l’écran efface le code', !view.querySelector('[data-relay-code]') && !view.innerHTML.includes('12345678'));
      answer = false;
      view.querySelector('[data-act=revoke]').click();
      await tick();
      ck('révocation : rien sans l’accord', !calls.some(c => c[0] === 'relay/devices/revoke'));
      answer = true;
      view.querySelector('[data-act=revoke][data-id=a1]').click();
      await tick(80);
      ck('révocation d’un appareil', calls.some(c => c[0] === 'relay/devices/revoke' && c[1]?.id === 'a1') && view.querySelectorAll(
        '[data-device]').length === 2);
      view.querySelector('[data-act=revokeAll][data-name=XYZ]').click();
      await tick(80);
      ck('révocation de tous les appareils d’un pilote', calls.some(c => c[0] === 'relay/devices/revoke' && c[1]?.trigram === 'XYZ') &&
        view.querySelectorAll(
          '[data-device]').length === 1);
    } catch (x) {
      ck('exception du banc', false, x?.stack || x);
    }
    const pass = rows.filter(r => r[0] === 'PASS').length;
    window.__relayBench = {
      done: true,
      pass,
      fail: rows.length - pass,
      rows
    };
    out.insertAdjacentHTML('beforeend', `\n${pass}/${rows.length}\n`);
  })();
</script>
</body>
</html>
