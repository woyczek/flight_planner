<!doctype html>
<!-- Banc de l'écran « Jetons des pilotes » (frame/settings/pilot_tokens.js ; G2) : sans lanceur, sans secret, liste, création
     (le jeton montré une fois), trigramme refusé, révocation après question ; refus de GitLab dits par leur raison (401, 403,
     404), jeton de l'administrateur testé et enregistré (1er nov. 2026) ; le jeton créé seul en haut, la liste repliée
     dessous, sept éléments au plus à l'ouverture, une ligne qui commence par le trigramme ; la branche des données fermée
     aux Developers dite, ouverte après une question, la question avant le premier jeton (1er nov. 2026). Contexte du cadre simulé (t, ask, notify,
     routes) : aucun appel réel. window.__tokensBench = { done, pass, fail, rows }. Ouvrir la page suffit. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>pilot tokens — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">pilot_tokens.js — bench</h1>
<pre id="out"></pre>
<div id="view"></div>
<script src="../kit.js?v=0"></script>
<script src="../pilot_tokens.js?v=0"></script>
<script>
  (async () => {
    const out = document.getElementById('out'),
      rows = [];
    const ck = (name, ok, info = '') => {
      rows.push([ok ? 'PASS' : 'FAIL', name, info]);
      out.insertAdjacentHTML('beforeend', `<span class="${ok ? 'PASS' : 'FAIL'}">${ok ? 'PASS' : 'FAIL'}</span> ${name}${ok ? '' : ' — ' + String(info).replace(/</g, '&lt;')}\n`);
    };
    const tick = (ms = 30) => new Promise(r => setTimeout(r, ms));
    const t = (row, v = {}) => String(row[0]).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
    try {
      const S = window.SogScreens['pilot-tokens'],
        view = document.getElementById('view'),
        notes = [],
        calls = [],
        asked = [];
      let tokens = [],
        mode = 'ok',
        answer = true,
        admin = {
          ok: true,
          username: 'chef',
          bot: false,
          scopes: ['api'],
          expires: '2027-06-30',
          level: 40,
          problems: []
        };
      const REFUSALS = {
        401: 'refused',
        403: 'level',
        404: 'project'
      };
      const routes = {
        call: async (route, body) => {
          calls.push([route, body]);
          if (route === 'gitlab/admin/branch') {
            if (admin.branch?.lost) return {
              ok: false,
              status: 400,
              reason: 'unprotected',
              message: 'branch main left unprotected'
            };
            admin = {
              ...admin,
              branch: {
                ...admin.branch,
                protected: true,
                force: false,
                open: true
              }
            };
            return {
              ok: true,
              branch: admin.branch,
              changed: true
            };
          }
          if (route === 'gitlab/admin' && !body) return admin;
          if (route === 'gitlab/admin') return body.token === 'bad' ? {
            saved: false,
            ok: false,
            status: 400,
            reason: 'form'
          } : (mode = 'ok', {
            saved: true,
            ...admin
          });
          if (mode === 'nosecret') return {
            ok: false,
            status: 409,
            reason: 'secret',
            message: 'no GitLab secret'
          };
          if (REFUSALS[mode]) return {
            ok: false,
            status: +mode,
            reason: REFUSALS[mode],
            message: `${mode} GitLab`
          };
          if (route === 'gitlab/tokens' && !body) return {
            ok: true,
            tokens
          };
          if (route === 'gitlab/tokens') {
            const x = {
              id: tokens.length + 7,
              name: body.trigram,
              active: true,
              revoked: false,
              created: '2026-11-01T09:00:00Z',
              expires: '2027-10-29',
              used: null
            };
            tokens = [...tokens, x];
            return {
              ok: true,
              id: x.id,
              name: x.name,
              expires: '2027-10-29',
              token: 'glpat-ONCE'
            };
          }
          if (route === 'gitlab/tokens/revoke') {
            tokens = tokens.map(x => x.id === body.id ? {
              ...x,
              active: false,
              revoked: true
            } : x);
            return {
              ok: true
            };
          }
          return {
            ok: false,
            status: 404
          };
        }
      };
      const ctx = (withRoutes = true) => ({
        t,
        lang: () => 'fr',
        notify: (m, k) => notes.push([m, k]),
        ask: async q => (asked.push(q), answer),
        routes: () => withRoutes ? routes : null
      });
      S.screen(view, ctx(false));
      await tick();
      ck('sans lanceur : la carte le dit, aucun appel', !!view.querySelector('[data-tokens-nolauncher]') && calls.length === 0);
      mode = 'nosecret';
      S.screen(view, ctx());
      await tick();
      ck('sans jeton de l’administrateur sur le poste : la carte le dit et ouvre « Jeton de l’administrateur », ses prérequis dits',
        /collez-le ci-dessous/.test(view.querySelector('[data-tokens-error]')?.textContent || '') && view.querySelector(
          '[data-admintoken]')?.open && /portée api/.test(view.querySelector('[data-admintoken]').textContent) &&
        /Maintainer ou Owner/
        .test(view.querySelector('[data-admintoken]').textContent));
      // les trois refus de GitLab, chacun par sa phrase, le jeton de l'administrateur ouvert dessous
      const said = {};
      for (const code of ['401', '403', '404']) {
        mode = code;
        S.screen(view, ctx());
        await tick();
        said[code] = [view.querySelector('[data-tokens-error]')?.dataset.tokensError, view.querySelector('[data-tokens-error]')
          ?.textContent || '', !!view.querySelector('[data-admintoken]')?.open
        ];
      }
      ck('401 : jeton refusé (absent, expiré ou sans api), à refaire ci-dessous', said[401][0] === 'refused' &&
        /refusé : absent, expiré ou sans la portée api/
        .test(said[401][1]) && said[401][2], JSON.stringify(said[401]));
      ck('403 : ce compte n’est pas Maintainer du projet', said[403][0] === 'level' && /n’est pas Maintainer du projet/.test(said[403][
          1
        ]) &&
        said[403][2], JSON.stringify(said[403]));
      ck('404 : projet introuvable ou jeton sans accès', said[404][0] === 'project' && /Projet introuvable ou jeton sans accès/.test(
        said[
          404][1]) && said[404][2], JSON.stringify(said[404]));
      ck('aucun refus ne montre le message brut seul (« GitLab a refusé »)', !Object.values(said).some(x => /GitLab a refusé/.test(x[
        1])));
      // « Tester » : qui, rôle, portées, expiration ; un jeton sans api refusé d'office ; un compte Developer dit
      view.querySelector('[data-act=atest]').click();
      await tick();
      const r1 = view.querySelector('[data-admin-result]');
      ck('Tester : compte, rôle, portées, expiration, et qu’il peut créer les jetons', r1?.dataset.adminResult === 'ok' && /chef/.test(
          r1
          .textContent) && /Maintainer/.test(r1.textContent) && /api/.test(r1.textContent) && /2027-06-30/.test(r1.textContent), r1
        ?.textContent);
      admin = {
        ...admin,
        ok: false,
        scopes: ['read_api'],
        level: 30,
        problems: ['scope', 'level']
      };
      view.querySelector('[data-act=atest]').click();
      await tick();
      const r2 = view.querySelector('[data-admin-result]');
      ck('Tester : un jeton sans api et un compte Developer, refusés et dits', r2?.dataset.adminResult === 'scope level' &&
        /sans la portée api/
        .test(r2.textContent) && /Developer/.test(r2.textContent) && /n’est pas Maintainer/.test(r2.textContent), r2?.textContent);
      admin = {
        ok: false,
        status: 401,
        reason: 'refused',
        message: '401 Unauthorized'
      };
      view.querySelector('[data-act=atest]').click();
      await tick();
      ck('Tester : un jeton refusé par GitLab, dit par sa phrase', /refusé : absent, expiré/.test(view.querySelector(
        '[data-admin-result]')?.textContent || ''));
      // « Enregistrer et tester » : la saisie va au lanceur, une saisie refusée est dite, le champ du jeton est vidé ensuite
      view.querySelector('[data-f=atok]').value = 'bad';
      view.querySelector('[data-act=asave]').click();
      await tick();
      ck('Enregistrer : une saisie incomplète est dite, rien d’enregistré', /instance en https/.test(view.querySelector(
        '[data-admin-result]')?.textContent || ''));
      admin = {
        ok: true,
        username: 'chef',
        bot: false,
        scopes: ['api'],
        expires: null,
        level: 50,
        problems: []
      };
      view.querySelector('[data-f=ainst]').value = ' https://gitlab.com ';
      view.querySelector('[data-f=aproj]').value = 'acme/data';
      view.querySelector('[data-f=atok]').value = 'glpat-ADMIN';
      view.querySelector('[data-act=asave]').click();
      await tick(80);
      const sent = calls.filter(c => c[0] === 'gitlab/admin' && c[1]).pop()?.[1];
      ck('Enregistrer : instance, projet et jeton au lanceur ; la liste revient ; le champ du jeton vidé, la valeur jamais dans la page',
        sent?.instance === 'https://gitlab.com' && sent?.project === 'acme/data' && sent?.token === 'glpat-ADMIN' && !view
        .querySelector(
          '[data-tokens-error]') && view.querySelector('[data-f=atok]')?.value === '' && !view.innerHTML.includes('glpat-ADMIN') &&
        notes.some(n => n[1] === 'ok') && /Owner/.test(view.querySelector('[data-admin-result]')?.textContent || '') &&
        /sans expiration/
        .test(view.querySelector('[data-admin-result]').textContent), JSON.stringify(sent));
      mode = 'ok';
      S.screen(view, ctx());
      await tick();
      ck('aucun jeton : la liste le dit, le formulaire est là', !view.querySelector('[data-tokens-list]') && !!view.querySelector(
        '[data-act=make]'));
      // ce qui se voit : titres, paragraphes non vides, champs, boutons, liens, résumés (rien de ce qu'un repli cache)
      const seen = () => [...view.querySelectorAll('h2, h3, p, label, button, summary, a, input[data-token-value]')].filter(e => {
        const fold = e.closest('details');
        if (fold && !fold.open && !(e.tagName === 'SUMMARY' && e.parentElement === fold)) return false;
        if (e.tagName !== 'LABEL' && e.closest('label')) return false;
        return !!e.getClientRects().length && (e.tagName === 'INPUT' || !!e.textContent.trim());
      });
      const open0 = seen();
      ck('à l’ouverture : sept éléments au plus, la liste et le jeton de l’administrateur repliés', open0.length <= 7 && !view
        .querySelector(
          '[data-tokens-existing]').open && !view.querySelector('[data-admintoken]').open && /Jetons existants \(0\)/.test(view
          .querySelector('[data-tokens-existing] summary').textContent), open0.map(e => e.tagName + ':' + e.textContent.trim().slice(
          0,
          20)).join(' | '));
      view.querySelector('[data-f=tri]').value = 'a';
      view.querySelector('[data-act=make]').click();
      await tick();
      ck('trigramme refusé : un message, aucun appel de création', /2 à 5/.test(view.querySelector('[data-msg]').textContent) && !calls
        .some(c => c[1]?.trigram));
      view.querySelector('[data-f=tri]').value = 'abc';
      view.querySelector('[data-act=make]').click();
      await tick(80);
      ck('création : le jeton montré une fois, la liste le porte', view.querySelector('[data-token-value]')?.value ===
        'glpat-ONCE' && view.querySelectorAll(
          '[data-token]').length === 1 && calls.some(c => c[0] === 'gitlab/tokens' && c[1]?.trigram === 'ABC' && c[1]?.days === 365));
      // après « Créer » : la carte du jeton seule en haut ; ni formulaire ni jeton de l'administrateur ; la liste repliée dessous
      const card = view.querySelector('[data-tokens-body]').firstElementChild;
      ck('après « Créer » : la carte « Jeton de ABC créé » en premier, le jeton dans un champ, « Copier », copiez-le maintenant, ce qu’il faut dire au pilote, le lien vers son message',
        card?.matches('[data-tokens-new]') && /Jeton de ABC créé/.test(card.querySelector('h3')?.textContent || '') && card
        .querySelector(
          'input[data-token-value][readonly]') && card.querySelector('[data-act=copy]') &&
        /Copiez-le maintenant : il ne sera plus affiché/
        .test(card.textContent) && /2027-10-29/.test(card.textContent) && /Réglages › Accès aux données, avec l’adresse du projet/
        .test(card
          .textContent) && card.querySelector('a[data-tokens-message]')?.getAttribute('href') ===
        '#settings?card=admin&panel=addPilot',
        card?.outerHTML.slice(0, 200));
      ck('après « Créer » : ni formulaire, ni jeton de l’administrateur ; « Jetons existants (1) » replié dessous, « Créer un autre jeton »',
        !view.querySelector('[data-act=make]') && !view.querySelector('[data-admintoken]') && !view.querySelector(
          '[data-tokens-existing]')
        .open && /Jetons existants \(1\)/.test(view.querySelector('[data-tokens-existing] summary').textContent) && !!view
        .querySelector(
          '[data-act=another]'));
      const fresh = view.querySelector('[data-token-fresh]');
      ck('la ligne du nouveau : le trigramme d’abord, créé le, l’expiration, « créé à l’instant » — jamais « jamais utilisé »', !!
        fresh &&
        /^ABC\s+créé le 2026-11-01 · expire le 2027-10-29 · créé à l’instant/.test(fresh.textContent.trim().replace(/\s+/g, ' ')) && !
        /jamais utilisé/.test(fresh.textContent), fresh?.textContent.trim().replace(/\s+/g, ' '));
      view.querySelector('[data-act=another]').click();
      await tick();
      const again = view.querySelector('[data-token="7"]');
      ck('« Créer un autre jeton » : le formulaire revient, le jeton n’est plus dans la page ; la ligne dit alors « jamais utilisé », en dernier',
        !!view.querySelector('[data-act=make]') && !view.innerHTML.includes('glpat-ONCE') && /· jamais utilisé$/.test(again
          ?.textContent
          .trim().replace(/\s+/g, ' ').replace(/ Révoquer$/, '') || ''), again?.textContent.trim().replace(/\s+/g, ' '));
      view.querySelector('[data-f=tri]').value = 'abd';
      view.querySelector('[data-act=make]').click();
      await tick(80);
      window.dispatchEvent(new HashChangeEvent('hashchange'));
      await tick();
      ck('quitter l\u2019écran (autre adresse) efface la valeur du jeton', !view.querySelector('[data-token-value]') && !view.innerHTML
        .includes('glpat-ONCE'));
      S.screen(view, ctx());
      await tick();
      ck('un nouveau dessin efface la valeur du jeton', !view.querySelector('[data-token-value]') && !view.innerHTML.includes(
        'glpat-ONCE'));
      answer = false;
      view.querySelector('[data-act=revoke]').click();
      await tick();
      ck('révocation : rien sans l’accord', !calls.some(c => c[0] === 'gitlab/tokens/revoke'));
      answer = true;
      view.querySelector('[data-act=revoke]').click();
      await tick(80);
      ck('révocation : après l’accord, le jeton est dit révoqué', calls.some(c => c[0] === 'gitlab/tokens/revoke' && c[1]?.id === 7) &&
        !view.querySelector(
          '[data-token="7"] [data-act=revoke]') && /révoqué/.test(view.querySelector('[data-token="7"]').textContent));
      // la branche des données fermée aux Developers (gitlab.com : push aux Maintainers) : dite en tête avec son bouton
      tokens = [];
      admin = {
        ok: true,
        username: 'chef',
        bot: false,
        scopes: ['api'],
        expires: '2027-06-30',
        level: 40,
        problems: [],
        branch: {
          name: 'main',
          protected: true,
          open: false
        }
      };
      S.screen(view, ctx());
      await tick(80);
      const top = view.querySelector('[data-tokens-body]').firstElementChild;
      ck('branche fermée aux Developers : la ligne et son bouton en tête de l’écran', top?.matches('[data-branch=closed]') &&
        /Branche main : push réservé aux Maintainers — les pilotes ne pourront pas écrire/.test(top.textContent) && !!top
        .querySelector(
          '[data-act=bopen]'), top?.outerHTML.slice(0, 160));
      // le premier jeton : la question avant de créer ; « non » crée le jeton sans rien ouvrir
      answer = false;
      asked.length = 0;
      view.querySelector('[data-f=tri]').value = 'xyz';
      view.querySelector('[data-act=make]').click();
      await tick(80);
      ck('premier jeton, branche fermée : la question avant de créer ; « non » crée le jeton sans ouvrir la branche', asked.some(q =>
          /La branche main n’est pas prête pour les pilotes/.test(q)) && !calls.some(c => c[0] === 'gitlab/admin/branch') && calls
        .some(
          c => c[
            0] === 'gitlab/tokens' && c[1]?.trigram === 'XYZ'), JSON.stringify(asked));
      // le bouton : après la question, la route ; la ligne s'en va, la notification le dit
      S.screen(view, ctx());
      await tick(80);
      answer = false;
      view.querySelector('[data-act=bopen]').click();
      await tick(40);
      ck('« Ouvrir la branche aux Developers » : rien sans l’accord', !calls.some(c => c[0] === 'gitlab/admin/branch'));
      answer = true;
      view.querySelector('[data-act=bopen]').click();
      await tick(120);
      ck('« Ouvrir la branche aux Developers » : après l’accord, ouverte par le lanceur, la ligne s’en va, la notification le dit',
        calls
        .some(c => c[0] === 'gitlab/admin/branch') && !view.querySelector('[data-branch=closed]') && notes.some(n =>
          /Branche main réglée : push aux Developers, sans poussée forcée/
          .test(n[0])) && asked.some(q => /sans poussée forcée \?/.test(q)));
      view.querySelector('[data-act=atest]').click();
      await tick();
      ck('Tester : la branche dite ouverte aux Developers, sans poussée forcée',
        /Branche main : ouverte aux Developers, sans poussée forcée/.test(view
          .querySelector('[data-admin-msg]')?.textContent || ''));
      // non protégée, poussée forcée permise : chacune sa phrase, « Protéger la branche » ; la remise refusée : dite
      const lineOf = async branch => {
        admin = {
          ...admin,
          branch
        };
        S.screen(view, ctx());
        await tick(80);
        return view.querySelector('[data-tokens-body]').firstElementChild;
      };
      const un = await lineOf({
        name: 'main',
        protected: false,
        open: false,
        force: false
      });
      const fo = await lineOf({
        name: 'main',
        protected: true,
        open: false,
        force: true
      });
      ck('non protégée, ou poussée forcée permise : jamais « ouverte », chacune sa phrase et « Protéger la branche »', un?.dataset
        .branch ===
        'unprotected' && /non protégée — un jeton de pilote pourrait la réécrire ou la supprimer/.test(un.textContent) &&
        /Protéger la branche/
        .test(un.textContent) && fo?.dataset.branch === 'force' && /poussée forcée permise/.test(fo.textContent), [un?.textContent, fo
          ?.textContent
        ].join(' | '));
      asked.length = 0;
      view.querySelector('[data-act=bopen]').click();
      await tick(120);
      ck('« Protéger la branche » : sa question dit push, fusion, poussée forcée interdite', asked.some(q =>
        /Protéger la branche main \? Push aux Developers et Maintainers, fusion aux Maintainers, poussée forcée interdite/
        .test(q)), JSON.stringify(asked));
      await lineOf({
        name: 'main',
        protected: true,
        open: false,
        force: false,
        lost: true
      });
      notes.length = 0;
      view.querySelector('[data-act=bopen]').click();
      await tick(120);
      ck('la protection perdue (remise refusée) : la notification dit de la reposer dans GitLab', notes.some(n => n[1] === 'err' &&
        /n’est plus protégée : reposez sa protection dans GitLab/
        .test(n[0])), JSON.stringify(notes));
    } catch (x) {
      ck('exception du banc', false, x?.stack || x);
    }
    const pass = rows.filter(r => r[0] === 'PASS').length;
    window.__tokensBench = {
      done: true,
      pass,
      fail: rows.length - pass,
      rows
    };
    out.insertAdjacentHTML('beforeend', `\n${pass}/${rows.length}\n`);
  })();
</script>
</body>
</html>
