<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fuel — route text bench</title>
<!-- Banc du texte de route (frame/lib/route_text.js) : jetons d'un texte libre et d'une liste d'OFP, texte normalisé,
     texte refait depuis des points modifiés — voies gardées entre deux points restés voisins et inchangés, tombées
     ailleurs —, niveaux en /Fnnn, coordonnées OACI. Page d'outil, hors des applications. -->
<style>
  :root {
    color-scheme: light
  }
  body {
    margin: 0;
    padding: 12px;
    background: #f4f6f8;
    color: #17202a;
    font: 13px/1.4 system-ui, sans-serif
  }
  pre {
    white-space: pre-wrap;
    background: #fff;
    border: 1px solid #0002;
    padding: 8px;
    font-size: 12px
  }
  .ok {
    color: #1b7a3a
  }
  .ko {
    color: #b3261e;
    font-weight: 600
  }
</style></head>
<body>
<h1 style="font-size:16px;margin:0 0 8px">fuel — route text bench</h1>
<pre id="out">running…</pre>
<script type="module">
  import * as RT from '../../../frame/lib/route_text.js';
  const lines = [];
  let pass = 0,
    fail = 0;
  /** Compare une valeur (JSON) à l'attendue. */
  const check = (label, got, want) => {
    const g = JSON.stringify(got),
      w = JSON.stringify(want),
      ok = g === w;
    ok ? pass++ : fail++;
    lines.push(`<span class="${ok ? 'ok' : 'ko'}">${ok ? '✓' : '✗'}</span> ${label}: ${g}${ok ? '' : ` (expected ${w})`}`);
  };
  // positions fictives
  const P = {
      LFRS: [47.16, -1.61],
      LUGEN: [46.58, -1.2],
      NEPIX: [45.9, 0.6],
      LFML: [43.44, 5.22],
      XRAY: [46.9, -1.4]
    },
    pt = (id, alt) => ({
      id,
      lat: P[id][0],
      lon: P[id][1],
      ...(alt ? {
        alt_ft: alt
      } : {})
    });
  lines.push('<b>tokens</b>');
  check('free text', RT.tokenize('lfrs n0300f270 dct lugen un869 NEPIX/N0300F280 4530N00030E lfml').map(t => `${t.kind}:${t.id || ''}${t.alt_ft ? '@' + t.alt_ft : ''}${t.airway ? '*' : ''}`), ['name:LFRS',
    'group:@27000', 'name:LUGEN', 'name:UN869*', 'name:NEPIX@28000', 'coord:4530N00030E', 'name:LFML'
  ]);
  check('OFP list', RT.tokenize('LFRS 47.16 -1.61/N0300F270,\nLFML 43.44 5.22').map(t => [t.kind, t.id, t.alt_ft]), [
    ['coord', 'LFRS', 27000],
    ['coord', 'LFML', 0]
  ]);
  check('NAME lat lon in a line', RT.tokenize('LFRS PT1 45.5 0.5 LFML').map(t => t.kind + ':' + t.id), ['name:LFRS', 'coord:PT1',
    'name:LFML'
  ]);
  check('ICAO coordinates', RT.icaoCoord(45.5, -0.8), '4530N00048W');
  check('normalised text', RT.textFromTokens([{
    pt: pt('LFRS')
  }, {
    keep: 'UN869'
  }, {
    pt: pt('LUGEN', 28000)
  }, {
    pt: {
      id: '',
      lat: 45.5,
      lon: .5
    }
  }]), 'LFRS UN869 LUGEN/F280 4530N00030E');
  lines.push('<b>points changed, airways kept where the leg is intact</b>');
  const typed = 'LFRS UN869 LUGEN DCT NEPIX UM3 LFML',
    before = ['LFRS', 'LUGEN', 'NEPIX', 'LFML'].map(id => pt(id));
  check('same points: text unchanged (DCT implicit)', RT.textFromPoints(before, typed, before), 'LFRS UN869 LUGEN NEPIX UM3 LFML');
  check('a point inserted in the direct leg: both airways stay', RT.textFromPoints([pt('LFRS'), pt('LUGEN'), pt('XRAY'), pt('NEPIX'), pt(
    'LFML')], typed, before), 'LFRS UN869 LUGEN XRAY NEPIX UM3 LFML');
  const moved = {
    ...pt('LUGEN'),
    lat: 46.2,
    lon: -0.9
  };
  check('a point of an airway moved: that airway drops, the other stays', RT.textFromPoints([pt('LFRS'), moved, pt('NEPIX'), pt('LFML')],
    typed, before), 'LFRS LUGEN NEPIX UM3 LFML');
  check('a point removed: its airways drop', RT.textFromPoints([pt('LFRS'), pt('NEPIX'), pt('LFML')], typed, before),
    'LFRS NEPIX UM3 LFML');
  check('order changed: the airway of a broken pair drops', RT.textFromPoints([pt('LFRS'), pt('NEPIX'), pt('LUGEN'), pt('LFML')], typed),
    'LFRS NEPIX LUGEN LFML');
  check('a level on a point: written, airways kept', RT.textFromPoints([pt('LFRS'), pt('LUGEN'), pt('NEPIX', 28000), pt('LFML')], typed),
    'LFRS UN869 LUGEN NEPIX/F280 UM3 LFML');
  check('without previous positions: same names = unchanged', RT.textFromPoints([pt('LFRS'), pt('LUGEN'), pt('XRAY'), pt('NEPIX'), pt(
    'LFML')], typed), 'LFRS UN869 LUGEN XRAY NEPIX UM3 LFML');
  check('a point without a usable name: ICAO coordinates', RT.textFromPoints([pt('LFRS'), {
    id: 'point 1',
    lat: 45.5,
    lon: .5
  }, pt('LFML')], 'LFRS LFML'), 'LFRS 4530N00030E LFML');
  check('speed-level group of the old text ignored', RT.textFromPoints(before, 'LFRS N0300F270 UN869 LUGEN NEPIX UM3 LFML'),
    'LFRS UN869 LUGEN NEPIX UM3 LFML');
  lines.push('<b>level notation</b>');
  check('FL060 above the transition', RT.formatLevel(6000), 'FL060');
  check('at the transition', RT.formatLevel(5000), 'FL050');
  check('below: feet, thin space', RT.formatLevel(3500), '3 500 ft');
  check('rounded to the hundred', RT.formatLevel(3449), '3 400 ft');
  check('another transition (FL070)', RT.formatLevel(6000, 7000), '6 000 ft');
  check('no value', RT.formatLevel(null), '');
  document.getElementById('out').innerHTML = `${pass} passed, ${fail} failed\n` + lines.join('\n');
  document.title = `fuel — route text bench: ${fail ? 'FAIL' : 'OK'} (${pass}/${pass + fail})`;
</script>
</body></html>
