<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>fuel — sheets bench</title>
<!-- Banc des fiches V3 (frame/aerodb/sheets.js, logique reprise de fuel par aerodb le 23/10/2026) : mêmes entrées que celles passées le 22/10/2026 aux fonctions de la V2
     (apps/planner/performance_sheets.html) — écriture et relecture .lnmperf, CSV enrichi, réponse ChatGPT désordonnée
     (bloc de code, commentaire, virgule finale, unités dans les valeurs), différences entre deux fiches, champs
     comblés par une autre fiche, date d'une fiche, valeurs à plat, champs manquants ; résultats attendus dans
     sheets_v2.json (identifiants aléatoires, dates et date de création .lnmperf écartés). Page d'outil, servie par un
     serveur (fetch du JSON). Deux écarts voulus de la V3 sont reportés dans sheets_v2.json : engineType est devenu
     airframe + propulsion (28/10/2026), et une fiche en kg s'écrit en .lnmperf en livres (c14aac84b). La suite du banc
     (cellule et propulsion déduites de la base OACI, migration, familles de champs manquants) n'a pas de relevé V2. -->
<style>
  :root {
    color-scheme: light
  }
  body {
    margin: 0;
    padding: 12px;
    background: #f4f6f8;
    color: #17202a;
    font: 13px/1.4 system-ui, sans-serif
  }
  pre {
    white-space: pre-wrap;
    background: #fff;
    border: 1px solid #0002;
    padding: 8px;
    font-size: 12px
  }
  .ok {
    color: #1b7a3a
  }
  .ko {
    color: #b3261e;
    font-weight: 600
  }
</style></head>
<body>
<h1 style="font-size:16px;margin:0 0 8px">fuel — sheets bench</h1>
<pre id="out">running…</pre>
<script src="../performance_model.js?v=0"></script>
<script src="../model.js?v=0"></script>
<script src="../perf_prompt.js?v=0"></script>
<script src="../../../frame/aerodb/sheets.js?v=0"></script>
<script>
  (async () => {
    'use strict';
    const V2 = await fetch('sheets_v2.json').then(r => r.json()),
      // base des types factice (classement comme aerodb.aircraft().classify : famille et motorisation de la description
      // OACI, dirigeable / ballon par la fiche) ; ZZ.. : codes d'essai, EC45 : un hélicoptère de la base
      STUB = {
        ZZJ2: {
          description: 'L2J'
        },
        ZZT2: {
          description: 'L2T'
        },
        ZZP1: {
          description: 'L1P'
        },
        ZZH2: {
          description: 'H2T'
        },
        EC45: {
          description: 'H2T'
        },
        ZZH1: {
          description: 'H1P'
        },
        ZZGY: {
          description: 'G1P'
        },
        ZZTR: {
          description: 'T2T'
        },
        ZZRK: {
          description: 'L1R'
        },
        ZZAS: {
          kind: 'airship',
          engines: 2,
          engine_type: 'P'
        },
        ZZPR: {
          description: 'L2J',
          pressurized: true
        }
      },
      classify = c => {
        const code = String(c || '').toUpperCase(),
          rec = STUB[code] || null,
          d = String(rec?.description || ''),
          kind = rec?.kind === 'airship' || rec?.kind === 'balloon' ? rec.kind : '';
        return {
          code,
          rec,
          kind,
          family: kind ? 'B' : d[0] && 'LSAHGT'.includes(d[0]) ? d[0] : '',
          power: kind ? String(rec.engine_type || '').toUpperCase() : d[2] && 'JTPER'.includes(d[2]) ? d[2] : ''
        };
      },
      F = window.AeroDBSheets.configure({
        lang: () => 'en', // langue de la page V2 au relevé
        aircraft: {
          classify,
          related: c => [c],
          record: c => STUB[c] || null,
          perf: () => null
        }
      }),
      lines = [];
    let pass = 0,
      fail = 0;
    /** Copie sans les identifiants aléatoires ni les dates (comme le relevé de la V2). */
    const strip = o => JSON.parse(JSON.stringify(o, (k, v) => ['_rowId', 'importedAt', 'at', 'appliedAt', 'fetchedAt', 'updatedAt']
      .includes(
        k) ? undefined : v));
    /** Compare un résultat V3 au résultat relevé sur la V2. */
    const check = (label, got, want) => {
      const a = String(JSON.stringify(got)),
        b = String(JSON.stringify(want)),
        ok = a === b;
      ok ? pass++ : fail++;
      lines.push(`<span class="${ok ? 'ok' : 'ko'}">${ok ? '✓' : '✗'}</span> ${label}${ok ? '' : `\n  V3 ${a.slice(0, 600)}\n  V2 ${b.slice(0, 600)}`}`);
    };
    const SHEET = {
      id: 'TEST_TP',
      name: 'Test turboprop',
      icao: 'ZZTP',
      unit: 'kg',
      propulsion: 'turboprop',
      fuelAsVolume: false,
      jetFuel: true,
      usableFuel: 5000,
      taxiFuel: 30,
      reserveFuel: 350,
      extraFuel: 0,
      contingencyPercent: 5,
      minRunwayLengthFt: 3000,
      runwayType: 'HARD',
      alternate: {
        fuelFlowPerHour: 900,
        tasKt: 280
      },
      cruise: {
        tasKt: 300,
        fuelFlowPerHour: 1000,
        refAltFt: 20000,
        ceilingFt: 25000
      },
      climb: {
        iasKt: 180,
        rateFpm: 1500,
        fuelFlowPerHour: 1300,
        tasKt: 220
      },
      descent: {
        rateFpm: -1500,
        tasKt: 250,
        fuelFlowPerHour: 450
      },
      taxi: {
        fuelFlowPerHour: 200
      },
      reserveFuelFlowPerHour: 700,
      tod: {
        gradientFtPerNm: 300,
        bufferNm: 5
      },
      rpmFuelCurve: [{
        rpm: 900,
        fuelFlowPerHour: 800
      }, {
        rpm: 1000,
        fuelFlowPerHour: 1000
      }]
    };
    const noDate = x => String(x).replace(/<CreationDate>[^<]*<\/CreationDate>/, '<CreationDate/>');
    const lnm = F.toLnmperf(F.normalize(structuredClone(SHEET)));
    check('.lnmperf written', noDate(lnm), noDate(V2.lnm));
    check('.lnmperf read back', strip(F.parseLnmperf(lnm, 'test.lnmperf')), V2.lnmBack);
    const CSV =
      'Aircraft;ICAO;Registration;Confidence;Basis;Cruise TAS kt;Cruise Fuel Flow lb/h;Climb Rate fpm;Descent Rate fpm;Service Ceiling ft;Fuel Flow vs RPM / Power;LNM Min Runway ft\nTest Twin;ZZTW;F-TEST;medium;manual;250;900;1800;1500;25000;1 000 RPM : 800-900 lb/h | 1 100 RPM : 950 lb/h;3000';
    check('enriched CSV', strip(F.parsePerformanceCsvEnriched(CSV, 'test.csv')), V2.csv);
    const GPT =
      'Here is the sheet:\n```json\n{\n  // profile\n  "name": "Test jet",\n  "icao": "ZZJT",\n  "unit": "kg",\n  "propulsion": "jet",\n  "cruise": { "tasKt": "450 kt", "fuelFlowPerHour": "2,400", "refAltFt": 35000, },\n  "climb": { "iasKt": 280, "rateFpm": 2500 },\n  "descent": { "rateFpm": -2000 },\n  "estimated": ["climb.rateFpm"],\n  "sources": ["manufacturer brochure"]\n}\n```\nHope it helps.';
    // V2 lisait « 2,400 » comme 2,4 ; la V3 corrige (gptNumberText) : seule cette valeur diffère du relevé V2
    const gptV3 = structuredClone(V2.gpt);
    gptV3.profile.cruise.fuelFlowPerHour = 2400;
    check('ChatGPT reply (any shape)', strip(F.parseGptReply(GPT)), gptV3);
    for (const [txt, want] of [
        ['2,400', 2400],
        ['1,234.5', 1234.5],
        ['12,500 kg/h', 12500],
        ['2.400,5', 2400.5],
        ['2,5', 2.5],
        ['0,850', 0.85],
        ['0.78', 0.78],
        ['1500', 1500]
      ]) check(`ChatGPT number "${txt}"`, F.normalize(F.parseGptReply(`{"cruise": {"fuelFlowPerHour": "${txt}"}}`).profile).cruise
      .fuelFlowPerHour, want);
    check('ChatGPT number text "-1,500 ft/min"', F.gptNumberText('-1,500 ft/min'), '-1500 ft/min');
    const A = F.normalize(structuredClone(SHEET)),
      B = F.normalize({
        ...structuredClone(SHEET),
        id: 'TEST_TP2',
        name: 'Test turboprop B',
        cruise: {
          tasKt: 310,
          fuelFlowPerHour: 980
        },
        usableFuel: null,
        climb: {
          iasKt: 185
        }
      });
    check('differences between two sheets', strip(F.profileDiff(A, B)), V2.diff);
    const C = F.normalize({
      id: 'GAPS',
      icao: 'ZZTP',
      unit: 'kg',
      cruise: {
        tasKt: 300
      }
    });
    check('gaps filled from another sheet', strip(F.fillProfileGaps(C, A)), V2.fill);
    check('sheet date (latest of its dates)', F.profileWhen({
      updatedAt: '2026-10-01T00:00:00Z',
      source: {
        importedAt: '2026-10-05T00:00:00Z'
      }
    }), V2.when);
    check('sheet values flattened', F.profileLeaves(A), V2.leaves);
    check('missing fields', F.sheetMissingPaths(F.normalize({
      id: 'X',
      cruise: {
        tasKt: 300
      }
    })), V2.missing);
    // ---- V3 : cellule et propulsion déduites de la base OACI à la place d'engineType (aerodb DECISIONS, 28 Oct 2026)
    lines.push('<b>airframe and propulsion (V3)</b>');
    const facts = icao => F.catalogFacts({
      icao
    });
    check('catalogFacts L2J → aeroplane, jet', facts('ZZJ2'), {
      airframe: 'aeroplane',
      propulsion: 'jet'
    });
    check('catalogFacts L2T → aeroplane, turboprop', facts('ZZT2'), {
      airframe: 'aeroplane',
      propulsion: 'turboprop'
    });
    check('catalogFacts L1P → aeroplane, piston', facts('ZZP1'), {
      airframe: 'aeroplane',
      propulsion: 'piston'
    });
    check('catalogFacts H2T → helicopter, turboshaft', facts('ZZH2'), {
      airframe: 'helicopter',
      propulsion: 'turboshaft'
    });
    check('catalogFacts H1P → helicopter, piston', facts('ZZH1'), {
      airframe: 'helicopter',
      propulsion: 'piston'
    });
    check('catalogFacts G1P → gyroplane, piston', facts('ZZGY'), {
      airframe: 'gyroplane',
      propulsion: 'piston'
    });
    check('catalogFacts T2T (tiltrotor) → propulsion only', facts('ZZTR'), {
      propulsion: 'turboprop'
    });
    check('catalogFacts rocket (R) → airframe only', facts('ZZRK'), {
      airframe: 'aeroplane'
    });
    check('catalogFacts airship → airship, piston', facts('ZZAS'), {
      airframe: 'airship',
      propulsion: 'piston'
    });
    check('catalogFacts GLID → glider, none', facts('GLID'), {
      airframe: 'glider',
      propulsion: 'none'
    });
    check('catalogFacts BALL → balloon, none', facts('BALL'), {
      airframe: 'balloon',
      propulsion: 'none'
    });
    check('catalogFacts unknown code → nothing', facts('QQQQ'), {});
    check('catalogFacts reads icao, then type, then id', [F.catalogFacts({
      type: 'ZZJ2'
    }), F.catalogFacts({
      id: 'ZZJ2'
    })], [{
      airframe: 'aeroplane',
      propulsion: 'jet'
    }, {
      airframe: 'aeroplane',
      propulsion: 'jet'
    }]);
    check('catalogFacts pressurized only from a boolean of the record', [facts('ZZPR').pressurized, 'pressurized' in facts('ZZJ2')], [
      true,
      false
    ]);
    check('effective values: the sheet\'s own first, the catalogue\'s otherwise', F.effectiveFacts({
      icao: 'ZZJ2',
      propulsion: 'other'
    }), {
      airframe: 'aeroplane',
      propulsion: 'other'
    });
    // migration à la lecture
    const mig = p => {
      const q = F.normalize(structuredClone(p));
      return [q.engineType, q.airframe, q.propulsion];
    };
    check('migration: EC45 with engineType turboprop (a ChatGPT guess) → nothing stored', mig({
      id: 'EC45',
      icao: 'EC45',
      engineType: 'turboprop'
    }), [undefined, undefined, undefined]);
    check('migration: unknown code + turboprop → propulsion turboprop', mig({
      id: 'QQ1',
      icao: 'QQQQ',
      engineType: 'turboprop'
    }), [undefined, undefined, 'turboprop']);
    check('migration: unknown code + helicopter + turboprop → turboshaft', mig({
      id: 'QQ2',
      icao: 'QQQQ',
      airframe: 'helicopter',
      engineType: 'turboprop'
    }), [undefined, 'helicopter', 'turboshaft']);
    check('migration: a propulsion already stored is kept', mig({
      id: 'QQ3',
      icao: 'QQQQ',
      propulsion: 'piston',
      engineType: 'jet'
    }), [undefined, undefined, 'piston']);
    check('migration: engineType auto is only dropped', mig({
      id: 'QQ4',
      icao: 'QQQQ',
      engineType: 'auto'
    }), [undefined, undefined, undefined]);
    check('migration: "auto" in the new fields is removed', mig({
      id: 'QQ5',
      icao: 'QQQQ',
      airframe: 'auto',
      propulsion: 'auto'
    }), [undefined, undefined, undefined]);
    // champs manquants
    const miss = p => F.sheetMissingPaths(F.normalize(p));
    check('missing: unknown type still lists airframe and propulsion', miss({
      id: 'X',
      icao: 'QQQQ'
    }).filter(k => ['airframe', 'propulsion'].includes(k)), ['airframe', 'propulsion']);
    check('missing: deduced airframe and propulsion are not listed, the rpm fields are', miss({
      id: 'X',
      icao: 'ZZJ2'
    }).filter(k => ['airframe', 'propulsion', 'taxi.rpmNominal', 'cruise.rpmNominal', 'rpmFuelCurve'].includes(k)), [
      'taxi.rpmNominal',
      'cruise.rpmNominal', 'rpmFuelCurve'
    ]);
    check('missing: a stored propulsion is not listed either', miss({
      id: 'X',
      icao: 'QQQQ',
      propulsion: 'jet'
    }).filter(k => ['airframe', 'propulsion'].includes(k)), ['airframe']);
    check('missing: a pressurized flag of the catalogue is not listed', [miss({
      id: 'X',
      icao: 'ZZPR'
    }).includes('pressurized'), miss({
      id: 'X',
      icao: 'ZZJ2'
    }).includes('pressurized')], [false, true]);
    check('missing: iasKt is still listed when tasKt is filled', miss({
      id: 'X',
      icao: 'ZZJ2',
      cruise: {
        tasKt: 300
      }
    }).includes('cruise.iasKt'), true);
    // altitude de rétablissement : comptée et demandée pour un moteur à pistons ou une propulsion inconnue seulement
    const crit = p => miss(p).includes('engineCriticalAltFt');
    check('missing: critical altitude not listed for a jet (catalogue)', crit({
      id: 'X',
      icao: 'ZZJ2'
    }), false);
    check('missing: critical altitude not listed for a turboshaft helicopter (catalogue)', crit({
      id: 'X',
      icao: 'ZZH2'
    }), false);
    check('missing: critical altitude not listed for a stored jet propulsion', crit({
      id: 'X',
      icao: 'QQQQ',
      propulsion: 'jet'
    }), false);
    check('missing: critical altitude listed for a piston (catalogue) when empty', crit({
      id: 'X',
      icao: 'ZZP1'
    }), true);
    check('missing: critical altitude listed for a stored piston when empty', crit({
      id: 'X',
      icao: 'QQQQ',
      propulsion: 'piston'
    }), true);
    check('missing: critical altitude not listed for a piston once filled', crit({
      id: 'X',
      icao: 'ZZP1',
      engineCriticalAltFt: 8000
    }), false);
    check('missing: critical altitude listed when the propulsion is unknown', crit({
      id: 'X',
      icao: 'QQQQ'
    }), true);
    check('missing: the stored propulsion wins over the catalogue for the critical altitude', crit({
      id: 'X',
      icao: 'ZZJ2',
      propulsion: 'piston'
    }), true);
    // familles de champs manquants, dans l'ordre de la liste des fiches
    check('families: ordered, once each', F.sheetMissingFamilies(['pressurized', 'taxiFuel', 'runwayType', 'cruise.tasKt',
      'climb.rpmNominal',
      'cruise.refAltFt', 'climb.rateFpm', 'descent.fuelFlowPerHour', 'usableFuel', 'jetFuel', 'foo', 'rpmFuelCurve', 'climb.iasKt'
    ]), ['rpm', 'speeds', 'cruise', 'rates', 'flows', 'taxi', 'runway', 'fuel', 'aircraft', 'other']);
    check('families: taxi.rpmNominal is a rpm, taxi.fuelFlowPerHour a taxi, cruise.fuelFlowPerHour a cruise', [
      F.sheetMissingFamilies(['taxi.rpmNominal']), F.sheetMissingFamilies(['taxi.fuelFlowPerHour']), F.sheetMissingFamilies([
        'cruise.fuelFlowPerHour'
      ]), F.sheetMissingFamilies(['alternate.fuelFlowPerHour']), F.sheetMissingFamilies(['engineCriticalAltFt', 'airframe'])
    ], [
      ['rpm'],
      ['taxi'],
      ['cruise'],
      ['flows'],
      ['aircraft']
    ]);
    check('families: nothing missing → none', F.sheetMissingFamilies([]), []);
    // réponse de ChatGPT : la base OACI prime, les mots libres sont ramenés à la liste
    const reply = (icao, o) => F.parseGptReply(JSON.stringify({
      icao,
      cruise: {
        tasKt: 300
      },
      ...o
    }), icao);
    check('reply: keys the catalogue deduces are dropped (catalogue wins)', ['airframe', 'propulsion'].map(k => k in reply('ZZJ2', {
      airframe: 'helicopter',
      propulsion: 'piston'
    }).profile), [false, false]);
    check('reply: the other keys are kept', reply('ZZJ2', {
      propulsion: 'piston'
    }).profile.cruise.tasKt, 300);
    const free = (k, v) => reply('QQQQ', {
      [k]: v
    });
    for (const [k, v, want] of [
        ['propulsion', 'turbofan', 'jet'],
        ['propulsion', 'Turbojet', 'jet'],
        ['propulsion', 'turboshaft', 'turboshaft'],
        ['propulsion', 'free-turboshaft', 'turboshaft'],
        ['propulsion', 'turboprop', 'turboprop'],
        ['propulsion', 'reciprocating', 'piston'],
        ['propulsion', 'piston', 'piston'],
        ['airframe', 'Helicopter', 'helicopter'],
        ['airframe', 'heli', 'helicopter'],
        ['airframe', 'autogyro', 'gyroplane'],
        ['airframe', 'sailplane', 'glider'],
        ['airframe', 'blimp', 'airship'],
        ['airframe', 'airplane', 'aeroplane']
      ]) check(`reply: ${k} "${v}" → ${want}`, free(k, v).profile[k], want);
    const odd = free('propulsion', 'warp drive');
    check('reply: a value out of the list is dropped with a warning', [odd.profile.propulsion, odd.warnings.some(w => /propulsion/.test(
      w))], [
      undefined, true
    ]);
    lines.unshift(`<b class="${fail ? 'ko' : 'ok'}">${pass} passed, ${fail} failed</b>`);
    document.getElementById('out').innerHTML = lines.join('\n');
    document.title = `fuel — sheets bench: ${fail ? 'FAIL' : 'OK'} (${pass}/${pass + fail})`;
    // compte rendu lu par le contrôle de non-régression (tests/v3, cas F10)
    window.__bench = {
      pass,
      fail,
      rows: lines.filter(l => l.includes('class="ko"')),
      done: true
    };
  })().catch(e => {
    document.getElementById('out').textContent = 'ERROR ' + e.stack;
    document.title = 'fuel — sheets bench: ERROR';
  });
</script>
</body></html>
