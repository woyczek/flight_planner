<!doctype html>
<!-- Banc de la section « Tiroirs » (modules/missions/drawers_view.js, SOG-0441 lot T2) : la vue montée dans une page nue avec un FAUX
     cadre (données en mémoire, traduction, notifications) — mission feuilletée ou jouée, l'ORDRE (seul le premier tiroir fermé s'ouvre,
     les suivants disent « après le tiroir n »), la clé en clair, « Ouvrir le tiroir » en deux temps, l'ouverture à l'heure et sa
     notification, le carnet d'un autre (constat, geste, refus, « reçu ici à … »), le départ réel écrit, « Resceller », la fiche
     redessinée, le passage de synchronisation à la minute, douze tiroirs. Missions, trigrammes et positions inventés.
     window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>drawers view — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
  #stage {
    max-width: 390px;
    border: 1px dashed #999;
    padding: 8px;
    margin: 8px 0
  }
</style>
</head>
<body>
<h1 style="font-size:16px">drawers_view.js — bench</h1>
<div id="stage"></div>
<pre id="out"></pre>
<script type="module">
  import * as DV from '../drawers_view.js?v=0';
  const out = document.getElementById('out'),
    stage = document.getElementById('stage'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      detail: ok ? '' : typeof got === 'string' ? got : JSON.stringify(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + rows[rows.length - 1].detail}`;
    out.append(l);
  }
  const MIN = 60e3,
    ID = 'X-701A',
    iso = ms => new Date(ms).toISOString(),
    sleep = ms => new Promise(r => setTimeout(r, ms)),
    /** Attend qu'une condition soit vraie (4 s au plus). */
    until = async (fn, ms = 4000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          if (fn()) return true;
          await sleep(40);
        }
        return !!fn();
      },
      z = ms => `${String(new Date(ms).getUTCHours()).padStart(2, '0')}:${String(new Date(ms).getUTCMinutes()).padStart(2, '0')}Z`;

  /** Un faux cadre : les documents en mémoire, les écritures annoncées aux écoutes, les notifications gardées. */
  function fakeCtx({
    trigram = 'AAA',
    level = 1,
    docs = {}
  } = {}) {
    const store = new Map(Object.entries(docs)),
      watchers = new Set(),
      c = {
        identity: {
          trigram
        },
        level,
        notes: [],
        asked: [], // les chemins demandés au cadre
        synced: 0,
        store,
        t: (row, v) => String(row[0]).replace(/\{(\w+)\}/g, (_, k) => v?.[k] ?? ''),
        notify: (text, kind) => c.notes.push([kind, text]),
        data: {
          get: async p => (c.asked.push(p), store.has(p) ? structuredClone(store.get(p)) : null),
          put: async (p, v) => {
            store.set(p, structuredClone(v));
            for (const w of watchers)
              if (p.startsWith(w.prefix)) w.fn([p]);
          },
          watch: (prefix, fn) => {
            const w = {
              prefix,
              fn
            };
            watchers.add(w);
            return () => watchers.delete(w);
          },
          sync: async () => {
            c.synced++;
          }
        }
      };
    return c;
  }
  /** L'index des affectations : AAA et BBB sur la mission, décollage à cet instant. */
  const index = takeoff => ({
    assignments: [{
      mission: ID,
      pilot: 'AAA',
      takeoff: iso(takeoff),
      role: 'mission'
    }, {
      mission: ID,
      pilot: 'BBB',
      takeoff: iso(takeoff),
      role: 'mission'
    }]
  });
  // les tiroirs, à la forme rendue par frame/lib/mission.js
  const HAND = {
      title: 'Retour <img src=x onerror="window.__xss=1">',
      message: 'Fin de mission.',
      brief: 'Retour au terrain.',
      key: {
        kind: 'hand'
      }
    },
    TIME = {
      title: 'Nouvel ordre',
      message: 'CYRANO : cap au nord.',
      brief: 'Rejoindre le point N.\nAltitude 2 000 ft.',
      key: {
        kind: 'time',
        point: 'ORIGIN',
        delayMin: 40
      }
    },
    ZONE = {
      title: 'Recherche',
      message: 'Zone atteinte.',
      brief: '',
      key: {
        kind: 'zone',
        shape: {
          circle: {
            lat: 44.5,
            lon: -1.2,
            radiusM: 3000
          }
        },
        ceilingFt: null,
        shown: true,
        fallbackMin: 90
      }
    },
    LETTERS = 'BCDEFGHIJKLM',
    /** Une mission faite de ces tiroirs, dans cet ordre (identifiants B, C, D… par la place). */
    missionOf = (...list) => ({
      id: ID,
      drawers: list.map((d, i) => ({
        ...d,
        id: LETTERS[i]
      }))
    }),
    mission = missionOf(HAND, TIME, ZONE); // 1 : le geste ; 2 : l'heure (H + 40) ; 3 : la zone (repli H + 90)
  /** Un élément [data-drawers] neuf dans la scène (la fiche redessinée). */
  const host = () => {
    stage.innerHTML = '<section data-drawers></section>';
    return stage.firstChild;
  };
  const q = sel => stage.querySelector(sel),
    qa = sel => [...stage.querySelectorAll(sel)],
    text = sel => (q(sel)?.textContent || '').replace(/\s+/g, ' ').trim(),
    BOOK = 'pilot/AAA/missions/X-701A.json',
    PEER = 'pilot/BBB/missions/X-701A.json',
    SEEN = 'cache/missions/seen_X-701A.json',
    /** Monte la section sur une mission et attend ses lignes. */
    mount = async (c, m, n, more = {}) => {
        DV.show(host(), {
          ctx: c,
          id: ID,
          mission: m,
          ...more
        });
        if (n) await until(() => qa('[data-dw]').length === n);
      },
      /** Le geste en deux temps sur ce tiroir. */
      twice = async id => {
          q(`[data-dw-open="${id}"]`).click();
          q(`[data-dw-open="${id}"]`).click();
          await until(() => !!q(`[data-dw="${id}"][data-open]`));
        },
        gestures = () => qa('[data-dw-open]').map(b => b.dataset.dwOpen).join();

  // ---- 1. une mission qu'on feuillette : une ligne, rien d'autre
  let ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: [{
          mission: ID,
          pilot: 'BBB',
          takeoff: iso(Date.now())
        }]
      }
    }
  });
  await mount(ctx, mission, 0);
  await sleep(150);
  ck('mission feuilletée (ni affectée à moi, ni celle de mon vol) : une seule ligne « Tiroirs : 3 », ni titre, ni clé, ni geste, sans « data-mine »',
    text('[data-dw-count]').startsWith('Tiroirs : 3') && !q('[data-dw]') && !q('button') && !text('[data-drawers]').includes(
      'Recherche') && !q('[data-drawers]').hasAttribute('data-mine'), text('[data-drawers]'));
  await mount(ctx, {
    id: ID,
    drawers: []
  }, 0);
  ck('mission sans tiroir : la section est cachée et vide', q('[data-drawers]').hidden === true && q('[data-drawers]').innerHTML === '');

  // ---- 2. MA mission : l'ordre — seul le premier tiroir fermé a son geste
  const T0 = Date.now() - 40 * MIN + 3000; // le décollage affecté : l'heure du tiroir 2 passe dans 3 s
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T0)
    }
  });
  DV.show(host(), {
    ctx,
    id: ID,
    mission
  });
  ck('avant la lecture des affectations : la ligne « Tiroirs : 3 », jamais un tiroir montré trop tôt', !!q('[data-dw-count]') && !q(
    '[data-dw]'));
  await until(() => qa('[data-dw]').length === 3);
  ck('mission affectée : trois tiroirs fermés, dits par leur rang (« Tiroir 1, 2, 3 », jamais une lettre), une enveloppe chacun ; la section porte « data-mine »',
    qa('[data-dw]').map(e => e.dataset.dw).join() === 'B,C,D' && !q('[data-open]') && text('h3') === 'Tiroirs' && text(
      '[data-dw="C"] .dw-top') === 'Tiroir 2 · Nouvel ordre' && text('[data-dw="D"] [data-dw-n]') === 'Tiroir 3' && qa(
      '[data-dw] .dw-ico').length === 3 && q('[data-drawers]').hasAttribute('data-mine'), text('[data-drawers]'));
  ck('l\'ordre : « Ouvrir le tiroir » n\'est proposé que sur le premier tiroir fermé ; les suivants disent « après le tiroir n », sans clé ni geste',
    gestures() === 'B' && text('[data-dw="B"] [data-dw-key]') === 'à ouvrir à la main' && text('[data-dw="C"] [data-dw-after]') ===
    'après le tiroir 1' && text('[data-dw="D"] [data-dw-after]') === 'après le tiroir 2' && !q('[data-dw="C"] [data-dw-key]') && !q(
      '[data-dw-note]') && qa('[data-locked]').length === 2, text('[data-drawers]'));
  ck('un titre hostile est affiché comme du texte, jamais interprété', !window.__xss && !q('[data-drawers] img') && text('[data-dw="B"]')
    .includes('<img src=x'), text('[data-dw="B"]'));
  ck('fermé : ni message ni briefing dans la page', !q('[data-dw-text]') && !text('[data-drawers]').includes('CYRANO') && !text(
    '[data-drawers]').includes('Fin de mission'));

  // ---- 3. « Ouvrir le tiroir » en deux temps ; l'heure du tiroir 2 passée pendant que le 1 est fermé
  q('[data-dw-open="B"]').click();
  ck('premier temps : « Confirmer : ouvrir maintenant », rien d\'écrit', text('[data-dw-open="B"]') === 'Confirmer : ouvrir maintenant' &&
    q('[data-dw-open="B"]').hasAttribute('data-armed') && !ctx.store.has(BOOK), text('[data-dw-open="B"]'));
  await sleep(5300);
  ck('sans second temps dans les cinq secondes : désarmé, rien d\'écrit ; l\'heure du tiroir 2, passée entre-temps, n\'a rien ouvert (le tiroir 1 est fermé)',
    text('[data-dw-open="B"]') === 'Ouvrir le tiroir' && !ctx.store.has(BOOK) && !q('[data-open]') && ctx.notes.length === 0, [text(
      '[data-drawers]'), ctx.notes]);
  await twice('B');
  const book = ctx.store.get(BOOK);
  ck('second temps : le carnet de CE pilote est écrit (le tiroir, « hand », la séance, l\'auteur), et lui seul', book?.drawer_B?.state ===
    'open' && book.drawer_B.how === 'hand' && book.seance === `A:${iso(T0).slice(0, 10)}` && book.by === 'AAA' && book.mission === ID && !book.drawer_C && !
    book.drawer_D && [...ctx.store.keys()].filter(k => k.startsWith('pilot/')).join() === BOOK, [book, [...ctx.store.keys()]]);
  ck('le tiroir 1 est ouvert « à la main », son message (détaché) et son briefing sont là, plus de bouton ; un passage de synchronisation est demandé',
    q('[data-dw="B"]').dataset.open === 'hand' && /^ouvert à la main, à \d\d:\d\dZ$/.test(text('[data-dw="B"] [data-dw-how]')) && text(
      '[data-dw="B"] [data-dw-msg]') === 'Fin de mission.' && text('[data-dw="B"] [data-dw-brief]') === 'Retour au terrain.' && !q(
      '[data-dw-open="B"]') && ctx.synced === 1, [text('[data-dw="B"]'), ctx.synced]);
  await until(() => !!q('[data-dw="C"][data-open]'));
  ck('l\'heure passée du tiroir 2 joue dès que le 1 s\'ouvre : « ouvert à l\'heure », à l\'heure de cette ouverture ; une notification le dit (« Tiroir 2 ouvert »), mon geste n\'en a pas',
    q('[data-dw="C"]')?.dataset.open === 'time' && /^ouvert à l'heure, à \d\d:\d\dZ$/.test(text('[data-dw="C"] [data-dw-how]')) && text(
      '[data-dw="C"] [data-dw-text]').includes('CYRANO') && ctx.notes.length === 1 && ctx.notes[0][0] === 'ok' && ctx.notes[0][1]
    .startsWith('Tiroir 2 ouvert'), [text('[data-dw="C"]'), ctx.notes]);
  ck('le tiroir 3 devient le premier fermé : sa clé en clair (« montrée sur la Carte »), son geste, et, sans position en direct, l\'heure à laquelle il s\'ouvrira — l\'heure d\'abord, une seule fois',
    text('[data-dw="D"] [data-dw-key]') === 's\'ouvre au passage de la zone montrée sur la Carte' && text(
      '[data-dw="D"] [data-dw-note]') === `Sans position en direct sur cet appareil : le tiroir s'ouvrira à ${z(T0 + 90 * MIN)} (heure estimée)` && gestures() === 'D' && !q('[data-locked]'), [text('[data-dw="D"]')]);

  // ---- 4. la fiche redessinée : le même état dans un élément neuf
  DV.show(host(), {
    ctx,
    id: ID,
    mission
  });
  ck('la fiche redessinée : les trois tiroirs sont repeints tout de suite dans l\'élément neuf, dans leur état', qa('[data-dw]').length ===
    3 && qa('[data-open]').length === 2 && !!q('[data-dw-open="D"]'));
  q('[data-dw-open="D"]').click();
  ck('un toucher sur l\'élément neuf arme une fois (une seule écoute)', text('[data-dw-open="D"]') === 'Confirmer : ouvrir maintenant' && !
    ctx.store.get(BOOK).drawer_D);

  // ---- 5. le carnet d'un autre pilote de la mission, sur le premier tiroir fermé
  const peer = (entry, at = T0) => ({
    schema: 1,
    mission: ID,
    seance: `A:${iso(at).slice(0, 10)}`,
    ...entry
  });
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() + 10 * MIN),
      how: 'zone'
    }
  }));
  await until(() => ctx.notes.some(n => n[0] === 'warn'));
  ck('une ouverture d\'un autre datée dans le futur : refusée, le tiroir reste fermé, et c\'est dit avec son auteur et le rang du tiroir', !
    q('[data-dw="D"][data-open]') && ctx.notes.some(n => n[0] === 'warn' && n[1].includes('BBB') && n[1].includes('Tiroir 3') && n[1]
      .includes('futur')), ctx.notes);
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() - 1000),
      how: 'hand'
    }
  }));
  await until(() => !!q('[data-dw-hand="BBB"]'));
  ck('le GESTE d\'un autre : le tiroir reste fermé ici, et la ligne dit « BBB l\'a ouvert à la main … pour lui seul »', !q(
    '[data-dw="D"][data-open]') && /^BBB l'a ouvert à la main à \d\d:\d\dZ, pour lui seul$/.test(text('[data-dw-hand="BBB"]')) && !!q(
    '[data-dw-open="D"]'), text('[data-dw="D"]'));
  const notesBefore = ctx.notes.length;
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() - 1000),
      how: 'zone',
      from: {
        lat: 44.52,
        lon: -1.25,
        at: iso(Date.now() - 6000),
        altFt: 2000
      },
      to: {
        lat: 44.49,
        lon: -1.15,
        at: iso(Date.now() - 1000),
        altFt: 2000
      },
      source: 'xplane'
    }
  }));
  await until(() => !!q('[data-dw="D"][data-open]'));
  ck('le CONSTAT d\'un autre (zone franchie) : ouvert pour tous — « ouvert au passage de la zone par BBB, à … », une notification ; reçu dans la minute : pas de « reçu ici »',
    q('[data-dw="D"]')?.dataset.open === 'zone' && /^ouvert au passage de la zone par BBB, à \d\d:\d\dZ$/.test(text(
      '[data-dw="D"] [data-dw-how]')) && text('[data-dw="D"] [data-dw-text]').includes('Zone atteinte.') && ctx.notes.length ===
    notesBefore + 1 && ctx.notes.at(-1)[1].startsWith('Tiroir 3 ouvert'), [text('[data-dw="D"]'), ctx.notes.slice(notesBefore)]);
  await until(() => ctx.store.has(SEEN));
  ck('l\'appareil garde ce qu\'il a vu, avec l\'heure où il l\'a reçu (cache/missions/seen_<ID>.json) ; mon carnet n\'est pas touché par l\'ouverture d\'un autre',
    ctx.store.get(SEEN)?.drawers?.D?.by === 'BBB' && !!ctx.store.get(SEEN).drawers.D.got && !ctx.store.get(BOOK).drawer_D, ctx.store.get(
      SEEN));
  await ctx.data.put(PEER, peer({}));
  await sleep(300);
  ck('BBB retire son constat de son carnet : le tiroir RESTE ouvert ici, et la ligne le dit', q('[data-dw="D"]')?.dataset.open === 'zone' &&
    text('[data-dw="D"] [data-dw-how]').includes('BBB a retiré cette ouverture de son carnet'), text('[data-dw="D"]'));
  DV.stop();

  // ---- 6. « reçu ici à … » ; le constat d'un autre SOUS VERROU
  const T3 = Date.now() - 30 * MIN,
    leg = { // les deux relevés d'un vrai constat portent leur heure, à cinq secondes l'un de l'autre
      from: {
        lat: 44.52,
        lon: -1.25,
        at: iso(T3 + 10 * MIN - 5000),
        altFt: 2000
      },
      to: {
        lat: 44.49,
        lon: -1.15,
        at: iso(T3 + 10 * MIN),
        altFt: 2000
      }
    };
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T3),
      [PEER]: peer({
        drawer_B: {
          state: 'open',
          at: iso(Date.now() - 5 * MIN),
          how: 'zone',
          ...leg
        }
      }, T3)
    }
  });
  await mount(ctx, missionOf(ZONE, HAND), 2);
  await until(() => !!q('[data-dw="B"][data-open]'));
  ck('un constat reçu plus d\'une minute après le fait : « ouvert au passage de la zone par BBB, à … — reçu ici à … » ; aucune notification pour ce qui était déjà ouvert à l\'arrivée',
    /^ouvert au passage de la zone par BBB, à \d\d:\d\dZ — reçu ici à \d\d:\d\dZ$/.test(text('[data-dw="B"] [data-dw-how]')) && ctx.notes
    .length === 0 && gestures() === 'C', [text('[data-dw="B"] [data-dw-how]'), ctx.notes]);
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T3),
      [PEER]: peer({
        drawer_D: {
          state: 'open',
          at: iso(Date.now() - 2000),
          how: 'zone',
          ...leg
        }
      }, T3)
    }
  });
  await mount(ctx, mission, 3);
  await until(() => ctx.store.has(SEEN));
  ck('le constat d\'un autre sur un tiroir verrouillé (les tiroirs 1 et 2 sont fermés) : rien ne s\'ouvre, le tiroir 3 dit « après le tiroir 2 » ; l\'appareil le garde pour son tour',
    !q('[data-open]') && text('[data-dw="D"] [data-dw-after]') === 'après le tiroir 2' && ctx.store.get(SEEN)?.drawers?.D?.by === 'BBB' &&
    ctx.notes.length === 0, [text('[data-drawers]'), ctx.store.get(SEEN)]);
  DV.stop();

  // ---- 7. l'ouverture à l'heure pendant que la fiche est à l'écran ; le départ réel ; « Resceller »
  const T4 = Date.now() - 40 * MIN + 2500; // le tiroir 1 (l'heure) s'ouvre dans 2,5 s
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T4)
    }
  });
  await mount(ctx, missionOf(TIME, HAND), 2);
  ck('le premier tiroir a une heure : dite « estimée » tant que le départ est celui de l\'affectation ; le second attend', text(
    '[data-dw="B"] [data-dw-key]') === `s'ouvre à ${z(T4 + 40 * MIN)} (heure estimée)` && text('[data-dw="C"] [data-dw-after]') === 'après le tiroir 1', text(
    '[data-drawers]'));
  await until(() => !!q('[data-dw="B"][data-open]'), 6000);
  ck('à l\'heure : le tiroir s\'ouvre de lui-même (« ouvert à l\'heure, à … »), une notification le dit une fois, le suivant reçoit son geste',
    q('[data-dw="B"]')?.dataset.open === 'time' && text('[data-dw="B"] [data-dw-how]') === `ouvert à l'heure, à ${z(T4 + 40 * MIN)}` && ctx.notes.filter(n => n[0] ===
      'ok' && n[1].startsWith('Tiroir 1 ouvert')).length === 1 && ctx.notes.length === 1 && gestures() === 'C', [text('[data-dw="B"]'),
      ctx.notes
    ]);
  DV.stop();
  const T1 = Date.now() - 10 * MIN;
  ctx = fakeCtx({
    level: 3,
    docs: {
      'missions/affectations.json': index(T1),
      'pilot/AAA/current_flight.json': {
        mission: ID,
        started: {
          at: iso(T1 + 2 * MIN)
        }
      }
    }
  });
  await mount(ctx, missionOf(TIME, HAND), 2);
  await until(() => !!ctx.store.get(BOOK)?.start_at);
  await sleep(150);
  ck('le vol de cette mission est démarré : son départ réel est écrit une fois au carnet, l\'heure n\'est plus « estimée »', ctx.store.get(
    BOOK)?.start_at === iso(T1 + 2 * MIN) && text('[data-dw="B"] [data-dw-key]') === `s'ouvre à ${z(T1 + 42 * MIN)}`, [ctx.store.get(BOOK), text(
    '[data-dw="B"] [data-dw-key]')]);
  await twice('B');
  await until(() => !!q('[data-dw-seal="B"]'));
  ck('niveau Complet : « Resceller » sur un tiroir que j\'ai ouvert (avant son heure) ; le suivant a reçu son geste', !!q(
    '[data-dw-seal="B"]') && q('[data-dw="B"]').dataset.open === 'hand' && gestures() === 'C');
  q('[data-dw-seal="B"]').click();
  await until(() => !q('[data-dw="B"][data-open]'));
  ck('rescellé : le tiroir est refermé pour moi, dit « rescellé », le carnet le porte ; le suivant est de nouveau verrouillé', !q(
      '[data-open]') && text('[data-dw="B"] [data-dw-key]').includes('rescellé') && ctx.store.get(BOOK).drawer_B.state === 'sealed' &&
    gestures() === 'B' && text('[data-dw="C"] [data-dw-after]') === 'après le tiroir 1', text('[data-drawers]'));
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T1),
      [BOOK]: {
        schema: 1,
        mission: ID,
        seance: `A:${iso(T1).slice(0, 10)}`,
        drawer_B: {
          state: 'open',
          at: iso(T1),
          how: 'hand'
        }
      }
    }
  });
  await mount(ctx, mission, 3);
  await until(() => !!q('[data-dw="B"][data-open]'));

  ck('page cachée (onglet caché, appareil en veille) : la relecture est en PAUSE, aucun passage ; au retour, un passage tout de suite',
    hiddenAfter === hiddenAt && ctx.synced === hiddenAfter + 1, [hiddenAt, hiddenAfter, ctx.synced, document.visibilityState]);
  await ctx.data.put(PEER, peer({
    drawer_B: {
      state: 'open',
      at: iso(Date.now() - 1000),
      how: 'zone',
      ...leg
    }
  }, T2));
  await until(() => !!q('[data-dw="B"][data-open]'));
  await sleep(200);
  const after = ctx.synced;
  await sleep(700);
  ck('le tiroir attendu est ouvert : plus aucun passage demandé (le suivant, à geste, n\'en demande pas)', ctx.synced === after &&
    gestures() === 'C', [after, ctx.synced]);
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: [index(T2).assignments[0]]
      }
    }
  });
  await mount(ctx, missionOf(ZONE, HAND), 2, {
    pollMs: 150
  });
  await sleep(600);
  ck('seul sur la mission : aucun passage demandé, même avec un tiroir à zone fermé', ctx.synced === 0, ctx.synced);
  DV.stop();

  // ---- 11. plus de limite à trois : douze tiroirs, sept à l'écran puis les suivants repliés
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T2)
    }
  });
  const twelve = {
    id: ID,
    drawers: 'BCDEFGHIJKLMNO'.split('').map((id, i) => ({
      id,
      rank: i + 1,
      title: `Titre ${i + 1}`,
      message: `Message ${i + 1}`,
      key: {
        kind: 'hand'
      }
    }))
  };
  await mount(ctx, twelve, 12);
  ck('douze tiroirs (B à M ; N et O écartés) : « Tiroir 1 » à « Tiroir 12 », sept à l\'écran, les cinq suivants repliés sous « Tiroirs suivants : 5 » ; un seul geste, sur le premier',
    qa('[data-dw]').length === 12 && qa('[data-dw-list] > [data-dw]').length === 7 && qa('[data-dw-rest] [data-dw]').length === 5 && q(
      '[data-dw-rest]').open === false && text('[data-dw-rest] summary') === 'Tiroirs suivants : 5' && text(
      '[data-dw="B"] [data-dw-n]') === 'Tiroir 1' && text('[data-dw="M"] [data-dw-n]') === 'Tiroir 12' && text(
      '[data-dw="M"] [data-dw-after]') === 'après le tiroir 11' && !text('[data-drawers]').includes('Titre 13') && gestures() === 'B',
    text('[data-dw-rest] summary'));
  q('[data-dw-rest]').open = true;
  await sleep(50);
  await twice('B');
  ck('le premier s\'ouvre au geste : le carnet porte drawer_B, le geste passe au tiroir 2, le pli des suivants reste ouvert au dessin suivant',
    ctx.store.get(BOOK)?.drawer_B?.state === 'open' && gestures() === 'C' && q('[data-dw-rest]').open === true, ctx.store.get(BOOK));
  DV.stop();
  await mount(ctx, {
    id: ID,
    drawers: [{
      id: 'D',
      rank: 3,
      title: 'Seul lu',
      key: {
        kind: 'hand'
      }
    }]
  }, 1);
  ck('le rang est celui que le lecteur rend (un tiroir d\'avant écarté par lui ne décale pas les numéros)', text(
    '[data-dw="D"] [data-dw-n]') === 'Tiroir 3');
  DV.stop();
  ctx = fakeCtx({
    trigram: 'QQQ',
    docs: {
      'missions/affectations.json': index(T2)
    }
  });
  await mount(ctx, twelve, 0);
  await sleep(200);
  ck('mission feuilletée à douze tiroirs : « Tiroirs : 12 », sans « data-mine »', text('[data-dw-count]').startsWith('Tiroirs : 12') && !q(
    '[data-drawers]').hasAttribute('data-mine') && !q('[data-dw]'));
  DV.stop();
  stage.innerHTML = '';

  // ---- 12. SOG-0448 : les tiroirs ouverts publiés sur l'appareil, sees() et la fiche prévenue
  const OPEN = 'cache/missions/open_X-701A.json',
    // une mission lue (à la forme de frame/lib/mission.js) : une zone montrée par la partie visible, une zone que le tiroir 1 cache
    seenMission = {
      id: ID,
      routeOrder: ['ZONE-1'],
      maps: [],
      points: {},
      turns: [],
      rendezvous: [],
      zones: [{
        id: 'ZONE-1',
        name: 'Attente',
        lat: 44.7,
        lon: 1.2
      }, {
        id: 'ZONE-2',
        name: 'Cachée',
        lat: 44.6,
        lon: 1.3
      }],
      drawers: [{
        id: 'B',
        rank: 1,
        title: 'Secteur',
        message: 'Message du tiroir.',
        brief: 'Briefing du tiroir.',
        key: {
          kind: 'zone',
          zoneId: 'ZONE-2',
          shown: false,
          fallbackMin: 60,
          shape: {
            circle: {
              lat: 44.6,
              lon: 1.3,
              radiusM: 4000
            }
          }
        },
        route: []
      }]
    },
    zonesOf = m => (m?.zones || []).map(x => x.id).join();
  let changes = 0;
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(Date.now() - 10 * MIN)
    }
  });
  let view = DV.sees(ID, seenMission);
  ck('sees() avant que la section ait lu : la partie visible seule — la zone du tiroir fermé n\'y est pas, le tiroir est scellé (ni message, ni briefing), « pas la mienne »',
    zonesOf(view) === 'ZONE-1' && view.drawers[0].sealed === true && view.drawers[0].message === '' && view.drawers[0].brief === '' &&
    view
    .pilot.mine === false && !JSON.stringify(view).includes('44.6'), view);
  await mount(ctx, seenMission, 1, {
    changed: () => changes++
  });
  await until(() => !!ctx.store.get(OPEN));
  ck('MA mission lue, tiroir fermé : le document « ouverts » est écrit sur l\'appareil (ma mission, la séance, aucune lettre), et la fiche est prévenue une fois (elle était dessinée « pas la mienne »)',
    ctx.store.get(OPEN)?.mine === true && JSON.stringify(ctx.store.get(OPEN).opened) === '[]' && /^A:\d{4}-\d\d-\d\d$/.test(ctx.store
      .get(OPEN).seance) && ctx.store.get(OPEN).mission === ID && changes === 1, [ctx.store.get(OPEN), changes]);
  view = DV.sees(ID, seenMission);
  ck('sees() pour MA mission, tiroir fermé : la mienne, rien d\'ouvert — la zone cachée n\'est toujours pas là',
    zonesOf(view) === 'ZONE-1' && view.pilot.mine === true && view.pilot.opened.length === 0 && view.drawers[0].sealed === true, view);
  await twice('B');
  await until(() => ctx.store.get(OPEN)?.opened?.length === 1);
  ck('le tiroir ouvert à la main : le document « ouverts » porte sa lettre, et la fiche est prévenue (une fois)', JSON.stringify(ctx.store
    .get(OPEN)?.opened) === '["B"]' && changes === 2, [ctx.store.get(OPEN), changes]);
  view = DV.sees(ID, seenMission);
  ck('sees() après l\'ouverture : la zone du tiroir est montrée, le tiroir rendu en entier ; la mission lue n\'est pas modifiée',
    zonesOf(view) === 'ZONE-1,ZONE-2' && view.drawers[0].message === 'Message du tiroir.' && !view.drawers[0].sealed && view.pilot.opened
    .join() === 'B' && seenMission.zones.length === 2 && !('pilot' in seenMission), view);
  DV.show(host(), {
    ctx,
    id: ID,
    mission: seenMission,
    changed: () => changes++
  });
  await sleep(150);
  ck('la fiche redessinée après sees() : rien n\'a changé, elle n\'est pas prévenue de nouveau (aucune boucle de dessin)', changes === 2 &&
    !!q('[data-dw="B"][data-open]'), changes);
  ck('sees() pour une AUTRE mission que celle de la section : la partie visible seule', zonesOf(DV.sees('X-702A', {
    ...seenMission,
    id: 'X-702A'
  })) === 'ZONE-1');
  DV.sees(ID, seenMission);
  const cached = ctx.asked.filter(p => p.startsWith('cache/missions/open_')).length;
  ck('MA mission : le document « ouverts » n\'est jamais relu par la section (elle l\'écrit de ce qu\'elle calcule) ; rien n\'est écrit hors de mon carnet et du cache de l\'appareil',
    cached === 0 && [...ctx.store.keys()].every(p => p === BOOK || p.startsWith('cache/missions/') || p === 'missions/affectations.json'),
    [
      ...ctx.store.keys()
    ]);
  // une mission qu'on feuillette : un document qui la disait mienne (une affectation retirée) est défait ; sinon rien n'est écrit
  DV.stop();
  changes = 0;
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: [{
          mission: ID,
          pilot: 'BBB',
          takeoff: iso(Date.now())
        }]
      },
      [OPEN]: {
        schema: 1,
        mission: ID,
        mine: true,
        seance: null,
        opened: ['B'],
        at: iso(Date.now() - MIN)
      }
    }
  });
  DV.sees(ID, seenMission);
  await mount(ctx, seenMission, 0, {
    changed: () => changes++
  });
  await until(() => ctx.store.get(OPEN)?.mine === false);
  ck('mission feuilletée dont un document « ouverts » disait « la mienne, tiroir B ouvert » : il est défait (plus la mienne, aucune lettre), et la fiche n\'est pas redessinée',
    ctx.store.get(OPEN)?.mine === false && JSON.stringify(ctx.store.get(OPEN).opened) === '[]' && changes === 0 && zonesOf(DV.sees(ID,
      seenMission)) === 'ZONE-1', [ctx.store.get(OPEN), changes]);
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: []
      }
    }
  });
  await mount(ctx, seenMission, 0);
  await sleep(200);
  ck('mission feuilletée sans document « ouverts » : rien n\'est écrit', !ctx.store.has(OPEN) && ctx.store.size === 1, [...ctx.store
    .keys()
  ]);
  DV.stop();
  stage.innerHTML = '';

  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows: rows.filter(r => !r.ok)
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
