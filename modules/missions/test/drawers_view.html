<!doctype html>
<!-- Banc de la section « Suite de la mission » (modules/missions/drawers_view.js, SOG-0441 lot T2, SOG-0459) : la vue montée dans une
     FAUSSE fiche (la rangée des actions et sa place [data-actslot]) avec un FAUX cadre (données en mémoire, traduction, notifications).
     La règle de SOG-0459 : rien avant l'ouverture (section cachée et vide, pour toute mission), puis une ligne par tiroir OUVERT ; un
     seul geste neutre, « Demander la suite » → « Demander », qui n'ouvre que le geste ou un objet suivi et à portée, sinon « Rien de
     nouveau pour l'instant » ; une minute de repos ; le MÊME écran pour une mission sans tiroir et une mission dont tout est fermé. Et
     ce qui reste du lot T2 : l'ORDRE, l'heure, le carnet d'un autre (constat, geste, refus, « reçu ici à … »), le départ réel,
     « Resceller », la fiche redessinée, le passage à la minute, douze tiroirs, le suivi en vol, sees(). Les phrases d'un tiroir
     restent vérifiées par describe() (section 9). Missions, trigrammes et positions inventés.
     window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>drawers view — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
  #stage {
    max-width: 390px;
    border: 1px dashed #999;
    padding: 8px;
    margin: 8px 0
  }
</style>
</head>
<body>
<h1 style="font-size:16px">drawers_view.js — bench</h1>
<div id="stage"></div>
<pre id="out"></pre>
<script type="module">
  import * as DV from '../drawers_view.js?v=0';
  import {
    REFILL_RULE
  } from '../../../frame/lib/mission.js?v=0';
  const out = document.getElementById('out'),
    stage = document.getElementById('stage'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      detail: ok ? '' : typeof got === 'string' ? got : JSON.stringify(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + rows[rows.length - 1].detail}`;
    out.append(l);
  }
  const MIN = 60e3,
    ID = 'X-701A',
    iso = ms => new Date(ms).toISOString(),
    sleep = ms => new Promise(r => setTimeout(r, ms)),
    /** Attend qu'une condition soit vraie (4 s au plus). */
    until = async (fn, ms = 4000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          if (fn()) return true;
          await sleep(40);
        }
        return !!fn();
      },
      z = ms => `${String(new Date(ms).getUTCHours()).padStart(2, '0')}:${String(new Date(ms).getUTCMinutes()).padStart(2, '0')}Z`;

  /** Un faux cadre : les documents en mémoire, les écritures annoncées aux écoutes, les notifications gardées. */
  function fakeCtx({
    trigram = 'AAA',
    level = 1,
    docs = {}
  } = {}) {
    const store = new Map(Object.entries(docs)),
      watchers = new Set(),
      c = {
        identity: {
          trigram
        },
        level,
        notes: [],
        asked: [], // les chemins demandés au cadre
        synced: 0,
        store,
        t: (row, v) => String(row[0]).replace(/\{(\w+)\}/g, (_, k) => v?.[k] ?? ''),
        notify: (text, kind) => c.notes.push([kind, text]),
        data: {
          get: async p => (c.asked.push(p), store.has(p) ? structuredClone(store.get(p)) : null),
          put: async (p, v) => {
            store.set(p, structuredClone(v));
            for (const w of watchers)
              if (p.startsWith(w.prefix)) w.fn([p]);
          },
          watch: (prefix, fn) => {
            const w = {
              prefix,
              fn
            };
            watchers.add(w);
            return () => watchers.delete(w);
          },
          sync: async () => {
            c.synced++;
          }
        }
      };
    return c;
  }
  /** L'index des affectations : AAA et BBB sur la mission, décollage à cet instant. */
  const index = (takeoff, mission = ID) => ({
    assignments: [{
      mission,
      pilot: 'AAA',
      takeoff: iso(takeoff),
      role: 'mission'
    }, {
      mission,
      pilot: 'BBB',
      takeoff: iso(takeoff),
      role: 'mission'
    }]
  });
  // les tiroirs, à la forme rendue par frame/lib/mission.js
  const HAND = {
      title: 'Retour <img src=x onerror="window.__xss=1">',
      message: 'Fin de mission.',
      brief: 'Retour au terrain.',
      key: {
        kind: 'hand'
      }
    },
    TIME = {
      title: 'Nouvel ordre',
      message: 'CYRANO : cap au nord.',
      brief: 'Rejoindre le point N.\nAltitude 2 000 ft.',
      key: {
        kind: 'time',
        point: 'ORIGIN',
        delayMin: 40
      }
    },
    ZONE = {
      title: 'Recherche',
      message: 'Zone atteinte.',
      brief: '',
      key: {
        kind: 'zone',
        shape: {
          circle: {
            lat: 44.5,
            lon: -1.2,
            radiusM: 3000
          }
        },
        ceilingFt: null,
        shown: true,
        fallbackMin: 90
      }
    },
    LETTERS = 'BCDEFGHIJKLM',
    /** Une mission faite de ces tiroirs, dans cet ordre (identifiants B, C, D… par la place). */
    missionOf = (...list) => ({
      id: ID,
      drawers: list.map((d, i) => ({
        ...d,
        id: LETTERS[i]
      }))
    }),
    mission = missionOf(HAND, TIME, ZONE); // 1 : le geste ; 2 : l'heure (H + 40) ; 3 : la zone (repli H + 90)
  // la fausse fiche : la première page, sa section, la rangée des actions avec la place que module.js donne à la section
  const SHEET =
    '<div data-module="missions"><div class="ms-sheet"><section class="ms-first"><section data-drawers hidden></section><div class="ms-actions"><a data-do="prepare" href="#fuel">Préparer ce vol</a><span class="ms-actslot" data-actslot></span><button type="button" data-do="back">Retour</button></div></section><section class="ms-detail"></section></div></div>';
  /** Un élément [data-drawers] neuf dans la scène (la fiche redessinée) ; `bare` : un élément seul, hors d'une fiche. */
  const host = (bare = false) => {
    stage.innerHTML = bare ? '<section data-drawers></section>' : SHEET;
    return stage.querySelector('[data-drawers]');
  };
  const q = sel => stage.querySelector(sel),
    qa = sel => [...stage.querySelectorAll(sel)],
    text = sel => (q(sel)?.textContent || '').replace(/\s+/g, ' ').trim(),
    BOOK = 'pilot/AAA/missions/X-701A.json',
    PEER = 'pilot/BBB/missions/X-701A.json',
    SEEN = 'cache/missions/seen_X-701A.json',
    sec = () => q('[data-drawers]'),
    /** La section est cachée et VIDE (aucun texte, aucun élément, pas de « data-mine ») : rien ne dit qu'il y a une suite. */
    empty = () => !!sec() && sec().hidden === true && sec().innerHTML === '' && !sec().hasAttribute('data-mine'),
    askBtn = () => q('[data-actslot] > [data-dw-ask]'),
    /** L'ordre de la rangée des actions : « Préparer ce vol », la place (et ce qu'elle porte), puis le reste. */
    order = () => [...(q('.ms-actions')?.children || [])].map(e => e.matches('[data-actslot]') ? `slot(${[...e.children].map(x => x.hasAttribute('data-dw-ask') ? 'ask' : x.tagName).join()})` : e.dataset.do || e.tagName).join(
      ' '),
    /** Monte la section sur une mission et attend sa lecture (et, pour MA mission, « Demander la suite » posé). */
    mount = async (c, m, more = {}) => {
        DV.show(host(more.bare), {
          ctx: c,
          id: more.id || ID,
          mission: m,
          restMs: 100,
          ...more
        });
        await until(() => c.asked.includes('missions/affectations.json'));
        if (more.mine) await until(() => !!askBtn());
        await sleep(120);
      },
      /** « Demander la suite » puis « Demander » ; attend la fin du repos d'avant (le banc le raccourcit). */
      ask = async () => {
          await until(() => !!askBtn() && !askBtn().disabled);
          askBtn().click();
          q('[data-dw-ask-yes]').click();
          await sleep(60);
        },
        opened = () => qa('[data-dw]').map(e => e.dataset.dw + ':' + e.dataset.open).join();

  // ---- 1. une mission qu'on feuillette : rien — ni ligne, ni compte, ni geste
  let ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: [{
          mission: ID,
          pilot: 'BBB',
          takeoff: iso(Date.now())
        }]
      }
    }
  });
  await mount(ctx, mission);
  ck('mission feuilletée (ni affectée à moi, ni celle de mon vol) : la section reste cachée et VIDE — plus de « Tiroirs : 3 », ni titre, ni geste ; la place de la rangée est vide',
    empty() && !askBtn() && q('[data-actslot]').innerHTML === '' && !stage.textContent.includes('Recherche') && !/Tiroir/.test(stage
      .textContent), sec().outerHTML);
  await mount(ctx, {
    id: ID,
    drawers: []
  });
  ck('mission feuilletée sans tiroir : la même chose — cachée, vide, pas de geste', empty() && !askBtn());

  // ---- 2. MA mission : rien avant l'ouverture, un seul geste neutre dans la rangée
  const T0 = Date.now() - 40 * MIN + 3000; // le décollage affecté : l'heure du tiroir 2 passe dans 3 s
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T0)
    }
  });
  DV.show(host(), {
    ctx,
    id: ID,
    mission,
    restMs: 100
  });
  ck('avant la lecture des affectations : la section est cachée et vide, aucun geste posé (jamais rien montré trop tôt)', empty() && !
    askBtn());
  await until(() => !!askBtn());
  await sleep(100);
  ck('mission affectée, trois tiroirs fermés : la section reste cachée et VIDE (ni ligne, ni titre, ni clé, ni « après le tiroir n », ni note), pas de « data-mine »',
    empty() && !q('[data-dw]') && !/Tiroir|Recherche|Nouvel ordre|s'ouvre|après le|Cet appareil|Sans position/.test(stage.textContent),
    sec().outerHTML);
  ck('« Demander la suite » est posé DANS la place de la rangée, juste après « Préparer ce vol », « Retour » en dernier ; un seul bouton, neutre (aucun mot des tiroirs)',
    order() === 'prepare slot(ask) back' && text('[data-dw-ask]') === 'Demander la suite' && qa('[data-dw-ask]').length === 1 && askBtn()
    .type === 'button' && !askBtn().disabled, order());
  ck('un titre hostile n\'est pas dans la page tant que son tiroir est fermé ; rien n\'est interprété', !window.__xss && !q('img') && !
    stage.innerHTML.includes('Retour &lt;img'));
  ck('fermé : ni message ni briefing dans la page', !q('[data-dw-text]') && !stage.textContent.includes('CYRANO') && !stage.textContent
    .includes('Fin de mission'));

  // ---- 3. « Demander la suite » → le panneau ; « Pas maintenant » ; « Demander » ouvre le tiroir « à la main »
  askBtn().click();
  ck('premier toucher : la section paraît avec le panneau — la question, « Demander » (principal) et « Pas maintenant » ; rien d\'écrit, aucune ligne de tiroir',
    sec().hidden === false && text('[data-dw-askbox] p') ===
    'Vous avez atteint ou trouvé ce que la mission demande ? Le centre vous donne la suite s\'il y en a une.' && text(
      '[data-dw-ask-yes]') ===
    'Demander' && q('[data-dw-ask-yes]').classList.contains('primary') && text('[data-dw-ask-no]') === 'Pas maintenant' && !ctx.store.has(
      BOOK) && !q('[data-dw]') && !q('h3') && !sec().hasAttribute('data-mine'), sec().innerHTML);
  q('[data-dw-ask-no]').click();
  ck('« Pas maintenant » : le panneau se ferme, la section redevient cachée et vide, la commande n\'est PAS au repos', empty() && !askBtn()
    .disabled && !askBtn().hasAttribute('data-dw-rest'));
  await sleep(3300);
  ck('l\'heure du tiroir 2, passée entre-temps, n\'a rien ouvert (le tiroir 1 est fermé) : toujours rien à l\'écran, aucune notification',
    empty() &&
    !ctx.store.has(BOOK) && ctx.notes.length === 0, [sec().innerHTML, ctx.notes]);
  await ask();
  await until(() => !!q('[data-dw="B"][data-open]'));
  const book = ctx.store.get(BOOK);
  ck('« Demander » sur un premier tiroir « à la main » : le carnet de CE pilote est écrit (le tiroir, « hand », la séance, l\'auteur), et lui seul',
    book?.drawer_B?.state === 'open' && book.drawer_B.how === 'hand' && book.seance === `A:${iso(T0).slice(0, 10)}` && book.by === 'AAA' &&
    book.mission === ID && !book.drawer_C && !book.drawer_D && [...ctx.store.keys()].filter(k => k.startsWith('pilot/')).join() === BOOK,
    [
      book, [...ctx.store.keys()]
    ]);
  ck('« Suite de la mission » : le titre en gras (sans « Tiroir n »), « ouvert à votre demande, à … », le message (détaché) et le briefing ; un passage de synchronisation est demandé ; la section porte « data-mine »',
    text('h3') === 'Suite de la mission' && text('[data-dw="B"] .dw-top') === 'Retour <img src=x onerror="window.__xss=1">' && !q(
      '[data-dw] img') && !window.__xss && /^ouvert à votre demande, à \d\d:\d\dZ$/.test(text('[data-dw="B"] [data-dw-how]')) && text(
      '[data-dw="B"] [data-dw-msg]') === 'Fin de mission.' && text('[data-dw="B"] [data-dw-brief]') === 'Retour au terrain.' && ctx
    .synced ===
    1 && sec().hasAttribute('data-mine') && !/Tiroir/.test(sec().textContent), [sec().textContent, ctx.synced]);
  await until(() => !!q('[data-dw="C"][data-open]'));
  ck('l\'heure passée du tiroir 2 joue dès que le 1 s\'ouvre (« ouvert à l\'heure ») ; chaque ouverture a sa notification « Suite de la mission : {title} », sans numéro',
    q('[data-dw="C"]')?.dataset.open === 'time' && /^ouvert à l'heure, à \d\d:\d\dZ$/.test(text('[data-dw="C"] [data-dw-how]')) && text(
      '[data-dw="C"] [data-dw-text]').includes('CYRANO') && JSON.stringify(ctx.notes) === JSON.stringify([
      ['ok', 'Suite de la mission : Retour <img src=x onerror="window.__xss=1">'],
      ['ok', 'Suite de la mission : Nouvel ordre']
    ]), [text('[data-dw="C"]'), ctx.notes]);
  ck('après la réponse la commande se repose (désactivée, « data-dw-rest »), puis se réarme d\'elle-même ; le panneau est fermé', askBtn()
    .disabled && askBtn().hasAttribute('data-dw-rest') && !q('[data-dw-askbox]'));
  ck('le tiroir 3 (la zone) est le premier fermé : RIEN de lui à l\'écran — ni titre, ni clé, ni « Sans position en direct… », ni geste ; seuls les ouverts ont une ligne',
    opened() === 'B:hand,C:time' && !stage.textContent.includes('Recherche') && !q('[data-dw-note]') && !q('[data-dw-key]') && !
    /Sans position|s'ouvrira/
    .test(stage.textContent), sec().textContent);
  await until(() => !askBtn().disabled);
  ck('… la commande s\'est réarmée à la fin du repos', !askBtn().disabled && !askBtn().hasAttribute('data-dw-rest'));

  // ---- 4. la fiche redessinée : le même état dans un élément neuf
  DV.show(host(), {
    ctx,
    id: ID,
    mission
  });
  ck('la fiche redessinée : les deux tiroirs ouverts sont repeints tout de suite dans l\'élément neuf, « Demander la suite » reposé dans la nouvelle place (un seul)',
    opened() === 'B:hand,C:time' && order() === 'prepare slot(ask) back' && qa('[data-dw-ask]').length === 1);
  const n4 = ctx.notes.length;
  await ask();
  ck('« Demander » sur l\'élément neuf : une seule réponse (une seule écoute) — la zone ne s\'ouvre jamais par « Demander » : « Rien de nouveau pour l\'instant », rien d\'écrit',
    ctx.notes.length === n4 + 1 && JSON.stringify(ctx.notes.at(-1)) === JSON.stringify(['info', 'Rien de nouveau pour l\'instant']) && !
    ctx
    .store.get(BOOK).drawer_D && opened() === 'B:hand,C:time', ctx.notes.slice(n4));

  // ---- 5. le carnet d'un autre pilote de la mission, sur le premier tiroir fermé
  const peer = (entry, at = T0) => ({
    schema: 1,
    mission: ID,
    seance: `A:${iso(at).slice(0, 10)}`,
    ...entry
  });
  let notesBefore = ctx.notes.length;
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() + 10 * MIN),
      how: 'zone'
    }
  }));
  await sleep(300);
  ck('une ouverture d\'un autre datée dans le futur : refusée, le tiroir reste fermé — et RIEN ne le dit (un refus dirait qu\'une suite existe)',
    !
    q('[data-dw="D"]') && ctx.notes.length === notesBefore && !stage.textContent.includes('BBB'), ctx.notes.slice(notesBefore));
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() - 1000),
      how: 'hand'
    }
  }));
  await sleep(300);
  ck('le GESTE d\'un autre : le tiroir reste fermé ici, et rien ne le dit (plus de « BBB l\'a ouvert à la main »)', !q('[data-dw="D"]') && !
    stage.textContent.includes('BBB') && ctx.notes.length === notesBefore, sec().textContent);
  await ctx.data.put(PEER, peer({
    drawer_D: {
      state: 'open',
      at: iso(Date.now() - 1000),
      how: 'zone',
      from: {
        lat: 44.52,
        lon: -1.25,
        at: iso(Date.now() - 6000),
        altFt: 2000
      },
      to: {
        lat: 44.49,
        lon: -1.15,
        at: iso(Date.now() - 1000),
        altFt: 2000
      },
      source: 'xplane'
    }
  }));
  await until(() => !!q('[data-dw="D"][data-open]'));
  ck('le CONSTAT d\'un autre (zone franchie) : ouvert pour tous — « ouvert au passage de la zone par BBB, à … », la notification « Suite de la mission : Recherche » ; reçu dans la minute : pas de « reçu ici »',
    q('[data-dw="D"]')?.dataset.open === 'zone' && /^ouvert au passage de la zone par BBB, à \d\d:\d\dZ$/.test(text(
      '[data-dw="D"] [data-dw-how]')) && text('[data-dw="D"] [data-dw-text]').includes('Zone atteinte.') && ctx.notes.length ===
    notesBefore + 1 && ctx.notes.at(-1)[1] === 'Suite de la mission : Recherche', [text('[data-dw="D"]'), ctx.notes.slice(notesBefore)]);
  await until(() => ctx.store.has(SEEN));
  ck('l\'appareil garde ce qu\'il a vu, avec l\'heure où il l\'a reçu (cache/missions/seen_<ID>.json) ; mon carnet n\'est pas touché par l\'ouverture d\'un autre',
    ctx.store.get(SEEN)?.drawers?.D?.by === 'BBB' && !!ctx.store.get(SEEN).drawers.D.got && !ctx.store.get(BOOK).drawer_D, ctx.store.get(
      SEEN));
  await ctx.data.put(PEER, peer({}));
  await sleep(300);
  ck('BBB retire son constat de son carnet : le tiroir RESTE ouvert ici, et la ligne le dit', q('[data-dw="D"]')?.dataset.open === 'zone' &&
    text('[data-dw="D"] [data-dw-how]').includes('BBB a retiré cette ouverture de son carnet'), text('[data-dw="D"]'));
  await ask();
  ck('tout est ouvert : « Demander » répond la même chose, « Rien de nouveau pour l\'instant »', ctx.notes.at(-1)?.[1] ===
    'Rien de nouveau pour l\'instant' && ctx.notes.at(-1)[0] === 'info', ctx.notes.at(-1));
  DV.stop();
  ck('stop() retire « Demander la suite » de la rangée', !askBtn() && q('[data-actslot]').innerHTML === '');

  // ---- 6. « reçu ici à … » ; le constat d'un autre SOUS VERROU
  const T3 = Date.now() - 30 * MIN,
    leg = { // les deux relevés d'un vrai constat portent leur heure, à cinq secondes l'un de l'autre
      from: {
        lat: 44.52,
        lon: -1.25,
        at: iso(T3 + 10 * MIN - 5000),
        altFt: 2000
      },
      to: {
        lat: 44.49,
        lon: -1.15,
        at: iso(T3 + 10 * MIN),
        altFt: 2000
      }
    };
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T3),
      [PEER]: peer({
        drawer_B: {
          state: 'open',
          at: iso(Date.now() - 5 * MIN),
          how: 'zone',
          ...leg
        }
      }, T3)
    }
  });
  await mount(ctx, missionOf(ZONE, HAND), {
    mine: true
  });
  await until(() => !!q('[data-dw="B"][data-open]'));
  ck('un constat reçu plus d\'une minute après le fait : « ouvert au passage de la zone par BBB, à … — reçu ici à … » ; aucune notification pour ce qui était déjà ouvert à l\'arrivée ; le suivant (à la main) n\'a pas de ligne',
    /^ouvert au passage de la zone par BBB, à \d\d:\d\dZ — reçu ici à \d\d:\d\dZ$/.test(text('[data-dw="B"] [data-dw-how]')) && ctx.notes
    .length === 0 && opened() === 'B:zone', [text('[data-dw="B"] [data-dw-how]'), ctx.notes]);
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T3),
      [PEER]: peer({
        drawer_D: {
          state: 'open',
          at: iso(Date.now() - 2000),
          how: 'zone',
          ...leg
        }
      }, T3)
    }
  });
  await mount(ctx, mission, {
    mine: true
  });
  await until(() => ctx.store.has(SEEN));
  ck('le constat d\'un autre sur un tiroir verrouillé (les tiroirs 1 et 2 sont fermés) : rien ne s\'ouvre, RIEN à l\'écran ; l\'appareil le garde pour son tour',
    empty() && ctx.store.get(SEEN)?.drawers?.D?.by === 'BBB' && ctx.notes.length === 0, [sec().innerHTML, ctx.store.get(SEEN)]);
  DV.stop();

  // ---- 7. l'ouverture à l'heure pendant que la fiche est à l'écran ; le départ réel ; « Resceller »
  const T4 = Date.now() - 40 * MIN + 2500; // le tiroir 1 (l'heure) s'ouvre dans 2,5 s
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(T4)
    }
  });
  await mount(ctx, missionOf(TIME, HAND), {
    mine: true
  });
  ck('le premier tiroir a une heure : rien ne dit son heure avant qu\'elle joue (section cachée et vide)', empty() && !stage.textContent
    .includes(z(T4 + 40 * MIN)));
  await until(() => !!q('[data-dw="B"][data-open]'), 6000);
  ck('à l\'heure : le tiroir s\'ouvre de lui-même (« ouvert à l\'heure, à … »), la notification « Suite de la mission : Nouvel ordre » une fois ; le suivant n\'a pas de ligne',
    q('[data-dw="B"]')?.dataset.open === 'time' && text('[data-dw="B"] [data-dw-how]') === `ouvert à l'heure, à ${z(T4 + 40 * MIN)}` &&
    JSON.stringify(ctx.notes) === JSON.stringify([

      to: dfix(ms, nm)
    }),
    dMission = missionOf(HAND, {
      ...LDRAWER,
      title: 'Le point repéré',
      key: LANDP
    }),
    dBook = (...entries) => peer(Object.fromEntries(entries), DX),
    dDocs = (mineLand, theirs) => ({
      'missions/affectations.json': index(DX),
      [BOOK]: dBook(['drawer_B', {
        state: 'open',
        at: iso(DX + MIN),
        how: 'hand'
      }], ...(mineLand ? [
        ['drawer_C', {
          state: 'open',
          at: iso(DT),
          how: 'landing',
          ...dHeld(DT, 0.15),
          tier: 'excellent', // un tier écrit qui ment : le débrief lit le recalcul
          distNm: 0.001
        }]
      ] : [])),
      ...(theirs ? {
        [PEER]: dBook(['drawer_B', {
          state: 'open',
          at: iso(DX + 2 * MIN),
          how: 'hand'
        }], ['drawer_C', {
          state: 'open',
          at: iso(DT + 60e3),
          how: 'landing',
          ...dHeld(DT + 60e3, 0.08)
        }])
      } : {})
    });
  ctx = fakeCtx({
    docs: dDocs(false, false)
  });
  await mount(ctx, dMission, {
    mine: true
  });
  await until(() => !!q('[data-dw="B"][data-open]'));
  ck('débrief : sans posé de précision jugé (un tiroir ouvert à la main), pas de bloc « Débrief » ni de titre',
    !!q('[data-dw="B"]') && !q('[data-dw-debrief]') && !q('[data-dw-debrief-head]') && qa('h3').map(h => h.textContent).join() === 'Suite de la mission', sec().innerHTML);
  DV.stop();
  ctx = fakeCtx({
    docs: dDocs(true, true)
  });
  await mount(ctx, dMission, {
    mine: true
  });
  await until(() => qa('[data-dwd]').length === 2);
  const dRows = qa('[data-dwd]').map(e => e.textContent.replace(/\s+/g, ' ').trim());
  ck('débrief : présent après l\'ouverture d\'un tiroir, SOUS « Suite de la mission » ; deux lignes — la mienne (le tier écrit « excellent » ignoré : « réussi », 0,15) puis celle de BBB (« parfait », 0,08), l\'heure du fait, jamais un lieu',
    qa('h3').map(h => h.textContent).join() === 'Suite de la mission,Débrief' && q('[data-dw-list]').compareDocumentPosition(q('[data-dw-debrief]')) & Node.DOCUMENT_POSITION_FOLLOWING &&
    dRows.join('|') === `Le point repéré — atterrissage réussi (0,15 NM), à ${z(DT)}|Le point repéré — atterrissage parfait (0,08 NM), à ${z(DT + 60e3)} — BBB` && !/PT1|DESTINATION|45\.|lat/.test(q('[data-dw-debrief]').outerHTML),
    dRows);
  ck('débrief : visible au niveau 1 (Découverte) comme aux autres ; marqué mine / non mine',
    ctx.level === 1 && !q('[data-dw-debrief]').hidden && qa('[data-dwd]').map(e => e.dataset.dwdMine).join() === '1,0');
  DV.stop();
  ck('débrief : stop() retire le bloc (titre et lignes), avec « Demander la suite »', !q('[data-dw-debrief]') && !q('[data-dw-debrief-head]') && !askBtn() && !!q('[data-dw-list]'));
  stage.innerHTML = '';
  // le texte, dans les quatre langues : espaces normalisés, le séparateur décimal de la langue, l'heure du fait
  const dSay = (i, l) => DV.debriefLine((row, v) => String(row[i]).replace(/\{(\w+)\}/g, (_, k) => v?.[k] ?? ''), l).replace(/\s+/g, ' '),
    dLn = {
      title: 'Le point repéré',
      how: 'landing',
      tier: 'réussi',
      distNm: 0.15,
      at: AT,
      by: 'BBB',
      mine: true
    };
  ck('débrief, texte exact : « Le point repéré — atterrissage réussi (0,15 NM), à 19:20Z » en français ; en anglais « … — landing: good (0.15 NM), at 19:20Z » (point décimal) ; équipier : « — BBB » ; en allemand et en espagnol la virgule',
    dSay(0, dLn) === 'Le point repéré — atterrissage réussi (0,15 NM), à 19:20Z' && dSay(1, dLn) === 'Le point repéré — landing: good (0.15 NM), at 19:20Z' && dSay(0, {
      ...dLn,
      mine: false
    }) === 'Le point repéré — atterrissage réussi (0,15 NM), à 19:20Z — BBB' && dSay(1, {
      ...dLn,
      mine: false
    }) === 'Le point repéré — landing: good (0.15 NM), at 19:20Z — BBB' && dSay(2, dLn) === 'Le point repéré — Landung gelungen (0,15 NM) um 19:20Z' && dSay(3, {
      ...dLn,
      mine: false
    }) === 'Le point repéré — aterrizaje logrado (0,15 NM), a las 19:20Z — BBB' && [0, 1, 2, 3].map(i => dSay(i, {
      ...dLn,
      tier: 'partiel',
      distNm: 0.5
    })).every((t, i) => t.includes(['partiel', 'partial', 'teilweise', 'parcial'][i])) && ['Débrief', 'Debrief', 'Nachbesprechung', 'Informe'].every((w, i) => DV.TX.debriefHead[i] === w),
    [0, 1, 2, 3].map(i => dSay(i, dLn)));
  // sans titre : la phrase commence par la majuscule, sans « — » d'attaque, dans les quatre langues, moi et l'équipier
  const dNo = { ...dLn, title: '' };
  ck('débrief sans titre : « Atterrissage réussi (0,15 NM), à 19:20Z » (puis « — BBB »), « Landing: good … », « Landung gelungen … », « Aterrizaje logrado … » ; un titre absent ou non texte vaut vide',
    dSay(0, dNo) === 'Atterrissage réussi (0,15 NM), à 19:20Z' && dSay(0, { ...dNo, mine: false }) === 'Atterrissage réussi (0,15 NM), à 19:20Z — BBB' &&
    dSay(1, dNo) === 'Landing: good (0.15 NM), at 19:20Z' && dSay(1, { ...dNo, mine: false }) === 'Landing: good (0.15 NM), at 19:20Z — BBB' &&
    dSay(2, dNo) === 'Landung gelungen (0,15 NM) um 19:20Z' && dSay(3, { ...dNo, mine: false }) === 'Aterrizaje logrado (0,15 NM), a las 19:20Z — BBB' &&
    dSay(0, { ...dLn, title: undefined }) === dSay(0, dNo) && dSay(0, { ...dLn, title: 7 }) === dSay(0, dNo));
  // jamais un numéro : un tiroir de rang 3 (pas de rang dans la ligne) ne dit ni « Tiroir » ni « 3 » hors de l'heure et de la distance ; le titre est borné à 120 signes
  const dNum = [0, 1, 2, 3].map(i => dSay(i, { ...dLn, rank: 3 }).replace(/\d{1,2}:\d{2}Z/, '').replace(/\d[.,]\d{2}/, ''));
  ck('débrief : aucun numéro de tiroir dans la ligne (ni « Tiroir »/« Drawer »/« Schublade »/« Cajón » ni chiffre hors heure et distance), même si la donnée porte un rang ; le titre est borné à 120 signes',
    dNum.every(t => !/Tiroir|Drawer|Schublade|Cajón|\d/.test(t)) && dSay(0, { ...dLn, title: 'x'.repeat(300) }).startsWith('x'.repeat(120) + ' —') && !dSay(0, { ...dLn, title: 'x'.repeat(300) }).includes('x'.repeat(121)), dNum);
  // un titre hostile est échappé (la phrase entière passe par esc) : du texte, jamais un élément
  DV.stop();
  ctx = fakeCtx({
    docs: dDocs(true, false)
  });
  await mount(ctx, missionOf(HAND, {
    ...LDRAWER,
    title: '<b id="dwx">Le "point"</b>',
    key: LANDP
  }), {
    mine: true
  });
  await until(() => qa('[data-dwd]').length === 1);
  ck('débrief : un titre hostile (<b>, guillemets) est du texte échappé, jamais un élément',
    !q('[data-dwx], #dwx') && q('[data-dwd]').textContent.startsWith('<b id="dwx">Le "point"</b> — atterrissage'), q('[data-dwd]').innerHTML);
  DV.stop();
  stage.innerHTML = '';

  // ---- SOG-0521 : la condition « refill » (ravitaillement en retardant) jugée en vol — une tenue complète puis un relevé en l'air.
  // Les chiffres (rayon, tolérance de cap, écart permis) viennent de REFILL_RULE ; la durée est courte (10 s) pour le banc.
  const RFK = {
      kind: 'condition',
      condition: 'refill',
      rule: {
        kind: 'refill',
        label: '',
        point: null,
        at: null,
        object: {
          id: 'RF1',
          kind: 'refill',
          name: 'Station du banc',
          lat: 45.0,
          lon: 1.0,
          moving: false
        },
        radiusM: REFILL_RULE.radiusM,
        durationSec: 10,
        maxGapSec: REFILL_RULE.maxGapSec,
        speedMaxKt: 3,
        headingDeg: 90,
        headingTolDeg: REFILL_RULE.headingTolDeg,
        departure: true,
        confirmation: '',
        confirm: false
      },
      fallbackMin: 120
    },
    RDRAWER = {
      title: 'Ravitaillement',
      message: 'Plein fait.',
      brief: '',
      key: RFK
    },
    TR = Date.now(),
    // un relevé du simulateur, des secondes avant maintenant : posé à 5 m de la station, au cap 90°, lent, sauf indication
    rfix = (secAgo, more = {}) => ({
      lat: 45.0 + 5 / 111194.93,
      lon: 1.0,
      at: iso(TR - secAgo * 1000),
      altFt: 100,
      onGround: true,
      gsKt: 1,
      headingDeg: 90,
      ...more
    }),
    rIn = (i, st) => Object.fromEntries(Object.entries(DV.describe((row, v) => String(row[i]).replace(/\{(\w+)\}/g, (_, k) => v?.[k] ?? ''), {
      key: RFK,
      dueAt: null,
      open: false,
      ...st
    }, {}, {})).map(([k, v]) => [k, typeof v === 'string' ? v.replace(/\s+/g, ' ') : v]));
  ck('refill, describe : la clé dit « s\'ouvre au ravitaillement », jamais le lieu (ni le nom de la station) ; jugée en vol, l\'appareil la suit ; ouverte : « ouvert à votre ravitaillement en retardant, à 19:20Z », « ouvert au ravitaillement en retardant de BBB, à 19:20Z »',
    say(RFK).key === 's\'ouvre au ravitaillement' && !/RF1|Station|45\.0|1\.0/.test(say(RFK).key) && say(RFK, {
      live: true
    }).follow === 'followed' && say(RFK, {}, {
      open: true,
      how: 'refill',
      mine: true,
      at: AT
    }).how === 'ouvert à votre ravitaillement en retardant, à 19:20Z' && say(RFK, {}, {
      open: true,
      how: 'refill',
      mine: false,
      by: 'BBB',
      at: AT,
      srcAt: AT
    }).how === 'ouvert au ravitaillement en retardant de BBB, à 19:20Z', [say(RFK), say(RFK, {}, {
      open: true,
      how: 'refill',
      mine: true,
      at: AT
    })]);
  ck('refill, describe, quatre langues : la clé et l\'ouverture (moi, un autre) dites en français, anglais, allemand et espagnol, sans le lieu ni les accolades',
    [0, 1, 2, 3].every(i => {
      const k = rIn(i, {}).key,
        me = rIn(i, {
          open: true,
          how: 'refill',
          mine: true,
          at: AT
        }).how,
        by = rIn(i, {
          open: true,
          how: 'refill',
          mine: false,
          by: 'BBB',
          at: AT,
          srcAt: AT
        }).how;
      return k && me.includes('19:20Z') && by.includes('BBB') && by.includes('19:20Z') && ![k, me, by].some(t => /[{}]|RF1|Station/.test(t)) && me !== by &&
        k !== rIn(i, {
          key: {
            kind: 'condition',
            condition: 'hover',
            rule: {}
          }
        }).key;
    }) && rIn(1, {
      open: true,
      how: 'refill',
      mine: true,
      at: AT
    }).how === 'opened on your retardant refill, at 19:20Z', [0, 1, 2, 3].map(i => rIn(i, {
      open: true,
      how: 'refill',
      mine: false,
      by: 'BBB',
      at: AT,
      srcAt: AT
    }).how));
  ctx = fakeCtx({
    docs: flying(T5)
  });
  ctx.live = fakeLive();
  await mount(ctx, missionOf(RDRAWER, HAND), {
    mine: true
  });
  await until(() => ctx.live.subs.size === 1);
  ctx.live.emit(rfix(30, {
    gsKt: 40,
    onGround: false
  }));
  await sleep(150);
  ctx.live.emit(rfix(20));
  await sleep(150);
  ctx.live.emit(rfix(15));
  await sleep(150);
  const rNotYet = empty() && !ctx.store.get(BOOK)?.drawer_B;
  ctx.live.emit(rfix(10)); // la tenue est complète (10 s d'affilée) : « rempli », rien ne s'ouvre avant le départ
  await sleep(150);
  ctx.live.emit(rfix(5, {
    gsKt: 20
  })); // il bouge un peu : toujours « rempli »
  await sleep(150);
  const rFull = empty() && !ctx.store.get(BOOK)?.drawer_B;
  ctx.live.emit(rfix(0, {
    onGround: false
  })); // le premier relevé en l'air : le tiroir s'ouvre
  await until(() => !!q('[data-dw="B"][data-open]'));
  const rb = ctx.store.get(BOOK)?.drawer_B;
  ck('le ravitaillement : en transit puis tenu 5 s, rien ; tenue complète (10 s d\'affilée) puis un relevé posé qui bouge un peu, rien encore ; au premier relevé en l\'air, le constat « refill » est écrit (from, to, last, off, cap compris) et « Suite de la mission » dit « ouvert à votre ravitaillement en retardant, à … » sans nommer le lieu',
    rNotYet && rFull && rb?.how === 'refill' && rb.from?.headingDeg === 90 && rb.to?.onGround === true && rb.last?.onGround === true && rb.off?.onGround === false &&
    Date.parse(rb.to.at) - Date.parse(rb.from.at) === 10e3 && Date.parse(rb.off.at) > Date.parse(rb.last.at) && /^ouvert à votre ravitaillement en retardant, à \d\d:\d\dZ$/.test(
      text('[data-dw="B"] [data-dw-how]')) && ctx.notes.some(n => n[0] === 'ok' && n[1] === 'Suite de la mission : Ravitaillement') && !/RF1|Station du banc/.test(stage
      .textContent), [rNotYet, rFull, rb, ctx.notes]);
  DV.stop();
  // un cap faux : la tenue n'est jamais complète, rien ne s'ouvre même après un départ
  ctx = fakeCtx({
    docs: flying(T5)
  });
  ctx.live = fakeLive();
  await mount(ctx, missionOf(RDRAWER, HAND), {
    mine: true
  });
  await until(() => ctx.live.subs.size === 1);
  for (const s of [30, 25, 20, 15, 10, 5]) {
    ctx.live.emit(rfix(s, {
      headingDeg: 250
    }));
    await sleep(80);
  }
  ctx.live.emit(rfix(0, {
    onGround: false
  }));
  await sleep(200);
  ck('le ravitaillement au mauvais cap : la tenue n\'est jamais complète, un relevé en l\'air n\'ouvre rien', empty() && !ctx.store.get(BOOK)?.drawer_B, ctx.store.get(BOOK));
  DV.stop();

  // ---- 13. lot T3 : l'enveloppe et la liseuse posées avec la section, « lu » écrit dans MON carnet
  /** Une fausse fiche (.ms-sheet et sa rangée d'actions) dont la section « Tiroirs » est l'hôte. */
  const sheetHost = () => {
    stage.innerHTML =
      '<div data-module="missions"><div class="ms-sheet"><section class="ms-first"><section data-drawers></section><div class="ms-actions"><a data-do="prepare" href="#fuel">Préparer ce vol</a></div></section><section class="ms-detail"></section></div></div>';
    return stage.querySelector('[data-drawers]');
  };
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': index(Date.now() + 10 * MIN)
    }
  });
  DV.show(sheetHost(), {
    ctx,
    id: ID,
    mission: {
      ...seenMission,
      title: 'Recherche cachée'
    }
  });
  await until(() => !!q('[data-rd-read]'));
  ck('MA mission dans une fiche : « Lire la mission » est posé dans la rangée des actions, après « Préparer ce vol » ; rien n\'est écrit dans mon carnet',
    qa('.ms-actions > *').map(e => e.textContent).join('|') === 'Préparer ce vol|Lire la mission' && !ctx.store.has(BOOK), qa(
      '.ms-actions > *').map(e => e.textContent));
  q('[data-rd-read]').click();
  ck('mission affectée pas encore lue : l\'enveloppe — pour moi (mon trigramme), rien du tiroir fermé ni de sa zone', !!q(
      '[data-rd-env]') && text('.rd-lab').includes('AAA') && !q('[data-reader]').innerHTML.includes('Secteur') && !q('[data-reader]')
    .innerHTML.includes('ZONE-2'), text('[data-reader]'));
  q('[data-rd-open]').click();
  await until(() => !!q('[data-rd-pages]'));
  ck('« Ouvrir l\'enveloppe » écrit « lu » dans MON carnet (read_at, la séance, aucun tiroir), demande un passage, et ouvre la liseuse ; la zone cachée et le titre du tiroir fermé n\'y sont pas',
    typeof ctx.store.get(BOOK)?.read_at === 'string' && /^A:/.test(ctx.store.get(BOOK).seance) && !Object.keys(ctx.store.get(BOOK)).some(
      k => k.startsWith('drawer_')) && ctx.synced >= 1 && text('[data-rd-closed]') === 'Tiroirs encore fermés : 1' && !q(
      '[data-reader]').innerHTML.includes('Secteur') && !q('[data-reader]').innerHTML.includes('ZONE-2') && [...ctx.store.keys()]
    .every(p => p === BOOK || p.startsWith('cache/missions/') || p === 'missions/affectations.json'), [ctx.store.get(BOOK), text(
      '[data-reader]')]);
  const readAt = ctx.store.get(BOOK).read_at;
  q('[data-rd-back]').click();
  q('[data-rd-read]').click();
  ck('la mission lue : plus d\'enveloppe, « lu » n\'est pas récrit', !q('[data-rd-env]') && !!q('[data-rd-pages]') && ctx.store.get(BOOK)
    .read_at === readAt);
  q('[data-rd-back]').click();
  await twice('B');
  await until(() => ctx.store.get(BOOK)?.drawer_B?.state === 'open');
  q('[data-rd-read]').click();
  while (!q('[data-rd-next]').disabled) q('[data-rd-next]').click();
  ck('le tiroir ouvert a sa page, la dernière : son titre, son message, comment il s\'est ouvert ; « lu » est gardé à l\'écriture du geste',
    q('.rd-page')?.dataset.rdDrawer === 'B' && text('.rd-page').includes('Secteur') && text('[data-rd-msg]') === 'Message du tiroir.' &&
    text('[data-rd-how]').startsWith('ouvert à la main') && ctx.store.get(BOOK).read_at === readAt && !q('[data-rd-closed]'), text(
      '.rd-page'));
  // une mission qu'on feuillette, dans une fiche : ni bouton ni liseuse
  DV.stop();
  ck('la section arrêtée : le bouton et la liseuse sont retirés', !q('[data-rd-read]') && !q('[data-reader]'));
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: []
      }
    }
  });
  DV.show(sheetHost(), {
    ctx,
    id: ID,
    mission: seenMission
  });
  await until(() => !!q('[data-dw-count]'));
  await sleep(100);
  ck('mission feuilletée : pas de « Lire la mission », pas de liseuse', !q('[data-rd-read]') && !q('[data-reader]'));
  // jouée seul (la mission de mon vol, sans affectation) : la liseuse, sans enveloppe, rien d'écrit
  DV.stop();
  ctx = fakeCtx({
    docs: {
      'missions/affectations.json': {
        assignments: []
      },
      'pilot/AAA/current_flight.json': {
        mission: ID
      }
    }
  });
  DV.show(sheetHost(), {
    ctx,
    id: ID,
    mission: seenMission
  });
  await until(() => !!q('[data-rd-read]'));
  q('[data-rd-read]').click();
  ck('mission jouée seul : la liseuse sans enveloppe, rien n\'est écrit dans mon carnet', !q('[data-rd-env]') && !!q('[data-rd-pages]') &&
    !ctx.store.has(BOOK), [...ctx.store.keys()]);
  DV.stop();
  stage.innerHTML = '';

  window.__bench = {
    done: true,
    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows: rows.filter(r => !r.ok)
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
