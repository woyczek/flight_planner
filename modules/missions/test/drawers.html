<!doctype html>
<!-- Banc des tiroirs chez le pilote (modules/missions/drawers.js, SOG-0441 lot T1) : la séance, la référence d'heure, l'état de chaque
     tiroir d'après les carnets (le sien, ceux des autres : une entrée non fiable), l'heure et l'heure de repli calculées, le geste, le
     rescellement, ce que l'appareil a vu. Missions, trigrammes et positions inventés. Fonctions pures ; page nue ;
     window.__bench = { done, pass, fail, rows }. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>drawers — bench</title>
<style>
  body {
    font: 13px/1.5 ui-monospace, monospace;
    margin: 12px
  }
  .FAIL {
    color: #b00020;
    font-weight: 700
  }
  .PASS {
    color: #1b6e2a
  }
</style>
</head>
<body>
<h1 style="font-size:16px">drawers.js — bench</h1>
<pre id="out"></pre>
<script type="module">
  import * as D from '../drawers.js?v=0';
  import {
    DRAWER_IDS
  } from '../../../frame/lib/mission.js?v=0';
  const out = document.getElementById('out'),
    rows = [];
  /** Une vérification : nom, vrai ou faux, ce qu'on a mesuré. */
  function ck(name, ok, got = '') {
    rows.push({
      name,
      ok: !!ok,
      detail: ok ? '' : typeof got === 'string' ? got : JSON.stringify(got)
    });
    const l = document.createElement('div');
    l.className = ok ? 'PASS' : 'FAIL';
    l.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${ok ? '' : '  ' + rows[rows.length - 1].detail}`;
    out.append(l);
  }
  const MIN = 60e3,
    H = 3600e3,
    ID = 'X-701A',
    T0 = Date.parse('2026-11-18T19:40:00Z'), // le décollage affecté
    iso = ms => new Date(ms).toISOString();
  // l'index des affectations, tel qu'un pilote quelconque peut l'avoir écrit
  const lines = [{
    mission: ID,
    pilot: 'AAA',
    takeoff: '2026-11-18T19:40:00Z',
    status: 'affectée',
    role: 'mission'
  }, {
    mission: ID,
    pilot: 'bbb',
    takeoff: '2026-11-18T19:41:00Z',
    role: 'mission'
  }, {
    mission: ID,
    pilot: 'CCC',
    takeoff: '2026-11-18T18:00:00Z',
    role: 'convoyage'
  }, {
    mission: ID,
    pilot: 'DDD',
    takeoff: '2026-11-18T19:00:00Z',
    status: 'annulée'
  }, {
    mission: 'X-702A',
    pilot: 'EEE',
    takeoff: '2026-11-18T10:00:00Z'
  }, null, 'x', {
    mission: ID,
    pilot: '../AAA'
  }];
  // les tiroirs, à la forme convenue avec frame/lib/mission.js
  const drawers = [{
    id: 'B',
    title: 'Nouvel ordre',
    key: {
      kind: 'time',
      point: 'ORIGIN',
      delayMin: 40
    }
  }, {
    id: 'C',
    title: 'Recherche',
    key: {
      kind: 'zone',
      shape: {
        circle: {
          lat: 44.5,
          lon: -1.2,
          radiusM: 3000
        }
      },
      ceilingFt: null,
      shown: true,
      fallbackMin: 90
    }
  }, {
    id: 'D',
    title: 'Retour',
    key: {
      kind: 'hand'
    }
  }];
  const sc = D.seanceOf({
      mission: ID,
      me: 'AAA',
      lines
    }),
    ctx = now => ({
      mission: ID,
      me: 'AAA',
      seance: sc,
      now
    }),
    /** L'état des tiroirs pour AAA. */
    /** L'état des tiroirs pour AAA. Sans `chain`, chaque tiroir est jugé À PART (une liste d'un seul) : la vérification porte sur sa
     *  clé, pas sur l'ordre ; `chain: true` juge la liste entière, dans l'ordre. */
    st = (o = {}) => {
      const opts = {
          me: 'AAA',
          seance: o.seance || sc,
          book: D.readBook(o.doc, ID),
          others: (o.others || []).map(([pilot, doc]) => ({
            pilot,
            book: D.readBook(doc, ID)
          })),
          seen: o.seen,
          now: o.now ?? T0,
          passage: o.passage,
          crosses: o.crosses
        },
        list = o.drawers || drawers;
      return o.chain ? D.stateOf(list, opts) : list.flatMap(d => D.stateOf([d], opts));
    },
    by = (list, id) => list.find(x => x.id === id),
    /** Le carnet d'un autre pilote, ce tiroir ouvert. */
    peer = (id, at, how = 'hand', more = {}) => ({
      schema: 1,
      mission: ID,
      seance: sc.key,
      [`drawer_${id}`]: {
        state: 'open',
        at: iso(at),
        how,
        ...more
      }
    });

  // ---- le chemin du carnet
  ck('bookPath : pilot/<TRI>/missions/<ID>.json, trigramme et identifiant en majuscules', D.bookPath('aaa', 'x-701a') ===
    'pilot/AAA/missions/X-701A.json', D.bookPath('aaa', 'x-701a'));
  ck('bookPath : jamais un chemin pris tel quel (« ../ », un trigramme de quatre lettres, rien)', [D.bookPath('AAA', '../../etc'), D
    .bookPath('AAAA', ID), D.bookPath('', ID), D.bookPath('AAA', null), D.bookPath('A/A', ID)
  ].every(x => x === null));

  // ---- la séance
  ck('séance affectée : A:<jour UTC du premier décollage>, l\'équipage sans le convoyeur ni la ligne annulée, la référence = ce décollage',
    sc.key === 'A:2026-11-18' && sc.ref === T0 && sc.crew.join() === 'AAA,BBB' && sc.assigned === true, sc);
  const noTime = D.seanceOf({
    mission: ID,
    me: 'AAA',
    lines: [{
      mission: ID,
      pilot: 'AAA'
    }]
  });
  ck('séance affectée sans heure (astreinte) : A:0, aucune référence', noTime.key === 'A:0' && noTime.ref === null && noTime.assigned,
    noTime);
  const solo0 = D.seanceOf({
      mission: ID,
      me: 'ZZZ',
      lines
    }),
    FL = {
      mission: ID,
      started: {
        at: '2026-11-19T08:00:00Z'
      }
    },
    solo = D.seanceOf({
      mission: ID,
      me: 'ZZZ',
      lines,
      flight: FL
    }),
    soloOther = D.seanceOf({
      mission: ID,
      me: 'ZZZ',
      lines,
      flight: {
        mission: 'X-702A',
        started: FL.started
      }
    });
  ck('séance jouée seul : aucune avant le départ, S:<started.at> ensuite, l\'équipage = le pilote ; le vol d\'une autre mission ne compte pas',
    solo0.key === null && solo0.crew.join() === 'ZZZ' && !solo0.assigned && solo.key === 'S:2026-11-19T08:00:00.000Z' && solo.ref === Date
    .parse(FL.started.at) && soloOther.key === null, [solo0, solo, soloOther]);
  ck('séance : douze trigrammes au plus, un index qui n\'est pas une liste ne casse rien', D.seanceOf({
    mission: ID,
    me: 'AAA',
    lines: Array.from({
      length: 40
    }, (_, i) => ({
      mission: ID,
      pilot: 'A' + String.fromCharCode(65 + (i % 26)) + String.fromCharCode(65 + Math.floor(i / 26))
    })).concat([{
      mission: ID,
      pilot: 'AAA'
    }])
  }).crew.length === 12 && D.seanceOf({
    mission: ID,
    me: 'AAA',
    lines: {
      length: 3
    }
  }).key === null);

  // ---- l'heure : calculée, jamais écrite
  let s = st({
    now: T0 + 39 * MIN
  });
  ck('clé « heure » : fermé avant H + 40 min, son échéance dite, « estimée » tant que le départ est celui de l\'affectation', by(s, 'B')
    .open === false && by(s, 'B').dueAt === T0 + 40 * MIN && by(s, 'B').estimated === true, by(s, 'B'));
  s = st({
    now: T0 + 40 * MIN
  });
  ck('clé « heure » : ouvert à l\'échéance, « time », sans auteur, à l\'heure de l\'échéance', by(s, 'B').open && by(s, 'B').how ===
    'time' && by(s, 'B').by === null && by(s, 'B').at === T0 + 40 * MIN && !by(s, 'B').mine, by(s, 'B'));
  const started = D.withStart(null, ctx(T0 + 10 * MIN), T0 + 10 * MIN);
  s = st({
    doc: started,
    now: T0 + 45 * MIN
  });
  ck('départ réel écrit au carnet : la référence devient ce départ (H + 50 min), l\'heure n\'est plus « estimée »', started.start_at ===
    iso(T0 + 10 * MIN) && by(s, 'B').open === false && by(s, 'B').dueAt === T0 + 50 * MIN && by(s, 'B').estimated === false, [started, by(
      s, 'B')]);
  s = st({
    others: [
      ['BBB', {
        schema: 1,
        mission: ID,
        seance: sc.key,
        start_at: iso(T0 + 5 * MIN)
      }]
    ],
    doc: started,
    now: T0 + 20 * MIN
  });
  ck('le départ réel le plus ancien de l\'équipage fait la référence (BBB parti à H + 5)', by(s, 'B').dueAt === T0 + 45 * MIN, by(s, 'B')
    .dueAt);
  s = st({
    others: [
      ['BBB', {
        schema: 1,
        mission: ID,
        seance: sc.key,
        start_at: iso(T0 - 13 * H)
      }],
      ['EEE', {
        schema: 1,
        mission: ID,
        seance: sc.key,
        start_at: iso(T0 - 1 * H)
      }]
    ],
    now: T0
  });
  ck('un départ à plus de douze heures du décollage affecté, ou d\'un pilote hors de la mission, ne déplace pas la référence', by(s, 'B')
    .dueAt === T0 + 40 * MIN, by(s, 'B').dueAt);
  s = st({
    doc: started,
    now: T0
  });
  ck('un départ écrit dans le futur (horloge fausse) ne déplace pas la référence', by(s, 'B').dueAt === T0 + 40 * MIN && by(s, 'B')
    .estimated === true, by(s, 'B'));
  const byPoint = [{
    id: 'B',
    title: 't',
    key: {
      kind: 'time',
      point: 'PT2',
      delayMin: 10
    }
  }];
  s = st({
    drawers: byPoint,
    doc: started,
    passage: p => p === 'PT2' ? {
      nm: 60,
      min: 25
    } : null,
    now: T0 + 20 * MIN
  });
  ck('clé « heure » au passage d\'un lieu : départ + temps estimé + délai, toujours « estimée » ; un nombre ou { min } sont lus', by(s, 'B')
    .dueAt === T0 + 45 * MIN && by(s, 'B').estimated === true && by(st({
      drawers: byPoint,
      passage: () => 25,
      now: T0
    }), 'B').dueAt === T0 + 35 * MIN, by(s, 'B'));
  s = st({
    drawers: byPoint,
    passage: () => null,
    now: T0 + 20 * H
  });
  ck('temps de passage inconnu : aucune échéance, le tiroir reste fermé (le geste reste)', by(s, 'B').open === false && by(s, 'B').dueAt ===
    null && by(s, 'B').estimated === false, by(s, 'B'));
  s = D.stateOf(drawers, {
    me: 'AAA',
    seance: noTime,
    now: T0 + 20 * H
  });
  ck('sans heure de référence (astreinte, mission pas encore démarrée) : ni l\'heure ni le repli n\'ouvrent', s.every(x => !x.open && x
    .dueAt === null), s);

  // ---- l'heure de repli d'un tiroir à zone ou à objet
  s = st({
    now: T0 + 89 * MIN
  });
  const s2 = st({
    now: T0 + 90 * MIN
  });
  ck('heure de repli : la zone non franchie, le tiroir s\'ouvre à H + 90 min, « fallback »', by(s, 'C').open === false && by(s, 'C')
    .dueAt === T0 + 90 * MIN && by(s2, 'C').open && by(s2, 'C').how === 'fallback' && by(s2, 'C').by === null, [by(s, 'C'), by(s2, 'C')]);
  s = st({
    drawers: [{
      id: 'C',
      key: {
        kind: 'object',
        object: {
          kind: '',
          lat: 44,
          lon: -1,
          rangeM: 500,
          heightFt: null
        },
        fallbackMin: null
      }
    }],
    now: T0 + 30 * H
  });
  ck('sans heure de repli dans le fichier : jamais ouvert par l\'heure', by(s, 'C').open === false && by(s, 'C').dueAt === null, by(s,
    'C'));

  const arrival = [{
    id: 'B',
    title: 'Au terrain',
    key: {
      kind: 'arrival',
      point: 'LFXX',
      fallbackMin: 120
    }
  }, {
    id: 'C',
    key: {
      kind: 'actor'
    }
  }, {
    id: 'D',
    key: {
      kind: 'hand',
      fallbackMin: 30
    }
  }];
  ck('le geste seul avec une heure de repli (une condition de l\'auteur que le lecteur ne lit pas) : fermé avant, ouvert « fallback » à H + 30 min',
    (x => x.open === false && x.dueAt === T0 + 30 * MIN)(by(st({
      drawers: arrival,
      now: T0 + 29 * MIN
    }), 'D')) && by(st({
      drawers: arrival,
      now: T0 + 30 * MIN
    }), 'D').how === 'fallback');
  s = st({
    drawers: arrival,
    others: [
      ['BBB', peer('B', T0 + 30 * MIN, 'zone')]
    ],
    now: T0 + 119 * MIN
  });
  const s3 = st({
    drawers: arrival,
    now: T0 + 30 * H
  });
  ck('une clé que le calcul ne sait pas juger (« arrivée », cible mobile) n\'est pas refusée : fermé, sa clé gardée ; le repli l\'ouvre s\'il existe, sinon le geste seul ; un constat de zone d\'un autre n\'y vaut rien',
    by(s, 'B').open === false && by(s, 'B').key.kind === 'arrival' && by(s, 'B').dueAt === T0 + 120 * MIN && by(s, 'B').refused[0]
    ?.why === 'key' && by(s3, 'B').how === 'fallback' && by(s3, 'C').open === false && by(s3, 'C').dueAt === null && by(D.stateOf([
      arrival[1]
    ], {
      me: 'AAA',
      seance: sc,
      book: D.readBook(D.withOpen(null, ctx(T0), 'C'), ID),
      now: T0 + MIN
    }), 'C').how === 'hand', [s, s3]);

  // ---- le geste du pilote, et le carnet écrit
  const opened = D.withOpen(null, ctx(T0 + 20 * MIN), 'D');
  ck('withOpen : le carnet à écrire — une clé de premier niveau par tiroir, la séance, l\'auteur, la date', JSON.stringify(opened) === JSON
    .stringify({
      schema: 1,
      mission: ID,
      seance: 'A:2026-11-18',
      read_at: null,
      start_at: null,
      drawer_D: {
        state: 'open',
        at: iso(T0 + 20 * MIN),
        how: 'hand'
      },
      updated_at: iso(T0 + 20 * MIN),
      by: 'AAA'
    }), opened);
  s = st({
    doc: opened,
    now: T0 + 21 * MIN
  });
  ck('le geste : ouvert « à la main », par moi, à l\'heure du geste', by(s, 'D').open && by(s, 'D').how === 'hand' && by(s, 'D').by ===
    'AAA' && by(s, 'D').mine && by(s, 'D').at === T0 + 20 * MIN, by(s, 'D'));
  const again = D.withOpen(opened, ctx(T0 + 50 * MIN), 'D', 'zone');
  ck('un tiroir déjà ouvert par moi garde sa première ouverture (heure, manière)', again.drawer_D.at === iso(T0 + 20 * MIN) && again
    .drawer_D.how === 'hand' && again.updated_at === iso(T0 + 50 * MIN), again);
  const found = D.withOpen(opened, ctx(T0 + 60 * MIN), 'C', 'zone', {
    from: {
      lat: 44.512345678,
      lon: -1.204,
      altFt: 2400.4,
      at: iso(T0 + 59 * MIN),
      aglFt: 800,
      onGround: false,
      gsKt: 120,
      junk: 'x'
    },
    to: {
      lat: 44.498,
      lon: -1.171,
      altFt: 'haut',
      at: iso(T0 + 60 * MIN)
    },
    source: 'xplane',
    extra: 'x'
  });
  ck('un constat (zone) porte ses DEUX relevés à pleine précision, bornés par le service du cadre (un champ inconnu ou illisible est absent), et sa source ; les autres tiroirs du carnet sont gardés',
    JSON.stringify(found.drawer_C) === JSON.stringify({
      state: 'open',
      at: iso(T0 + 60 * MIN),
      how: 'zone',
      from: {
        lat: 44.512345678,
        lon: -1.204,
        at: iso(T0 + 59 * MIN),
        altFt: 2400.4,
        aglFt: 800,
        onGround: false,
        gsKt: 120
      },
      to: {
        lat: 44.498,
        lon: -1.171,
        at: iso(T0 + 60 * MIN)
      },
      source: 'xplane'
    }) && found.drawer_D.at === iso(T0 + 20 * MIN), found);
  ck('l\'heure d\'un constat est celle du FAIT (le franchissement), jamais dans le futur ; un relevé à 0°, 0° ou en tableau n\'est pas gardé',
    D.withOpen(null, ctx(T0 + 60 * MIN), 'C', 'zone', {
      at: T0 + 57 * MIN
    }).drawer_C.at === iso(T0 + 57 * MIN) && D.withOpen(null, ctx(T0 + 60 * MIN), 'C', 'zone', {
      at: T0 + 90 * MIN,
      from: {
        lat: 0,
        lon: 0
      },
      to: [44.5, -1.2, 2000]
    }).drawer_C.at === iso(T0 + 60 * MIN) && D.withOpen(null, ctx(T0 + 60 * MIN), 'C', 'zone', {
      from: {
        lat: 0,
        lon: 0
      },
      to: [44.5, -1.2, 2000]
    }).drawer_C.from === undefined);
  ck('withOpen : un tiroir hors de B à M, une manière inconnue, un pilote ou une mission illisibles : rien à écrire', [D.withOpen(null,
    ctx(T0), 'N'), D.withOpen(null, ctx(T0), 'B', 'time'), D.withOpen(null, {
    ...ctx(T0),
    me: 'x'
  }, 'B'), D.withOpen(null, {
    ...ctx(T0),
    mission: '../x'
  }, 'B')].every(x => x === null));
  const read = D.withRead(opened, ctx(T0 + 30 * MIN)),
    read2 = D.withRead(read, ctx(T0 + 31 * MIN));
  ck('withRead : la première lecture est gardée', read.read_at === iso(T0 + 30 * MIN) && read2.read_at === iso(T0 + 30 * MIN) && read2
    .drawer_D.state === 'open', [read, read2]);
  // un trajet qui traverse la zone du tiroir C (cercle de 3 km autour de 44.5 N, 1.2 W), et un autre, loin
  const leg = {
      from: {
        lat: 44.52,
        lon: -1.25,
        at: iso(T0 + 29 * MIN),
        altFt: 2000
      },
      to: {
        lat: 44.49,
        lon: -1.15,
        at: iso(T0 + 30 * MIN),
        altFt: 2000
      }
    },
    far = {
      from: {
        lat: 45.2,
        lon: -1.25,
        at: iso(T0 + 29 * MIN),
        altFt: 2000
      },
      to: {
        lat: 45.19,
        lon: -1.15,
        at: iso(T0 + 30 * MIN),
        altFt: 2000
      }
    };
  s = st({
    doc: found,
    others: [
      ['BBB', peer('C', T0 + 50 * MIN, 'zone', leg)]
    ],
    now: T0 + 70 * MIN
  });
  ck('la plus ancienne ouverture retenue est « l\'ouverture » : la zone franchie par BBB à H + 50 avant moi à H + 60 ; l\'heure passée de B reste « time »',
    by(s, 'C').by === 'BBB' && by(s, 'C').at === T0 + 50 * MIN && !by(s, 'C').mine && by(s, 'B').how === 'time' && by(s, 'D').mine, s);

  // ---- resceller (outil d'auteur)
  const sealed = D.withSeal(opened, ctx(T0 + 41 * MIN), 'B');
  s = st({
    doc: sealed,
    now: T0 + 3 * H
  });
  ck('rescellé par moi : l\'heure passée ne l\'ouvre plus, « sealed » ; mes autres tiroirs ne bougent pas', sealed.drawer_B.state ===
    'sealed' && by(s, 'B').open === false && by(s, 'B').sealed === true && by(s, 'D').open, [sealed, s]);
  const sealedC = D.withSeal(opened, ctx(T0 + 95 * MIN), 'C');
  s = st({
    doc: sealedC,
    others: [
      ['BBB', peer('C', T0 + 50 * MIN, 'zone', leg)]
    ],
    now: T0 + 3 * H
  });
  ck('rescellé par moi mais ouvert par le constat d\'un autre de la mission : ouvert (un tiroir ouvert pour tous le reste)', by(s, 'C')
    .open && by(s, 'C').by === 'BBB' && by(s, 'C').sealed === false && by(st({
      doc: sealedC,
      now: T0 + 3 * H
    }), 'C').sealed === true, by(s, 'C'));

  // ---- le carnet d'un autre : une entrée non fiable
  s = st({
    others: [
      ['BBB', peer('C', T0 + 30 * MIN, 'zone', leg)]
    ],
    now: T0 + 31 * MIN
  });
  ck('ouvert pour tous : le carnet d\'un pilote de la mission dit la zone franchie → ouvert ici, « zone », par BBB', by(s, 'C').open && by(
      s, 'C').by === 'BBB' && by(s, 'C').how === 'zone' && !by(s, 'C').mine && by(s, 'C').refused.length === 0 && by(s, 'C').hands
    .length === 0, by(s, 'C'));
  s = st({
    others: [
      ['BBB', peer('D', T0 + 30 * MIN)],
      ['BBB', peer('C', T0 + 30 * MIN)]
    ],
    now: T0 + 31 * MIN
  });
  ck('le GESTE d\'un autre n\'ouvre que pour lui : fermé ici, et dit (« hands » : BBB, son heure), sans refus — sur un tiroir à geste comme sur un tiroir à zone',
    ['D', 'C'].every(id => by(s, id).open === false && JSON.stringify(by(s, id).hands) === JSON.stringify([{
      by: 'BBB',
      at: T0 + 30 * MIN
    }]) && by(s, id).refused.length === 0) && !D.SHARED.includes('hand'), s);
  /** Ce que donne une ouverture de D venue d'un autre carnet : fermé ou ouvert, les refus, ceux qui l'ont ouvert pour eux seuls. */
  const refusal = (others, o = {}) => {
    const x = by(st({
      others,
      now: T0 + 31 * MIN,
      ...o
    }), o.id || 'D');
    return `${x.open ? 'OPEN' : 'closed'}:${x.refused.map(r => `${r.by}=${r.why}`).join()}:${x.hands.map(h => h.by).join()}`;
  };
  ck('refus « stranger » : un pilote qui n\'est pas de la mission (EEE), le convoyeur (CCC), une ligne annulée (DDD), moi-même', refusal([
    ['EEE', peer('D', T0)],
    ['CCC', peer('D', T0)],
    ['DDD', peer('D', T0)],
    ['AAA', peer('D', T0)]
  ]) === 'closed:EEE=stranger,CCC=stranger,DDD=stranger,AAA=stranger:', refusal([
    ['EEE', peer('D', T0)],

    pass: rows.filter(r => r.ok).length,
    fail: rows.filter(r => !r.ok).length,
    rows: rows.filter(r => !r.ok)
  };
  const h = document.createElement('div');
  h.textContent = `${window.__bench.pass} PASS · ${window.__bench.fail} FAIL`;
  out.prepend(h);
</script>
</body>
</html>
