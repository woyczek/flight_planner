    brief: { fr: "L’équipage confirme la déconnexion et ouvre le retour.", en: "The crew confirms the disconnection and opens the return.", de: "Die Besatzung bestätigt die Trennung und öffnet den Rückflug.", es: "La tripulación confirma la desconexión y abre el regreso." }
  - id: fi-procedure
    family: FI
    key: hand
    title: { fr: "Validation de procédure déclarée", en: "Procedure validation declared", de: "Verfahrensprüfung gemeldet", es: "Validación de procedimiento declarada" }
    brief: { fr: "L’équipage confirme la fin de la procédure de contrôle.", en: "The crew confirms the end of the check procedure.", de: "Die Besatzung bestätigt das Ende des Prüfverfahrens.", es: "La tripulación confirma el fin del procedimiento de control." }
  - id: survey-lidar
    family: SURVEY
    key: hand
    title: { fr: "Acquisition LIDAR déclarée", en: "LIDAR acquisition declared", de: "LIDAR-Erfassung gemeldet", es: "Adquisición LIDAR declarada" }
    brief: { fr: "L’opérateur confirme la fin d’acquisition.", en: "The operator confirms the end of the acquisition.", de: "Der Operator bestätigt das Ende der Erfassung.", es: "El operador confirma el fin de la adquisición." }
  # --- l'arrivée au terrain (1)
  - id: special-ferry
    family: SPECIAL
    key: arrival
    title: { fr: "Convoyage vers le terrain", en: "Ferry to the aerodrome", de: "Überführung zum Platz", es: "Traslado al aeródromo" }
    brief: { fr: "Valider l’arrivée au terrain de destination.", en: "Validate the arrival at the destination aerodrome.", de: "Die Ankunft am Zielplatz bestätigen.", es: "Validar la llegada al aeródromo de destino." }
    params: { radius_nm: 1, speed_max_kt: 30, require_on_ground: true }
    fallback_min: 120
models:
  - id: blank
    type: ""
    title: { fr: "Mission vierge", en: "Blank mission", de: "Leere Mission", es: "Misión en blanco" }
    brief: { fr: "Aucun tiroir, aucun lieu : tout est à poser.", en: "No drawer, no place: everything is yours to set.", de: "Keine Schublade, kein Ort: alles ist selbst zu setzen.", es: "Ningún cajón, ningún lugar: todo queda por poner." }
    drawers: []
    places: []
  - id: search-glacier
    type: SAR
    title: { fr: "Recherche sur un glacier", en: "Search on a glacier", de: "Suche auf einem Gletscher", es: "Búsqueda en un glaciar" }
    brief: { fr: "Une zone de passage, une personne à trouver, le retour au terrain.", en: "A passage zone, a person to find, the return to the aerodrome.", de: "Eine Durchflugzone, eine zu findende Person, die Rückkehr zum Platz.", es: "Una zona de paso, una persona por encontrar, el regreso al aeródromo." }
    drawers:
      - brick: sar-land
        place: zone-1
        title: { fr: "Entrée sur le glacier", en: "Entering the glacier", de: "Einflug über den Gletscher", es: "Entrada en el glaciar" }
      - brick: le-missing
        place: obj-1
        title: { fr: "Personne en vue", en: "Person in sight", de: "Person in Sicht", es: "Persona a la vista" }
      - brick: special-ferry
        title: { fr: "Retour au terrain", en: "Return to the aerodrome", de: "Rückkehr zum Platz", es: "Regreso al aeródromo" }
    places:
      - { id: zone-1, kind: zone, name: { fr: "Secteur de recherche", en: "Search sector", de: "Suchsektor", es: "Sector de búsqueda" } }
      - { id: obj-1, kind: object, okind: person, name: { fr: "Personne à trouver", en: "Person to find", de: "Zu findende Person", es: "Persona por encontrar" } }
  - id: interception
    type: COMBAT
    title: { fr: "Interception d’un aéronef", en: "Intercepting an aircraft", de: "Abfangen eines Luftfahrzeugs", es: "Interceptación de una aeronave" }
    brief: { fr: "Une zone d’entrée, l’aéronef à identifier, le retour au terrain.", en: "An entry zone, the aircraft to identify, the return to the aerodrome.", de: "Eine Einflugzone, das zu identifizierende Luftfahrzeug, die Rückkehr zum Platz.", es: "Una zona de entrada, la aeronave por identificar, el regreso al aeródromo." }
    drawers:
      - brick: combat-bfm
        place: zone-1
        title: { fr: "Entrée dans le secteur", en: "Entering the sector", de: "Einflug in den Sektor", es: "Entrada en el sector" }
      - brick: combat-intercept
        place: obj-1
        title: { fr: "Contact établi", en: "Contact made", de: "Kontakt hergestellt", es: "Contacto establecido" }
      - brick: special-ferry
        title: { fr: "Retour au terrain", en: "Return to the aerodrome", de: "Rückkehr zum Platz", es: "Regreso al aeródromo" }
    places:
      - { id: zone-1, kind: zone, name: { fr: "Secteur d’interception", en: "Interception sector", de: "Abfangsektor", es: "Sector de interceptación" } }
      - { id: obj-1, kind: object, okind: aircraft, name: { fr: "Aéronef à identifier", en: "Aircraft to identify", de: "Zu identifizierendes Luftfahrzeug", es: "Aeronave por identificar" } }
