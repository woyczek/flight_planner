# V3 missions — le catalogue des briques et des modèles de l'atelier (SOG-0444, lot « modèles de mission »), livré avec le module, lu
# en lecture seule par modules/missions/catalog.js (readCatalog : une entrée non fiable, bornée — 128 Ko, 80 briques, 20 modèles,
# 12 tiroirs et 20 lieux par modèle, identifiants à forme fermée, textes sans balise, nombres dans leurs bornes).
# Une brique est un tiroir sans lieu — ou avec les lieux « à placer » qu'elle crée (`places`, quatre au plus, la forme de ceux d'un modèle ;
# `place` cite l'un d'eux : SOG-0521) : sa clé (une de celles que l'atelier sait écrire : hand, time, zone, object, arrival, et les
# conditions 1.1 hover, landing, overflight, sequence, event — SOG-0500 (d) — et refill, SOG-0521), son titre et son message en quatre langues, ses réglages
# (`params`, bornés comme le lecteur les borne), son heure de repli. Une brique n'est proposée que si le vol juge sa clé. Un modèle : un type (la famille, vide pour toute famille), des tiroirs (une
# brique, et ce que le modèle y change) et des lieux « à placer » — une sorte et un nom, jamais une position.
# Tout est inventé : aucun indicatif, aucune immatriculation, aucun lieu réel, aucune coordonnée.
version: 1
families: [SAR, HADR, MARITIME, LE, FIRE, AIRLIFT, AIRBORNE, SPECIAL, COMBAT, ISR, COMMAND, AAR, FI, SURVEY, HEMS, SOF]
