    family: ISR
    key: hand
    title: { fr: "Observation capteur déclarée", en: "Sensor observation declared", de: "Sensorbeobachtung gemeldet", es: "Observación por sensor declarada" }
    brief: { fr: "L’opérateur confirme l’identification capteur.", en: "The operator confirms the sensor identification.", de: "Der Operator bestätigt die Sensoridentifizierung.", es: "El operador confirma la identificación por sensor." }
