  # --- le geste du pilote seul (6)
  - id: fire-reload
    family: FIRE
    key: hand
    title: { fr: "Écopage / rechargement déclaré", en: "Scooping / reload declared", de: "Wasseraufnahme / Nachladen gemeldet", es: "Carga de agua / recarga declarada" }
    brief: { fr: "Le pilote confirme le rechargement avant la nouvelle rotation.", en: "The pilot confirms the reload before the next rotation.", de: "Der Pilot bestätigt das Nachladen vor dem nächsten Umlauf.", es: "El piloto confirma la recarga antes de la nueva rotación." }
  - id: airborne-personnel
    family: AIRBORNE
    key: hand
    title: { fr: "Largage de personnel déclaré", en: "Personnel drop declared", de: "Personenabsprung gemeldet", es: "Lanzamiento de personal declarado" }
    brief: { fr: "La confirmation de l’équipage valide le largage.", en: "The crew’s confirmation validates the drop.", de: "Die Bestätigung der Besatzung bestätigt den Absprung.", es: "La confirmación de la tripulación valida el lanzamiento." }
