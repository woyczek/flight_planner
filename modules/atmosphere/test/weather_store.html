<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>atmosphere — weather cache bench</title>
<!-- Banc de la réserve météo partagée (weather_store.js) : couche de données et réseau simulés (Open-Meteo répondu par
     la démonstration) ; cases, fichier par modèle / case / jour, relecture sans appel, variable ou jour manquant seuls
     demandés, case partagée entre routes, nouveau run, variable refusée, lectures simultanées, décompte, jours passés
     effacés. Page d'outil, hors des applications ; servir le dépôt et l'ouvrir. -->
<style>
  body {
    margin: 0;
    padding: 12px;
    background: #f4f6f8;
    color: #17202a;
    font: 13px/1.5 system-ui, sans-serif
  }
  .ok {
    color: #1b7a3a
  }
  .ko {
    color: #b3261e;
    font-weight: 600
  }
</style>
</head><body><h1>Weather cache bench</h1><div id="out"></div>
<script type="module">
import {
  weatherStore,
  cellOf
} from '../weather_store.js?v=0';
import * as Demo from '../demo.js?v=0';
let T = Date.parse('2026-10-24T21:00:00Z');
const now = () => T;
const db = new Map();
let puts = 0;
const data = {
  get: async p => db.has(p) ? JSON.parse(db.get(p)) : null,
  put: async (p, v) => {
    puts++;
    db.set(p, JSON.stringify(v));
  },
  cached: async pre => [...db.keys()].filter(k => k.startsWith(pre)).map(path => ({
    path
  })),
  remove: async p => {
    db.delete(p);
  }
};
const calls = [];
let refuse = null;
const net = {
  fetch: async (url) => {
    const u = new URL(url);
    if (u.pathname.endsWith('meta.json')) return new Response(JSON.stringify({
      last_run_initialisation_time: 1000
    }), {
      status: 200
    });
    const lat = u.searchParams.get('latitude').split(','),
      lon = u.searchParams.get('longitude').split(','),
      vars = u.searchParams.get('hourly').split(',');
    calls.push({
      n: lat.length,
      v: vars.length,
      from: u.searchParams.get('start_date'),
      to: u.searchParams.get('end_date')
    });
    if (refuse && vars.some(v => refuse.test(v))) return new Response(JSON.stringify({
      error: true,
      reason: 'Cannot initialize ' + vars.find(v => refuse.test(v))
    }), {
      status: 400
    });
    const days = (Date.parse(u.searchParams.get('end_date')) - Date.parse(u.searchParams.get('start_date'))) / 864e5 + 1;
    const out = [].concat(Demo.forecast(lat.map((x, i) => ({
      lat: +x,
      lon: +lon[i]
    })), vars, Date.parse(u.searchParams.get("start_date"))));
    // demo gives 48 h from start: keep `days` days
    out.forEach(o => {
      const k = days * 24;
      for (const key in o.hourly) o.hourly[key] = o.hourly[key].slice(0, k);
    });
    return new Response(JSON.stringify(out.length === 1 ? out[0] : out), {
      status: 200
    });
  }
};
const W = weatherStore({
  data,
  net,
  now
});
const out = document.getElementById('out'),
  res = [];
const ok = (c, m) => {
  res.push(c);
  out.insertAdjacentHTML('beforeend', `<div class="${c ? 'ok' : 'ko'}">${c ? '✓' : '✗'} ${m.replace(/</g, '&lt;')}</div>`);
};
const route = [{
  lat: 47.1569,
  lon: -1.6078
}, {
  lat: 47.16,
  lon: -1.61
}, {
  lat: 46.58,
  lon: -1.2
}, {
  lat: 43.44,
  lon: 5.215
}];
const V1 = ['temperature_2m', 'pressure_msl', 'temperature_850hPa', 'relative_humidity_850hPa'];
ok(cellOf(47.1569, -1.6078).id === '47.15_-1.65', 'case ' + cellOf(47.1569, -1.6078).id);
ok(cellOf(-0.01, 179.99).id === '-0.05_179.95', 'case négative ' + cellOf(-0.01, 179.99).id);
let r = await W.forecast(route, V1, {
  model: 'meteofrance_seamless',
  cacheOnly: true
});
ok(r === null, 'cacheOnly sans réserve : null');
r = await W.forecast(route, V1, {
  model: 'meteofrance_seamless'
});
ok(calls.length === 1 && calls[0].n === 3 && calls[0].from === '2026-10-24' && calls[0].to === '2026-10-25',
  'une demande, 3 cases (2 points dans la même) : ' + JSON.stringify(calls[0]));
ok(r.locs.length === 4 && r.locs[0].hourly.time.length === 48 && r.locs[0].hourly.temperature_850hPa.length === 48, '4 lieux, 48 h');
ok(Math.abs(r.weight - 3) < 1e-9, 'poids 3 × max(1, 4/10) = 3 : ' + r.weight);
ok(db.has('cache/weather/meteofrance_seamless/47.15_-1.65/2026-10-24.json'), 'fichier par modèle / case / jour');
calls.length = 0;
r = await W.forecast(route, V1, {
  model: 'meteofrance_seamless',
  cacheOnly: true
});
ok(r && r.weight === 0 && calls.length === 0, 'relu de la réserve, aucun appel');
// une variable de plus : seulement elle
const V2 = [...V1, 'wind_speed_850hPa'];
r = await W.forecast(route, V2, {
  model: 'meteofrance_seamless'
});
ok(calls.length === 1 && calls[0].v === 1 && r.locs[2].hourly.wind_speed_850hPa.length === 48, 'variable manquante seule : ' + JSON
  .stringify(calls[0]));
// autre route qui partage une case
calls.length = 0;
r = await W.forecast([{
  lat: 47.12,
  lon: -1.62
}, {
  lat: 48.0,
  lon: 2.0
}], V2, {
  model: 'meteofrance_seamless'
});
ok(calls.length === 1 && calls[0].n === 1, 'case partagée entre deux routes : une seule case demandée');
// lendemain 01Z : aujourd'hui (25) gardé, le 26 manquant
T = Date.parse('2026-10-25T01:00:00Z');
calls.length = 0;
const W2 = weatherStore({
  data,
  net,
  now
});
r = await W2.forecast(route, V1, {
  model: 'meteofrance_seamless'
});
ok(calls.length === 1 && calls[0].from === '2026-10-26' && calls[0].to === '2026-10-26', 'jour suivant seulement : ' + JSON.stringify(calls[
  0]));
ok(r.locs[0].hourly.time.length === 48 && new Date(r.locs[0].hourly.time[0] * 1000).toISOString() === '2026-10-25T00:00:00.000Z',
  'heures bout à bout depuis le 25 00Z');
// run plus récent : tout relu
T += 11 * 60e3;
calls.length = 0;
const net2 = {
  fetch: async u => u.includes('meta.json') ? new Response(JSON.stringify({
    last_run_initialisation_time: 2000
  }), {
    status: 200
  }) : net.fetch(u)
};
r = await weatherStore({
  data,
  net: net2,
  now
}).forecast(route, V1, {
  model: 'meteofrance_seamless'
});
ok(calls.length === 1 && calls[0].from === '2026-10-25' && calls[0].to === '2026-10-26', 'nouveau run : relu');
// refus d'une variable facultative
calls.length = 0;
refuse = /^cloud_cover_\d+hPa$/;
r = await W.forecast(route, ['temperature_700hPa', 'cloud_cover_700hPa'], {
  model: 'icon_seamless'
});
ok(calls.length === 2 && r.locs[0].hourly.temperature_700hPa && !r.locs[0].hourly.cloud_cover_700hPa, 'refus : redemandé sans la variable');
calls.length = 0;
r = await W.forecast(route, ['temperature_700hPa', 'cloud_cover_700hPa'], {
  model: 'icon_seamless'
});
ok(calls.length === 0, 'variable refusée notée : plus redemandée');
refuse = null;
// lectures simultanées
calls.length = 0;
const [a, b] = await Promise.all([W.forecast([{
  lat: 50,
  lon: 3
}], V1, {
  model: 'm'
}), W.forecast([{
  lat: 50,
  lon: 3
}], V1, {
  model: 'm'
})]);
ok(calls.length === 1 && a.weight + b.weight === 1, 'deux lectures simultanées : une demande');
ok((await W.spent()) > 0, 'décompte : ' + (await W.spent()));

ok(cellOf(47.1569, -1.6078, 0.25).id === '47.125_-1.625', 'case GFS 0,25° : ' + cellOf(47.1569, -1.6078, 0.25).id);
ok(cellOf(47.3, 2.0).id === '47.35_2.05', 'bord exact : ' + cellOf(47.3, 2.0).id);
calls.length = 0;
await W.forecast([{
  lat: 47.1,
  lon: -1.6
}, {
  lat: 47.2,
  lon: -1.55
}], V1, {
  model: 'gfs_seamless'
});
ok(calls.length === 1 && calls[0].n === 1, 'GFS : deux lieux dans une case de 0,25° → une case');

const before = [...db.keys()].filter(k => k.includes('2026-10-24')).length;
T = Date.parse('2026-10-26T03:00:00Z');
const n = await weatherStore({
  data,
  net,
  now
}).prune();
ok(n > 0 && ![...db.keys()].some(k => /2026-10-2[45]\.json$/.test(k)), `jours passés effacés : ${n}`);
ok((await weatherStore({
  data,
  net,
  now
}).prune()) === 0, 'une fois par jour');

out.insertAdjacentHTML('afterbegin', `<p><b>${res.filter(Boolean).length} / ${res.length}</b></p>`);
document.title += res.every(Boolean) ? ' — ok' : ' — KO';
</script>
</body></html>
