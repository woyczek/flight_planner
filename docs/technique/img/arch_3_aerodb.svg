<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" role="img" aria-labelledby="t3 d3" font-family="sans-serif">
<title id="t3">aerodb, from the sources to the navigation base</title>
<desc id="d3">Raw sources go through builders on the workstation into files per zone, cycle and kind. Those files are published to the private data repository and read by the aerodb reader on every device. Sources kept local, such as X-Plane data, feed the reader only on the workstation and are never published.</desc>
<style>
.t{font:600 14px sans-serif;fill:#1a1a1a}
.s,.k{font:12px sans-serif;fill:#4a4a4a}
.code{fill:#e3eefb;stroke:#3b78c4;stroke-width:1.5}
.loc{fill:#fdebd9;stroke:#c46a1a;stroke-width:1.5}
.data{fill:#eeeeee;stroke:#888888;stroke-width:1.5}
.ar{stroke:#555555;stroke-width:1.5;fill:none}
.arl{stroke:#c46a1a;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.mk{fill:#555555}
.mkl{fill:#c46a1a}
@media (prefers-color-scheme: dark){
.t{fill:#f2f2f2}
.s,.k{fill:#c4c4c4}
.code{fill:#1f3552;stroke:#6aa3e8}
.loc{fill:#4a2e14;stroke:#e8954a}
.data{fill:#333333;stroke:#9a9a9a}
.ar{stroke:#bbbbbb}
.arl{stroke:#e8954a}
.mk{fill:#bbbbbb}
.mkl{fill:#e8954a}
}
</style>
<defs>
<marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
<marker id="m3l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkl" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="data" x="20" y="20" width="190" height="54" rx="4"/>
<text class="t" x="115" y="42" text-anchor="middle">Raw sources</text>
<text class="s" x="115" y="60" text-anchor="middle">SIA, openAIP, FAA, NATS</text>
<rect class="code" x="245" y="20" width="190" height="54" rx="4"/>
<text class="t" x="340" y="42" text-anchor="middle">Builders</text>
<text class="s" x="340" y="60" text-anchor="middle">pieces, then zone files</text>
<rect class="data" x="470" y="20" width="190" height="54" rx="4"/>
<text class="t" x="565" y="42" text-anchor="middle">Compiled base</text>
<text class="s" x="565" y="60" text-anchor="middle">per zone, cycle, kind</text>
<rect class="data" x="470" y="110" width="190" height="54" rx="4"/>
<text class="t" x="565" y="132" text-anchor="middle">Data repository</text>
<text class="s" x="565" y="150" text-anchor="middle">private, shared by the group</text>
<rect class="code" x="470" y="200" width="190" height="54" rx="4"/>
<text class="t" x="565" y="222" text-anchor="middle">aerodb reader</text>
<text class="s" x="565" y="240" text-anchor="middle">every device, reads the base</text>
<rect class="loc" x="20" y="200" width="190" height="54" rx="4"/>
<text class="t" x="115" y="222" text-anchor="middle">Local only</text>
<text class="s" x="115" y="240" text-anchor="middle">X-Plane, EAD, never published</text>
<path class="ar" d="M212 47H243" marker-end="url(#m3)"/>
<path class="ar" d="M437 47H468" marker-end="url(#m3)"/>
<path class="ar" d="M565 74V108" marker-end="url(#m3)"/>
<path class="ar" d="M565 164V198" marker-end="url(#m3)"/>
<path class="arl" d="M212 227H468" marker-end="url(#m3l)"/>
<rect class="data" x="20" y="300" width="12" height="12"/>
<text class="k" x="38" y="310">data</text>
<rect class="code" x="110" y="300" width="12" height="12"/>
<text class="k" x="128" y="310">code</text>
<rect class="loc" x="200" y="300" width="12" height="12"/>
<text class="k" x="218" y="310">stays on the workstation (dashed)</text>
</svg>
