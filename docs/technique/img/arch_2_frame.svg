<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" role="img" aria-labelledby="t2 d2" font-family="sans-serif">
<title id="t2">The frame</title>
<desc id="d2">Navigation and levels lead to the module loader, which mounts a module. The module reads and writes through the data layer, which uses the device cache. The synchronisation control and the transport move changes between the cache and the repository.</desc>
<style>
.t{font:600 14px sans-serif;fill:#1a1a1a}
.s,.k{font:12px sans-serif;fill:#4a4a4a}
.code{fill:#e3eefb;stroke:#3b78c4;stroke-width:1.5}
.ws{fill:#e6f3e3;stroke:#4f8a3f;stroke-width:1.5}
.data{fill:#eeeeee;stroke:#888888;stroke-width:1.5}
.ar{stroke:#555555;stroke-width:1.5;fill:none}
.mk{fill:#555555}
@media (prefers-color-scheme: dark){
.t{fill:#f2f2f2}
.s,.k{fill:#c4c4c4}
.code{fill:#1f3552;stroke:#6aa3e8}
.ws{fill:#243b21;stroke:#7cc06a}
.data{fill:#333333;stroke:#9a9a9a}
.ar{stroke:#bbbbbb}
.mk{fill:#bbbbbb}
}
</style>
<defs>
<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="code" x="20" y="20" width="280" height="54" rx="4"/>
<text class="t" x="160" y="42" text-anchor="middle">Navigation and levels</text>
<text class="s" x="160" y="60" text-anchor="middle">applications, verbs, three levels</text>
<rect class="code" x="20" y="110" width="280" height="54" rx="4"/>
<text class="t" x="160" y="132" text-anchor="middle">Module loader</text>
<text class="s" x="160" y="150" text-anchor="middle">import on demand, mount</text>
<rect class="code" x="20" y="200" width="280" height="54" rx="4"/>
<text class="t" x="160" y="222" text-anchor="middle">Module</text>
<text class="s" x="160" y="240" text-anchor="middle">receives its context</text>
<rect class="code" x="380" y="110" width="280" height="54" rx="4"/>
<text class="t" x="520" y="132" text-anchor="middle">Synchronisation control</text>
<text class="s" x="520" y="150" text-anchor="middle">visible state, one button</text>
<rect class="code" x="380" y="200" width="280" height="54" rx="4"/>
<text class="t" x="520" y="222" text-anchor="middle">Data layer</text>
<text class="s" x="520" y="240" text-anchor="middle">reads and writes stay local</text>
<rect class="data" x="380" y="290" width="280" height="54" rx="4"/>
<text class="t" x="520" y="312" text-anchor="middle">Device cache</text>
<text class="s" x="520" y="330" text-anchor="middle">IndexedDB, pending writes</text>
<rect class="ws" x="20" y="290" width="280" height="54" rx="4"/>
<text class="t" x="160" y="312" text-anchor="middle">Transport</text>
<text class="s" x="160" y="330" text-anchor="middle">GitHub, launcher or local</text>
<path class="ar" d="M160 74V108" marker-end="url(#m2)"/>
<path class="ar" d="M160 164V198" marker-end="url(#m2)"/>
<path class="ar" d="M302 227H378" marker-end="url(#m2)"/>
<path class="ar" d="M520 164V198" marker-end="url(#m2)"/>
<path class="ar" d="M520 254V288" marker-start="url(#m2)" marker-end="url(#m2)"/>
<path class="ar" d="M302 317H378" marker-start="url(#m2)" marker-end="url(#m2)"/>
<rect class="code" x="20" y="358" width="12" height="12"/>
<text class="k" x="38" y="368">code of the frame</text>
<rect class="data" x="190" y="358" width="12" height="12"/>
<text class="k" x="208" y="368">data on the device</text>
<rect class="ws" x="360" y="358" width="12" height="12"/>
<text class="k" x="378" y="368">link to the outside</text>
</svg>
