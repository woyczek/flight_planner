<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistiques HEMS / MEDEVAC</title><link rel="stylesheet" href="../shared/repository_nav.css"><script src="../repository_tree"></script><style>:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#773131;--soft:#f3eaea}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--accent);color:#fff;padding:18px 24px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#f2e8e8}main{max-width:1220px;margin:20px auto;padding:0 16px}section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}h2{font-size:17px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:10px;font-weight:650}.primary{background:var(--accent);color:#fff}.secondary{background:#e5e7eb}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:10px;padding:12px}.card b{display:block;font-size:23px}.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.barrow{display:grid;grid-template-columns:1fr 42px 2fr;gap:8px;align-items:center;margin:7px 0}.track{height:16px;background:#eee;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:7px;text-align:left}th{background:#f9fafb}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Statistiques missions — HEMS / MEDEVAC</h1><p>Même structure d’analyse que le reporting GAAR</p></header><main><section><h2>Importer les données</h2><div class="row"><input id="ledgerName" data-mission-config="ledgerName" value="hems_mission_ledger.csv"><input id="file" type="file" accept=".csv,text/csv"><button class="secondary" id="demo">Exemple</button><button class="primary" onclick="print()">PDF / Imprimer</button><button class="secondary" id="export">Exporter CSV</button></div><p class="small">Le nom du registre est partagé avec les autres pages HEMS et automatiquement rechargé.</p></section><section><h2>Synthèse</h2><div class="cards" id="cards"></div></section><section><h2>Délais et durées</h2><div class="cards" id="durations"></div></section><section><h2>Répartition détaillée</h2><div class="grid" id="breakdowns"></div></section><section><h2>Table missions</h2><div style="overflow:auto"><table id="table"></table></div></section></main><script src="../shared/repository_nav.js"></script><script src="../shared/mission_reporting_config.js"></script><script src="../shared/hems_reporting.js"></script><script src="../shared/content_i18n.js"></script><script src="../shared/app_framework.js"></script></body></html>
