<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Statistiques missions — Escadrille Feux de Forêt</title><style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#773131;--soft:#f3eaea;--ok:#166534;--warn:#92400e}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--accent);color:#fff;padding:18px 24px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#f2e8e8}main{max-width:1220px;margin:20px auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr 430px;gap:18px}section,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}h2{font-size:17px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:white}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#e5e7eb}.danger{background:#7f1d1d;color:white}.ok{background:var(--ok);color:white}.warn{background:var(--warn);color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--soft);padding:10px;border-radius:10px}.kpi b{display:block;font-size:18px}.small{font-size:12px;color:var(--muted)}.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:7px;text-align:left}th{background:#f9fafb}.events td:last-child{width:54px;text-align:center}.report{background:white;color:#111;padding:20px;border-radius:10px;border:1px solid var(--line)}.report h2{font-size:20px;border:0;margin:0 0 8px}.report h3{font-size:15px;margin:16px 0 6px}.report .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.report .box{border:1px solid #bbb;padding:8px;min-height:42px}.report .box span{display:block;font-size:10px;color:#555;text-transform:uppercase}.stamp{font-weight:800;color:var(--accent);letter-spacing:.05em}.hidden{display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 10px;border-radius:8px;background:#eee}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eee;font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media print{body{background:white}header,form,.controls,.panel:not(.printme){display:none!important}main{display:block;max-width:none;margin:0;padding:0}.printme{border:0;box-shadow:none}.report{border:0}.no-print{display:none!important}@page{size:A4;margin:12mm}}
 main{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card b{font-size:24px;display:block}.chart{height:18px;background:#eee;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent)}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Statistiques missions — Simulation Feux de Forêt</h1><p>Analyse locale du fichier mission_ledger.csv exporté par le formulaire</p></header><main><section><h2>Importer les données</h2><div class="row"><input type="file" id="file" accept=".csv,text/csv" onchange="loadFile(event)"><button class="secondary" onclick="demo()">Charger exemple</button><button class="primary" onclick="print()">PDF / Imprimer</button><button class="secondary" onclick="downloadStatsCSV()">Exporter stats CSV</button></div><p class="small">Le script attend le CSV cumul généré par “Ajouter au fichier mission”. Séparateur : point-virgule.</p></section><section><h2>Synthèse</h2><div class="cards" id="cards"></div></section><section><h2>Répartition</h2><div id="breakdowns"></div></section><section><h2>Table missions</h2><div style="overflow:auto"><table id="table"></table></div></section></main><script>
let rows=[];let stats={};function parseCSV(text){const out=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(q&&ch==='"'&&nx==='"'){cur+='"';i++}else if(ch==='"'){q=!q}else if(!q&&ch===';'){row.push(cur);cur=''}else if(!q&&(ch==='\n'||ch==='\r')){if(ch==='\r'&&nx==='\n')i++;row.push(cur);if(row.some(x=>x!==''))out.push(row);row=[];cur=''}else cur+=ch}row.push(cur);if(row.some(x=>x!==''))out.push(row);return out}function loadFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadCSV(r.result);r.readAsText(f)}function loadCSV(text){const arr=parseCSV(text).filter(r=>!r[0]?.startsWith('#'));const head=arr.shift();rows=arr.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])));render()}function num(v){const n=parseFloat((v||'').toString().replace(',','.'));return isNaN(n)?0:n}function sum(k){return rows.reduce((a,r)=>a+num(r[k]),0)}function avg(k){return rows.length?sum(k)/rows.length:0}function countBy(k){const m={};rows.forEach(r=>{const v=r[k]||'—';m[v]=(m[v]||0)+1});return m}function topBy(k,n=8){return Object.entries(countBy(k)).sort((a,b)=>b[1]-a[1]).slice(0,n)}function fmtMin(m){m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return h?`${h}h${String(mm).padStart(2,'0')}`:`${mm} min`}function card(label,val){return `<div class="card"><span class="small">${label}</span><b>${val}</b></div>`}function esc(s){return (s||'').toString().replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function render(){stats={missions:rows.length,flightMin:sum('flightMinutes'),blockMin:sum('blockMinutes'),fuel:sum('fuelUsed'),drops:sum('drops'),reloads:sum('reloads'),avgFuelRate:avg('fuelRatePerHour')};cards.innerHTML=card('Missions',stats.missions)+card('Temps vol total',fmtMin(stats.flightMin))+card('Temps bloc total',fmtMin(stats.blockMin))+card('Carburant total',Math.round(stats.fuel))+card('Largages',stats.drops)+card('Rechargements / écopages',stats.reloads)+card('Conso moyenne',Math.round(stats.avgFuelRate)+'/h')+card('Temps vol moyen',fmtMin(avg('flightMinutes')));breakdowns.innerHTML=breakdown('Par appareil','aircraft')+breakdown('Par risque','risk')+breakdown('Par type mission','missionType')+breakdown('Top secteurs','sector');renderTable()}function breakdown(title,k){const items=topBy(k),max=Math.max(1,...items.map(x=>x[1]));return `<h3>${title}</h3><table><tbody>${items.map(([name,c])=>`<tr><td style="width:220px">${esc(name)}</td><td style="width:80px">${c}</td><td><div class="chart"><div class="bar" style="width:${100*c/max}%"></div></div></td></tr>`).join('')}</tbody></table>`}
function renderTable(){const cols=['missionId','date','aircraft','callsign','risk','missionType','sector','flightMinutes','fuelUsed','drops','reloads'];table.innerHTML='<thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody>'}
function downloadStatsCSV(){const lines=[['metric','value'],['missions',stats.missions||0],['flight_minutes',Math.round(stats.flightMin||0)],['block_minutes',Math.round(stats.blockMin||0)],['fuel_used',Math.round(stats.fuel||0)],['drops',stats.drops||0],['reloads',stats.reloads||0],['avg_fuel_rate',Math.round(stats.avgFuelRate||0)]].map(r=>r.join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines],{type:'text/csv'}));a.download='mission_stats.csv';a.click()}
function demo(){loadCSV('missionId;date;aircraft;registration;callsign;risk;missionType;sector;baseDeparture;baseReturn;reloadBase;fms;altitude;weather;load;engineStart;takeoff;patrolStart;fireAlert;onScene;firstDrop;endIntervention;landing;engineStop;fuelStart;fuelEnd;fuelUnit;fuelUsed;blockMinutes;flightMinutes;fuelRatePerHour;drops;reloads;reloadTime;captain;fo;observer;opsNotes;techNotes;lessons\nGAAR-001;2026-07-06;Milan / Dash Q400MR;;MILAN 73;Orange;GAAR;Cévennes;LFTW;LFTW;;x.fms;FL100;;10000 L;09:00;09:18;;;;;;10:40;10:45;6500;4300;kg;2200;105;82;1610;0;0;;;;;;\nGAAR-002;2026-07-06;Canadair CL-415;;PELICAN 36;Rouge;GAAR avec déroutement;Maures;LFTW;LFTW;Mer;z.fms;2500 ft;;6137 L;13:00;13:12;13:35;14:01;14:18;14:25;15:20;15:52;15:58;4800;3300;kg;1500;178;160;563;5;6;;;;;;')}
render();</script></main></body></html>
