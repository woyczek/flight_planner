<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Objets de mission — pont X-Plane</title>
<style>body{font:16px system-ui;background:#f1f4ef;color:#17383d;max-width:900px;margin:40px auto;padding:20px}h1{font:36px Georgia}article{background:white;border:1px solid #c8d6cd;padding:16px;margin:12px 0;border-radius:8px}.tag{color:#8f4a16}small{color:#586c6d}p{line-height:1.6}</style>
<p>DEFA · OBJETS X-PLANE · PROTOTYPE LOCAL</p><h1>Objets de la mission</h1><p id="status">Connexion au pont…</p><p>« Dans le champ caméra » est un indice géométrique. Seul « Objet en vue » déclaré par le pilote constitue une confirmation, après contrôle de portée.</p><section id="events"></section>
<script>let cursor=0;const labels={spawned:'Objet placé dans X-Plane',removed:'Objet retiré',candidate_fov:'Dans le champ caméra — visibilité non vérifiée',object_found:'Objet en vue — confirmé par le pilote',spawn_failed:'Placement indisponible'};async function poll(){try{const d=await(await fetch('/api/events?after='+cursor)).json();document.querySelector('#status').textContent=d.mission+' · pont actif · '+d.events.length+' nouvel événement(s) · '+d.rejected+' rejet(s)';for(const e of d.events){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('small');h.textContent=labels[e.type]||e.type;p.textContent=e.object+' · '+e.reason;s.textContent='H + '+(e.sim_sec/60).toFixed(1)+' min · '+e.received_at;a.append(h,p,s);document.querySelector('#events').prepend(a)}cursor=d.cursor;while(document.querySelector('#events').children.length>100)document.querySelector('#events').lastElementChild.remove()}catch{document.querySelector('#status').textContent='Pont indisponible — aucune découverte validée.'}setTimeout(poll,1000)}poll();</script></html>
