  type: AIRLIFT
  subtype: STRATEGIC / CARGO
title: Logistics air bridge to Solenzara
summary: Fly a heavy, high-priority load from Orléans-Bricy to restore the capability of a detachment deployed at Solenzara. The flight combines load preparation, centre-of-gravity management, a long-range transit and arrival at an active military base. The logistics unit reports that the two generators are "ready on a single pallet"; two separate pallets are eventually presented for loading. The mission remains planned for a sequenced unload so that electrical power is available first.
