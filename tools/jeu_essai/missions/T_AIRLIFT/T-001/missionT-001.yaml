objectives:
  primary: Deliver the 12,800 kg of priority freight to Solenzara within the planned logistics window, undamaged and with a compliant centre of gravity.
  secondary:
  - Meet an arrival window of ±15 minutes around the planned time.
  - Prepare an alternate airfield before departure and keep the associated reserve.
  - Unload the generators before the telecommunications modules.
risks:
- hazard: En-route weather and sea crossing
  consequence: A front or local convection may increase flight time or force a detour.
  mitigation: Update weather and fuel before departure; keep a routing and diversion margin.
- hazard: Military traffic at Solenzara
  consequence: An arrival slot may be delayed by local activity.
  mitigation: Plan holding fuel and early radio coordination.
- hazard: Heavy palletised load
  consequence: Poor distribution may degrade the centre of gravity and floor loading.
  mitigation: Check mass, pallet positions, tie-down and load sheet before closing up.
