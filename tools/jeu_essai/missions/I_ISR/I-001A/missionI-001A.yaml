title: EYE OF SOLOGNE — the big dish is listening
summary: |-
  An E-3F of the 36th Wing takes off from Avord to build an air and electromagnetic picture over west-central France, in coordination with a Phénix and a Rafale flight. The exercise includes a refuelling sequence on the SIMONE track before taking station, the scenario having decided that an aircraft with a nine-metre rotodome still lacked a little visibility.

  The crew must join SIMONE, refuel, set up surveillance of the Brenne sector, then pass the Rafales the tracks and data needed for their reconnaissance phase. Success depends on keeping the shared time slot, maintaining a continuous tactical picture and returning to Avord with the planned reserves.
detailed_description: |-
  Operation EYE OF SOLOGNE brings together three SOG crews: an E-3F for surveillance and coordination, an A330 MRTT Phénix for air-to-air refuelling, and a Rafale flight to exploit the information gathered. The scenario covers building a coherent air picture over west-central France and passing simulated tracks between the three crews. The big dish on top of the fuselage does not, therefore, excuse the crew from watching the rendezvous time.

  The E-3F takes off from BA 702 Avord, climbs to FL240 and proceeds direct to the ARIP of the SIMONE track, about 90 NM from the base. The initial transit takes about 15 minutes at 360 kt true airspeed, plus the climb and joining the track. After refuelling, the aircraft continues to the Brenne sector to set up its surveillance orbit at FL260.

  At RDV-1, the E-3F joins the Phénix COTAM3510 on SIMONE and takes on the planned fuel before leaving the track via the ARCP. It then proceeds to ZONE-1 and holds an orbit for 45 minutes to build and disseminate the simulated air picture. Relevant information is passed to the RAFALE31 flight, which in turn joins the package to correlate the detected tracks and fly its reconnaissance sequence.

  Tanker unavailability, a delay of more than ten minutes at the rendezvous or weather incompatible with holding station leads to a shorter surveillance period rather than eating into the return reserves. If the link with RAFALE31 is lost, the E-3F keeps the picture and continues surveillance without attempting an improvised rendezvous. Bourges is the primary diversion if a direct return to Avord is temporarily impossible.

  After the surveillance period, the E-3F leaves the Brenne to the north-east, picks up a route to Avord and descends for arrival at BA 702. The mission is complete once the aircraft has landed at Avord and the simulated tracks, rendezvous times and refuelling sequence have been logged for the debrief.
