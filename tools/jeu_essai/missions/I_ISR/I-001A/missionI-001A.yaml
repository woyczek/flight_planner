risks:
  - hazard: Slot slippage
    consequence: Missed rendezvous with the Phénix and less time available on station.
    mitigation: Check the estimated time at the ARIP from the climb onwards and adjust speed before joining the track.
  - hazard: Conflict on the track
    consequence: Insufficient separation between aircraft during the AAR sequence.
    mitigation: Follow the join-up procedure, the assigned levels and the tanker's instructions.
  - hazard: Weather at altitude
    consequence: Turbulence or icing reducing the effectiveness of the refuelling sequence.
    mitigation: Adjust the track level within the available limits and stop the sequence if the criteria are exceeded.
  - hazard: Workload
    consequence: Degraded surveillance during coordination phases with the other crews.
    mitigation: Explicitly split tasks between flying the aircraft, surveillance and tactical datalink.
