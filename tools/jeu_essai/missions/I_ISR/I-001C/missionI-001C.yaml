risks:
  - hazard: Delay on SIMONE
    consequence: Out of step with the tanker slot and less time available over the Brenne.
    mitigation: Compute the time over PT2 from the climb onwards and adjust speed early enough.
  - hazard: Fuel after AAR
    consequence: Insufficient return margin if the transfer is incomplete.
    mitigation: Recompute endurance immediately after the sequence and cut time on station if necessary.
  - hazard: Tactical link loss
    consequence: Unable to receive or correlate the tracks designated by CYRANO01.
    mitigation: Apply the planned link recovery procedure and leave the area if coordination cannot be restored.
  - hazard: Workload
    consequence: Degraded formation keeping during the reconnaissance phase.
    mitigation: Clearly split navigation, lookout and exploitation of tactical information within the flight.
