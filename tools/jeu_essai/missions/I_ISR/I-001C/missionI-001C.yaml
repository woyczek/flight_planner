title: EYE OF SOLOGNE — two Rafales look for what the AWACS has already found
summary: |-
  A Rafale flight takes off from BA 113 Saint-Dizier to join Operation EYE OF SOLOGNE, refuel on the SIMONE track, then exploit the tracks passed by the E-3F CYRANO01 over the Brenne. The idea of the exercise is to have two fighters visually confirm what the aircraft with the biggest radar in the sector claims to have already seen.

  RAFALE31 must join the Phénix COTAM3510 in its planned slot, continue to the Brenne, establish tactical contact with CYRANO01, then carry out a simulated reconnaissance of several tracks before returning to Saint-Dizier. Synchronisation with the tanker and the AWACS, fuel management and adherence to the transit levels are the main constraints.
detailed_description: |-
  Operation EYE OF SOLOGNE links the E-3F CYRANO01, the Phénix COTAM3510 and the RAFALE31 flight in a complete surveillance, support and exploitation chain. CYRANO01 builds the simulated air picture, COTAM3510 provides fuel support and RAFALE31 must find and identify the designated tracks. The training goal is to coordinate the three missions without turning the tactical frequency into a residents' association meeting.

  RAFALE31 takes off from BA 113 Saint-Dizier-Robinson, climbs to FL260 and heads for central France on a transit of about 150 NM. The flight reaches the SIMONE ARIP at about 420 kt true airspeed and plans roughly 25 minutes from take-off to arrival in the refuelling area, excluding any holding. After contact with the Phénix, it continues to the Brenne at FL240.

  At RDV-3, RAFALE31 joins COTAM3510 and completes its refuelling sequence after CYRANO01 has cleared. The flight then leaves SIMONE via the ARCP and proceeds to RDV-2 in the Brenne sector, where CYRANO01 passes it the simulated tracks to reconnoitre. RAFALE31 then flies a 25-minute sequence in ZONE-1, correlates the information received and reports the simulated identification of each requested track back to the airborne controller.

  A refuelling delay, higher-than-planned fuel burn or a lasting loss of the link with CYRANO01 reduces the number of tracks worked. If the AAR sequence is cancelled, the flight continues only if its reserves allow the reconnaissance and the return to Saint-Dizier with the planned margin. BA 123 Orléans-Bricy is the primary diversion if the home base is unavailable.

  Once the last track has been worked, RAFALE31 leaves the Brenne to the east, resumes its transit to Saint-Dizier and descends to recover at BA 113. The mission is complete after the flight has landed and the refuelling times, the tracks actually worked and any coordination discrepancies with CYRANO01 have been logged.
