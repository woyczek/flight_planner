objectives:
  primary: Refuel CYRANO01 and then RAFALE31 on the SIMONE track before returning to BA 125 Istres.
  secondary:
    - Be established on SIMONE before the first receiver arrives.
    - Keep clear time separation between the two refuelling sequences.
    - Leave the track with the planned reserve for the return or diversion.
risks:
  - hazard: Receiver delay
    consequence: Longer racetrack and extra tanker fuel burn.
    mitigation: Set a contact cut-off time and reduce the time available to any late receiver.
  - hazard: Transferable fuel
    consequence: Insufficient tanker return reserve after the transfers.
    mitigation: Recompute the maximum transferable quantity before each sequence and keep the diversion reserve.
  - hazard: Turbulence on the track
    consequence: Unstable contact and risk of the refuelling being interrupted.
    mitigation: Adjust the level within the track limits and suspend the transfer if the stability criteria are no longer met.
  - hazard: Two AAR slots
    consequence: Sequencing conflict between CYRANO01 and RAFALE31.
    mitigation: Give each receiver a separate slot and confirm the track is clear before the next sequence.
