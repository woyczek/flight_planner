title: EYE OF SOLOGNE — the filling station takes to the skies
summary: |-
  An A330 MRTT Phénix takes off from BA 125 Istres-Le Tubé to support Operation EYE OF SOLOGNE over west-central France. Its task is to reach the SIMONE track, refuel first the E-3F CYRANO01 and then the RAFALE31 flight, and keep enough reserve to return to Istres, proof that even a flying filling station has to watch its own gauge.

  The crew must meet both receivers' time slots, run a stable refuelling on the track and leave the area once the transfers are complete. The main constraint is balancing timing accuracy, transferable fuel and return reserve on a long mission.
detailed_description: |-
  Operation EYE OF SOLOGNE brings together three SOG crews: the E-3F CYRANO01 for surveillance and coordination, the Phénix COTAM3510 for air-to-air refuelling, and the RAFALE31 flight to exploit the simulated tracks. The Phénix is the shared support asset that lets the other two crews extend their time in the exercise area. On the whiteboard the plan is simple: arrive on time, hand out fuel and leave with enough fuel for yourself.

  COTAM3510 takes off from BA 125 Istres-Le Tubé, climbs to FL280 and heads north towards central France at around 460 kt true airspeed. The transit to the SIMONE track covers about 260 NM and takes some forty minutes, excluding climb and joining. The aircraft reaches the SIMONE ARIP from the south and settles into its configuration before the first receiver arrives.

  At RDV-1, COTAM3510 picks up CYRANO01 and completes the first transfer before continuing the refuelling racetrack. RAFALE31 then joins on the same track for a second sequence, with time separation between the two receivers. Once the transfers are complete, the tanker holds station for a few minutes to confirm both crews' fuel state before leaving SIMONE via the ARCP.

  A significant delay by a receiver, insufficient transferable fuel or atmospheric conditions incompatible with a stable contact leads to the relevant transfer being reduced or cancelled. The priority remains keeping the reserves needed to return to Istres and, if necessary, divert to Orange-Caritat. The racetrack is never extended at the expense of this margin.

  After the last receiver departs, COTAM3510 leaves the SIMONE track, turns back south and descends towards Istres. The mission ends on return to BA 125 once the quantities delivered, contact times and any anomalies have been logged for the joint debrief.
