risks:
  - hazard: Loss of separation
    consequence: Conflict between MERCURE41, the other fighter element or the exercise tracks.
    mitigation: Respect the holding sectors, watch the other participants and terminate immediately on knock-it-off.
  - hazard: Insufficient fuel
    consequence: Unable to complete the sequence or reach the planned airfield.
    mitigation: Check quantities after refuelling, after each engagement and before any new reset.
  - hazard: Loss of visual
    consequence: Continuing a manoeuvre without sufficient awareness of the engagement geometry.
    mitigation: Call the loss of visual, break off the manoeuvre and apply the separation procedure.
  - hazard: Tactical overload
    consequence: Degraded flying, communications or lookout.
    mitigation: Prioritise flying, separation and fuel over pursuing the tactical objective.
