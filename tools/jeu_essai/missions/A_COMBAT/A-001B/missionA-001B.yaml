title: BOXING GLOVES — second pair of gloves
summary: |-
  MERCURE41 is the second fighter element of BOXING GLOVES and joins MERCURE31 and COTAM3510 for the common set-up before the engagements in TRA 34 A. Its refuelling precedes a series of BFM sequences whose adversaries and appearance conditions will be passed in flight; so the day starts by looking for a basket before looking for trouble.

  The crew must take on fuel in D31D, proceed to its holding sector and then fly the engagements triggered by exercise control. In particular, MERCURE41 must keep enough separation from MERCURE31 to allow independent engagements followed by a coordinated reset.
detailed_description: |-
  MERCURE41 is the second Rafale element committed to BOXING GLOVES. The exercise combines air-to-air refuelling, tactical set-up and visual air combat manoeuvring against tracks introduced progressively by exercise control. Each element has its own sequence so that the TRA does not look like an aerial roundabout at rush hour.

  The aircraft takes off from BA 118 Mont-de-Marsan in the planned air-to-air training configuration. The set-up is coordinated with MERCURE31 and COTAM3510, but MERCURE41 keeps its own navigation, fuel checks and decisions. Access to the formation depends on the availability of the tanker and the area, and on military ATC clearances.

  MERCURE41 joins the common D31D rendezvous behind MERCURE31, then in turn approaches the Phénix and takes on fuel. After disconnecting, the element proceeds to its holding point east of the sector before being called into the combat area. Tracks are revealed by exercise control in accordance with A-001Z and must be acquired, identified and then fought under the established safety rules.

  Any loss of the tactical picture, fuel anomaly, technical problem or reduced separation leads to immediate termination of the sequence. A reset may be ordered before a new engagement, and the priority remains safety between MERCURE31, MERCURE41 and the bandits. A missed pass is still an exercise; trying to fix it by inventing a new branch of physics is not part of it.

  After the last authorised sequence, MERCURE41 leaves the TRA via its exit point and returns to Mont-de-Marsan. A diversion to Cazaux remains possible if the operational or technical situation requires it. The mission ends once the aircraft is recovered and fully clear of the exercise.
