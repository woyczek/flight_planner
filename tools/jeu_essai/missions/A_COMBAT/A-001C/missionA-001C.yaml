    consequence: "Risk of dangerous closure between the tanker and the receiver."
    mitigation: "Terminate the approach immediately and send the receiver back to the waiting position before any new attempt."
  - hazard: "Sequencing conflict"
    consequence: "Two receivers converge simultaneously on the contact area."
    mitigation: "Explicitly assign the join-up order and clear only one element to the contact position."
  - hazard: "Tanker fuel"
    consequence: "Reduced margin for the return to Istres or a diversion."
    mitigation: "Track the quantity transferred after each contact and stop offloading before reaching the minimum reserve."
  - hazard: "Area unavailable"
    consequence: "Unable to maintain the planned refuelling pattern."
    mitigation: "Suspend contacts, keep the receivers clear of the set-up, then follow ATC instructions."
