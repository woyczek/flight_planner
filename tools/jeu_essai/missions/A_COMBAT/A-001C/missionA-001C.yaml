title: "BOXING GLOVES — the bar is open"
summary: |-
  COTAM3510 provides fuel support for BOXING GLOVES by setting up the Phénix in D31D before MERCURE31 and MERCURE41 engage in TRA 34 A. The tanker must take the two Rafale elements in turn, deliver the planned fuel and then remain available during the initial phase of the exercise; for once, "the bar is open" mostly means you had better arrive stabilised.

  The crew must hold the refuelling slot, sequence the two receivers and keep a reserve compatible with its own return to Istres. Any formation, fuel or area availability anomaly leads to immediate suspension of contacts.
detailed_description: |-
  COTAM3510 is the third DEFA element of BOXING GLOVES and provides the refuelling ahead of the two Rafale formations. Its mission is separate from the BFM sequences: it must set up a stable, predictable point in the formation before MERCURE31 and MERCURE41 proceed to TRA 34 A. The role is less spectacular than a merge, but a combat exercise without fuel very quickly becomes a lecture on the parking ramp.

  The Phénix takes off from BA 125 Istres-Le Tubé with the planned transferable fuel for both receivers plus its own reserve. The set-up is synchronised with the Rafale departure times and the slot allocated in D31D. The crew remains responsible for sequencing the contacts and for terminating any unstabilised approach.

  On arrival on the track, COTAM3510 establishes its refuelling pattern and receives MERCURE31 then MERCURE41 at the common rendezvous. Each receiver carries out its closure, contact and disconnect before the next one is cleared to join. The tanker then remains available during the planned window to allow a limited re-contact if a contact was interrupted, without delaying the BFM set-up.

  Any deterioration in weather, airspace unavailability, technical anomaly or unfavourable fuel situation leads to shortening or cancelling the remaining contacts. An unstable receiver is sent back to the waiting position before any new attempt. Promised fuel is not a debt of honour: the Phénix minimums and the safety of the formation take priority.

  Once both Rafales are finally released, COTAM3510 leaves D31D and returns to Istres-Le Tubé. If return conditions deteriorate, a suitable diversion may be chosen without needlessly extending the exercise support. The mission ends once the tanker has landed and the fuel balance has been established.
