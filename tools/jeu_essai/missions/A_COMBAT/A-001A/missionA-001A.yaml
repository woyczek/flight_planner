risks:
  - hazard: Loss of separation
    consequence: Dangerous closure between participants during BFM manoeuvring.
    mitigation: Comply with the rules of engagement and separation altitudes, and call any knock-it-off immediately.
  - hazard: Fuel state
    consequence: Insufficient reserves to continue the exercise or return to base.
    mitigation: Check fuel after refuelling and at each exit from an engagement; terminate before reaching minimums.
  - hazard: Loss of situational awareness
    consequence: Continuing a manoeuvre without reliable knowledge of the other aircraft's positions.
    mitigation: Break off the engagement and re-form as soon as the tactical picture is lost.
  - hazard: Workload
    consequence: Degraded lookout or flight parameters.
    mitigation: Strictly share flying, lookout and communications within the crew and the flight.
