title: BOXING GLOVES — round one in TRA 34 A
summary: |-
  MERCURE31 is the first fighter element of exercise BOXING GLOVES, run between D31D and TRA 34 A with a second Rafale element and a Phénix. The set-up includes air-to-air refuelling before entering the combat sector, so that the first serious opponent of the day is not the fuel gauge.

  The crew must join the formation, take on fuel and then fly the BFM sequences assigned by the exercise director. The adversary tracks and their behaviour are not known at take-off and will be passed in flight in accordance with organisation mission A-001Z.
detailed_description: |-
  BOXING GLOVES is an air combat exercise involving two Rafale elements in TRA 34 A, with two training tracks introduced progressively by exercise control. MERCURE31 is one of the blue elements and must be able to switch quickly from coordinated navigation to a BFM sequence. The bandits have been told to stay credible, but not to demand a rematch in the mess after every engagement.

  MERCURE31 takes off from BA 118 Mont-de-Marsan in the air-to-air configuration planned for the exercise. The set-up is coordinated with MERCURE41 and the Phénix COTAM3510, each with its own mission. Joining the formation remains subject to the availability of the tanker and of the combat area, and to military ATC instructions.

  A first coordination takes place in D31D to form up behind COTAM3510 and carry out the refuelling sequence. After leaving the tanker, MERCURE31 proceeds to TRA 34 A and comes under the control of the exercise director. Adversary contacts are then revealed according to the A-001Z timeline and must be acquired, identified and engaged in accordance with the exercise rules.

  A sequence is terminated in case of loss of separation, a fuel state incompatible with continuing, area unavailability or on the exercise director's order. The flight may also temporarily leave the fight if it loses the tactical picture or if a reset is needed. The aim remains BFM training, not turning a poorly prepared merge into an improvised demonstration of applied geometry.

  After the engagements, MERCURE31 leaves the area via the planned point and returns to Mont-de-Marsan. The mission ends once the aircraft has landed and been released from the exercise. Any sequence not flown may be carried over to a later sortie rather than extended at the expense of reserves.
