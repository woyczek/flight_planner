title: BOXING GLOVES — exercise organisation
summary: |-
  BOXING GLOVES coordinates two Rafale elements and an A330 MRTT Phénix for a refuelling sequence in D31D followed by BFM training in TRA 34 A. Both fighter elements know their rendezvous, their set-up sectors and the general rules, but the adversary tracks are only revealed to them in flight; the exercise director therefore keeps a few cards up his sleeve, almost literally.

  The organisation must sequence the departures, the refuelling, the entry of the fighter elements into the area and then the successive appearance of the two bandits. Each track is revealed by radio at the planned time, with immediate termination in case of loss of separation, degraded tactical situation or safety instruction.
detailed_description: |-
  BOXING GLOVES is built as a progressive exercise combining AAR support and visual air combat training. COTAM3510 sets up the refuelling while MERCURE31 and MERCURE41 join the formation in turn before proceeding to TRA 34 A. The crews know the overall architecture, but not the exact order of appearance nor the behaviour of the adversary tracks; otherwise the bandit would end up filing a complaint for lack of surprise.

  H-hour is the start of the first BFM window after the planned end of refuelling. COTAM3510 takes off early enough to establish the set-up in D31D; MERCURE31 then MERCURE41 join it a few minutes apart. The two fighter elements are then separated in their respective holding areas until called in.

  The first bandit is introduced once MERCURE31 is established in the working area and must be handled as a visual manoeuvring threat. The second one appears later for MERCURE41 with a different profile, so that the two engagements are not mere copies of each other. Radio calls give only the information needed for initial acquisition and leave the crews to build their own tactical picture.

  The exercise director retains the authority to delay a track, terminate a sequence, change the order of engagements or cancel the second presentation if fuel margins shrink. Both bandits must respect their altitude, speed and sector limits, and exit immediately on command. A track that carries on after a knock-it-off stops being a good training tool and very quickly becomes an administrative problem.

  The exercise ends when both fighter elements have left TRA 34 A and COTAM3510 has been released from its support task. Participants then return to their airfields in accordance with their individual missions. The debrief focuses on identifications, radio calls, separation management and knock-it-off discipline rather than on a simple count of simulated kills.
